<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniel Campins</title>
<style>
<style>
*{box-sizing:border-box}

:root{
--bg:#f4f5f7;
--card:#fff;
--text:#111318;
--muted:#737780;
--line:#e7e8eb;
--dark:#111318;
--dark2:#1a1c21;
--accent:#c9a24a;
--accent2:#e4c477;
--blue:#3478f6;
--green:#22a06b;
--red:#d94b4b;
--radius:22px;
--shadow:0 10px 35px rgba(17,19,24,.07);
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
background:var(--bg);
color:var(--text);
-webkit-font-smoothing:antialiased;
}

button,input,textarea,select{
font:inherit;
}

button{
cursor:pointer;
-webkit-tap-highlight-color:transparent;
}

/* LOGIN */

.login{
min-height:100vh;
display:grid;
place-items:center;
padding:24px;
background:
radial-gradient(circle at 85% 10%,#394556 0,#171b22 35%,#0d0f13 75%);
}

.login-box{
width:min(720px,100%);
padding:44px;
border-radius:30px;
background:rgba(255,255,255,.97);
box-shadow:0 35px 100px rgba(0,0,0,.35);
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:4px;
}

.login-box>p{
margin-top:8px;
font-size:15px;
}

.choices{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:34px;
}

.choice{
position:relative;
min-height:170px;
padding:26px;
border:1px solid var(--line);
border-radius:22px;
background:#fff;
text-align:left;
transition:.25s;
overflow:hidden;
}

.choice:hover{
transform:translateY(-4px);
box-shadow:0 18px 45px rgba(17,19,24,.12);
}

.choice b{
display:block;
font-size:20px;
margin-bottom:12px;
}

.choice .muted{
line-height:1.5;
}

.choice.dark{
background:linear-gradient(145deg,#171a20,#0d0f13);
color:#fff;
border-color:#171a20;
}

.choice.dark span{
color:#bfc3cb;
}

/* APP */

.app{
display:none;
min-height:100vh;
}

/* SIDEBAR */

.side{
position:fixed;
left:0;
top:0;
bottom:0;
width:250px;
padding:26px 15px;
background:linear-gradient(180deg,#111318,#0c0e12);
color:#fff;
z-index:20;
}

.side h2{
margin:0 10px 24px;
padding:0 4px 22px;
font-size:14px;
letter-spacing:3px;
border-bottom:1px solid #292d35;
}

.nav button{
display:flex;
align-items:center;
gap:12px;
width:100%;
margin:4px 0;
padding:13px 14px;
border:0;
border-radius:14px;
background:transparent;
color:#aeb3bd;
text-align:left;
font-size:14px;
transition:.2s;
}

.nav button:hover,
.nav button.active{
background:#1c2027;
color:#fff;
}

.nav button:first-letter{
font-size:18px;
}

.out{
position:absolute;
left:15px;
right:15px;
bottom:22px;
padding:11px;
border:1px solid #30343c;
border-radius:13px;
background:transparent;
color:#aeb3bd;
}

/* MAIN */

main{
margin-left:250px;
padding:38px;
max-width:1500px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:18px;
margin-bottom:28px;
}

.top h1,
h1{
margin:0;
font-size:32px;
font-weight:800;
letter-spacing:-1px;
}

.top .muted{
margin:4px 0 0;
}

h2{
margin-top:0;
font-size:20px;
letter-spacing:-.4px;
}

h3{
margin-top:0;
font-size:16px;
}

/* GRID */

.grid{
display:grid;
gap:18px;
}

.g2{
grid-template-columns:1.4fr .8fr;
}

.g3{
grid-template-columns:repeat(3,1fr);
}

/* CARDS */

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:var(--radius);
padding:24px;
margin-bottom:18px;
box-shadow:var(--shadow);
}

.card h2:first-child{
margin-top:0;
}

.card small{
color:var(--muted);
font-size:12px;
font-weight:700;
letter-spacing:.3px;
}

/* METRICS */

.metrics{
display:grid;
grid-template-columns:repeat(3,1fr);
border:1px solid var(--line);
border-radius:17px;
overflow:hidden;
background:#fff;
}

.metric{
padding:19px;
border-right:1px solid var(--line);
}

.metric:last-child{
border-right:0;
}

.metric b{
display:block;
font-size:28px;
margin:6px 0 3px;
letter-spacing:-1px;
}

.metric .muted{
font-size:13px;
}

/* ITEMS */

.item{
padding:17px 0;
border-bottom:1px solid var(--line);
}

.item:last-child{
border-bottom:0;
}

/* BUTTONS */

.btn{
border:0;
border-radius:13px;
padding:12px 17px;
background:var(--accent);
color:#17130a;
font-weight:800;
transition:.2s;
box-shadow:0 5px 15px rgba(201,162,74,.18);
}

.btn:hover{
background:var(--accent2);
transform:translateY(-1px);
}

.ghost{
border:1px solid #dfe1e5;
border-radius:13px;
padding:11px 15px;
background:#fff;
color:var(--text);
font-weight:650;
transition:.2s;
}

.ghost:hover{
background:#f7f7f8;
border-color:#cfd2d8;
}

.danger{
border:1px solid #f1cccc;
border-radius:13px;
padding:11px 15px;
background:#fff4f4;
color:var(--red);
}

/* BADGES */

.pill{
display:inline-flex;
align-items:center;
padding:7px 11px;
border-radius:999px;
background:#f1e8d3;
color:#8a6a25;
font-size:11px;
font-weight:900;
letter-spacing:.7px;
}

/* CLIENTS */

.client-row{
padding:20px;
margin:8px 0;
border:1px solid var(--line);
border-radius:17px;
background:#fff;
cursor:pointer;
transition:.2s;
}

.client-row:hover{
transform:translateY(-2px);
box-shadow:var(--shadow);
border-color:#d9dbe0;
}

.client-row b{
font-size:16px;
}

/* FOOD / EXERCISES */

.food,
.exercise{
display:flex;
align-items:center;
justify-content:space-between;
gap:14px;
padding:15px 16px;
margin:9px 0;
border:1px solid var(--line);
border-radius:15px;
background:#fafafa;
transition:.2s;
}

.food:hover,
.exercise:hover{
background:#fff;
box-shadow:0 5px 18px rgba(0,0,0,.05);
}

.food b,
.exercise b{
font-size:15px;
}

.food span,
.exercise span{
color:var(--muted);
font-size:14px;
}

.food-actions,
.exercise-actions{
display:flex;
align-items:center;
gap:8px;
}

/* FORMS */

textarea,
input,
select{
width:100%;
padding:13px 14px;
border:1px solid #dfe1e5;
border-radius:13px;
background:#fff;
color:var(--text);
outline:none;
transition:.2s;
}

textarea:focus,
input:focus,
select:focus{
border-color:var(--blue);
box-shadow:0 0 0 4px rgba(52,120,246,.10);
}

textarea{
min-height:110px;
resize:vertical;
}

label{
display:block;
margin:15px 0 7px;
font-size:13px;
font-weight:750;
}

/* EMPTY */

.empty{
padding:35px 20px;
text-align:center;
color:var(--muted);
}

/* MODAL */

.modal{
position:fixed;
inset:0;
display:none;
place-items:center;
padding:20px;
background:rgba(8,10,14,.62);
backdrop-filter:blur(8px);
z-index:50;
}

.modal-box{
width:min(540px,100%);
max-height:90vh;
overflow:auto;
padding:27px;
border-radius:24px;
background:#fff;
box-shadow:0 30px 90px rgba(0,0,0,.3);
}

.modal-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
margin-bottom:12px;
}

/* TOAST */

.toast{
position:fixed;
right:22px;
bottom:22px;
display:none;
padding:14px 18px;
border-radius:14px;
background:#111318;
color:#fff;
box-shadow:0 15px 40px rgba(0,0,0,.25);
z-index:100;
}

/* MOBILE */

@media(max-width:700px){

body{
background:#f4f5f7;
}

.login{
padding:16px;
}

.login-box{
padding:28px 20px;
border-radius:25px;
}

.logo{
font-size:21px;
}

.choices{
grid-template-columns:1fr;
gap:12px;
margin-top:25px;
}

.choice{
min-height:auto;
padding:21px;
}

.side{
top:auto;
bottom:0;
width:100%;
height:76px;
padding:7px 5px;
border-top:1px solid #292d35;
}

.side h2,
.out{
display:none;
}

.nav{
display:flex;
align-items:center;
justify-content:space-around;
height:100%;
}

.nav button{
width:auto;
min-width:48px;
height:58px;
margin:0;
padding:7px 8px;
justify-content:center;
border-radius:14px;
font-size:21px;
}

.nav button span{
display:none;
}

main{
margin:0 0 76px;
padding:20px 15px;
}

.top{
align-items:flex-start;
margin-bottom:20px;
}

.top h1,
h1{
font-size:27px;
letter-spacing:-.8px;
}

.g2,
.g3{
grid-template-columns:1fr;
}

.card{
padding:19px;
border-radius:19px;
margin-bottom:14px;
}

.metrics{
grid-template-columns:1fr;
}

.metric{
border-right:0;
border-bottom:1px solid var(--line);
}

.metric:last-child{
border-bottom:0;
}

.food,
.exercise{
align-items:flex-start;
flex-wrap:wrap;
padding:14px;
}

.food-actions,
.exercise-actions{
width:100%;
}

.food-actions button,
.exercise-actions button{
flex:1;
}

.top .btn{
white-space:nowrap;
padding:10px 12px;
}

.modal{
padding:12px;
}

.modal-box{
padding:21px;
border-radius:21px;
}

.toast{
left:15px;
right:15px;
bottom:90px;
text-align:center;
}

}
</style>
</head>

<body>

<div id="login" class="login">
<div class="login-box">
<div class="logo">DANIEL CAMPINS</div>
<p class="muted">Transformación física personalizada</p>
<div class="choices">
<button class="choice" onclick="openApp('client')">
<b>👤 Área cliente</b>
<span class="muted">Alimentación, entrenamiento, progreso, check-in y mensajes.</span>
</button>
<button class="choice dark" onclick="openApp('coach')">
<b>🧑‍💼 Panel Daniel</b>
<span>Clientes, dietas, rutinas, check-ins y mensajes.</span>
</button>
</div>
</div>
</div>

<div id="client" class="app">
<aside class="side">
<h2>DANIEL CAMPINS</h2>
<div class="nav" id="client-nav"></div>
<button class="out" onclick="logout()">Salir</button>
</aside>
<main id="client-main"></main>
</div>

<div id="coach" class="app">
<aside class="side">
<h2>DANIEL CAMPINS</h2>
<div class="nav" id="coach-nav"></div>
<button class="out" onclick="logout()">Salir</button>
</aside>
<main id="coach-main"></main>
</div>

<div id="modal" class="modal">
<div class="modal-box" id="modal-content"></div>
</div>

<div id="toast" class="toast"></div>

<script>
const KEY="danielCampinsApp";

const defaultData={
clients:[
{id:"carlos",name:"Carlos García",goal:"Recomposición",weight:78.4,initial:80,plan:"2.250 kcal · 180 g proteína",status:"Revisado"},
{id:"laura",name:"Laura Martín",goal:"Pérdida de grasa",weight:64.2,initial:64.2,plan:"Plan pendiente",status:"Pendiente"},
{id:"marcos",name:"Marcos López",goal:"Ganancia muscular",weight:70,initial:70,plan:"Plan pendiente",status:"Pendiente"},
{id:"pedro",name:"Pedro",goal:"Pérdida de grasa",weight:70,initial:70,plan:"Plan pendiente",status:"Pendiente"}
],
diets:{
carlos:{
training:{
calories:"2.250 kcal",
protein:"180 g",
meals:[
{name:"Desayuno",foods:[["Whey","30 g"],["Avena","60 g"],["Plátano","1 unidad"]]},
{name:"Comida",foods:[["Pollo","180 g"],["Arroz","100 g"]]},
{name:"Pre-entreno",foods:[["Yogur","200 g"],["Plátano","1 unidad"]]},
{name:"Cena",foods:[["Pescado","180 g"],["Patata","250 g"]]}
]
},
rest:{
calories:"2.050 kcal",
protein:"180 g",
meals:[
{name:"Desayuno",foods:[["Huevos","3 unidades"],["Avena","40 g"],["Fruta","1 pieza"]]},
{name:"Comida",foods:[["Pollo","180 g"],["Arroz","70 g"],["Verduras","libre"]]},
{name:"Merienda",foods:[["Yogur","200 g"],["Frutos secos","20 g"]]},
{name:"Cena",foods:[["Pescado","180 g"],["Patata","180 g"],["Verduras","libre"]]}
]
}
}
},
routines:{
carlos:[
["Press banca","4","8–10"],
["Press inclinado","3","10–12"],
["Elevaciones laterales","3","12–15"],
["Press militar","3","8–10"]
]
},
weights:{
carlos:[80,78.4],
laura:[64.2],
marcos:[70],
pedro:[70]
},
checkins:{
carlos:{weight:"78,4 kg",diet:"9 / 10",training:"8 / 10",comment:"Todo bien esta semana.",reviewed:true},
laura:{weight:"64,2 kg",diet:"Pendiente",training:"Pendiente",comment:"Pendiente de revisión.",reviewed:false},
marcos:{weight:"70 kg",diet:"Pendiente",training:"Pendiente",comment:"Pendiente de revisión.",reviewed:false},
pedro:{weight:"70 kg",diet:"Pendiente",training:"Pendiente",comment:"Pendiente de revisión.",reviewed:false}
},
messages:{
carlos:[["Daniel","Perfecto, Carlos. Sigue así esta semana."],["Carlos","Gracias Dani, lo haré."]],
laura:[],
marcos:[["Marcos","Nuevo mensaje"]],
pedro:[]
}
};

let data=loadData();
let currentApp="";
let currentScreen="";

function loadData(){
try{
const saved=localStorage.getItem(KEY);
if(saved)return Object.assign({},defaultData,JSON.parse(saved));
}catch(e){}
return JSON.parse(JSON.stringify(defaultData));
}

function saveData(){
localStorage.setItem(KEY,JSON.stringify(data));
}

function esc(value){
return String(value??"").replace(/[&<>"']/g,function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
});
}

function client(id){
return data.clients.find(c=>c.id===id);
}

function money(n){
return Number(n).toFixed(1).replace(".",",");
}

function toast(msg){
const t=document.getElementById("toast");
t.textContent=msg;
t.style.display="block";
setTimeout(()=>t.style.display="none",2200);
}

function openApp(app){
currentApp=app;
document.getElementById("login").style.display="none";
document.getElementById("client").style.display=app==="client"?"block":"none";
document.getElementById("coach").style.display=app==="coach"?"block":"none";

if(app==="client"){
buildClientNav();
showClient("home");
}else{
buildCoachNav();
showCoach("dashboard");
}
}

function logout(){
document.getElementById("login").style.display="grid";
document.getElementById("client").style.display="none";
document.getElementById("coach").style.display="none";
}

function navButton(icon,text,fn){
return '<button onclick="'+fn+'">'+icon+' <span>'+text+"</span></button>";
}

function buildClientNav(){
document.getElementById("client-nav").innerHTML=
navButton("⌂","Inicio","showClient('home')")+
navButton("👤","Mi perfil","showClient('profile')")+
navButton("🍴","Alimentación","showClient('food')")+
navButton("🏋️","Entrenamiento","showClient('training')")+
navButton("📈","Progreso","showClient('progress')")+
navButton("✓","Check-in","showClient('checkin')")+
navButton("💬","Coach","showClient('coach')");
}

function buildCoachNav(){
document.getElementById("coach-nav").innerHTML=
navButton("▦","Dashboard","showCoach('dashboard')")+
navButton("👥","Clientes","showCoach('clients')")+
navButton("✓","Check-ins","showCoach('checkins')")+
navButton("🍴","Dietas","showCoach('diets')")+
navButton("🏋️","Rutinas","showCoach('routines')")+
navButton("💬","Mensajes","showCoach('messages')");
}

function showClient(screen){
currentScreen=screen;
const main=document.getElementById("client-main");
const c=data.clients[0];

let html="";

if(screen==="home"){
html=`
<div class="top"><div><p class="muted">Área cliente</p><h1>${esc(c.name)}, bienvenido</h1></div><span class="pill">SEMANA 3</span></div>
<div class="grid g3">
<div class="card"><small>Peso actual</small><div class="metric"><b>${money(c.weight)} kg</b><span class="muted">Inicio ${money(c.initial)} kg</span></div></div>
<div class="card"><small>Entrenamientos</small><div class="metric"><b>3 / 4</b><span class="muted">Esta semana</span></div></div>
<div class="card"><small>Alimentación</small><div class="metric"><b>85 %</b><span class="muted">Adherencia</span></div></div>
</div>
<div class="grid g2">
<div class="card"><h2>Hoy</h2>
<div class="item">🍴 <b>Comida pendiente</b></div>
<div class="item">🏋️ <b>Push — Día 1</b></div>
<div class="item">✓ <b>Check-in semanal</b></div></div>
<div class="card"><h2>Mensaje de Daniel</h2><p class="muted">“Perfecto, Carlos. Sigue así esta semana.”</p></div>
</div>`;
}

if(screen==="profile"){
html=`
<div class="top"><div><h1>Mi perfil</h1><p class="muted">Datos de tu proceso.</p></div></div>
<div class="card"><h2>${esc(c.name)}</h2>
<div class="item"><b>Objetivo</b><br>${esc(c.goal)}</div>
<div class="item"><b>Peso actual</b><br>${money(c.weight)} kg</div>
<div class="item"><b>Peso inicial</b><br>${money(c.initial)} kg</div>
<div class="item"><b>Plan</b><br>${esc(c.plan)}</div>
</div>`;
}

if(screen==="food"){
const dietType=window.clientDietType||"training";
const diet=data.diets.carlos?.[dietType]||{calories:"",protein:"",meals:[]};
const meals=diet.meals||[];

html=`
<h1>Alimentación</h1>
<p class="muted">Elige el tipo de día que corresponde hoy.</p>

<div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0">
<button class="${dietType==="training"?"btn":"ghost"}"
onclick="window.clientDietType='training';showClient('food')">
🏋️ Día de entrenamiento
</button>

<button class="${dietType==="rest"?"btn":"ghost"}"
onclick="window.clientDietType='rest';showClient('food')">
🛋️ Día de descanso
</button>
</div>

<div class="card">
<h2>${dietType==="training"?"🏋️ Día de entrenamiento":"🛋️ Día de descanso"}</h2>

<div class="metrics">
<div class="metric">
<small>Calorías</small>
<b>${esc(diet.calories)}</b>
</div>

<div class="metric">
<small>Proteína</small>
<b>${esc(diet.protein)}</b>
</div>

<div class="metric">
<small>Comidas</small>
<b>${meals.length}</b>
</div>
</div>
</div>

<div class="card">
${meals.map(m=>`
<div class="item">
<h2>${esc(m.name)}</h2>
${m.foods.map(f=>`
<div class="food">
<b>${esc(f[0])}</b>
<span>${esc(f[1])}</span>
</div>
`).join("")}
</div>
`).join("")}
</div>`;
}

if(screen==="training"){
const routine=data.routines.carlos||[];
html=`
<h1>Entrenamiento</h1>
<p class="muted">Hoy · Push · ${routine.length} ejercicios</p>
<div class="card" style="background:#071019;color:white">
<h2>PUSH</h2><p style="color:#c8d0d8">Pecho · Hombro · Tríceps</p>
<button class="btn" onclick="toast('Entrenamiento iniciado')">Empezar entrenamiento</button>
</div>
<div class="card">
${routine.map(r=>`<div class="exercise"><b>${esc(r[0])}</b><span>${esc(r[1])} × ${esc(r[2])}</span></div>`).join("")}
</div>`;
}

if(screen==="progress"){
const history=data.weights.carlos||[c.initial,c.weight];
const change=c.weight-c.initial;
html=`
<h1>Progreso</h1><p class="muted">Seguimiento de tu proceso.</p>
<div class="grid g3">
<div class="card"><small>Peso inicial</small><h2>${money(c.initial)} kg</h2></div>
<div class="card"><small>Peso actual</small><h2>${money(c.weight)} kg</h2></div>
<div class="card"><small>Cambio</small><h2>${change>=0?"+":""}${money(change)} kg</h2></div>
</div>
<div class="card"><h2>Historial de peso</h2>${history.map((w,i)=>`<div class="item">Registro ${i+1}<br><b>${money(w)} kg</b></div>`).join("")}</div>`;
}

if(screen==="checkin"){
const x=data.checkins.carlos;
html=`
<h1>Check-in semanal</h1>
<div class="card">
<div class="item"><b>Peso</b><br>${esc(x.weight)}</div>
<div class="item"><b>Alimentación</b><br>${esc(x.diet)}</div>
<div class="item"><b>Entrenamiento</b><br>${esc(x.training)}</div>
<div class="item"><b>Cómo me encuentro</b><br>${esc(x.comment)}</div>

function openClient(id){

showClientAdmin(id);
}

function showClientAdmin(id){

if(!c)return;

const history=data.weights[id]||[c.initial,c.weight];
const change=c.weight-c.initial;

document.getElementById("coach-main").innerHTML=`
<button class="ghost" onclick="showCoach('clients')">← Clientes</button>
<div class="top"><div><h1>${esc(c.name)}</h1><p class="muted">${esc(c.goal)}</p></div></div>

<div class="grid g3">

<div class="card"><small>Alimentación</small><h2>${id==="carlos"?"9 / 10":"Pendiente"}</h2></div>
<div class="card"><small>Entrenamiento</small><h2>${id==="carlos"?"8 / 10":"Pendiente"}</h2></div>
</div>

<div class="card">
<h2>Gestionar ${esc(c.name)}</h2>
<button class="btn" onclick="window.selectedClient='${id}';showCoach('diets')">🍴 Alimentación</button>
<button class="btn" onclick="window.selectedClient='${id}';showCoach('routines')">🏋️ Entrenamiento</button>
<button class="ghost" onclick="reviewCheckin('${id}')">✓ Check-in</button>
</div>

<div class="card">
<h2>Evolución</h2>
<div class="item"><b>Peso inicial</b><br>${money(c.initial)} kg</div>
<div class="item"><b>Peso actual</b><br>${money(c.weight)} kg</div>
<div class="item"><b>Cambio total</b><br>${change>=0?"+":""}${money(change)} kg</div>
<div class="item"><b>Historial</b><br>${history.map(money).join(" → ")} kg</div>
<button class="btn" onclick="addWeight('${id}')">+ Añadir peso</button>
</div>

<div class="card">
<h2>Estado</h2>
<p class="muted">${c.status==="Revisado"?"✓ Check-in revisado":"Pendiente de revisión"}</p>
</div>`;
}

function newClient(){
openModal(`
<div class="modal-head"><h2>Nuevo cliente</h2><button class="ghost" onclick="closeModal()">✕</button></div>
<label>Nombre</label><input id="new-name" placeholder="Nombre y apellidos">
<label>Peso actual</label><input id="new-weight" placeholder="Ej. 75,5">
<label>Objetivo</label><input id="new-goal" placeholder="Ej. Pérdida de grasa">
<button class="btn" style="margin-top:18px" onclick="createClient()">Crear cliente</button>
`);
}

function createClient(){
const name=document.getElementById("new-name").value.trim();
const weightText=document.getElementById("new-weight").value.trim();
const goal=document.getElementById("new-goal").value.trim();

if(!name||!weightText||!goal){
toast("Completa todos los campos");
return;
}

const weight=parseFloat(weightText.replace(",","."));
if(!Number.isFinite(weight)||weight<=0){
toast("Introduce un peso válido");
return;
}

const id="client_"+Date.now();
data.clients.push({id,name,goal,weight,initial:weight,plan:"Plan pendiente",status:"Pendiente"});
data.weights[id]=[weight];
data.checkins[id]={weight:money(weight)+" kg",diet:"Pendiente",training:"Pendiente",comment:"Pendiente de revisión.",reviewed:false};
data.diets[id]=[];
data.routines[id]=[];
data.messages[id]=[];

saveData();
closeModal();
showCoach("clients");
toast("Cliente creado correctamente");
}

function addWeight(id){
const c=client(id);
if(!c)return;

const text=prompt("Nuevo peso (kg):",money(c.weight));
if(text===null)return;

const value=parseFloat(text.replace(",","."));
if(!Number.isFinite(value)||value<=0){
toast("Introduce un peso válido");
return;
}

c.weight=value;
if(!data.weights[id])data.weights[id]=[c.initial];
data.weights[id].push(value);
saveData();

if(currentApp==="coach")showClientAdmin(id);
toast("Peso actualizado");
}

function editDietMarcos(id,type){
if(!data.diets[id])data.diets[id]={};
if(!data.diets[id][type]){
data.diets[id][type]={
calories:"",
protein:"",
meals:[]
};
}

const diet=data.diets[id][type];

const calories=prompt("Calorías:",diet.calories||"");
if(calories===null)return;

const protein=prompt("Proteína:",diet.protein||"");
if(protein===null)return;

diet.calories=calories;
diet.protein=protein;

saveData();
window.coachDietType=type;
showCoach("diets");
}
function addMeal(id,type){
const name=prompt("Nombre de la comida:");
if(!name)return;

if(!data.diets[id])data.diets[id]={};
if(!data.diets[id][type])data.diets[id][type]={calories:"",protein:"",meals:[]};
if(!data.diets[id][type].meals)data.diets[id][type].meals=[];

data.diets[id][type].meals.push({
name:name,
foods:[]
});

saveData();
window.coachDietType=type;
showCoach("diets");
}


function addFood(id,type,mi){
const food=prompt("Alimento:");
if(!food)return;

const qty=prompt("Cantidad:");
if(!qty)return;

const diet=data.diets[id]?.[type];

if(!diet||!diet.meals||!diet.meals[mi])return;

diet.meals[mi].foods.push([food,qty]);

saveData();
window.coachDietType=type;
showCoach("diets");
}


function removeFood(id,type,mi,fi){
const diet=data.diets[id]?.[type];

if(!diet||!diet.meals||!diet.meals[mi])return;

diet.meals[mi].foods.splice(fi,1);

saveData();
window.coachDietType=type;
showCoach("diets");
}


function addExercise(id){
const name=prompt("Nombre del ejercicio:");
if(!name)return;
const sets=prompt("Series:");
if(!sets)return;
const reps=prompt("Repeticiones:");
if(!reps)return;

if(!data.routines[id])data.routines[id]=[];
data.routines[id].push([name,sets,reps]);
saveData();
showCoach("routines");
}

function removeExercise(id,index){
data.routines[id].splice(index,1);
saveData();
showCoach("routines");
}

function reviewCheckin(id){
const c=client(id);
const x=data.checkins[id]||{
weight:money(c.weight)+" kg",
diet:"Pendiente",
training:"Pendiente",
comment:"Pendiente",
reviewed:false
};

openModal(`
<div class="modal-head"><h2>Check-in · ${esc(c.name)}</h2><button class="ghost" onclick="closeModal()">✕</button></div>
<div class="item"><b>Peso</b><br>${esc(x.weight)}</div>
<div class="item"><b>Alimentación</b><br>${esc(x.diet)}</div>

<div class="item"><b>Comentario</b><br>${esc(x.comment)}</div>
<button class="btn" onclick="markReviewed('${id}')">✓ Marcar como revisado</button>
`);
}

function markReviewed(id){
data.checkins[id].reviewed=true;
client(id).status="Revisado";
saveData();
closeModal();
showCoach("checkins");
toast("Check-in marcado como revisado");
}

function openMessages(id){
const c=client(id);
const msgs=data.messages[id]||[];

openModal(`
<div class="modal-head"><h2>${esc(c.name)}</h2><button class="ghost" onclick="closeModal()">✕</button></div>
<div id="conversation">
${msgs.length?msgs.map(m=>`<div class="item"><b>${esc(m[0])}</b><p>${esc(m[1])}</p></div>`).join(""):"<div class='empty'>Sin mensajes.</div>"}
</div>
<textarea id="coach-message" placeholder="Escribe un mensaje..."></textarea>
<button class="btn" style="margin-top:10px" onclick="sendCoachMessage('${id}')">Enviar</button>
`);
}

function sendCoachMessage(id){
const box=document.getElementById("coach-message");
const text=box.value.trim();
if(!text)return;

if(!data.messages[id])data.messages[id]=[];
data.messages[id].push(["Daniel",text]);
saveData();
closeModal();
toast("Mensaje enviado");
}

function openModal(html){
document.getElementById("modal-content").innerHTML=html;
document.getElementById("modal").style.display="grid";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click",function(e){
if(e.target===this)closeModal();
});
</script>
