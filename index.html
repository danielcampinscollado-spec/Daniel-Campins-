function continueTrainingExerciseSelection(id,dayIndex){

  const day=data.routines[id]?.[dayIndex];

  if(!day)return;

  if(!Array.isArray(day.exercises)){
    day.exercises=[];
  }

  if(!day.selectedExerciseIds?.length && !day.exercises.length){
    toast("Selecciona al menos un ejercicio");
    return;
  }

  const selected=
    exerciseLibraryFull.filter(ex=>
      day.selectedExerciseIds.includes(ex.id)
    );

  selected.forEach(ex=>{

    const already=
      day.exercises.some(item=>
        item.libraryId===ex.id
      );

    day.exercises.push({
      libraryId:ex.id,
      name:ex.name,
      muscle:ex.muscle,
      image:ex.image,
      sets:"",
      reps:"",
      restBetweenSets:0,
      restBetweenExercises:0,
      videoUrl:""
    });

  });

  /*

async function saveConfiguredTraining(id,dayIndex){

  const day=data.routines[id]?.[dayIndex];

  if(!day){
    toast("No se encontró el día");
    return;
  }

  if(!Array.isArray(day.exercises) || !day.exercises.length){
    toast("No hay ejercicios en esta rutina");
    return;
  }

  const incompleteExercise=day.exercises.find(ex=>{
    const sets=String(ex?.sets??ex?.series??'').trim();
    const reps=String(ex?.reps??ex?.repetitions??ex?.repeticiones??'').trim();
    return !sets || !reps;
  });
  if(incompleteExercise){
    toast("Completa las series y repeticiones de todos los ejercicios");
    return;
  }
  const incompleteRestPause=day.exercises.find(ex=>ex?.restPause&&(ex.restPauseSeconds===null||ex.restPauseSeconds===undefined||ex.restPauseFinalRest===null||ex.restPauseFinalRest===undefined));
  if(incompleteRestPause){
    toast("Completa las pausas del REST-pause");
    return;
  }
  const incompleteSuperset=day.exercises.find(ex=>ex?.supersetId&&(ex.supersetRest===null||ex.supersetRest===undefined));
  if(incompleteSuperset){
    toast("Completa el descanso de la superserie");
    return;
  }

  const restBetweenSetsGlobal =
    Math.max(0,parseInt(day.restBetweenSetsGlobal)||0);

  const restBetweenExercisesGlobal =
    Math.max(0,parseInt(day.restBetweenExercisesGlobal)||0);

  day.exercises.forEach(ex=>{
    if(ex.supersetId){
      const specialRest = Math.max(0,parseInt(ex.supersetRest)||0);
      ex.supersetRest=specialRest;
      ex.restBetweenSets=0;
      ex.restBetweenExercises=specialRest;
      return;
    }

    if(ex.restPause){
      const shortRest=Math.max(1,parseInt(ex.restPauseSeconds)||1);
      const finalRest=Math.max(0,parseInt(ex.restPauseFinalRest)||0);
      ex.restPauseSeconds=shortRest;
      ex.restPauseFinalRest=finalRest;
      ex.restBetweenSets=shortRest;
      ex.restBetweenExercises=finalRest;
      return;
    }

    ex.restBetweenSets=restBetweenSetsGlobal;
    ex.restBetweenExercises=restBetweenExercisesGlobal;
  });

  const previousSetupStep=day.trainingSetupStep;
  const previousSetupStarted=day.trainingSetupStarted;

  day.trainingSetupStep="complete";
  day.trainingSetupStarted=false;

  const ok=await saveRoutineToSupabase(id);
  if(!ok){
    day.trainingSetupStep=previousSetupStep;
    day.trainingSetupStarted=previousSetupStarted;
    toast("No se pudo sincronizar la rutina. Revisa la conexión e inténtalo de nuevo");
    return;
  }

  saveData();

  window.__dccRoutineDraftDirty=false;
  window.__dccRoutineUnsavedBackup=undefined;
  window.__dccRoutineUnsavedBackupSet=false;
  window.__dccRoutineUnsavedClient="";
  window.__dccRoutineNavBypass=false;
  window.__dccTrainingEdit=false;
  window.__dccTrainingOpen=null;
  window.__dccTrainingChoosePending=false;
  delete window.__dccTrainingBackup;

  const days=Array.isArray(data.routines?.[id])?data.routines[id]:[];
  const nextDayIndex=days.findIndex((item,index)=>index>Number(dayIndex)&&item?.trainingSetupStep!=="complete");

  if(nextDayIndex>=0){
    toast("Día "+(Number(dayIndex)+1)+" guardado · continúa con Día "+(nextDayIndex+1));
    window.selectedClient=id;
    window.__dccTrainingOpen=nextDayIndex;
    if(typeof window.openTrainingDay==="function"){
      window.openTrainingDay(id,nextDayIndex);
      return;
    }
  }

  toast("Rutina guardada correctamente");
  window.selectedClient=id;
  if(typeof window.dccClientAdmin==="function"){
    window.dccClientAdmin(id,"training");
    return;
  }
  if(typeof window.showClientAdmin==="function"){
    window.showClientAdmin(id);
    return;
  }
  showCoach("clients");
}
function removeTrainingExercise(id,dayIndex,index){

  const day=data.routines[id]?.[dayIndex];

  if(!day || !Array.isArray(day.exercises))return;

  const exercise=day.exercises[index];

  if(!exercise)return;

  const confirmDelete=
    confirm(`¿Eliminar "${exercise.name}" de esta rutina?`);

  if(!confirmDelete)return;

  day.exercises.splice(index,1);

  saveData();

  renderTrainingExerciseConfiguration(id,dayIndex);

}
async function addExercise(id,dayIndex){

  const day=data.routines[id]?.[dayIndex];

  if(!day){
    toast("No se encontró el día");
    return;
  }

  const name=prompt("Nombre del ejercicio:");
  if(!name) return;

  const sets=prompt("Series:");
  if(!sets) return;

  const reps=prompt("Repeticiones:");
  if(!reps) return;

  const restBetweenSets=prompt("Descanso entre series (segundos):","0");
  if(restBetweenSets===null) return;

  const restBetweenExercises=prompt("Descanso después del ejercicio (segundos):","0");
  if(restBetweenExercises===null) return;

  const video=prompt("Enlace al vídeo del ejercicio (opcional):");
  if(video===null) return;

  if(!Array.isArray(day.exercises))day.exercises=[];

  const exercise={
    name:name.trim(),
    sets:sets.trim(),
    reps:reps.trim(),
    restBetweenSets:Math.max(0,parseInt(restBetweenSets)||0),
    restBetweenExercises:Math.max(0,parseInt(restBetweenExercises)||0),
    videoUrl:video.trim()
  };

  day.exercises.push(exercise);

  const ok=await saveRoutineToSupabase(id);
  if(!ok){
    const index=day.exercises.indexOf(exercise);
    if(index>=0)day.exercises.splice(index,1);
    toast("No se pudo guardar el ejercicio");
    return;
  }

  saveData();
  showCoach("routines");
  toast("Ejercicio guardado");
}

async function removeExercise(id,dayIndex,exerciseIndex){

  const day=data.routines[id]?.[dayIndex];

  if(!day || !Array.isArray(day.exercises)) return;

  const removed=day.exercises[exerciseIndex];
  if(!removed)return;

  day.exercises.splice(exerciseIndex,1);

  const ok=await saveRoutineToSupabase(id);

  if(!ok){
    day.exercises.splice(exerciseIndex,0,removed);
    toast("No se pudo eliminar el ejercicio");
    return;
  }

  saveData();
  toast("Ejercicio eliminado");
  showCoach("routines");
}

async function removeTrainingDay(id,dayIndex){

  if(!Array.isArray(data.routines?.[id])) return;

  const previous=JSON.parse(JSON.stringify(data.routines[id]));

  data.routines[id].splice(dayIndex,1);

  data.routines[id].forEach((day,i)=>{
    day.day=i+1;
  });

  const ok=await saveRoutineToSupabase(id);

  if(!ok){
    data.routines[id]=previous;
    toast("No se pudo eliminar el día de entrenamiento");
    return;
  }

  saveData();
  toast("Día de entrenamiento eliminado");
  showCoach("routines");
}

async function sendCoachMessage(id){
  const box=document.getElementById("coach-message");
  const text=box?.value.trim();if(!text)return;
  try{
    const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError)throw sessionError;
    const sender=typeof window.dccCoachName==="function"?window.dccCoachName():"Entrenador";
    const {error}=await supabaseClient.from("client_messages").insert({
      client_id:id,sender:sender,message:text,sender_role:"coach",sender_user_id:sessionData?.session?.user?.id||null
    });
    if(error)throw error;
    await loadMessagesFromSupabase();closeModal();toast("Mensaje enviado");
  }catch(error){console.error("Error enviando mensaje del entrenador:",error);toast("No se pudo enviar el mensaje")}
}

async function updateClientWeight(){
  const c=client(currentClientId);if(!c){toast("No se encontró el cliente");return}
  const text=prompt("Introduce tu peso actual (kg):");if(text===null)return;
  const value=Number(String(text).trim().replace(",","."));
  if(!Number.isFinite(value)||value<=0||value>500){toast("Introduce un peso válido");return}
  try{
    const {data:ok,error}=await supabaseClient.rpc("dcc_add_weight",{p_client_id:String(currentClientId),p_weight:value});
    if(error)throw error;if(ok!==true)throw new Error("El servidor no confirmó el peso");
    await Promise.allSettled([loadClientsFromSupabase(),loadWeightsFromSupabase(),loadCheckinsFromSupabase()]);
    toast("Peso actualizado correctamente");showClient("checkin");
  }catch(error){console.error("Error actualizando peso del cliente:",error);toast("No se pudo guardar el peso")}
}

async function updateClientBodyFat(){
  const c=client(currentClientId);if(!c){toast("No se encontró el cliente");return}
  const text=prompt("Introduce tu % de grasa actual:");if(text===null)return;
  const value=Number(String(text).trim().replace(",","."));
  if(!Number.isFinite(value)||value<=0||value>=70){toast("Introduce un % de grasa válido");return}
  try{
    const {data:ok,error}=await supabaseClient.rpc("dcc_record_body_fat",{p_client_id:String(currentClientId),p_body_fat:value});
    if(error)throw error;if(ok!==true)throw new Error("El servidor no confirmó el % de grasa");
    await loadCheckinsFromSupabase();toast("% de grasa actualizado correctamente");showClient("checkin");
  }catch(error){console.error("Error actualizando % de grasa:",error);toast("No se pudo guardar el % de grasa")}
}

function selectCheckinOption(type,option){

  if(
    type !== "diet" &&
    type !== "training"
  ){
    return;
  }

  if(!data.checkins[currentClientId]){
    const c = client(currentClientId);

    data.checkins[currentClientId] = {
      weight:money(c?.weight || 0) + " kg",
      diet:"",
      training:"",
      comment:"",
      reviewed:false
    };
  }

  const commentBox=document.getElementById("checkin-comment");

  if(commentBox){
    data.checkins[currentClientId].comment=commentBox.value;
  }

  data.checkins[currentClientId][type] = option;

  data.checkins[currentClientId].reviewed = false;

  saveData();

  showClient("checkin");
}


async function sendClientCheckin(){
  try{
    const c=client(currentClientId);if(!c){toast("No se encontró el cliente");return}
    const checkin=data.checkins?.[currentClientId]||{};
    const commentBox=document.getElementById("checkin-comment");
    const sentAt=new Date().toISOString();
    const bodyFat=checkin.bodyFat!==undefined&&checkin.bodyFat!==null&&checkin.bodyFat!==""?Number(checkin.bodyFat):null;
    const {data:ok,error}=await supabaseClient.rpc("dcc_submit_checkin",{
      p_client_id:String(currentClientId),p_weight:money(c.weight)+" kg",p_diet:checkin.diet||"Pendiente",
      p_training:checkin.training||"Pendiente",p_energy:checkin.energy||"Pendiente",p_comment:commentBox?.value.trim()||checkin.comment||"",
      p_body_fat:bodyFat,p_sent_at:sentAt
    });
    if(error)throw error;if(ok!==true)throw new Error("El servidor no confirmó el check-in");
    await loadCheckinsFromSupabase();
    toast("Check-in enviado a "+(typeof window.dccCoachName==="function"?window.dccCoachName():"tu entrenador"));
    showClient("checkin");
  }catch(error){console.error("ERROR GENERAL CHECK-IN:",error);toast("No se pudo enviar el check-in: "+(error.message||"Error desconocido"))}
}

<script id="dcc-auth-flow-v4">
(function(){
  const ROLE_KEY='dcc:selected-access-role';
  const AUTH_ORIGIN='https://daniel-campins-git-a-244c40-danielcampinscollado-4962s-projects.vercel.app';
  const authRedirect=r=>AUTH_ORIGIN+'/?dcc_role='+encodeURIComponent(r);
  let busy=false;
  const getAuthClient=()=>{
    let client=window.supabaseClient;
    if(client?.auth)return client;
    try{
      if(window.supabase?.createClient){
        client=window.supabase.createClient(
          'https://khrhfurdlbqnlthlkhhp.supabase.co',
          'sb_publishable_Dhr67diGFP22g8PKdmUg9A_jbn2EyNZ',
          {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
        );
        window.supabaseClient=client;
        return client;
      }
    }catch(error){console.error('DCC auth client bootstrap',error)}
    throw new Error('No se pudo iniciar el sistema de acceso. Cierra esta pantalla, vuelve a abrir la app e inténtalo de nuevo.');
  };
  const role=()=>{try{return localStorage.getItem(ROLE_KEY)||''}catch(_){return ''}};
  const save=r=>{try{localStorage.setItem(ROLE_KEY,r)}catch(_){}};
  const clear=()=>{try{localStorage.removeItem(ROLE_KEY)}catch(_){}};
  function resetAccessUi(){
    document.getElementById('dcc-google-auth-box')?.remove();
    document.getElementById('dcc-client-email-box')?.remove();
    document.querySelector('#login .dcc-access-grid')?.removeAttribute('style');
  }
  function googleScreen(r){
    const login=document.getElementById('login'),shell=login?.querySelector('.dcc-login-shell');if(!login||!shell)return;
    login.style.display='flex';resetAccessUi();
    let box=document.createElement('div');box.id='dcc-google-auth-box';box.style.cssText='margin-top:18px;display:grid;gap:10px';shell.appendChild(box);
    box.innerHTML='<button type="button" id="dcc-google-auth-go" style="width:100%;min-height:54px;border:1px solid #d2aa5d;border-radius:16px;background:linear-gradient(145deg,#fffdf8,#fbf2df);color:#17191d;font-weight:850;font-size:15px">Continuar con Google</button><button type="button" id="dcc-google-auth-back" style="border:0;background:transparent;color:#8b6a2b;font-weight:800;padding:8px">Volver</button>';
    login.querySelector('.dcc-access-grid')?.setAttribute('style','display:none!important');
    document.getElementById('dcc-google-auth-go').onclick=async()=>{
      if(busy)return;busy=true;save(r);
      try{
        const {error}=await getAuthClient().auth.signInWithOAuth({provider:'google',options:{redirectTo:authRedirect(r),skipBrowserRedirect:false}});
        if(error)throw error;
      }catch(e){busy=false;console.error(e);alert('No se pudo iniciar sesión con Google. Inténtalo de nuevo.')}
    };
    document.getElementById('dcc-google-auth-back').onclick=()=>{busy=false;clear();resetAccessUi()};
  }
  function clientEmailScreen(){
    const login=document.getElementById('login'),shell=login?.querySelector('.dcc-login-shell');if(!login||!shell)return;
    login.style.display='flex';resetAccessUi();save('client');
    const box=document.createElement('div');box.id='dcc-client-email-box';box.style.cssText='margin-top:18px;display:grid;gap:10px';shell.appendChild(box);
    box.innerHTML='<div style="padding:14px;border:1px solid rgba(210,170,93,.42);border-radius:16px;background:#fffdf8;text-align:left"><b style="display:block;color:#17191d;font-size:15px;margin-bottom:5px">Acceso cliente</b><span style="display:block;color:#75684e;font-size:12px;line-height:1.45">Entra con Google o activa este dispositivo con tu email. Una vez dentro, la sesión queda guardada y no necesitas pedir otro correo cada vez que abras la app.</span></div><button type="button" id="dcc-client-google" style="width:100%;min-height:54px;border:1px solid #d2aa5d;border-radius:16px;background:linear-gradient(145deg,#fffdf8,#fbf2df);color:#17191d;font-weight:900;font-size:15px">Continuar con Google</button><div style="display:flex;align-items:center;gap:10px;color:#999187;font-size:10px;letter-spacing:1.8px;text-transform:uppercase"><span style="height:1px;background:#e8ddca;flex:1"></span>o activar por email<span style="height:1px;background:#e8ddca;flex:1"></span></div><input id="dcc-client-email" type="email" inputmode="email" autocomplete="email" placeholder="tu@correo.com" style="width:100%;min-height:52px;border:1px solid rgba(210,170,93,.55);border-radius:15px;background:#fff;color:#17191d;padding:0 14px;font:inherit;box-sizing:border-box"><button type="button" id="dcc-client-email-send" style="width:100%;min-height:54px;border:1px solid #d2aa5d;border-radius:16px;background:linear-gradient(135deg,#f3cf69,#d9a63d);color:#17120a;font-weight:900;font-size:15px">Activar acceso en este dispositivo</button><div id="dcc-client-email-status" style="display:none;padding:11px 12px;border-radius:12px;background:#fff7df;color:#6f5522;font-size:12px;font-weight:750;line-height:1.4"></div><button type="button" id="dcc-client-email-back" style="border:0;background:transparent;color:#8b6a2b;font-weight:800;padding:8px">Volver</button>';
    login.querySelector('.dcc-access-grid')?.setAttribute('style','display:none!important');
    const input=document.getElementById('dcc-client-email'),send=document.getElementById('dcc-client-email-send'),status=document.getElementById('dcc-client-email-status'),google=document.getElementById('dcc-client-google');
    const setStatus=(message)=>{status.style.display='block';status.textContent=message};
    google.onclick=async()=>{
      if(busy)return;busy=true;google.disabled=true;save('client');
      try{
        const {error}=await getAuthClient().auth.signInWithOAuth({provider:'google',options:{redirectTo:authRedirect('client'),skipBrowserRedirect:false}});
        if(error)throw error;
      }catch(e){
        console.error('DCC client Google auth',e);
        setStatus('No se pudo abrir el acceso con Google. '+String(e?.message||'Inténtalo de nuevo.'));
        busy=false;google.disabled=false;
      }
    };
    send.onclick=async()=>{
      const email=String(input?.value||'').trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setStatus('Introduce un correo válido.');input?.focus();return}
      if(busy)return;busy=true;send.disabled=true;setStatus('Enviando enlace de activación…');save('client');
      try{
        const {error}=await getAuthClient().auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:authRedirect('client')}});
        if(error)throw error;
        setStatus('Enlace enviado. Ábrelo una sola vez para activar este dispositivo. Después la sesión se mantendrá guardada mientras no cierres sesión.');
      }catch(e){
        console.error('DCC client email auth',e);
        const msg=String(e?.message||'').toLowerCase();
        if(msg.includes('rate')||msg.includes('limit')||msg.includes('too many')){
          setStatus('Supabase ha limitado temporalmente los correos por exceso de solicitudes. No sigas pidiendo enlaces; espera a que se restablezca el límite.');
        }else if(msg.includes('not authorized')||msg.includes('unauthorized')){
          setStatus('El servidor de correo de prueba de Supabase no permite enviar ahora a esta dirección.');
        }else{
          setStatus('No se pudo enviar el enlace. '+String(e?.message||'Inténtalo de nuevo.'));
        }
        busy=false;send.disabled=false;
      }
    };
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send.click()}});
    document.getElementById('dcc-client-email-back').onclick=()=>{busy=false;clear();resetAccessUi()};
  }
  window.dccChooseAccessRole=async function(r){
    if(r!=='client'&&r!=='coach'||busy)return;
    if(r==='client'){
      save('client');
      try{
        const auth=getAuthClient();
        const {data,error}=await auth.auth.getSession();
        if(error)throw error;
        if(data?.session){
          const {data:claimedClientId,error:claimError}=await auth.rpc('dcc_claim_client_access');
          if(!claimError&&claimedClientId){
            try{currentClientId=String(claimedClientId)}catch(_){}
            window.currentClientId=String(claimedClientId);
            window.__dccSecureRole='client';
            return openApp('client');
          }
        }
      }catch(e){console.warn('DCC reutilizando sesión cliente',e)}
      clientEmailScreen();
      return;
    }
    try{
      const {data}=await getAuthClient().auth.getSession();
      if(data?.session){save(r);window.__dccSecureRole=r;return openApp(r)}
    }catch(_){}
    save(r);googleScreen(r);
  };
  async function resumeOnce(){
    if(window.__dccAuthResumed)return;
    window.__dccAuthResumed=true;

    const qp=new URLSearchParams(location.search).get('dcc_role');
    let r=(qp==='client'||qp==='coach')?qp:role();

    try{
      const {data}=await getAuthClient().auth.getSession();
      const session=data?.session||null;

      // Las versiones anteriores borraban el rol tras entrar. Si hay una
      // sesión válida pero no queda rol guardado, detectar automáticamente
      // si esta cuenta pertenece a un cliente para que el enlace estable
      // vuelva a abrir Inicio sin pedir el correo otra vez.
      if(session && r!=='client' && r!=='coach'){
        try{
          const {data:clientId,error:clientRoleError}=await getAuthClient().rpc('dcc_claim_client_access');
          if(!clientRoleError && clientId)r='client';
        }catch(_){}
      }

      if(session){
        if(r!=='client'&&r!=='coach')return;
        save(r);
        window.__dccSecureRole=r;
        history.replaceState({},document.title,location.pathname);
        await openApp(r);
        return;
      }

      let authSubscription=null;
      const {data:listener}=getAuthClient().auth.onAuthStateChange(async(event,newSession)=>{
        if(!newSession)return;
        authSubscription?.unsubscribe();

        let nextRole=(qp==='client'||qp==='coach')?qp:role();
        if(nextRole!=='client'&&nextRole!=='coach'){
          try{
            const {data:clientId,error:clientRoleError}=await getAuthClient().rpc('dcc_claim_client_access');
            if(!clientRoleError && clientId)nextRole='client';
          }catch(_){}
        }
        if(nextRole!=='client'&&nextRole!=='coach')return;

        save(nextRole);
        window.__dccSecureRole=nextRole;
        history.replaceState({},document.title,location.pathname);
        if(!window.currentApp)openApp(nextRole);
      });
      authSubscription=listener?.subscription||null;
    }catch(e){console.error('DCC auth resume',e)}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',resumeOnce,{once:true});else resumeOnce();
})();
</script>
