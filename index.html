<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniel Campins</title>
<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#080a0e;
  --bg2:#0d1117;
  --panel:#11151c;
  --panel2:#151a22;
  --text:#f5f5f2;
  --muted:#9299a5;
  --line:rgba(255,255,255,.09);
  --gold:#d9aa4a;
  --gold-light:#f0c96b;
  --blue:#4d8dff;
  --red:#e05a5a;
  --green:#39b982;
  --white:#ffffff;
  --radius:22px;
  --shadow:0 25px 80px rgba(0,0,0,.35);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* =========================
   PANTALLA DE ENTRADA
========================= */

.login{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 78% 8%,rgba(57,72,95,.48),transparent 35%),
    radial-gradient(circle at 12% 92%,rgba(217,170,74,.09),transparent 30%),
    linear-gradient(145deg,#18202b 0%,#090c11 52%,#040507 100%);
}

.login:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,transparent 0,rgba(0,0,0,.35) 75%),
    linear-gradient(120deg,rgba(255,255,255,.025),transparent 35%);
  pointer-events:none;
}

.login-box{
  width:min(720px,100%);
  position:relative;
  z-index:2;
  padding:46px 30px 30px;
  background:
    linear-gradient(145deg,
      rgba(25,29,37,.96),
      rgba(9,11,15,.94));
  border:1px solid rgba(255,255,255,.11);
  border-radius:32px;
  box-shadow:
    0 35px 100px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.logo{
  margin:0;
  text-align:center;
  font-size:0;
  line-height:1;
}

.logo:before{
  content:"DC";
  display:block;
  color:var(--gold);
  font-size:78px;
  font-weight:300;
  letter-spacing:-10px;
  text-shadow:
    0 0 30px rgba(217,170,74,.20);
}

.login-box>.muted{
  margin:20px 0 42px;
  text-align:center;
  color:#aeb4bd;
  font-size:15px;
  letter-spacing:.3px;
}

.login-box:after{
  content:"";
  position:absolute;
  top:143px;
  left:50%;
  width:48px;
  height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border-radius:999px;
  box-shadow:0 0 14px rgba(217,170,74,.25);
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.choice{
  position:relative;
  min-height:190px;
  padding:29px 25px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:23px;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.018));
  color:#fff;
  text-align:left;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.choice:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-75px;
  top:-75px;
  border-radius:50%;
  background:rgba(217,170,74,.075);
}

.choice:after{
  content:"";
  position:absolute;
  left:-30px;
  bottom:-60px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.018);
}

.choice:hover{
  transform:translateY(-4px);
  border-color:rgba(217,170,74,.42);
  box-shadow:0 20px 50px rgba(0,0,0,.32);
}

.choice b{
  position:relative;
  z-index:2;
  display:block;
  margin-bottom:15px;
  font-size:20px;
  font-weight:700;
  letter-spacing:-.3px;
}

.choice span{
  position:relative;
  z-index:2;
  display:block;
  color:#9da5af;
  font-size:14px;
  line-height:1.65;
}

.choice.dark{
  background:
    linear-gradient(145deg,
      rgba(217,170,74,.15),
      rgba(255,255,255,.025));
  border-color:rgba(217,170,74,.45);
}

.choice.dark span{
  color:#b8bec7;
}

/* =========================
   APP
========================= */

.app{
  display:none;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.035),transparent 28%),
    var(--bg);
}

/* =========================
   MENÚ LATERAL
========================= */

.side{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  padding:28px 14px;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.09),transparent 30%),
    linear-gradient(180deg,#11151b 0%,#080a0d 100%);
  color:#fff;
  border-right:1px solid rgba(255,255,255,.07);
  z-index:20;
}

.side h2{
  margin:0 10px 28px;
  padding:0 0 23px;
  border-bottom:1px solid rgba(255,255,255,.09);
  font-size:13px;
  font-weight:700;
  letter-spacing:4px;
  color:#f2f2ef;
}

.nav button{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  margin:4px 0;
  padding:13px 14px;
  border:1px solid transparent;
  border-radius:14px;
  background:transparent;
  color:#aeb5bf;
  text-align:left;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:rgba(217,170,74,.09);
  border-color:rgba(217,170,74,.08);
  color:var(--gold-light);
}

.out{
  position:absolute;
  left:14px;
  right:14px;
  bottom:20px;
  padding:11px;
  background:transparent;
  color:#858d98;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  transition:.2s;
}

.out:hover{
  color:#fff;
  border-color:rgba(255,255,255,.18);
}

/* =========================
   CONTENIDO
========================= */

main{
  margin-left:250px;
  padding:38px;
  max-width:1500px;
}

.screen{
  display:none;
}

.screen.on{
  display:block;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:26px;
}

.top h1,
h1{
  margin:0;
  font-size:32px;
  font-weight:750;
  letter-spacing:-1.1px;
}

h2{
  letter-spacing:-.5px;
}

h3{
  margin-top:0;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  gap:18px;
}

.g2{
  grid-template-columns:1.4fr .8fr;
}

.g3{
  grid-template-columns:repeat(3,1fr);
}

/* =========================
   TARJETAS
========================= */

.card{
  position:relative;
  background:rgba(255,255,255,.97);
  color:#111318;
  border:1px solid rgba(0,0,0,.06);
  border-radius:22px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:
    0 10px 35px rgba(15,23,42,.06);
}

.card h2:first-child{
  margin-top:0;
}

/* =========================
   MÉTRICAS
========================= */

.metric b{
  display:block;
  margin:7px 0;
  font-size:29px;
  letter-spacing:-.9px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden;
}

.metric{
  padding:17px;
  border-right:1px solid #e5e7eb;
}

.metric:last-child{
  border:0;
}

/* =========================
   ITEMS
========================= */

.item{
  padding:16px 0;
  border-bottom:1px solid #eceef1;
}

.item:last-child{
  border:0;
}

/* =========================
   BOTONES
========================= */

.btn{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#17130a;
  border:0;
  padding:11px 17px;
  border-radius:12px;
  font-weight:750;
  transition:.2s;
  box-shadow:0 5px 18px rgba(217,170,74,.12);
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(217,170,74,.20);
}

.ghost{
  background:#fff;
  color:#111318;
  border:1px solid #dfe3e8;
  padding:10px 14px;
  border-radius:12px;
  transition:.2s;
}

.ghost:hover{
  background:#f7f8fa;
  border-color:#cbd1d8;
}

.danger{
  background:#fff2f2;
  color:var(--red);
  border:1px solid #f0cccc;
  padding:10px 14px;
  border-radius:12px;
}

/* =========================
   BADGES
========================= */

.pill{
  display:inline-flex;
  align-items:center;
  padding:7px 11px;
  border-radius:999px;
  background:#f5ead2;
  color:#956b18;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
}

/* =========================
   CLIENTES
========================= */

.client-row{
  padding:18px;
  margin:5px 0;
  border:1px solid transparent;
  border-radius:15px;
  cursor:pointer;
  transition:.2s;
}

.client-row:hover{
  background:#fafbfc;
  border-color:#e6e9ed;
}

/* =========================
   EJERCICIOS / ALIMENTOS
========================= */

.exercise,
.food{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px;
  margin:9px 0;
  background:#fafbfc;
  border:1px solid #e5e8ec;
  border-radius:14px;
}

.food-actions,
.exercise-actions{
  display:flex;
  gap:7px;
  align-items:center;
}

/* =========================
   FORMULARIOS
========================= */

textarea,
input,
select{
  width:100%;
  padding:12px 13px;
  border:1px solid #d9dee4;
  border-radius:12px;
  background:#fff;
  color:#111318;
  outline:none;
  transition:.2s;
}

textarea:focus,
input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(52,120,246,.10);
}

label{
  display:block;
  margin:13px 0 7px;
  font-weight:700;
}

/* =========================
   VACÍO
========================= */

.empty{
  padding:30px 20px;
  text-align:center;
  color:#7c858f;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  padding:20px;
  background:rgba(5,7,10,.62);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:50;
}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  padding:26px;
  background:#fff;
  color:#111318;
  border-radius:23px;
  box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  display:none;
  padding:13px 17px;
  background:#10141a;
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
  border-radius:13px;
  z-index:100;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

/* =========================
   MÓVIL
========================= */

@media(max-width:700px){

  body{
    background:var(--bg);
  }

  .login{
    padding:14px;
    align-items:center;
  }

  .login-box{
    width:100%;
    padding:40px 20px 21px;
    border-radius:28px;
  }

  .logo:before{
    font-size:66px;
  }

  .login-box>.muted{
    margin-top:18px;
    margin-bottom:34px;
    font-size:14px;
  }

  .login-box:after{
    top:130px;
  }

  .choices{
    grid-template-columns:1fr;
    gap:12px;
  }

  .choice{
    min-height:145px;
    padding:23px 20px;
    border-radius:20px;
  }

  .choice b{
    font-size:19px;
  }

  .choice span{
    font-size:14px;
    line-height:1.55;
  }

  .side{
    width:100%;
    height:72px;
    top:auto;
    bottom:0;
    padding:7px 5px;
    border-top:1px solid #20252d;
    border-right:0;
  }

  .side h2,
  .out{
    display:none;
  }

  .nav{
    display:flex;
    justify-content:space-around;
    align-items:center;
    height:100%;
  }

  .nav button{
    width:auto;
    min-width:50px;
    margin:0;
    padding:9px 7px;
    justify-content:center;
    text-align:center;
    border-radius:13px;
    font-size:20px;
  }

  .nav button span{
    display:none;
  }

  main{
    margin:0 0 72px;
    padding:20px 15px;
  }

  .top{
    align-items:flex-start;
    margin-bottom:20px;
  }

  .top h1,
  h1{
    font-size:27px;
  }

  .g2,
  .g3{
    grid-template-columns:1fr;
  }

  .card{
    padding:19px;
    border-radius:18px;
    margin-bottom:14px;
  }

  .metrics{
    grid-template-columns:1fr;
  }

  .metric{
    border-right:0;
    border-bottom:1px solid #e7e9ec;
  }

  .metric:last-child{
    border-bottom:0;
  }

  .exercise,
  .food{
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .food-actions,
  .exercise-actions{
    width:100%;
  }

  .food-actions button,
  .exercise-actions button{
    flex:1;
  }

  .top .btn{
    white-space:nowrap;
  }
}
/* ===== DISEÑO FINAL PANTALLA DE INICIO ===== */

.login{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 15%,rgba(218,170,70,.08),transparent 35%),
    #080a0e;
}

.login-box{
  width:100%;
  max-width:620px;
  padding:28px 24px 26px;
  background:rgba(14,17,23,.92);

  border-radius:28px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  text-align:center;
}

.brand-logo{
  width:150px;
  height:105px;
  margin:0 auto 4px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.brand-logo svg{
  width:150px;
  height:105px;
  display:block;
}

.brand-name{
  color:#f5f5f2;
  font-size:27px;
  font-weight:500;
  letter-spacing:4px;
  line-height:1.2;
  margin-top:2px;
}

.brand-subtitle{
  color:#d9aa4a;
  font-size:13px;
  font-weight:500;
  letter-spacing:3px;
  margin-top:9px;
}

.brand-line{
  width:70px;
  height:2px;
  background:#d9aa4a;

}

.choices{
  display:flex;
  flex-direction:column;
  gap:12px;
  text-align:left;
}

.login .choices .choice{
  width:100%;
  min-height:0;
  height:auto;
  padding:24px 20px 22px;
  border-radius:22px;
  background:linear-gradient(
    145deg,
    rgba(31,35,43,.95),
    rgba(17,20,26,.95)
  );
  border:1px solid rgba(255,255,255,.16);
  color:#f5f5f2;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
}

.login .choices .choice:hover{
  transform:translateY(-2px);
  border-color:rgba(217,170,74,.55);
}

.choice-admin{
  border-color:rgba(217,170,74,.7) !important;
}

.login .choices .choice-icon{
  width:64px;
  height:64px;
  min-height:64px;
  margin:0 auto 13px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(20,24,32,.95);
  box-shadow:0 0 28px rgba(218,170,74,.20);
}

.login .choices .choice-icon span{
  font-size:29px;
  color:#f5d27a;
}

.login .choices .choice b{
  display:block;
  font-size:24px;
  line-height:1.15;
  letter-spacing:.3px;
  margin:0;
  color:#f7f7f4;
}

.login .choices .choice-line{
  width:50px;
  height:2px;
  background:#d9aa4a;
  margin:13px auto 15px;
}

.login .choices .choice-icons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:17px;
  width:100%;
  margin-bottom:13px;
}

.login .choices .choice-icons span{
  font-size:21px;
  line-height:1;
}

.login .choices .choice-description{
  display:block;
  max-width:330px;
  color:rgba(255,255,255,.62);
  font-size:15px;
  line-height:1.4;
  text-align:center;
}

/* ===== MÓVIL ===== */

@media(max-width:600px){

  .login{
    min-height:100dvh;
    padding:0
  }

  .login-box{
    max-width:100%;
    padding:20px 10px 20px;
    border-radius:26px;
  }

  .brand-logo{
    width:120px;
    height:82px;
    margin:0 auto 0;
  }

  .brand-logo svg{
    width:120px;
    height:82px;
  }

  .brand-name{
    font-size:23px;
    letter-spacing:3px;
    margin-top:0;
  }

  .brand-subtitle{
    font-size:11px;
    letter-spacing:2.5px;
    margin-top:7px;
  }

  .brand-line{
    width:52px;
    margin:14px auto 20px;
  }

  .choices{
    gap:10px;
  }

  .login .choices .choice{
    min-height:205px;
    height:205px;
    padding:22px 14px 20px;
    border-radius:20px;
  }

  .login .choices .choice-icon{
    width:54px;
    height:54px;
    min-height:54px;
    margin-bottom:10px;
  }

  .login .choices .choice-icon span{
    font-size:25px;
  }

  .login .choices .choice b{
    font-size:22px;
  }

  .login .choices .choice-line{
    width:44px;
    margin:10px auto 12px;
  }

  .login .choices .choice-icons{
    gap:12px;
    margin-bottom:10px;
  }

  .login .choices .choice-icons span{
    font-size:18px;
  }

  .login .choices .choice-description{
    max-width:300px;
    font-size:13px;
    line-height:1.35;
  }
}
</style>
</head>

async function loadDietsFromSupabase(){

  const { data: diets, error } = await supabaseClient
    .from("client_diets")
    .select("client_id,diet_type,calories,protein,meals");

  if(error){

    return;

  if(!diets) return;

  diets.forEach(row=>{

      data.diets[row.client_id]={};
    }

    data.diets[row.client_id][row.diet_type]={
      calories:row.calories||"",
      protein:row.protein||"",
      meals:Array.isArray(row.meals)?row.meals:[]
    };

  });

  saveData();
}

async function saveRoutineToSupabase(id){

      .from("client_routines")
      .upsert({

        routine:routine,

      },{

      });

}

document.getElementById("coach-main").innerHTML=`
<button class="ghost" onclick="showCoach('clients')">← Clientes</button>
<div class="top"><div><h1>${esc(c.name)}</h1><p class="muted">${esc(c.goal)}</p></div></div>

</div>

function newClient(){
openModal(`
<div class="modal-head"><h2>Nuevo cliente</h2><button class="ghost" onclick="closeModal()">✕</button></div>
<label>Nombre</label><input id="new-name" placeholder="Nombre y apellidos">
<label>Peso actual</label><input id="new-weight" placeholder="Ej. 75,5">
<label>Objetivo</label><input id="new-goal" placeholder="Ej. Pérdida de grasa">
<button class="btn" style="margin-top:18px" onclick="createClient()">Crear cliente</button>
`);
}

async function createClient(){
const name=document.getElementById("new-name").value.trim();
const weightText=document.getElementById("new-weight").value.trim();
const goal=document.getElementById("new-goal").value.trim();

if(!name||!weightText||!goal){
toast("Completa todos los campos");
return;
}

const weight=parseFloat(weightText.replace(",","."));
if(!Number.isFinite(weight)||weight<=0){
toast("Introduce un peso válido");
return;
}

const id="client_"+Date.now();

const { error } = await supabaseClient
  .from("clients")
  .insert({
    id,
    name,
    goal,
    weight,
    initial_weight:weight,
    plan:"",
    status:"Pendiente de revisión"
  });

if(error){
  console.error(error);
  toast("No se pudo guardar el cliente");
  return;
}

data.clients.push({
  id,
  name,
  goal,
  weight,
  initial:weight,
  plan:""
});

data.weights[id]=[weight];
data.checkins[id]={
  weight:money(weight)+" kg",
  diet:"Pendiente de revisión"
};
data.diets[id]={
  training:{
    calories:"",
    protein:"",
    meals:[]
  },
  rest:{
    calories:"",
    protein:"",
    meals:[]
  }
};
data.routines[id]=[];
data.messages[id]=[];

saveData();
closeModal();
showCoach("clients");
toast("Cliente creado correctamente");
}

function addWeight(id){
const c=client(id);
if(!c)return;

const text=prompt("Nuevo peso (kg):",money(c.weight));
if(text===null)return;

const value=parseFloat(text.replace(",","."));
if(!Number.isFinite(value)||value<=0){
toast("Introduce un peso válido");
return;
}

c.weight=value;
if(!data.weights[id])data.weights[id]=[c.initial];
data.weights[id].push(value);
saveData();

if(currentApp==="coach")showClientAdmin(id);
toast("Peso actualizado");
}

function editDietMarcos(id,type){
if(!data.diets[id])data.diets[id]={};
if(!data.diets[id][type]){
data.diets[id][type]={
calories:"",
protein:"",
meals:[]
};
}

const diet=data.diets[id][type];

const calories=prompt("Calorías:",diet.calories||"");
if(calories===null)return;

const protein=prompt("Proteína:",diet.protein||"");
if(protein===null)return;

diet.calories=calories;
diet.protein=protein;

saveData();
window.coachDietType=type;
showCoach("diets");
}
function addMeal(id,type){
const name=prompt("Nombre de la comida:");
if(!name)return;

if(!data.diets[id])data.diets[id]={};
if(!data.diets[id][type])data.diets[id][type]={calories:"",protein:"",meals:[]};
if(!data.diets[id][type].meals)data.diets[id][type].meals=[];

data.diets[id][type].meals.push({
name:name,
foods:[]
});

saveData();
window.coachDietType=type;
showCoach("diets");
}


async function addFood(id,type,mi){

  const diet=data.diets[id]?.[type];

  if(!diet||!diet.meals||!diet.meals[mi]){
    toast("No se encontró la comida");
    return;
  }

  const food=prompt("Alimento:");
  if(!food)return;

  const qty=prompt("Cantidad:");
  if(!qty)return;

  if(!diet.meals[mi].foods){
    diet.meals[mi].foods=[];
  }

  diet.meals[mi].foods.push([food,qty]);

  const { error } = await supabaseClient
    .from("client_diets")
    .upsert({
      client_id:id,
      diet_type:type,
      calories:diet.calories||"",
      protein:diet.protein||"",
      meals:diet.meals
    },{
      onConflict:"client_id,diet_type"
    });

  if(error){
    console.error("Error guardando dieta:",error);
    diet.meals[mi].foods.pop();
    toast("No se pudo guardar la dieta");
    return;
  }

  const previousScroll=window.scrollY;

saveData();

window.coachDietType=type;

showCoach("diets");

requestAnimationFrame(()=>{
  window.scrollTo(0,previousScroll);
});

toast("Alimento guardado");
}

function removeFood(id,type,mi,fi){
const diet=data.diets[id]?.[type];

if(!diet||!diet.meals||!diet.meals[mi])return;

diet.meals[mi].foods.splice(fi,1);

saveData();
window.coachDietType=type;
showCoach("diets");
}


async function addTrainingDay(id){
  if(!data.routines[id]){
    data.routines[id]=[];
  }

  const muscle=prompt("Grupo muscular de este día:");
  if(!muscle)return;

  data.routines[id].push({
    day:data.routines[id].length+1,
    muscle:muscle,
    exercises:[]
  });

  saveData();

  const ok=await saveRoutineToSupabase(id);

  if(ok){
    toast("Día de entrenamiento guardado");
  }

  showCoach("routines");
}

async function addExercise(id,dayIndex){

  const day=data.routines[id]?.[dayIndex];

  if(!day){
    toast("No se encontró el día");
    return;
  }

  const name=prompt("Nombre del ejercicio:");
  if(!name) return;

  const sets=prompt("Series:");
  if(!sets) return;

  const reps=prompt("Repeticiones:");
  if(!reps) return;

  day.exercises.push({
    name:name,
    sets:sets,
    reps:reps
  });

  /* Guardado local */
  saveData();

  /* Guardado en Supabase */
  const { error } = await supabaseClient
    .from("client_routines")
    .upsert({
      client_id:id,
      routine:data.routines[id]
    });

  if(error){
    console.error("Error guardando rutina en Supabase:",error);
    toast("Guardado local, pero no en Supabase");
    return;
  }

  showCoach("routines");
  toast("Ejercicio guardado");
}
function removeExercise(id,dayIndex,exerciseIndex){
  const day=data.routines[id]?.[dayIndex];
  if(!day) return;

  day.exercises.splice(exerciseIndex,1);

  saveData();
  showCoach("routines");
}

function removeTrainingDay(id,dayIndex){
  if(!data.routines[id]) return;

  data.routines[id].splice(dayIndex,1);

  data.routines[id].forEach((day,i)=>{
    day.day=i+1;
  });

  saveData();
  showCoach("routines");
}

function openMessages(id){

const msgs=data.messages[id]||[];

openModal(`

<div id="conversation">
${msgs.length?msgs.map(m=>`<div class="item"><b>${esc(m[0])}</b><p>${esc(m[1])}</p></div>`).join(""):"<div class='empty'>Sin mensajes.</div>"}

function sendCoachMessage(id){
const box=document.getElementById("coach-message");
const text=box.value.trim();
if(!text)return;

if(!data.messages[id])data.messages[id]=[];
data.messages[id].push(["Daniel",text]);
saveData();
closeModal();
toast("Mensaje enviado");
}

function openModal(html){
document.getElementById("modal-content").innerHTML=html;
document.getElementById("modal").style.display="grid";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click",function(e){
if(e.target===this)closeModal();
});
</script>
