<style id="dcc-login-prepaint-v1">

#login>*{visibility:hidden!important}
#client,#coach{display:none}
</style>
<style id="dcc-nav-prepaint-v1">
html.dcc-theme-light-premium body{background:#f5efe4!important;color:#17191d!important}
#client-nav{background:linear-gradient(145deg,#28251f,#151513 58%,#222019)!important;border:1px solid rgba(231,181,73,.78)!important;box-shadow:0 12px 34px rgba(68,49,18,.26),0 0 0 1px rgba(255,211,108,.10),inset 0 1px 0 rgba(255,230,157,.10)!important}
#client-nav button{color:#e8b94f!important;background:transparent!important;border-color:transparent!important}

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#080a0e;
  --bg2:#0d1117;
  --panel:#11151c;
  --panel2:#151a22;
  --text:#f5f5f2;
  --muted:#9299a5;
  --line:rgba(255,255,255,.09);
  --gold:#d9aa4a;
  --gold-light:#f0c96b;
  --blue:#4d8dff;
  --red:#e05a5a;
  --green:#39b982;
  --white:#ffffff;
  --radius:22px;
  --shadow:0 25px 80px rgba(0,0,0,.35);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* =========================
   PANTALLA DE ENTRADA
========================= */

.login{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 78% 8%,rgba(57,72,95,.48),transparent 35%),
    radial-gradient(circle at 12% 92%,rgba(217,170,74,.09),transparent 30%),
    linear-gradient(145deg,#18202b 0%,#090c11 52%,#040507 100%);
}

.login:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,transparent 0,rgba(0,0,0,.35) 75%),
    linear-gradient(120deg,rgba(255,255,255,.025),transparent 35%);
  pointer-events:none;
}

.login-box{
  width:min(720px,100%);
  position:relative;
  z-index:2;
  padding:46px 30px 30px;
  background:
    linear-gradient(145deg,
      rgba(25,29,37,.96),
      rgba(9,11,15,.94));
  border:1px solid rgba(255,255,255,.11);
  border-radius:32px;
  box-shadow:
    0 35px 100px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.logo{
  margin:0;
  text-align:center;
  font-size:0;
  line-height:1;
}

.logo:before{
  content:"DC";
  display:block;
  color:var(--gold);
  font-size:78px;
  font-weight:300;
  letter-spacing:-10px;
  text-shadow:
    0 0 30px rgba(217,170,74,.20);
}

.login-box>.muted{
  margin:20px 0 42px;
  text-align:center;
  color:#aeb4bd;
  font-size:15px;
  letter-spacing:.3px;
}

.login-box:after{
  content:"";
  position:absolute;
  top:143px;
  left:50%;
  width:48px;
  height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border-radius:999px;
  box-shadow:0 0 14px rgba(217,170,74,.25);
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.choice{
  position:relative;
  min-height:190px;
  padding:29px 25px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:23px;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.018));
  color:#fff;
  text-align:left;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.choice:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-75px;
  top:-75px;
  border-radius:50%;
  background:rgba(217,170,74,.075);
}

.choice:after{
  content:"";
  position:absolute;
  left:-30px;
  bottom:-60px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.018);
}

.choice:hover{
  transform:translateY(-4px);
  border-color:rgba(217,170,74,.42);
  box-shadow:0 20px 50px rgba(0,0,0,.32);
}

.choice b{
  position:relative;
  z-index:2;
  display:block;
  margin-bottom:15px;
  font-size:20px;
  font-weight:700;
  letter-spacing:-.3px;
}

.choice span{
  position:relative;
  z-index:2;
  display:block;
  color:#9da5af;
  font-size:14px;
  line-height:1.65;
}

.choice.dark{
  background:
    linear-gradient(145deg,
      rgba(217,170,74,.15),
      rgba(255,255,255,.025));
  border-color:rgba(217,170,74,.45);
}

.choice.dark span{
  color:#b8bec7;
}

/* =========================
   APP
========================= */

.app{
  display:none;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.035),transparent 28%),
    var(--bg);
}

/* =========================
   MENÚ LATERAL
========================= */

.side{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  padding:28px 14px;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.09),transparent 30%),
    linear-gradient(180deg,#11151b 0%,#080a0d 100%);
  color:#fff;
  border-right:1px solid rgba(255,255,255,.07);
  z-index:20;
}

.side h2{
  margin:0 10px 28px;
  padding:0 0 23px;
  border-bottom:1px solid rgba(255,255,255,.09);
  font-size:13px;
  font-weight:700;
  letter-spacing:4px;
  color:#f2f2ef;
}

.nav button{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  width:100%;
  height:100%;

  background:none;
  border:0;

  color:#858d98;
  text-align:center;

  padding:6px 2px;
  margin:0;

  border-radius:16px;

  font-size:11px;
  line-height:1.1;

  white-space:nowrap;

  transition:
    background .25s ease,
    color .25s ease,
    transform .18s ease,
    box-shadow .25s ease;

  box-sizing:border-box;
}

.nav button::before{
  content:"";
  position:absolute;
  left:8px;
  top:50%;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(217,170,74,.12);
  transform:translateY(-50%) scale(.65);
  opacity:0;
  transition:
    transform .25s ease,
    opacity .25s ease;
  pointer-events:none;
}



.out{
  position:absolute;
  left:14px;
  right:14px;
  bottom:20px;
  padding:11px;
  background:transparent;
  color:#858d98;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  transition:.2s;
}

.out:hover{
  color:#fff;
  border-color:rgba(255,255,255,.18);
}

/* =========================
   CONTENIDO
========================= */

main{
  margin-left:250px;
  padding:38px;
  max-width:1500px;
}

.screen{
  display:none;
}

.screen.on{
  display:block;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:26px;
}

.top h1,
h1{
  margin:0;
  font-size:32px;
  font-weight:750;
  letter-spacing:-1.1px;
}

h2{
  letter-spacing:-.5px;
}

h3{
  margin-top:0;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  gap:18px;
}

.g2{
  grid-template-columns:1.4fr .8fr;
}

.g3{
  grid-template-columns:repeat(3,1fr);
}

/* =========================
   TARJETAS
========================= */

.card{
  position:relative;
  background:
    radial-gradient(circle at 100% 0%,rgba(217,170,74,.08),transparent 35%),
    linear-gradient(145deg,#181b23,#101218);
  color:#f5f5f2;
  border:1px solid rgba(255,255,255,.10);
  border-radius:26px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:
    0 14px 45px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.card h2:first-child{
  margin-top:0;
}

/* =========================
   MÉTRICAS
========================= */

.metric b{
  display:block;
  color:#f5f5f2;
  margin:7px 0;
  font-size:29px;
  letter-spacing:-.9px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;
  overflow:hidden;
  background:rgba(255,255,255,.025);
}

.metric{
  padding:17px;
  border-right:1px solid rgba(255,255,255,.08);
}

.metric:last-child{
  border:0;
}

/* =========================
   ITEMS
========================= */

.item{
  padding:16px 0;
  border-bottom:1px solid #eceef1;
}

.item:last-child{
  border:0;
}

/* =========================
   BOTONES
========================= */

.btn{
    background:linear-gradient(135deg,var(--gold),#f4d98a);
    color:#17130a;
    border:0;
    padding:12px 18px;
    border-radius:14px;
    font-weight:750;
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
    box-shadow:0 5px 18px rgba(217,170,74,.10);
}

.btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.04);
    box-shadow:0 8px 24px rgba(217,170,74,.18);
}

.btn:active{
    transform:scale(.97);
    box-shadow:0 3px 12px rgba(217,170,74,.12);
}
.ghost{
  background:#fff;
  color:#111318;
  border:1px solid #dfe3e8;
  padding:10px 14px;
  border-radius:12px;
  transition:.2s;
}

.ghost:hover{
  background:#f7f8fa;
  border-color:#cbd1d8;
}

.danger{
  background:#fff2f2;
  color:var(--red);
  border:1px solid #f0cccc;
  padding:10px 14px;
  border-radius:12px;
}

/* =========================
   BADGES
========================= */

.pill{
  display:inline-flex;
  align-items:center;
  padding:7px 11px;
  border-radius:999px;
  background:#f5ead2;
  color:#956b18;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
}

/* =========================
   CLIENTES
========================= */

.client-row{
  padding:18px;
  margin:5px 0;
  border:1px solid transparent;
  border-radius:15px;
  cursor:pointer;
  transition:.2s;
}

.client-row:hover{
  background:#fafbfc;
  border-color:#e6e9ed;
}

/* =========================
   EJERCICIOS / ALIMENTOS
========================= */

.exercise,
.food{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px;
  margin:9px 0;
  background:rgba(255,255,255,.035);
  color:#f5f5f2;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;
}

.exercise:active,
.food:active{
  transform:scale(.985);
  background:rgba(217,170,74,.06);
  border-color:rgba(217,170,74,.18);
}

.food-actions,
.exercise-actions{
  display:flex;
  gap:7px;
  align-items:center;
}

/* =========================
   FORMULARIOS
========================= */

textarea,
input,
select{
  width:100%;
  padding:12px 13px;
  border:1px solid #d9dee4;
  border-radius:12px;
  background:#fff;
  color:#111318;
  outline:none;
  transition:.2s;
}

textarea:focus,
input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(52,120,246,.10);
}

label{
  display:block;
  margin:13px 0 7px;
  font-weight:700;
}

/* =========================
   VACÍO
========================= */

.empty{
  padding:30px 20px;
  text-align:center;
  color:#7c858f;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  padding:20px;
  background:rgba(5,7,10,.62);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:50;
}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  padding:26px;
  background:#fff;
  color:#111318;
  border-radius:23px;
  box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  display:none;
  padding:13px 17px;
  background:#10141a;
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
  border-radius:13px;
  z-index:20000;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}
@media(max-width:900px){
  .toast{
    left:20px;
    right:20px;
    bottom:calc(92px + env(safe-area-inset-bottom));
    text-align:center;
  }
}

/* =========================
   MÓVIL
========================= */

@media(max-width:700px){

  body{
    background:var(--bg);
  }

  .login{
    padding:14px;
    align-items:center;
  }

  .login-box{
    width:100%;
    padding:40px 20px 21px;
    border-radius:28px;
  }

  .logo:before{
    font-size:66px;
  }

  .login-box>.muted{
    margin-top:18px;
    margin-bottom:34px;
    font-size:14px;
  }

  .login-box:after{
    top:130px;
  }

  .choices{
    grid-template-columns:1fr;
    gap:12px;
  }

  .choice{
    min-height:145px;
    padding:23px 20px;
    border-radius:20px;
  }

  .choice b{
    font-size:19px;
  }

  .choice span{
    font-size:14px;
    line-height:1.55;
  }

  .side{
  width:calc(100% - 20px);
  height:68px;
  top:auto;
  bottom:10px;
  left:10px;
  padding:6px;
  background:rgba(17,21,28,.94);
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

  .side h2,
  .out{
    display:none;
  }

  .nav{
  display:flex;
  justify-content:space-around;
  align-items:center;
  height:100%;
  gap:4px;
}

.nav button{
    position:relative;
    flex:1 1 0;
    width:100%;
    min-width:0;
    height:56px;
    margin:0;
    padding:4px 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border:1px solid transparent;
    border-radius:14px;
    background:transparent;
    color:#858d98;
    text-align:center;
    font-size:10px;
    box-sizing:border-box;
    transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease,
        border-color .2s ease;
}

.nav button.active{
    background:transparent !important;
    border-color:transparent !important;
    box-shadow:none !important;
    transform:none !important;
}

.nav button.active svg{
    color:#d9a62f;
}

.nav button.active span{
    color:#d9a62f;
}

.nav button svg{
  width:23px;
  height:23px;
  flex:none;
  stroke:currentColor;
}

.nav button:active{
  transform:scale(.94);
}





 

  .top h1,
  h1{
    font-size:27px;
  }

  .g2,
  .g3{
    grid-template-columns:1fr;
  }

  .card{
    padding:19px;
    border-radius:18px;
    margin-bottom:14px;
  }

  .metrics{
    grid-template-columns:1fr;
  }

  .metric{
    border-right:0;
    border-bottom:1px solid #e7e9ec;
  }

  .metric:last-child{
    border-bottom:0;
  }

  .exercise,
  .food{
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .food-actions,
  .exercise-actions{
    width:100%;
  }

  .food-actions button,
  .exercise-actions button{
    flex:1;
  }

  .top .btn{
    white-space:nowrap;
  }
}
/* ===== ELEVATE — PANTALLA DE INICIO ===== */

.login{
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  box-sizing:border-box;
  background:
    radial-gradient(circle at 50% 12%,rgba(217,170,74,.10),transparent 32%),
    radial-gradient(circle at 15% 85%,rgba(217,170,74,.045),transparent 30%),
    #07090d;
  position:relative;
  overflow:auto;
}

.login-box{
  width:100%;
  max-width:620px;
  box-sizing:border-box;
  padding:38px 30px 32px;
  background:
    linear-gradient(
      145deg,
      rgba(31,35,43,.96),
      rgba(17,20,26,.97)
    );
  border:1px solid rgba(255,255,255,.13);
  border-radius:30px;
  box-shadow:
    0 30px 90px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.035);
  text-align:center;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

/* brillo decorativo superior */
.login-box::before{
  content:"";
  position:absolute;
  width:230px;
  height:230px;
  right:-110px;
  top:-105px;
  border-radius:50%;
  background:rgba(217,170,74,.07);
  pointer-events:none;
}

.login-box::after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  left:-105px;
  bottom:-105px;
  border-radius:50%;
  background:rgba(255,255,255,.025);
  pointer-events:none;
}

/* ===== LOGO ===== */

.brand-logo{
  width:150px;
  height:105px;
  margin:0 auto 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
}

.brand-logo svg{
  width:150px;
  height:105px;
  display:block;
}

/* ===== NOMBRE ===== */

.brand-name{
  color:#f7f7f5;
  font-size:34px;
  font-weight:500;
  letter-spacing:7px;
  line-height:1.15;
  margin:0;
  position:relative;
  z-index:1;
}

/* ===== SUBTÍTULO ===== */

.brand-subtitle{
  color:#d9aa4a;
  font-size:13px;
  font-weight:500;
  letter-spacing:4px;
  margin-top:10px;
  position:relative;
  z-index:1;
}

/* ===== LÍNEA DORADA ===== */

.brand-line{
  width:70px;
  height:2px;
  margin:18px auto 25px;
  background:linear-gradient(
    90deg,
    #b98227,
    #f5d27a,
    #b98227
  );
  border-radius:999px;
  box-shadow:0 0 14px rgba(217,170,74,.25);
  position:relative;
  z-index:1;
}

/* ===== TARJETAS ===== */

.choices{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:100%;
  text-align:left;
  position:relative;
  z-index:1;
}

.login .choices .choice{
  width:100%;
  min-height:0;
  height:auto;
  box-sizing:border-box;
  padding:27px 22px 25px;
  border-radius:23px;
  background:
    linear-gradient(
      145deg,
      rgba(31,35,43,.96),
      rgba(17,20,26,.97)
    );
  border:1px solid rgba(255,255,255,.16);
  color:#f5f5f2;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
  cursor:pointer;
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
  font-family:inherit;
}

/* decoración de las tarjetas */
.login .choices .choice::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  right:-80px;
  top:-75px;
  border-radius:50%;
  background:rgba(217,170,74,.065);
  pointer-events:none;
}

.login .choices .choice::after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  left:-85px;
  bottom:-85px;
  border-radius:50%;
  background:rgba(255,255,255,.025);
  pointer-events:none;
}

/* ===== ICONO PRINCIPAL DE CADA TARJETA ===== */

.login .choices .choice-icon{
  width:64px;
  height:64px;
  min-height:64px;
  margin:0 auto 14px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle,
      rgba(217,170,74,.10),
      rgba(15,19,27,.96) 68%
    );
  box-shadow:
    0 0 28px rgba(217,170,74,.17),
    inset 0 1px 0 rgba(255,255,255,.025);
  position:relative;
  z-index:2;
}

.login .choices .choice-icon span{
  font-size:29px;
  line-height:1;
  color:#f5d27a;
}

/* ===== TÍTULO TARJETA ===== */

.login .choices .choice b{
  display:block;
  font-size:24px;
  line-height:1.15;
  letter-spacing:2px;
  margin:0;
  color:#f7f7f4;
  font-weight:600;
  position:relative;
  z-index:2;
}

/* ===== LÍNEA TARJETA ===== */

.login .choices .choice-line{
  width:50px;
  height:2px;
  margin:13px auto 16px;
  background:linear-gradient(
    90deg,
    #b98227,
    #f5d27a,
    #b98227
  );
  border-radius:999px;
  position:relative;
  z-index:2;
}

/* ===== ICONOS SECUNDARIOS ===== */

.login .choices .choice-icons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:19px;
  width:100%;
  margin-bottom:15px;
  position:relative;
  z-index:2;
}

.login .choices .choice-icons span{
  font-size:21px;
  line-height:1;
  color:rgba(255,255,255,.72);
}

/* ===== DESCRIPCIÓN ===== */

.login .choices .choice-description{
  display:block;
  max-width:340px;
  color:rgba(255,255,255,.64);
  font-size:15px;
  line-height:1.45;
  text-align:center;
  position:relative;
  z-index:2;
}

/* ===== PANEL ENTRENADOR ===== */

.choice-admin{
  border-color:rgba(217,170,74,.70) !important;
}

.choice-admin .choice-icon span{
  color:#f5d27a;
}

/* ===== INTERACCIÓN ===== */

.login .choices .choice:hover{
  transform:translateY(-2px);
  border-color:rgba(217,170,74,.58);
  box-shadow:
    0 14px 38px rgba(0,0,0,.35),
    0 0 25px rgba(217,170,74,.06);
}

.choice-admin:hover{
  border-color:rgba(217,170,74,.90) !important;
}

.login .choices .choice:active{
  transform:translateY(0);
}

.diet-list{

.meal-card{

    linear-gradient(
      145deg,

    );

  min-height:60px;
  padding:7px 14px;

}

  align-items:center;
  min-width:0;
  gap:12px;
}

.meal-number{
  flex:none;

  width:46px;

  box-sizing:border-box;

  font-size:14px;
  font-weight:700;

  box-shadow:

  font-family:Georgia,"Times New Roman",serif;

  line-height:1.2;
}

.meal-card summary b::before{

  line-height:1;

/* ===== BOTÓN PRINCIPAL ===== */

#client-main .btn,

#coach-main .btn{

  background:var(--dcc-gold) !important;

  color:#0b0d10 !important;

  border:1px solid var(--dcc-gold) !important;

  border-radius:15px !important;

  font-weight:700 !important;

  box-shadow:none !important;

}

#client-main .btn:hover,

#coach-main .btn:hover{

  background:var(--dcc-gold-light) !important;

  border-color:var(--dcc-gold-light) !important;

}

/* ===== BOTÓN SECUNDARIO ===== */

#client-main .ghost,

#coach-main .ghost{

  background:rgba(255,255,255,.035) !important;

  color:var(--dcc-text) !important;

  border:1px solid rgba(255,255,255,.12) !important;

  border-radius:15px !important;

  font-weight:600 !important;

}

/* ===== PILLS ===== */

#client-main .pill,

#coach-main .pill{

  background:rgba(217,170,74,.08) !important;

  color:var(--dcc-gold-light) !important;

  border:1px solid rgba(217,170,74,.22) !important;

  border-radius:999px !important;

}

/* ===== CAMPOS ===== */

#client-main input,

#client-main textarea,

#client-main select,

#coach-main input,

#coach-main textarea,

#coach-main select{

  background:var(--dcc-panel-2) !important;

  color:var(--dcc-text) !important;

  border:1px solid var(--dcc-line) !important;

  border-radius:14px !important;

}

#client-main input::placeholder,

#client-main textarea::placeholder,

#coach-main input::placeholder,

#coach-main textarea::placeholder{

  color:#6f7680 !important;

}

/* ===== ACENTO DCC ===== */

#client-main strong,

#coach-main strong{

  color:inherit;

}

/* ===== LINKS / ACCIONES ===== */

#client-main a,

#coach-main a{

  color:var(--dcc-gold-light);

}

/* ===== HOME: MISMA TIPOGRAFÍA ===== */

#client-main .dc-home h1,

#client-main .dc-home h2,

#client-main .dc-home h3{

  font-family:inherit !important;

}

/* ===== CONSISTENCIA MÓVIL ===== */

@media(max-width:700px){

  #client-main h1,

  #coach-main h1{

    font-size:28px !important;

  }

  #client-main h2,

  #coach-main h2{

    font-size:20px !important;

  }

  #client-main .card,

  #coach-main .card{

    border-radius:20px !important;

  }

  #client-main .btn,

  #client-main .ghost,

  #coach-main .btn,

  #coach-main .ghost{

    min-height:46px;

  }

}
/* =====================================================
   OPCIONES DE ALIMENTACIÓN — ESTILO DCC
===================================================== */

.diet-options{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  margin:0 0 16px;
  padding:0;
  overflow-x:auto;
  scrollbar-width:none;
}

.diet-options::-webkit-scrollbar{
  display:none;
}

.diet-option{
  flex:0 0 auto;

  min-width:88px;
  height:38px;

  padding:0 15px;

  border:1px solid #dfe3e8;
  border-radius:11px;

  background:#fff;
  color:#7f8792;

  font-size:12px;
  font-weight:700;
  letter-spacing:.2px;

  cursor:pointer;

  transition:
    background .18s ease,
    color .18s ease,
    border-color .18s ease,
    transform .12s ease;
}

.diet-option:active{
  transform:scale(.97);
}

.diet-option.active{
  background:#f0c96b;
  border-color:#f0c96b;
  color:#17191d;
}

.diet-option:not(.active):hover{
  border-color:#c9a957;
  color:#956b18;
}
/* =========================================================
   ALIMENTACIÓN — HALO DORADO PREMIUM
   ========================================================= */

.diet-switch{
  border-color:rgba(217,170,74,.22);

  background:
    linear-gradient(
      135deg,
      rgba(217,170,74,.045),
      rgba(21,22,27,.98) 45%,
      rgba(217,170,74,.025)
    );

  box-shadow:
    0 0 0 1px rgba(217,170,74,.045),
    0 8px 26px rgba(217,170,74,.055),
    inset 0 1px 0 rgba(255,255,255,.025);
}


.diet-pdf-card{
  border-color:rgba(217,170,74,.22);

  background:
    linear-gradient(
      135deg,
      rgba(217,170,74,.055),
      rgba(15,16,20,.98) 48%,
      rgba(217,170,74,.025)
    );

  box-shadow:
    0 0 0 1px rgba(217,170,74,.045),
    0 10px 30px rgba(217,170,74,.065),
    inset 0 1px 0 rgba(255,255,255,.025);
}

/* =========================================================
   DCC — NAVEGACIÓN MÓVIL FINAL
   Cliente: 6 accesos · Entrenador: 7 accesos
   ========================================================= */
@media (max-width:700px){
  #client .nav,
  #client-nav{
    display:grid !important;
    grid-template-columns:repeat(6,minmax(0,1fr)) !important;
  }
}

function shuffleCoachTips(){

  const order =
    COACH_TIPS.map((_,index)=>index);

  for(let i=order.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [order[i],order[j]]=
    [order[j],order[i]];

  }

  return order;
}


function getCoachTipState(clientId){

  const key =
    `dc_coach_tips_${clientId}`;

  try{

    const saved=
      localStorage.getItem(key);

    if(saved){

      const state=
        JSON.parse(saved);

      if(
        Array.isArray(state.order) &&
        state.order.length===COACH_TIPS.length
      ){

        return state;

      }

    }

  }catch(e){

    console.error(
      "Error leyendo consejos:",
      e
    );

  }


  const state={

    order:shuffleCoachTips(),

    position:0,

    dayKey:new Date()
      .toISOString()
      .slice(0,10)

  };


  localStorage.setItem(
    key,
    JSON.stringify(state)
  );

  return state;

}


function getTodayCoachTip(clientId){

  const key =
    `dc_coach_tips_${clientId}`;

  const state=
    getCoachTipState(clientId);

  const now = new Date();

const today =
  now.getFullYear() +
  "-" +
  String(now.getMonth()+1).padStart(2,"0") +
  "-" +
  String(now.getDate()).padStart(2,"0");


  /*
   * Un consejo automático nuevo cada día.
   */

  if(state.dayKey!==today){

    state.position++;

    state.dayKey=today;

    if(state.position>=state.order.length){

      state.order=shuffleCoachTips();

      state.position=0;

    }

    localStorage.setItem(
      key,
      JSON.stringify(state)
    );

  }


  return COACH_TIPS[
    state.order[state.position]
  ];

}


function nextCoachTip(clientId){

  const key =
    `dc_coach_tips_${clientId}`;

  const state=
    getCoachTipState(clientId);


  state.position++;

  if(state.position>=state.order.length){

    state.order=shuffleCoachTips();

    state.position=0;

  }

  const now = new Date();

state.dayKey =
  now.getFullYear() +
  "-" +
  String(now.getMonth()+1).padStart(2,"0") +
  "-" +
  String(now.getDate()).padStart(2,"0");

  localStorage.setItem(
    key,
    JSON.stringify(state)
  );


  showClient("training");

}
function getCurrentWeekKey(){

  const now = new Date();
  const day = now.getDay();

  const monday = new Date(now);

  const diff = day === 0 ? -6 : 1 - day;

  monday.setDate(now.getDate() + diff);
  monday.setHours(0,0,0,0);

  return monday.getFullYear()+"-"+String(monday.getMonth()+1).padStart(2,"0")+"-"+String(monday.getDate()).padStart(2,"0");
}


function isMonday(){

  return new Date().getDay() === 1;

}

  if(!data.checkins) return;

  const checkin=data.checkins[currentClientId];

  if(!checkin) return;

  const weekKey=getCurrentWeekKey();
  const weekStart=new Date(`${weekKey}T00:00:00`);

  const sentThisWeek=
    !!(
      checkin.sentAt &&
      new Date(checkin.sentAt) >= weekStart
    );

  checkin.energy="";
  checkin.comment="";
  checkin.reviewed=false;
  checkin.preparedWeekKey=weekKey;

  saveData();

async function loadTrainingProgressFromSupabase(){
  try{
    const {data:rows,error}=await supabaseClient
      .from("client_training_progress")
      .select("client_id,completed_days,next_day_index,week_start,updated_at");

    if(error){
      console.error("Error cargando progreso de entrenamiento:",error);
      return false;
    }

    data.completedTrainingDays={};
    data.trainingNextDayIndex={};
    data.trainingProgressWeekStart={};

    const currentWeek=getCurrentWeekKey();
    const stale=[];

    (rows||[]).forEach(row=>{
      const id=String(row.client_id);
      const rowWeek=String(row.week_start||"");
      const completed=Array.isArray(row.completed_days)
        ? [...new Set(row.completed_days.map(Number).filter(Number.isInteger).filter(n=>n>=0))]
        : [];

      data.trainingNextDayIndex[id]=Math.max(0,parseInt(row.next_day_index)||0);

      if(rowWeek===currentWeek){
        data.completedTrainingDays[id]=completed;
        data.trainingProgressWeekStart[id]=currentWeek;
      }else{
        data.completedTrainingDays[id]=[];
        data.trainingProgressWeekStart[id]=currentWeek;
        stale.push({
          client_id:id,
          completed_days:[],
          next_day_index:data.trainingNextDayIndex[id],
          week_start:currentWeek,
          updated_at:new Date().toISOString()
        });
      }
    });

    if(stale.length){
      const {error:resetError}=await supabaseClient
        .from("client_training_progress")
        .upsert(stale,{onConflict:"client_id"});
      if(resetError)console.error("Error reiniciando progreso semanal:",resetError);
    }

    saveData();
    return true;

  }catch(e){
    console.error("Error conectando con Supabase para progreso de entrenamiento:",e);
    return false;
  }
}

async function saveTrainingProgressToSupabase(clientId){
  try{
    if(!clientId)return false;

    if(!data.completedTrainingDays)data.completedTrainingDays={};
    if(!data.trainingNextDayIndex)data.trainingNextDayIndex={};
    if(!data.trainingProgressWeekStart)data.trainingProgressWeekStart={};

    const weekKey=getCurrentWeekKey();

    if(data.trainingProgressWeekStart[clientId]!==weekKey){
      data.completedTrainingDays[clientId]=[];
      data.trainingProgressWeekStart[clientId]=weekKey;
    }

    const completed=Array.isArray(data.completedTrainingDays[clientId])
      ? [...new Set(data.completedTrainingDays[clientId].map(Number).filter(Number.isInteger).filter(n=>n>=0))].sort((a,b)=>a-b)
      : [];

    const nextDayIndex=Math.max(0,parseInt(data.trainingNextDayIndex[clientId])||0);

    const {error}=await supabaseClient
      .from("client_training_progress")
      .upsert({
        client_id:String(clientId),
        completed_days:completed,
        next_day_index:nextDayIndex,
        week_start:weekKey,
        updated_at:new Date().toISOString()
      },{onConflict:"client_id"});

    if(error)throw error;
    return true;
  }catch(e){
    console.error("Error guardando progreso de entrenamiento:",e);
    return false;
  }
}

function ensureTrainingProgressWeek(clientId){
  if(!data.completedTrainingDays)data.completedTrainingDays={};
  if(!data.trainingNextDayIndex)data.trainingNextDayIndex={};
  if(!data.trainingProgressWeekStart)data.trainingProgressWeekStart={};

  const weekKey=getCurrentWeekKey();

  if(data.trainingProgressWeekStart[clientId]!==weekKey){
    data.completedTrainingDays[clientId]=[];
    data.trainingProgressWeekStart[clientId]=weekKey;
    saveData();
  }

  if(!Array.isArray(data.completedTrainingDays[clientId])){
    data.completedTrainingDays[clientId]=[];
  }

  return weekKey;
}

function getCompletedTrainingDays(clientId){
  ensureTrainingProgressWeek(clientId);
  return data.completedTrainingDays[clientId];
}

function getTrainingNextDayIndex(clientId,totalDays){
  const total=Math.max(0,parseInt(totalDays)||0);
  if(!total)return 0;

  ensureTrainingProgressWeek(clientId);

  const history=(data.workoutHistory?.[clientId]||[])
    .filter(w=>Number.isInteger(Number(w?.dayIndex)))
    .slice()
    .sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));

  if(history.length){
    const latestIndex=Number(history[0].dayIndex);
    const inferred=(latestIndex+1)%total;
    if(data.trainingNextDayIndex[clientId]!==inferred){
      data.trainingNextDayIndex[clientId]=inferred;
      saveData();
    }
    return inferred;
  }

  const stored=parseInt(data.trainingNextDayIndex[clientId]);
  if(Number.isInteger(stored)&&stored>=0){
    return stored%total;
  }

  const legacy=getCompletedTrainingDays(clientId);
  const inferred=Math.max(0,legacy.length)%total;
  data.trainingNextDayIndex[clientId]=inferred;
  saveData();
  return inferred;
}

function isTrainingDayCompleted(clientId,dayIndex){
  const index=Number(dayIndex);
  const weekStart=getWeekStart();
  const now=new Date();

  const history=data.workoutHistory?.[clientId]||[];
  const found=history.some(w=>{
    const date=new Date(w?.date||0);
    return Number(w?.dayIndex)===index && date>=weekStart && date<=now;
  });

  if(found)return true;
  return getCompletedTrainingDays(clientId).includes(index);
}

function markTrainingDayCompleted(clientId,dayIndex,totalDays){
  const total=Math.max(1,parseInt(totalDays)||1);
  const index=Math.max(0,Number(dayIndex)||0);

  ensureTrainingProgressWeek(clientId);

  const completed=getCompletedTrainingDays(clientId);
  if(!completed.includes(index)){
    completed.push(index);
    completed.sort((a,b)=>a-b);
  }

  const next=(index+1)%total;
  data.trainingNextDayIndex[clientId]=next;
  window.trainingDayTab=next;

  saveData();

  Promise.resolve(saveTrainingProgressToSupabase(clientId)).then(ok=>{
    if(!ok){
      try{toast("El entrenamiento se guardó, pero no se pudo sincronizar el progreso semanal.");}catch(_){}
    }
  });

  return getWeeklyWorkoutCount(clientId)>=total;
}

function getClientManagementStatus(id){

  const diet = data.diets?.[id];

  const trainingMeals =
    diet?.training?.meals || [];

  const restMeals =
    diet?.rest?.meals || [];

  const trainingFoods = trainingMeals.reduce(
  (total,meal) =>
    total +
    ensureMealOptions(meal).reduce(
      (sum,option) =>
        sum + (option.foods?.length || 0),
      0
    ),
  0
);

const restFoods = restMeals.reduce(
  (total,meal) =>
    total +
    ensureMealOptions(meal).reduce(
      (sum,option) =>
        sum + (option.foods?.length || 0),
      0
    ),
  0
);

  let dietStatus = "Falta gestionar dieta";

  if(trainingFoods > 0 || restFoods > 0){

    const hasTrainingMeals =
      trainingMeals.length > 0 &&
      trainingMeals.every(
        meal =>
  ensureMealOptions(meal).some(
    option => (option.foods?.length || 0) > 0
  )
      );

    const hasRestMeals =
      restMeals.length > 0 &&
      restMeals.every(
        meal =>
  ensureMealOptions(meal).some(
    option => (option.foods?.length || 0) > 0
  )
      );

    if(hasTrainingMeals && hasRestMeals){

      dietStatus = "Dieta gestionada";

    }else{

      dietStatus = "Acabar de gestionar alimentación";

    }

  }


  const routine =
    data.routines?.[id] || [];

  let routineStatus =
    "Falta gestionar entrenamiento";

  if(routine.length > 0){

    const completeRoutine =
      routine.every(day =>
        Array.isArray(day.exercises) &&
        day.exercises.length > 0
      );

    routineStatus =
      completeRoutine
        ? "Entrenamiento gestionado"
        : "Acabar de gestionar entrenamiento";
  }


  return {
    diet:dietStatus,
    training:routineStatus
  };
}

function setupMessageRealtime(){

  if(window.clientMessagesRealtimeChannel){
    return;
  }

  const channel = supabaseClient
    .channel("client-messages-sync")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"client_messages"
      },
      payload=>{

        const row=payload?.new;

        if(!row?.client_id) return;

        if(!data.messages){
          data.messages={};
        }

        if(!data.messages[row.client_id]){
          data.messages[row.client_id]=[];
        }

        const exists=data.messages[row.client_id].some(m=>
          m?.[0]===row.sender &&
          m?.[1]===row.message &&
          m?.[2]===row.created_at
        );

        if(!exists){
          data.messages[row.client_id].push([
            row.sender || "",
            row.message || "",
            row.created_at || null
          ]);

          saveData();
        }

        if(
          currentApp==="client" &&
          row.client_id===currentClientId
        ){

          if(currentScreen==="messages"){

            const draft=
              document.getElementById("client-message")?.value || "";

            showClient("messages");

            requestAnimationFrame(()=>{
              const box=document.getElementById("client-message");
              if(box) box.value=draft;
            });

          }else if(currentScreen==="home"){

            showClient("home");

          }

        }

        if(currentApp==="coach"){

          if(
            window.openCoachMessageClientId===row.client_id &&
            document.getElementById("modal")?.style.display==="grid"
          ){

            const draft=
              document.getElementById("coach-message")?.value || "";

            openMessages(row.client_id);

            requestAnimationFrame(()=>{
              const box=document.getElementById("coach-message");
              if(box) box.value=draft;
            });

          }else if(currentScreen==="messages"){

            showCoach("messages");

          }else if(currentScreen==="dashboard"){

            showCoach("dashboard");

          }

        }

      }
    )
    .subscribe(status=>{
      if(status==="CHANNEL_ERROR"){
        console.error("No se pudo activar la mensajería en tiempo real");
      }
    });

  window.clientMessagesRealtimeChannel=channel;
}

async function openApp(app){

  console.log("openApp funciona", app);

  if(app !== "client" && app !== "coach"){
    console.error("Aplicación no válida:", app);
    return;
  }

  if(window.__dccOpenAppPromise){
    const pendingMain=app==="client"
      ? document.getElementById("client-main")
      : document.getElementById("coach-main");
    const clientReady=
      app==="client" &&
      currentApp==="client" &&
      currentClientId &&
      typeof client==="function" &&
      !!client(currentClientId);

    if(clientReady && pendingMain && !pendingMain.textContent.trim()){
      try{
        showClient(currentScreen||"home");
      }catch(error){
        console.warn("DCC openApp pending repaint",error);
      }
    }

    return window.__dccOpenAppPromise;
  }

  const loginAlreadyHidden = document.getElementById("login")?.style.display==="none";
  const alreadyOpen = currentApp===app && document.getElementById(app)?.style.display==="block" && loginAlreadyHidden;

  if(alreadyOpen){
    if(app==="client"){
      const clientMain=document.getElementById("client-main");
      const targetScreen=String(currentScreen||"home");
      const homeMissing=
        targetScreen==="home" &&
        clientMain &&
        !clientMain.querySelector(".dch-wrap");

      if(currentClientId && homeMissing){
        try{
          showClient("home");
        }catch(error){
          console.warn("DCC openApp restored home repaint",error);
        }
      }
    }
    return true;
  }

  window.__dccOpenAppPromise=Promise.resolve(true);
  currentApp = app;
  window.currentApp = app;

  // La entrada debe pintar una sola vez. Realtime y la sincronización
  // pesada arrancan después, sin competir con el retorno OAuth en Safari.

  const login =
    document.getElementById("login");

  const clientApp =
    document.getElementById("client");

  const coachApp =
    document.getElementById("coach");

  login.style.display = "none";

  clientApp.style.display =
    app === "client" ? "block" : "none";

  coachApp.style.display =
    app === "coach" ? "block" : "none";

  // Al cambiar del login a la aplicación, no conservar la posición
  // de scroll de la pantalla de acceso.
  window.scrollTo(0,0);


  if(app === "client"){

    buildClientNav();

    const clientMain=document.getElementById("client-main");
    if(clientMain){
      clientMain.innerHTML='<div style="padding:28px 20px;color:#6f747c;font-weight:700">Cargando tu perfil…</div>';
    }

    try{
      const {data:claimedClientId,error:claimError}=await supabaseClient.rpc("dcc_claim_client_access");
      if(claimError)throw claimError;
      if(!claimedClientId)throw new Error("No hay ningún cliente asociado a esta cuenta de Google");

      currentClientId=String(claimedClientId);
      window.currentClientId=currentClientId;

      await loadClientsFromSupabase();

      if(!client(currentClientId)){
        throw new Error("No se pudo cargar el perfil del cliente");
      }

      // Inicio depende de rutina, check-in, historial, métricas, mensajes y
      // notificaciones. Antes se pintaba Inicio antes de que esos datos
      // estuvieran listos y Safari/iOS podía dejar el contenedor sin pintar
      // hasta que el usuario cambiaba de pestaña.
      currentScreen="home";
      window.currentScreen="home";

      await Promise.allSettled([
        loadDietsFromSupabase(),
        loadRoutinesFromSupabase(),
        loadWorkoutHistoryFromSupabase(),
        loadTrainingProgressFromSupabase(),
        loadWeightsFromSupabase(),
        loadNotificationStateFromSupabase(),
        loadMessagesFromSupabase(),
        loadCheckinHistoryFromSupabase(),
        loadCheckinsFromSupabase()
      ]);

      const loadedRoutine=Array.isArray(data.routines?.[currentClientId])?data.routines[currentClientId]:[];
      if(loadedRoutine.length){
        window.trainingDayTab=getTrainingNextDayIndex(currentClientId,loadedRoutine.length);
      }

      showClient("home");
      setupMessageRealtime();

      // Guardia final para restauraciones de página de Safari.
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          if(
            currentApp==="client" &&
            currentScreen==="home" &&
            currentClientId &&
            !document.querySelector("#client-main .dch-wrap")
          ){
            try{showClient("home")}catch(error){console.warn("DCC home final paint",error)}
          }
        });
      });

    }catch(error){
      console.error("Error accediendo al perfil cliente:",error);
      window.__dccOpenAppPromise=null;
      currentClientId=null;
      window.currentClientId=null;
      if(clientMain){
        clientMain.innerHTML='<div style="margin:24px;padding:20px;border:1px solid rgba(183,123,19,.25);border-radius:18px;background:#fffdf9;color:#17191d"><h2 style="margin:0 0 8px">No se pudo abrir el perfil de cliente</h2><p style="margin:0 0 14px;color:#6f747c;line-height:1.45">Entra con la cuenta de Google cuyo correo está asignado al cliente en el panel del entrenador.</p><button type="button" onclick="logout()" style="width:100%;min-height:46px;border:1px solid #d9aa4a;border-radius:12px;background:#f4d16f;font-weight:850">Cambiar cuenta</button></div>';
      }
    }

  }else{

    buildCoachNav();

    // Entramos al panel inmediatamente. La sincronización con Supabase
    // no debe bloquear la primera pintura del entrenador.
    showCoach("dashboard");

    setTimeout(()=>{
      setupMessageRealtime();
      Promise.allSettled([
        loadDietsFromSupabase(),
        loadClientsFromSupabase(),
        loadRoutinesFromSupabase(),
        loadWorkoutHistoryFromSupabase(),
        loadWeightsFromSupabase(),
        loadMessagesFromSupabase(),
        loadCheckinsFromSupabase()
      ]).then(()=>{
        // Los datos quedan sincronizados sin forzar una segunda entrada/render
        // del panel inmediatamente después del OAuth.
      });
    },700);

  }

  // La promesa solo bloquea aperturas concurrentes. No debe quedar
  // permanente, porque Safari/iOS puede restaurar la app desde caché
  // y necesitar una nueva pintura de Inicio.
  window.__dccOpenAppPromise=null;
  return true;

}

function getWeekStart(date=new Date()){

  const d=new Date(date);
  const day=d.getDay();

  const diff=day===0 ? -6 : 1-day;

  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);

  return d;
}

function getWeeklyWorkoutCount(clientId){

  const history=data.workoutHistory?.[clientId]||[];

  const weekStart=getWeekStart();
  const now=new Date();

  return history.filter(w=>{

    const date=new Date(w.date);

    return date>=weekStart && date<=now;

  }).length;
}

function getTodayWorkoutCount(clientId){

  const history=data.workoutHistory?.[clientId]||[];
  const now=new Date();
  const start=new Date(now);
  start.setHours(0,0,0,0);
  const end=new Date(start);
  end.setDate(end.getDate()+1);

  return history.filter(w=>{
    const date=new Date(w.date);
    return date>=start && date<end;
  }).length;
}

function getTrainingAccessState(clientId,dayIndex){

  const routine=Array.isArray(data.routines?.[clientId])
    ? data.routines[clientId]
    : [];

  const index=Math.max(0,Number(dayIndex)||0);
  const completedThisWeek=getWeeklyWorkoutCount(clientId);
  const completedToday=getTodayWorkoutCount(clientId);

  if(!routine.length){
    return {
      allowed:false,
      reason:"No tienes una rutina disponible",
      code:"no-routine",
      nextIndex:0,
      completedThisWeek
    };
  }

  const nextIndex=getTrainingNextDayIndex(
    clientId,
    routine.length
  );

  /*
    Un día ya realizado esta semana no puede repetirse.
    Se desbloquea de nuevo cuando empieza la semana del lunes siguiente.
  */
  if(isTrainingDayCompleted(clientId,index)){
    return {
      allowed:false,
      reason:"Este entrenamiento ya está completado esta semana. Volverá a estar disponible el próximo lunes.",
      code:"already-completed",
      nextIndex,
      completedThisWeek
    };
  }

  /*
    Límite semanal:
    el cliente nunca puede superar el número de sesiones
    que el entrenador ha programado para esa rutina.
  */
  if(completedThisWeek>=routine.length){
    return {
      allowed:false,
      reason:"Has completado todos los entrenamientos permitidos esta semana. El siguiente se habilitará la próxima semana.",
      code:"week-complete",
      nextIndex,
      completedThisWeek
    };
  }

  /*
    Orden continuo:
    si quedó un día pendiente la semana anterior, ese día sigue
    siendo el siguiente. La semana nueva no fuerza Día 1.
  */
  if(index!==nextIndex){
    return {
      allowed:false,
      reason:`Tu próximo entrenamiento es el Día ${nextIndex+1}.`,
      code:"sequence-required",
      nextIndex,
      completedThisWeek
    };
  }

  if(completedToday>0){
    return {
      allowed:false,

const recognizeExercise = (name="") => {

  const n = normalizeExerciseName(name);

  if(!n){
    return null;
  }

  let bestMatch = null;
  let bestScore = 0;

  exerciseLibrary.forEach(exercise => {

    exercise.aliases.forEach(alias => {

      const a = normalizeExerciseName(alias);

      /*
       * Coincidencia exacta
       */
      if(n === a){
        bestMatch = exercise;
        bestScore = 100;
        return;
      }

      /*
       * El nombre contiene la variante conocida
       */
      if(n.includes(a)){
        if(bestScore < 90){
          bestMatch = exercise;
          bestScore = 90;
        }
      }

      /*
       * La variante contiene el nombre escrito
       */
      if(a.includes(n) && n.length >= 5){
        if(bestScore < 80){
          bestMatch = exercise;
          bestScore = 80;
        }
      }

    });

  });

  return bestScore >= 80
    ? bestMatch
    : null;

};

  const currentBodyFat =
    progressCheckin.bodyFat !== undefined &&

  const bodyFatChange =
    initialBodyFat !== null &&
    currentBodyFat !== null
      ? currentBodyFat-initialBodyFat
      : null;


  /*
    GRÁFICA DE PESO
  */

  const chartValues =
    weightHistory
      .map(Number)
      .filter(Number.isFinite);


  const chartPoints =
    chartValues.length > 1

      ? (()=>{

          const min =
            Math.min(...chartValues);

          const max =
            Math.max(...chartValues);

          const range =
            max-min || 1;

          return chartValues
            .map((value,index)=>{

              const x =
                chartValues.length===1
                  ? 50
                  : (index/(chartValues.length-1))*100;

              const y =
                88 -
                ((value-min)/range)*68;

              return `${x},${y}`;

            })
            .join(" ");

        })()

    MEJORA DE FUERZA

    Comparamos los dos últimos entrenamientos
    reales guardados para el cliente.

    Cada serie utiliza kg × repeticiones.

      const previousSets =

          ? previousExercise.sets
          : [];


      if(
        !currentSets.length ||
        !previousSets.length

        return;
      }


      const bestCurrent =
        currentSets.reduce(
          (best,set)=>{

            const kg =
              Number(set.kg)||0;

            const reps =
              Number(set.reps)||0;

            const value =
              kg*reps;

            return value>best.value
              ? {
                  kg:kg,
                  reps:reps,
                  value:value
                }
              : best;

          },
          {
            kg:0,
            reps:0,
            value:0
          }
        );

function startWorkout(dayIndex){

  const index=Number(dayIndex);
  const access=getTrainingAccessState(currentClientId,index);

  if(!access.allowed){
    toast(access.reason);
    return;
  }

  const routine = data.routines[currentClientId] || [];
  const day = routine[index];

  if(!day){
    toast("No se encontró el entrenamiento");
    return;
  }

  const exercises = (day.exercises || []).map(ex=>{
    const hasOwnMethodRest=!!(ex?.supersetId||ex?.restPause);
    return {
      ...ex,
      restBetweenSets:
        hasOwnMethodRest
          ? Math.max(0,parseInt(ex.restBetweenSets)||0)
          : day.restBetweenSetsGlobal !== undefined
            ? Math.max(0,parseInt(day.restBetweenSetsGlobal)||0)
            : Math.max(0,parseInt(ex.restBetweenSets)||0),
      restBetweenExercises:
        hasOwnMethodRest
          ? Math.max(0,parseInt(ex.restBetweenExercises)||0)
          : day.restBetweenExercisesGlobal !== undefined
            ? Math.max(0,parseInt(day.restBetweenExercisesGlobal)||0)
            : Math.max(0,parseInt(ex.restBetweenExercises)||0)
    };
  });

  if(!exercises.length){
    toast("Este entrenamiento no tiene ejercicios");
    return;
  }

  window.activeWorkout = {
    clientId:currentClientId,
    dayIndex:Number(dayIndex),
    dayName:day.muscle || "Entrenamiento",
    anatomy:String(day.anatomy||"male").toLowerCase()==="female"?"female":"male",
    exercises:JSON.parse(JSON.stringify(exercises)),
    startedAt:Date.now(),
    currentExercise:0,
    sets:[],
    completedExercises:[]
  };

  renderWorkoutSession();
}

function startRestTimer(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!window.workoutAudioCtx){
      window.workoutAudioCtx = new AudioContext();
    }

    if(window.workoutAudioCtx.state === "suspended"){
      window.workoutAudioCtx.resume();
    }

  }catch(e){

    console.log("Audio no disponible:",e);

  }
  clearInterval(window.restTimerInterval);

  const workout = window.activeWorkout;

  if(!workout || !workout.restUntil) return;

  window.restTimerInterval = setInterval(()=>{

    if(!window.activeWorkout){
      clearInterval(window.restTimerInterval);
      return;
    }

    const remaining = Math.max(
      0,
      Math.ceil((workout.restUntil - Date.now()) / 1000)
    );

    const timer = document.getElementById("rest-timer");

    if(timer){

      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;

      timer.textContent =
        `${minutes}:${String(seconds).padStart(2,"0")}`;

    }

    
    if(remaining >= 1 && remaining <= 10){

  if(window.lastBeepSecond !== remaining){

    window.lastBeepSecond = remaining;

    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const audioCtx = window.workoutAudioCtx || new AudioContext();

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.frequency.value = 800;
      oscillator.type = "sine";

      gainNode.gain.value = 0.12;

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();

      oscillator.stop(audioCtx.currentTime + 0.12);

    }catch(e){
      console.log("No se pudo reproducir el sonido:",e);
    }

  }

}
    if(remaining <= 0){

  clearInterval(window.restTimerInterval);

  const finishedRestMode=workout.restMode;

  workout.restUntil = null;
  workout.restMode = null;

  if(finishedRestMode==="restpause-final"){

    const restPauseCtx=getWorkoutRestPauseContext(workout);

    if(restPauseCtx){
      completeWorkoutRestPause(restPauseCtx);
      return;
    }
  }

  renderWorkoutSession();

  if(finishedRestMode==="exercise"){

    toast("Descanso terminado · Siguiente ejercicio");

  }else if(finishedRestMode==="restpause-mini"){

    toast("Mini descanso terminado · Siguiente bloque");

  }else{

    toast("Descanso terminado · Siguiente serie");

  }

}

  },250);
}


function skipRest(){

  const workout = window.activeWorkout;

  if(!workout) return;

  clearInterval(window.restTimerInterval);

  const skippedRestMode=workout.restMode;

  workout.restUntil = null;
  workout.restMode = null;

  if(skippedRestMode==="restpause-final"){

    const restPauseCtx=getWorkoutRestPauseContext(workout);

      return;

    toast("Mini descanso omitido · Siguiente bloque");

  }else{

    toast("Descanso omitido · Siguiente serie");

  }
}


function getWorkoutSupersetContext(workout){
  if(!workout)return null;

  const currentIndex=Number(workout.currentExercise)||0;
  const exercise=workout.exercises?.[currentIndex];

  if(!exercise?.supersetId)return null;

  if(!workout.supersetRoundById)workout.supersetRoundById={};

  const groupIndices=(workout.exercises||[])
    .map((item,index)=>item?.supersetId===exercise.supersetId?index:-1)
    .filter(index=>index>=0)
    .sort((a,b)=>{
      const ao=parseInt(workout.exercises[a]?.supersetOrder);
      const bo=parseInt(workout.exercises[b]?.supersetOrder);
      return (Number.isFinite(ao)?ao:a)-(Number.isFinite(bo)?bo:b);
    });

  if(!groupIndices.length)return null;

  const position=Math.max(0,groupIndices.indexOf(currentIndex));
  const rounds=Math.max(1,parseInt(exercise.supersetRounds)||parseInt(exercise.sets)||1);
  const round=Math.min(
    rounds,
    Math.max(1,parseInt(workout.supersetRoundById[exercise.supersetId])||1)
  );
  const rest=Math.max(
    0,
    parseInt(exercise.supersetRest)||
    parseInt(workout.exercises[groupIndices[0]]?.supersetRest)||
    0
  );

  return {
    workout,
    exercise,
    groupIndices,
    position,
    rounds,
    round,
    rest
  };
}

function recordWorkoutSupersetSet(ctx){
  const workout=ctx.workout;
  const exercise=ctx.exercise;

  if(!Array.isArray(workout.completedExercises))workout.completedExercises=[];

  const existing=workout.completedExercises.find(item=>
    item?.supersetId===exercise.supersetId &&
    (
      (exercise.libraryId&&item.libraryId===exercise.libraryId) ||
      (!exercise.libraryId&&item.name===exercise.name)
    )
  );

  const copy=JSON.parse(JSON.stringify(workout.sets||[]));

  if(existing){
    existing.sets.push(...copy);
    return;
  }

  workout.completedExercises.push({
    libraryId:exercise.libraryId||"",
    name:exercise.name||"Ejercicio",
    plannedSets:ctx.rounds,
    plannedReps:exercise.reps||"",
    supersetId:exercise.supersetId,
    supersetOrder:exercise.supersetOrder||ctx.position+1,
    sets:copy
  });
}

function getWorkoutRestPauseContext(workout){
  if(!workout)return null;

  const currentIndex=Number(workout.currentExercise)||0;
  const exercise=workout.exercises?.[currentIndex];

  if(!exercise?.restPause)return null;

  const reps=String(exercise.restPauseReps||exercise.reps||"")
    .trim();

  const targets=reps
    .split(/[\/\-–,\s]+/)
    .map(value=>String(value||"").trim())
    .filter(Boolean);

  const blocks=Math.max(
    1,
    targets.length||
    parseInt(exercise.restPauseBlocks)||
    parseInt(exercise.sets)||
    1
  );

  const miniRest=Math.max(
    1,
    parseInt(exercise.restPauseSeconds)||
    parseInt(exercise.restBetweenSets)||
    1
  );

  const finalRest=Math.max(
    0,
    parseInt(exercise.restPauseFinalRest)||
    parseInt(exercise.restBetweenExercises)||
    0
  );

  return {
    workout,
    exercise,
    targets,
    reps,
    blocks,
    miniRest,
    finalRest
  };
}

function completeWorkoutRestPause(ctx){
  if(!ctx?.workout||!ctx?.exercise)return;

  const workout=ctx.workout;
  const exercise=ctx.exercise;

  if(!Array.isArray(workout.completedExercises)){
    workout.completedExercises=[];
  }

  workout.completedExercises.push({
    libraryId:exercise.libraryId||"",
    name:exercise.name||"Ejercicio",
    plannedSets:ctx.blocks,
    plannedReps:ctx.reps||exercise.reps||"",
    restPause:true,
    restPauseReps:ctx.reps||"",
    restPauseSeconds:ctx.miniRest,
    restPauseFinalRest:ctx.finalRest,
    sets:JSON.parse(JSON.stringify(workout.sets||[]))
  });

  workout.sets=[];
  workout.restUntil=null;
  workout.restMode=null;
  workout.restPausePendingFinal=false;
  workout.currentExercise++;

  if(workout.currentExercise>=workout.exercises.length){
    finishWorkout();
    return;
  }

  renderWorkoutSession();
  toast("REST-pause completado · Siguiente ejercicio");
}


function saveWorkoutSet(){

  const workout = window.activeWorkout;

  if(!workout) return;

  /* No permitir guardar otra serie durante el descanso */

  if(workout.restUntil && workout.restUntil > Date.now()){

    toast("Espera a que termine el descanso");

    return;
  }

  const exercise =
    workout.exercises[workout.currentExercise];

  const supersetCtx=
    getWorkoutSupersetContext(workout);

  const restPauseCtx=
    getWorkoutRestPauseContext(workout);

  const plannedSets =
    restPauseCtx?.blocks ||
    parseInt(exercise?.sets) || 0;

  if(
    !supersetCtx &&
    plannedSets &&
    workout.sets.length >= plannedSets
  ){

    toast("Ya has completado todas las series");

    return;
  }

  if(
    supersetCtx &&
    Array.isArray(workout.sets) &&
    workout.sets.length >= 1
  ){

    toast("Esta parte de la superserie ya está completada");

    return;
  }

  const kgInput =
    document.getElementById("workout-kg");

  const repsInput =
    document.getElementById("workout-reps");

  if(!kgInput || !repsInput) return;

  const kg =
    kgInput.value.trim();

  const reps =
    repsInput.value.trim();

  if(!kg || !reps){

    toast("Introduce peso y repeticiones");

    return;
  }

  const kgValue =
    parseFloat(kg.replace(",","."));

  const repsValue =
    parseInt(reps);

  if(
    !Number.isFinite(kgValue) ||
    !Number.isFinite(repsValue) ||
    kgValue < 0 ||
    repsValue <= 0
  ){

    toast("Introduce valores válidos");

    return;
  }

  workout.sets.push({
    kg:kgValue,
    reps:repsValue
  });

  /*
    SUPERSERIE:
    A1 -> B1 -> descanso -> A2 -> B2 -> descanso...
    Nunca se inicia descanso al guardar el primer ejercicio de la vuelta.
  */
  if(supersetCtx){
    nextWorkoutExercise();
    return;
  }

  /*
    REST-PAUSE:
    bloque -> mini descanso -> bloque -> mini descanso...
    Al terminar el último bloque se usa SOLO el descanso final
    configurado por el entrenador.
  */
  if(restPauseCtx){

    const completedBlocks=
      Array.isArray(workout.sets)
        ? workout.sets.length
        : 0;

    if(completedBlocks < restPauseCtx.blocks){

      workout.restUntil=
        Date.now() + (restPauseCtx.miniRest * 1000);

      workout.restMode="restpause-mini";
      workout.restPausePendingFinal=false;

      renderWorkoutSession();
      startRestTimer();

      toast(
        `Bloque ${completedBlocks} guardado · Mini descanso ${restPauseCtx.miniRest} s`
      );

      return;
    }

    workout.restPausePendingFinal=true;

    if(restPauseCtx.finalRest > 0){

      workout.restUntil=
        Date.now() + (restPauseCtx.finalRest * 1000);

      workout.restMode="restpause-final";

      renderWorkoutSession();
      startRestTimer();

      toast(
        `REST-pause completado · Descanso final ${restPauseCtx.finalRest} s`
      );

      return;
    }

    completeWorkoutRestPause(restPauseCtx);
    return;
  }

/* Descanso configurado por el entrenador */

const restSeconds =
  Math.max(
    0,
    parseInt(exercise?.restBetweenSets) || 0
  );

if(restSeconds > 0){

  workout.restUntil =
    Date.now() + (restSeconds * 1000);

  workout.restMode="set";

  renderWorkoutSession();

  startRestTimer();

  toast(`Serie guardada · Descanso ${restSeconds} s`);
}else{

  workout.restUntil = null;

  renderWorkoutSession();

  toast("Serie guardada");
}
}

function nextWorkoutExercise(){

  const workout=window.activeWorkout;

  if(!workout)return;

  const exercise=
    workout.exercises[workout.currentExercise];

  if(!exercise){
    finishWorkout();
    return;
  }

  if(!workout.sets || !workout.sets.length){
    toast("Registra al menos una serie");
    return;
  }

  const supersetCtx=
    getWorkoutSupersetContext(workout);

  if(supersetCtx){

    recordWorkoutSupersetSet(supersetCtx);

    workout.sets=[];

    /* Todavía quedan ejercicios dentro de esta misma vuelta: NO descansar. */
    if(supersetCtx.position < supersetCtx.groupIndices.length-1){

      workout.currentExercise=
        supersetCtx.groupIndices[supersetCtx.position+1];

      workout.restUntil=null;
      workout.restMode=null;

      renderWorkoutSession();

      toast("Siguiente ejercicio · sin descanso");

      return;
    }

    /* Se han registrado todos los ejercicios de la vuelta. Ahora sí descansa. */
    if(supersetCtx.round < supersetCtx.rounds){

      workout.supersetRoundById[supersetCtx.exercise.supersetId]=
        supersetCtx.round+1;

      workout.currentExercise=
        supersetCtx.groupIndices[0];

      if(supersetCtx.rest>0){

        workout.restUntil=
          Date.now() + (supersetCtx.rest * 1000);

        workout.restMode="exercise";

        renderWorkoutSession();

        startRestTimer();

        toast(
          `Vuelta ${supersetCtx.round} completada · Descanso ${supersetCtx.rest} s`
        );

        return;
      }

      workout.restUntil=null;
      workout.restMode=null;

      renderWorkoutSession();

      toast(
        `Empieza la vuelta ${supersetCtx.round+1}`
      );

      return;
    }

    /* Última vuelta terminada: salir de la superserie. */
    workout.supersetRoundById[supersetCtx.exercise.supersetId]=
      supersetCtx.rounds;

    workout.currentExercise=
      Math.max(...supersetCtx.groupIndices)+1;

    if(workout.currentExercise >= workout.exercises.length){

      finishWorkout();

      return;
    }

    if(supersetCtx.rest>0){

      workout.restUntil=
        Date.now() + (supersetCtx.rest * 1000);

      workout.restMode="exercise";

      renderWorkoutSession();

      startRestTimer();

      toast(
        `Superserie completada · Descanso ${supersetCtx.rest} s`
      );

      return;
    }

    workout.restUntil=null;
    workout.restMode=null;

    renderWorkoutSession();

    toast("Superserie completada");

    return;
  }

  workout.completedExercises.push({

    name:exercise.name || "Ejercicio",

    plannedSets:exercise.sets || "",

    plannedReps:exercise.reps || "",

    sets:JSON.parse(JSON.stringify(workout.sets))

  });

  workout.currentExercise++;

  workout.sets=[];

  /* Último ejercicio: terminar directamente */

  if(workout.currentExercise >= workout.exercises.length){

    finishWorkout();

    return;

  }

  /*
    Si el siguiente bloque es una superserie, se entra directamente.
    El descanso propio de la superserie solo empieza tras completar
    todos sus ejercicios de la vuelta.
  */
  const nextExercise=workout.exercises[workout.currentExercise];

  if(nextExercise?.supersetId){

    workout.restUntil=null;
    workout.restMode=null;

    renderWorkoutSession();

    toast("Empieza la superserie · sin descanso");

    return;
  }

  /* Descanso entre ejercicios configurado por el entrenador */

  const restSeconds=
    Math.max(
      0,
      parseInt(exercise.restBetweenExercises) || 0
    );

  if(restSeconds > 0){

    workout.restUntil=
      Date.now() + (restSeconds * 1000);

    workout.restMode="exercise";

    renderWorkoutSession();

    startRestTimer();

    toast(
      `Ejercicio completado · Descanso ${restSeconds} s`
    );

    return;

  }

  /* Sin descanso: pasar directamente */

  workout.restUntil=null;
  workout.restMode=null;

  renderWorkoutSession();
}


async function finishWorkout(){

  clearInterval(window.restTimerInterval);
  window.restTimerInterval=null;

  const workout=window.activeWorkout;
  if(!workout)return;
const totalDays =
  (data.routines[workout.clientId] || []).length;

  const lastExercise=
    workout.exercises[workout.currentExercise];

  if(lastExercise && workout.sets.length){

    workout.completedExercises.push({

      name:lastExercise.name || "Ejercicio",

      plannedSets:lastExercise.sets || "",

      plannedReps:lastExercise.reps || "",

      sets:JSON.parse(JSON.stringify(workout.sets))

    });

  }

  /* No guardar entrenamientos vacíos */
  if(!workout.completedExercises.length){

    toast("No hay ejercicios registrados");

    window.activeWorkout=null;

    showClient("training");

    return;

  }

  const duration=
    Math.max(
      1,
      Math.floor((Date.now()-workout.startedAt)/1000)
    );

  const workoutData={

    client_id:workout.clientId,

    workout_date:new Date().toISOString(),

    duration:duration,
    day_index:Number(workout.dayIndex),
    day_name:String(workout.dayName||"Entrenamiento"),

    exercises:workout.completedExercises

  };

  /* Guardar definitivamente en Supabase antes de confirmar la sesión local. */

  try{
    if(!supabaseClient) throw new Error("Sin conexión con Supabase");
    const {error}=await supabaseClient
      .from("workout_history")
      .insert(workoutData);
    if(error) throw error;
  }catch(error){
    console.error(
      "Error guardando entrenamiento en Supabase:",
      error
    );
    toast("No se pudo guardar el entrenamiento. Inténtalo de nuevo.");
    return;
  }

  /* Mantener también copia local */

  if(!data.workoutHistory[workout.clientId]){
    data.workoutHistory[workout.clientId]=[];
  }

  data.workoutHistory[workout.clientId].push({

    date:workoutData.workout_date,

    duration:duration,
    dayIndex:Number(workout.dayIndex),
    dayName:workout.dayName,

    exercises:workout.completedExercises

  });

  saveData();

const completedAll =
  markTrainingDayCompleted(
    workout.clientId,
    workout.dayIndex,
    totalDays
  );

if(completedAll){
  toast("¡Rutina semanal completada! El Día 1 volverá a estar disponible la próxima semana.");
}
  window.activeWorkout=null;

  toast("Entrenamiento guardado ✓");

  showClient("profile");

}


function cancelWorkout(){

  const workout=window.activeWorkout;

  if(!workout)return;

  const confirmExit=
    confirm("¿Quieres salir del entrenamiento? Se perderán las series realizadas.");

  if(!confirmExit)return;

clearInterval(window.restTimerInterval);
window.restTimerInterval=null;

window.activeWorkout=null;
  showClient("training");
}

async function createClient(){
  const name=document.getElementById("new-name")?.value.trim()||"";
  const accessEmail=document.getElementById("new-access-email")?.value.trim().toLowerCase()||"";
  const ageText=document.getElementById("new-age")?.value.trim()||"";
  const heightText=document.getElementById("new-height")?.value.trim()||"";
  const weightText=document.getElementById("new-weight")?.value.trim()||"";
  const bodyFatText=document.getElementById("new-body-fat")?.value.trim()||"";
  const goal=document.getElementById("new-goal")?.value.trim()||"";
  const foodsToAvoid=document.getElementById("new-foods-to-avoid")?.value.trim()||"";
  if(!name||!accessEmail||!ageText||!heightText||!weightText||!bodyFatText||!goal){toast("Completa todos los campos obligatorios");return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(accessEmail)){toast("Introduce un correo válido");return}
  const age=Number(ageText);
  const height=Number(heightText.replace(",","."));
  const weight=Number(weightText.replace(",","."));
  const bodyFat=Number(bodyFatText.replace(",","."));
  if(!Number.isInteger(age)||age<10||age>100){toast("Introduce una edad válida");return}
  if(!Number.isFinite(height)||height<100||height>250){toast("Introduce una altura válida");return}
  if(!Number.isFinite(weight)||weight<=0||weight>=500){toast("Introduce un peso válido");return}
  if(!Number.isFinite(bodyFat)||bodyFat<=0||bodyFat>=70){toast("Introduce un % de grasa válido");return}
  const id="client_"+Date.now();
  try{
    const {data:ok,error}=await supabaseClient.rpc("dcc_create_client",{p_id:id,p_name:name,p_goal:goal,p_weight:weight,p_initial_body_fat:bodyFat,p_age:age,p_height_cm:height,p_foods_to_avoid:foodsToAvoid,p_access_email:accessEmail});
    if(error)throw error;
    if(ok!==true)throw new Error("El servidor no confirmó la creación");
    await Promise.allSettled([loadClientsFromSupabase(),loadWeightsFromSupabase(),loadCheckinsFromSupabase(),loadRoutinesFromSupabase(),loadDietsFromSupabase()]);
    closeModal();showCoach("clients");toast("Cliente creado correctamente");
  }catch(error){
    console.error("Error creando cliente:",error);
    toast("No se pudo guardar el cliente");
  }
}

async function addWeight(id){
  const c=client(id);if(!c){toast("No se encontró el cliente");return}
  const text=prompt("Nuevo peso (kg):",c.weight??"");if(text===null)return;
  const value=Number(String(text).trim().replace(",","."));
  if(!Number.isFinite(value)||value<=0||value>=500){toast("Introduce un peso válido");return}
  try{
    const {data:ok,error}=await supabaseClient.rpc("dcc_record_weight",{p_client_id:String(id),p_weight:value});
    if(error)throw error;
    if(ok!==true)throw new Error("El servidor no confirmó el peso");
    await Promise.allSettled([loadClientsFromSupabase(),loadWeightsFromSupabase()]);
    if(currentApp==="coach")showClientAdmin(id);
    toast("Peso actualizado");
  }catch(error){
    console.error("Error guardando peso en Supabase:",error);
    toast("No se pudo actualizar el peso");
  }
}

function editDietMarcos(id,type){
if(!data.diets[id])data.diets[id]={};
if(!data.diets[id][type]){
data.diets[id][type]={
calories:"",
protein:"",
meals:[]
};
}

const diet=data.diets[id][type];

const calories=prompt("Calorías:",diet.calories||"");
if(calories===null)return;

const protein=prompt("Proteína:",diet.protein||"");
if(protein===null)return;

diet.calories=calories;
diet.protein=protein;

saveData();
window.coachDietType=type;
showCoach("diets");
}
function ensureMealOptions(meal){

  if(!meal.options || !Array.isArray(meal.options)){

    meal.options = [{
      name:"Opción 1",
      foods:Array.isArray(meal.foods)
        ? meal.foods
        : []
    }];

    delete meal.foods;
  }

  meal.options = meal.options
    .slice(0,3)
    .map((option,index)=>({

      name:`Opción ${index+1}`,

      foods:Array.isArray(option.foods)
        ? option.foods
        : []

    }));

  return meal.options;
}


function saveDietToSupabase(id,type,diet){

  return supabaseClient
    .from("client_diets")
    .upsert({

      client_id:id,
      diet_type:type,
      calories:diet.calories||"",
      protein:diet.protein||"",
      meals:diet.meals

    },{
      onConflict:"client_id,diet_type"
    });

}


async function addMeal(id,type){

  const name=prompt("Nombre de la comida:");

  if(!name)return;

  if(!data.diets[id]){
    data.diets[id]={};
  }

  if(!data.diets[id][type]){
    data.diets[id][type]={
      calories:"",
      protein:"",
      meals:[]
    };
  }

  if(!data.diets[id][type].meals){
    data.diets[id][type].meals=[];
  }

  const diet=data.diets[id][type];
  const meal={
    name:name,
    options:[{
      name:"Opción 1",
      foods:[]
    }]
  };

  diet.meals.push(meal);

  const {error}=await saveDietToSupabase(id,type,diet);

  if(error){
    console.error("Error guardando comida:",error);
    const index=diet.meals.indexOf(meal);
    if(index>=0)diet.meals.splice(index,1);
    toast("No se pudo guardar la comida");
    return;
  }

  saveData();
  window.coachDietType=type;
  showCoach("diets");
  toast("Comida añadida");

}


async function addDietOption(id,type,mi){

  const diet=data.diets[id]?.[type];

  if(!diet || !diet.meals || !diet.meals[mi]){
    toast("No se encontró la comida");
    return;
  }

  const meal=diet.meals[mi];

  const options=ensureMealOptions(meal);

  if(options.length>=3){

    toast("Máximo 3 opciones");

    return;
  }

  options.push({
    name:`Opción ${options.length+1}`,
    foods:[]
  });

  const {error}=await saveDietToSupabase(
    id,
    type,
    diet
  );

  if(error){

    console.error(
      "Error guardando opción:",
      error
    );

    options.pop();

    toast("No se pudo guardar la opción");

    return;
  }

  saveData();

  window.coachDietType=type;

  showCoach("diets");

  toast("Opción añadida");

}


async function addFood(id,type,mi,oi=0){

  const diet=data.diets[id]?.[type];

  if(!diet || !diet.meals || !diet.meals[mi]){
    toast("No se encontró la comida");
    return;
  }

  const meal=diet.meals[mi];

  const options=ensureMealOptions(meal);

  if(!options[oi]){
    toast("No se encontró la opción");
    return;
  }

  const food=prompt("Alimento:");

  if(!food)return;

  const qty=prompt("Cantidad:");

  if(!qty)return;

  options[oi].foods.push([
    food,
    qty
  ]);

  const {error}=await saveDietToSupabase(
    id,
    type,
    diet
  );

  if(error){

    console.error(
      "Error guardando dieta:",
      error
    );

    options[oi].foods.pop();

    toast("No se pudo guardar el alimento");

    return;
  }

  saveData();

  window.coachDietType=type;

  /* IMPORTANTE:
     No cambiamos de comida ni hacemos scroll.
     La pantalla permanece en la comida actual.
  */

  showCoach("diets");

  toast("Alimento guardado");

}


async function removeFood(id,type,mi,fi,oi=0){

  const diet=data.diets[id]?.[type];

  if(
    !diet ||
    !diet.meals ||
    !diet.meals[mi]
  ){
    return;
  }

  const meal=diet.meals[mi];

  const options=ensureMealOptions(meal);

  if(!options[oi]){
    return;
  }

  if(
    !options[oi].foods ||
    !options[oi].foods[fi]
  ){
    return;
  }

  const removed=
    options[oi].foods.splice(fi,1)[0];

  const {error}=await saveDietToSupabase(
    id,
    type,
    diet
  );

  if(error){

    console.error(
      "Error eliminando alimento:",
      error
    );

    options[oi].foods.splice(
      fi,
      0,
      removed
    );

    toast("No se pudo eliminar el alimento");

    return;
  }

  saveData();

  window.coachDietType=type;

  showCoach("diets");

  toast("Alimento eliminado");

}

async function startNewRoutine(id){

  if(!id)return;

  if(!data.previousRoutines){
    data.previousRoutines={};
  }

  const currentRoutine =
    Array.isArray(data.routines?.[id])
      ? data.routines[id]
      : [];

  if(!currentRoutine.length){
    toast("No hay una rutina actual para guardar");
    return;
  }

  const previousRoutine=JSON.parse(JSON.stringify(currentRoutine));
  const previousArchive=data.previousRoutines[id];

  data.routines[id]=[];

  const ok=await saveRoutineToSupabase(id);

  if(!ok){
    data.routines[id]=previousRoutine;
    if(previousArchive===undefined){
      delete data.previousRoutines[id];
    }else{
      data.previousRoutines[id]=previousArchive;
    }
    toast("No se pudo crear la nueva rutina");
    showCoach("routines");
    return;
  }

  data.previousRoutines[id]={
    routine:previousRoutine,
    savedAt:new Date().toISOString()
  };

  saveData();
  toast("Nueva rutina creada");
  showCoach("routines");

}

async function addTrainingDay(id){

  if(!data.routines){
    data.routines = {};
  }

  if(!Array.isArray(data.routines[id])){
    data.routines[id] = [];
  }

  const days = data.routines[id];

  const newDay = {
    day: days.length + 1,
    muscle: "",
    muscleGroups: [],
    exercises: []
  };

  days.push(newDay);

  const ok = await saveRoutineToSupabase(id);

  if(!ok){
    const index=days.indexOf(newDay);
    if(index>=0)days.splice(index,1);
    toast("No se pudo añadir el día de entrenamiento");
    return;
  }

  saveData();
  showCoach("routines");
}

function toggleTrainingMuscle(id,dayIndex,group){

  const day=data.routines[id]?.[dayIndex];

  if(!day)return;

  if(!Array.isArray(day.muscleGroups)){
    day.muscleGroups=[];
  }

  const index=day.muscleGroups.indexOf(group);

  if(index>=0){

    day.muscleGroups.splice(index,1);

  }else{

    if(day.muscleGroups.length>=3){
      toast("Puedes seleccionar un máximo de 3 grupos");
      return;
    }

    day.muscleGroups.push(group);

  }

  saveData();

  /*
   * Actualizamos solo las tarjetas y el contador,
   * sin reconstruir toda la pantalla.
   */

  const cards=document.querySelectorAll(
    '#coach-main button[onclick*="toggleTrainingMuscle"]'
  );

  cards.forEach(card=>{

    const match=card.getAttribute("onclick")
      ?.match(/toggleTrainingMuscle\('.*?',\d+,'(.*)'\)/);

    if(!match)return;

    const cardGroup=match[1]
      .replace(/\\'/g,"'");

    const selected=day.muscleGroups.includes(cardGroup);

    card.style.border=selected
      ? "1px solid #d9aa4a"

      : "#e7e9ed";

    card.style.boxShadow=selected
      ? "0 0 0 1px rgba(217,170,74,.12)"
      : "none";

    let check=card.querySelector(".training-muscle-check");

      check.style.cssText=`

async function saveTrainingMuscleGroups(id,dayIndex){

  const day=data.routines[id]?.[dayIndex];

  if(!day)return;

  if(!day.muscleGroups?.length){
    toast("Selecciona al menos un grupo muscular");
    return;
  }

  const previousMuscle=day.muscle;
  day.muscle=day.muscleGroups.join(" · ");

  const ok=await saveRoutineToSupabase(id);

  if(!ok){
    day.muscle=previousMuscle;
    toast("No se pudieron guardar los grupos musculares");
    return;
  }

  saveData();
  toast("Grupos musculares guardados");

  showCoach("routines");
}
async function createRoutineDays(id,count){

  if(!data.routines){
    data.routines = {};
  }

  const previousRoutine=JSON.parse(JSON.stringify(data.routines[id]??null));

  data.routines[id] = Array.from(
    {length:count},
    (_,i) => ({
      day:i+1,
      muscle:"",
      muscleGroups:[],
      exercises:[]
    })
  );

  const ok = await saveRoutineToSupabase(id);

  if(!ok){
    if(previousRoutine===null)delete data.routines[id];
    else data.routines[id]=previousRoutine;
    toast("No se pudo crear la estructura de la rutina");
    return;
  }

  saveData();
  showCoach("routines");
}
