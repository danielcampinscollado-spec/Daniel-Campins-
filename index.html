<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCC FITNESS</title>
<meta name="application-name" content="DCC FITNESS">
<meta name="apple-mobile-web-app-title" content="DCC FITNESS">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">


<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#f6efe3;
  --bg2:#fffaf1;
  --panel:#fffdf9;
  --panel2:#fbf3e6;
  --text:#17191d;
  --muted:#737b86;
  --line:rgba(183,123,19,.20);
  --gold:#d9aa4a;
  --gold-light:#f0c96b;
  --blue:#4d8dff;
  --red:#e05a5a;
  --green:#39b982;
  --white:#ffffff;
  --radius:22px;
  --shadow:0 25px 80px rgba(0,0,0,.35);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* =========================
   PANTALLA DE ENTRADA
========================= */

.login{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 88% 4%,rgba(201,145,38,.14),transparent 24%),
    radial-gradient(circle at 6% 94%,rgba(201,145,38,.08),transparent 24%),
    linear-gradient(180deg,#fffaf1 0%,#f7f0e4 58%,#f2e9dc 100%);
}

.login:before{
  content:"";
  position:absolute;
  inset:0;
  background:transparent;
  pointer-events:none;
}

.login-box{
  width:min(720px,100%);
  position:relative;
  z-index:2;
  padding:46px 30px 30px;
  background:transparent;
  border:1px solid transparent;
  border-radius:32px;
  box-shadow:
    0 35px 100px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.logo{
  margin:0;
  text-align:center;
  font-size:0;
  line-height:1;
}

.logo:before{
  content:"DC";
  display:block;
  color:var(--gold);
  font-size:78px;
  font-weight:300;
  letter-spacing:-10px;
  text-shadow:
    0 0 30px rgba(217,170,74,.20);
}

.login-box>.muted{
  margin:20px 0 42px;
  text-align:center;
  color:#aeb4bd;
  font-size:15px;
  letter-spacing:.3px;
}

.login-box:after{
  content:"";
  position:absolute;
  top:143px;
  left:50%;
  width:48px;
  height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border-radius:999px;
  box-shadow:0 0 14px rgba(217,170,74,.25);
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.choice{
  position:relative;
  min-height:190px;
  padding:29px 25px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:23px;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.018));
  color:#fff;
  text-align:left;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.choice:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-75px;
  top:-75px;
  border-radius:50%;
  background:rgba(217,170,74,.075);
}

.choice:after{
  content:"";
  position:absolute;
  left:-30px;
  bottom:-60px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.018);
}

.choice:hover{
  transform:translateY(-4px);
  border-color:rgba(217,170,74,.42);
  box-shadow:0 20px 50px rgba(0,0,0,.32);
}

.choice b{
  position:relative;
  z-index:2;
  display:block;
  margin-bottom:15px;
  font-size:20px;
  font-weight:700;
  letter-spacing:-.3px;
}

.choice span{
  position:relative;
  z-index:2;
  display:block;
  color:#9da5af;
  font-size:14px;
  line-height:1.65;
}

.choice.dark{
  background:
    linear-gradient(145deg,
      rgba(217,170,74,.15),
      rgba(255,255,255,.025));
  border-color:rgba(217,170,74,.45);
}

.choice.dark span{
  color:#b8bec7;
}

/* =========================
   APP
========================= */

.app{
  display:none;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.035),transparent 28%),
    var(--bg);
}

/* =========================
   MENÚ LATERAL
========================= */

.side{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  padding:28px 14px;
  background:linear-gradient(180deg,#fffaf1 0%,#f1e7d7 100%);
  color:#17191d;
  border-right:1px solid rgba(186,126,20,.24);
  z-index:20;
}

.side h2{
  margin:0 10px 28px;
  padding:0 0 23px;
  border-bottom:1px solid rgba(255,255,255,.09);
  font-size:13px;
  font-weight:700;
  letter-spacing:4px;
  color:#f2f2ef;
}

.nav button{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  width:100%;
  height:100%;

  background:none;
  border:0;

  color:#858d98;
  text-align:center;

  padding:6px 2px;
  margin:0;

  border-radius:16px;

  font-size:11px;
  line-height:1.1;

  white-space:nowrap;

  transition:
    background .25s ease,
    color .25s ease,
    transform .18s ease,
    box-shadow .25s ease;

  box-sizing:border-box;
}

.nav button::before{
  content:"";
  position:absolute;
  left:8px;
  top:50%;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(217,170,74,.12);
  transform:translateY(-50%) scale(.65);
  opacity:0;
  transition:
    transform .25s ease,
    opacity .25s ease;
  pointer-events:none;
}



.out{
  position:absolute;
  left:14px;
  right:14px;
  bottom:20px;
  padding:11px;
  background:transparent;
  color:#858d98;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  transition:.2s;
}

.out:hover{
  color:#fff;
  border-color:rgba(255,255,255,.18);
}

/* =========================
   CONTENIDO
========================= */

main{
  margin-left:250px;
  padding:38px;
  max-width:1500px;
}

.screen{
  display:none;
}

.screen.on{
  display:block;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:26px;
}

.top h1,
h1{
  margin:0;
  font-size:32px;
  font-weight:750;
  letter-spacing:-1.1px;
}

h2{
  letter-spacing:-.5px;
}

h3{
  margin-top:0;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  gap:18px;
}

.g2{
  grid-template-columns:1.4fr .8fr;
}

.g3{
  grid-template-columns:repeat(3,1fr);
}

/* =========================
   TARJETAS
========================= */

.card{
  position:relative;
  background:linear-gradient(145deg,#fffefa 0%,#fbf6ec 100%);
  color:#17191d;
  border:1px solid rgba(198,139,32,.34);
  border-radius:26px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:
    0 14px 45px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.card h2:first-child{
  margin-top:0;
}

/* =========================
   MÉTRICAS
========================= */

.metric b{
  display:block;
  color:#f5f5f2;
  margin:7px 0;
  font-size:29px;
  letter-spacing:-.9px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;
  overflow:hidden;
  background:rgba(255,255,255,.025);
}

.metric{
  padding:17px;
  border-right:1px solid rgba(255,255,255,.08);
}

.metric:last-child{
  border:0;
}

/* =========================
   ITEMS
========================= */

.item{
  padding:16px 0;
  border-bottom:1px solid #eceef1;
}

.item:last-child{
  border:0;
}

/* =========================
   BOTONES
========================= */

.btn{
    background:linear-gradient(135deg,var(--gold),#f4d98a);
    color:#17130a;
    border:0;
    padding:12px 18px;
    border-radius:14px;
    font-weight:750;
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
    box-shadow:0 5px 18px rgba(217,170,74,.10);
}

.btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.04);
    box-shadow:0 8px 24px rgba(217,170,74,.18);
}

.btn:active{
    transform:scale(.97);
    box-shadow:0 3px 12px rgba(217,170,74,.12);
}
.ghost{
  background:#fff;
  color:#111318;
  border:1px solid #dfe3e8;
  padding:10px 14px;
  border-radius:12px;
  transition:.2s;
}

.ghost:hover{
  background:#f7f8fa;
  border-color:#cbd1d8;
}

.danger{
  background:#fff2f2;
  color:var(--red);
  border:1px solid #f0cccc;
  padding:10px 14px;
  border-radius:12px;
}

/* =========================
   BADGES
========================= */

.pill{
  display:inline-flex;
  align-items:center;
  padding:7px 11px;
  border-radius:999px;
  background:#f5ead2;
  color:#956b18;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
}

/* =========================
   CLIENTES
========================= */

.client-row{
  padding:18px;
  margin:5px 0;
  border:1px solid transparent;
  border-radius:15px;
  cursor:pointer;
  transition:.2s;
}

.client-row:hover{
  background:#fafbfc;
  border-color:#e6e9ed;
}

/* =========================
   EJERCICIOS / ALIMENTOS
========================= */

.exercise,
.food{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px;
  margin:9px 0;
  background:rgba(255,255,255,.035);
  color:#f5f5f2;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;
}

.exercise:active,
.food:active{
  transform:scale(.985);
  background:rgba(217,170,74,.06);
  border-color:rgba(217,170,74,.18);
}

.food-actions,
.exercise-actions{
  display:flex;
  gap:7px;
  align-items:center;
}

/* =========================
   FORMULARIOS
========================= */

textarea,
input,
select{
  width:100%;
  padding:12px 13px;
  border:1px solid #d9dee4;
  border-radius:12px;
  background:#fff;
  color:#111318;
  outline:none;
  transition:.2s;
}

textarea:focus,
input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(52,120,246,.10);
}

label{
  display:block;
  margin:13px 0 7px;
  font-weight:700;
}

/* =========================
   VACÍO
========================= */

.empty{
  padding:30px 20px;
  text-align:center;
  color:#7c858f;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  padding:20px;
  background:rgba(5,7,10,.62);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:50;
}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  padding:26px;
  background:#fff;
  color:#111318;
  border-radius:23px;
  box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  right:auto;
  bottom:92px;
  transform:translateX(-50%);
  display:none;
  max-width:calc(100vw - 32px);
  padding:11px 15px;
  background:rgba(16,20,26,.96);
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
  border-radius:13px;
  z-index:1000;
  box-shadow:0 12px 30px rgba(0,0,0,.24);
  font-size:13px;
  line-height:1.35;
  text-align:center;
}

/* =========================
   MÓVIL
========================= */

@media(max-width:700px){

  body{
    background:var(--bg);
  }

  .login{
    padding:14px;
    align-items:center;
  }

  .login-box{
    width:100%;
    padding:40px 20px 21px;
    border-radius:28px;
  }

  .logo:before{
    font-size:66px;
  }

  .login-box>.muted{
    margin-top:18px;
    margin-bottom:34px;
    font-size:14px;
  }

  .login-box:after{
    top:130px;
  }

  .choices{
    grid-template-columns:1fr;
    gap:12px;
  }

  .choice{
    min-height:145px;
    padding:23px 20px;
    border-radius:20px;
  }

  .choice b{
    font-size:19px;
  }

  .choice span{
    font-size:14px;
    line-height:1.55;
  }

  .side{
  width:calc(100% - 20px);
  height:68px;
  top:auto;
  bottom:10px;
  left:10px;
  padding:6px;
  background:rgba(17,21,28,.94);
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

  .side h2,
  .out{
    display:none;
  }

  .nav{
  display:flex;
  justify-content:space-around;
  align-items:center;
  height:100%;
  gap:4px;
}

.nav button{
    position:relative;
    flex:1 1 0;
    width:100%;
    min-width:0;
    height:56px;
    margin:0;
    padding:4px 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border:1px solid transparent;
    border-radius:14px;
    background:transparent;
    color:#858d98;
    text-align:center;
    font-size:10px;
    box-sizing:border-box;
    transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease,
        border-color .2s ease;
}

.nav button.active{
    background:transparent !important;
    border-color:transparent !important;
    box-shadow:none !important;
    transform:none !important;
}

.nav button.active svg{
    color:#d9a62f;
}

.nav button.active span{
    color:#d9a62f;
}

.nav button svg{
  width:23px;
  height:23px;
  flex:none;
  stroke:currentColor;
}

.nav button:active{
  transform:scale(.94);
}





 

  .top h1,
  h1{
    font-size:27px;
  }

  .g2,
  .g3{
    grid-template-columns:1fr;
  }

  .card{
    padding:19px;
    border-radius:18px;
    margin-bottom:14px;
  }

  .metrics{
    grid-template-columns:1fr;
  }

  .metric{
    border-right:0;
    border-bottom:1px solid #e7e9ec;
  }

  .metric:last-child{
    border-bottom:0;
  }

  .exercise,
  .food{
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .food-actions,
  .exercise-actions{
    width:100%;
  }

  .food-actions button,
  .exercise-actions button{
    flex:1;
  }

  .top .btn{
    white-space:nowrap;
  }
}
/* ===== ELEVATE — PANTALLA DE INICIO ===== */

.login{
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  box-sizing:border-box;
  background:
    radial-gradient(circle at 50% 12%,rgba(217,170,74,.10),transparent 32%),
    radial-gradient(circle at 15% 85%,rgba(217,170,74,.045),transparent 30%),
    #f6efe3;
  position:relative;
  overflow:auto;
}

.login-box{
  width:100%;
  max-width:620px;
  box-sizing:border-box;
  padding:38px 30px 32px;
  background:linear-gradient(145deg,rgba(255,253,249,.98),rgba(248,240,227,.98));
  border:1px solid rgba(183,123,19,.18);
  border-radius:30px;
  box-shadow:
    0 30px 90px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.035);
  text-align:center;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

/* brillo decorativo superior */
.login-box::before{
  content:"";
  position:absolute;
  width:230px;
  height:230px;
  right:-110px;
  top:-105px;
  border-radius:50%;
  background:rgba(217,170,74,.07);
  pointer-events:none;
}

.login-box::after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  left:-105px;
  bottom:-105px;
  border-radius:50%;
  background:rgba(255,255,255,.025);
  pointer-events:none;
}

/* ===== LOGO ===== */

.brand-logo{
  width:150px;
  height:105px;
  margin:0 auto 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
}

.brand-logo svg{
  width:150px;
  height:105px;
  display:block;
}

/* ===== NOMBRE ===== */

.brand-name{
  color:#f7f7f5;
  font-size:34px;
  font-weight:500;
  letter-spacing:7px;
  line-height:1.15;
  margin:0;
  position:relative;
  z-index:1;
}

/* ===== SUBTÍTULO ===== */

.brand-subtitle{
  color:#d9aa4a;
  font-size:13px;
  font-weight:500;
  letter-spacing:4px;
  margin-top:10px;
  position:relative;
  z-index:1;
}

/* ===== LÍNEA DORADA ===== */

.brand-line{
  width:70px;
  height:2px;
  margin:18px auto 25px;
  background:linear-gradient(
    90deg,
    #b98227,
    #f5d27a,
    #b98227
  );
  border-radius:999px;
  box-shadow:0 0 14px rgba(217,170,74,.25);
  position:relative;
  z-index:1;
}

/* ===== TARJETAS ===== */

.choices{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:100%;
  text-align:left;
  position:relative;
  z-index:1;
}

.login .choices .choice{
  width:100%;
  min-height:0;
  height:auto;
  box-sizing:border-box;
  padding:27px 22px 25px;
  border-radius:23px;
  background:linear-gradient(145deg,#fffdf9,#f8f0e3);
  border:1px solid rgba(183,123,19,.22);
  color:#17191d;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
  cursor:pointer;
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
  font-family:inherit;
}

/* decoración de las tarjetas */
.login .choices .choice::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  right:-80px;
  top:-75px;
  border-radius:50%;
  background:rgba(217,170,74,.065);
  pointer-events:none;
}

.login .choices .choice::after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  left:-85px;
  bottom:-85px;
  border-radius:50%;
  background:rgba(255,255,255,.025);
  pointer-events:none;
}

/* ===== ICONO PRINCIPAL DE CADA TARJETA ===== */

.login .choices .choice-icon{
  width:64px;
  height:64px;
  min-height:64px;
  margin:0 auto 14px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle,
      rgba(217,170,74,.10),

.diet-list{

}

.meal-card{
  overflow:hidden;

    linear-gradient(
      145deg,

  list-style:none;

  min-height:60px;
  padding:7px 14px;

.meal-card summary::-webkit-details-marker{
  display:none;
}

.meal-card summary > div{
  display:flex;
  align-items:center;
  min-width:0;
  gap:12px;
}


/* Número */

.meal-number{
  flex:none;

  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  box-sizing:border-box;

  border:1px solid rgba(217,170,74,.55);
  border-radius:10px;

  background:
    radial-gradient(
      circle at center,
      rgba(217,170,74,.10),
      rgba(217,170,74,.015)
    );

  color:#f0c96b;

  font-size:14px;
  font-weight:700;

  box-shadow:
    0 0 14px rgba(217,170,74,.05);
}


/* Nombre + icono */

.meal-card summary b{
  display:flex;
  align-items:center;
  gap:10px;

  min-width:0;

  color:#f2f1ec;
  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  font-weight:500;
  line-height:1.2;
}

.meal-card summary b::before{
  flex:none;

  width:25px;

  color:#e9b94f;

  font-family:Arial,sans-serif;
  font-size:22px;
  line-height:1;
  text-align:center;
}


/* Icono diferente para cada comida */

.diet-list .meal-card:nth-child(1) summary b::before{
  content:"☼";
}

.diet-list .meal-card:nth-child(2) summary b::before{
  content:"♧";
}

.diet-list .meal-card:nth-child(3) summary b::before{
  content:"♨";
}

.diet-list .meal-card:nth-child(4) summary b::before{
  content:"ϟ";
}

.diet-list .meal-card:nth-child(5) summary b::before{
  content:"♢";
}

.diet-list .meal-card:nth-child(6) summary b::before{
  content:"☾";
}


/* Parte derecha */

.meal-count{
  flex:none;

  display:flex;
  align-items:center;
  gap:5px;

  color:#9298a2;
  font-size:12px;
  white-space:nowrap;
}

.meal-count::first-letter{
  color:#9298a2;
}


/* Flecha */

.meal-card summary .meal-count{
  font-size:0;
}

.meal-card summary .meal-count::after{
  content:"›";

  max-width:1180px;
  margin:0 auto;
  padding-bottom:30px;
}

.dc-home-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:24px;
  margin-bottom:34px;
}

.dc-brand{
  display:flex;
  align-items:center;
  gap:15px;
}

.dc-logo{
  width:58px;
  height:58px;
  flex:none;
  filter:drop-shadow(0 0 18px rgba(217,170,74,.18));
}

.dc-brand-name{
  margin:0;
  color:#f5f5f2;
  font-size:21px;
  font-weight:500;
  letter-spacing:4px;
}

.dc-brand-sub{
  margin-top:6px;
  color:var(--gold);
  font-size:10px;
  letter-spacing:3px;
}

.dc-header-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.dc-circle-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#151921,#0b0e13);
  border:1px solid rgba(217,170,74,.48);
  color:var(--gold-light);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 10px 30px rgba(0,0,0,.25);
}

.dc-circle-btn svg{
  width:22px;
  height:22px;
}

.dc-avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(217,170,74,.72);
  background:
    radial-gradient(circle at 50% 30%,#41444a,#111318 62%);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:#d9aa4a;
}

.dc-avatar svg{
  width:38px;
  height:38px;
}

.dc-welcome{
  margin-bottom:34px;
}

.dc-eyebrow{
  margin:0 0 7px;
  color:var(--gold-light);
  font-size:13px;
  font-weight:700;
  letter-spacing:2px;
}

.dc-welcome-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
}

.dc-welcome h1{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  font-size:52px;
  line-height:1;
  font-weight:500;
  letter-spacing:-1.8px;
  color:#f7f7f4;
}

.dc-tagline{
  margin:13px 0 0;
  color:#aeb4bd;
  font-size:18px;
}

.dc-week{
  padding:12px 20px;
  border-radius:999px;
  border:1px solid rgba(217,170,74,.55);
  color:var(--gold-light);
  font-size:13px;
  font-weight:700;
  letter-spacing:1px;
  white-space:nowrap;
  background:rgba(217,170,74,.025);
}

.dc-card{
  position:relative;
  overflow:hidden;
  margin-bottom:22px;
  border-radius:25px;
  border:1px solid rgba(255,255,255,.13);
  background:
    radial-gradient(circle at 90% 10%,rgba(217,170,74,.075),transparent 30%),
    linear-gradient(145deg,#151921,#0b0e13);
  box-shadow:
    0 20px 55px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.dc-card::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      120deg,
      transparent 0%,
      rgba(255,255,255,.018) 45%,
      transparent 70%
    );
}

.dc-stats{
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  min-height:270px;
}

.dc-divider{
  width:1px;
  background:rgba(255,255,255,.11);
  margin:34px 0;
}

.dc-stat{
  padding:34px 38px;
  position:relative;
  z-index:1;
}

.dc-stat-label{
  color:#9da4ae;
  font-size:12px;
  font-weight:600;
  letter-spacing:1.7px;
  text-transform:uppercase;
}

.dc-stat-icon{
  width:54px;
  height:54px;
  margin-bottom:18px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-light);
  border:1px solid rgba(217,170,74,.42);
  background:rgba(217,170,74,.035);
}

.dc-stat-icon svg{
  width:29px;
  height:29px;
}

.dc-weight{
  margin-top:12px;
  color:#fff;
  font-size:56px;
  line-height:1;
  font-weight:700;
  letter-spacing:-2px;
}

.dc-weight span{
  font-size:28px;
  letter-spacing:-.5px;
  font-weight:500;
}

.dc-stat-sub{
  margin-top:10px;
  color:#9299a5;
  font-size:16px;
}

.dc-change{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:22px;
  padding:10px 17px;
  border-radius:999px;
  border:1px solid rgba(217,170,74,.5);
  color:var(--gold-light);
  font-weight:700;
}

.dc-progress-value{
  margin-top:13px;
  color:var(--gold-light);
  font-size:38px;
  font-weight:700;
  letter-spacing:-1px;
}

.dc-progress-sub{
  margin-top:5px;
  color:#9299a5;
  font-size:15px;
}

.dc-chart{
  margin-top:13px;
  width:100%;
  height:78px;
}

.dc-chart svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.dc-training{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:210px;
}

.dc-training-left,
.dc-training-right{
  padding:34px 38px;
  position:relative;
  z-index:1;
}

.dc-training-left{
  border-right:1px solid rgba(255,255,255,.11);
}

.dc-training-count{
  margin-top:10px;
  font-size:46px;
  font-weight:700;
  letter-spacing:-1px;
}

.dc-training-sub{
  color:#9299a5;
  margin-top:3px;
}

.dc-checks{
  display:flex;
  gap:12px;
  margin-top:20px;
}

.dc-check{
  width:35px;
  height:35px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#f4c96b,#d9aa4a);
  color:#12100a;
  font-weight:900;
}

.dc-complete{
  display:flex;
  align-items:center;
  gap:22px;
  height:100%;
}

.dc-trophy{
  width:76px;
  height:76px;
  flex:none;
  border-radius:50%;
  border:1px solid rgba(217,170,74,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold-light);
  background:rgba(217,170,74,.035);
  box-shadow:0 0 25px rgba(217,170,74,.10);
}

.dc-trophy svg{
  width:39px;
  height:39px;
}

.dc-complete h2{
  margin:0;
  color:#f5f5f2;
  font-size:23px;
}

.dc-complete p{
  margin:7px 0 0;
  color:#9da4ae;
  line-height:1.5;
}

.dc-next{
  padding:25px 28px 28px;
}

.dc-next-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.dc-next-title{
  display:flex;
  align-items:center;
  gap:12px;
  color:#aeb4bd;
  font-size:13px;
  letter-spacing:1.8px;
  text-transform:uppercase;
}

.dc-next-title svg{
  width:23px;
  height:23px;
  color:var(--gold-light);
}

.dc-routine-btn{
  padding:10px 17px;
  border-radius:999px;
  border:1px solid rgba(217,170,74,.5);
  background:transparent;
  color:var(--gold-light);
  font-weight:600;
}

.dc-next-inner{
  display:grid;
  grid-template-columns:240px 1fr auto;
  min-height:150px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:20px;
  background:#0c1016;
}

.dc-next-image{
  position:relative;
  min-height:150px;
  background:
    linear-gradient(145deg,#242a31,#0a0c10);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8c939d;
}

.dc-next-image svg{
  width:54px;
  height:54px;
  color:var(--gold);
  opacity:.9;
}

.dc-next-info{
  padding:28px 28px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.dc-next-info h2{
  margin:0;
  color:#f5f5f2;
  font-size:25px;
}

.dc-next-info p{
  margin:8px 0 0;
  color:#8f97a2;
}

.dc-start{
  align-self:center;
  margin-right:25px;
  padding:15px 28px;
  border:0;
  border-radius:999px;
  background:linear-gradient(145deg,#f4cb70,#d9aa4a);
  color:#15120b;
  font-weight:800;
  font-size:15px;
  box-shadow:0 12px 28px rgba(217,170,74,.15);
}

.dc-quote{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
  padding:24px 32px;
}

.dc-quote-mark{
  color:var(--gold-light);
  font-family:Georgia,serif;
  font-size:48px;
  line-height:.6;
}

.dc-quote-text{
  flex:1;
  color:#e4e4df;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  font-size:18px;
}

.dc-quote-sign{
  color:var(--gold-light);
  font-family:cursive;
  font-size:22px;
}

/* =========================================================
   NUEVO DISEÑO MÓVIL — PROTOTIPO DANIEL CAMPINS
   BLOQUE ÚNICO Y DEFINITIVO
   ========================================================= */

@media (max-width: 768px) {

  /* ---------- BASE ---------- */

  body {
    overflow-x: hidden;
  }

  .dc-home {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 16px 16px 110px;
    box-sizing: border-box;
  }

  /* ---------- CABECERA ---------- */

  .dc-home > header,
  .dc-home .dc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    margin-bottom: 18px;
  }

  /* ---------- ESTADÍSTICAS ---------- */

  .dc-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    margin-bottom: 16px;
  }

  .dc-stats > * {
    min-width: 0;
  }

  /* ---------- ENTRENAMIENTO ---------- */

  .dc-training {
    width: 100%;
    margin-bottom: 16px;
    box-sizing: border-box;
  }

  .dc-training > * {
    max-width: 100%;
    box-sizing: border-box;
  }

  /* ---------- PRÓXIMO ENTRENAMIENTO ---------- */

  .dc-next {
    width: 100%;
    margin-bottom: 16px;
    box-sizing: border-box;
  }

  /* ---------- ACCESOS RÁPIDOS ---------- */

  .dc-home .dc-quick,
  .dc-home .dc-quick-actions,
  .dc-home .quick-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    margin: 0 0 16px;
  }

  .dc-home .dc-quick > *,
  .dc-home .dc-quick-actions > *,
  .dc-home .quick-actions > * {
    width: 100%;
    min-width: 0;
    min-height: 86px;
    box-sizing: border-box;
  }

  /* ---------- FRASE ---------- */

  .dc-quote {
    width: 100%;
    margin: 0 0 16px;
    box-sizing: border-box;
  }

  /* ---------- NAVEGACIÓN INFERIOR ---------- */

  #client-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1000;

    width: 100%;
    box-sizing: border-box;

    padding:
      8px
      max(8px, env(safe-area-inset-right))
      calc(8px + env(safe-area-inset-bottom))
      max(8px, env(safe-area-inset-left));

    margin: 0;
  }

  #client-nav > * {
    min-width: 0;
  }

  /* Evita que el contenido quede escondido
     detrás de la navegación inferior */
  .dc-home {
    padding-bottom: 115px;
  }

  /* ---------- AJUSTES DE TARJETAS ---------- */

  .dc-home .card,
  .dc-home .dc-card {
    max-width: 100%;
    box-sizing: border-box;
  }

  /* ---------- TIPOGRAFÍA ---------- */

  .dc-home h1,
  .dc-home h2,
  .dc-home h3,
  .dc-home p {
    max-width: 100%;
  }

}

/* =========================================================
   TELÉFONOS PEQUEÑOS
   ========================================================= */

@media (max-width: 390px) {

  .dc-home {
    padding-left: 12px;
    padding-right: 12px;
  }

  .dc-stats {
    gap: 8px;
  }

  .dc-home .dc-quick,
  .dc-home .dc-quick-actions,
  .dc-home .quick-actions {
    gap: 8px;
  }

}

}

/* ===== TARJETAS PREMIUM DCC ===== */

#client-main .card,
#coach-main .card{

  position:relative !important;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(217,170,74,.12),

    linear-gradient(
      145deg,
      #1b1e25 0%,
      #13161c 48%,

  overflow:hidden !important;

  backdrop-filter:blur(12px);

#client-main select,

function shuffleCoachTips(){

  const order =
    COACH_TIPS.map((_,index)=>index);

  for(let i=order.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [order[i],order[j]]=
    [order[j],order[i]];

  }

  return order;
}


function getCoachTipState(clientId){

  const key =
    `dc_coach_tips_${clientId}`;

  try{

    const saved=
      localStorage.getItem(key);

    if(saved){

      const state=
        JSON.parse(saved);

      if(
        Array.isArray(state.order) &&
        state.order.length===COACH_TIPS.length
      ){

        return state;

      }

    }

  }catch(e){

    console.error(
      "Error leyendo consejos:",
      e
    );

  }


  const state={

    order:shuffleCoachTips(),

    position:0,

    dayKey:new Date()
      .toISOString()
      .slice(0,10)

  };


  localStorage.setItem(
    key,
    JSON.stringify(state)
  );

  return state;

}

const today =
  now.getFullYear() +

  "-" +
  String(now.getDate()).padStart(2,"0");


  /*
   * Un consejo automático nuevo cada día.
   */

  if(state.dayKey!==today){

    state.position++;

    state.dayKey=today;

    if(state.position>=state.order.length){

      state.order=shuffleCoachTips();

      state.position=0;

    }

    localStorage.setItem(
      key,
      JSON.stringify(state)
    );

  }


  return COACH_TIPS[
    state.order[state.position]
  ];

}

function getCurrentWeekKey(){

  const now = new Date();
  const day = now.getDay();

  const monday = new Date(now);

  const diff = day === 0 ? -6 : 1 - day;

  monday.setDate(now.getDate() + diff);
  monday.setHours(0,0,0,0);

  return monday.getFullYear()+"-"+String(monday.getMonth()+1).padStart(2,"0")+"-"+String(monday.getDate()).padStart(2,"0");
}

async function markTrainingDayCompleted(clientId,dayIndex,totalDays){
  const total=Math.max(1,parseInt(totalDays)||1);
  const index=Math.max(0,Number(dayIndex)||0);

  ensureTrainingProgressWeek(clientId);

  const completed=getCompletedTrainingDays(clientId);
  if(!completed.includes(index)){
    completed.push(index);
    completed.sort((a,b)=>a-b);
  }

  const next=(index+1)%total;
  data.trainingNextDayIndex[clientId]=next;
  if(!data.trainingLastCompletedAt)data.trainingLastCompletedAt={};
  data.trainingLastCompletedAt[clientId]=new Date().toISOString();
  window.trainingDayTab=next;

  saveData();

  const synced=await saveTrainingProgressToSupabase(clientId);
  if(!synced){
    try{toast("El entrenamiento se guardó, pero no se pudo sincronizar el progreso semanal.");}catch(_){}
  }

  return {completedAll:completed.length>=total,synced};
}

/* Acceso secuencial continuo: la rutina nunca reinicia su posición el lunes.
   Solo el next_day_index puede entrenarse. Tras completar un día, el siguiente
   queda bloqueado hasta el siguiente día natural local. */
function getTrainingAccessState(clientId,dayIndex){
  const routine=Array.isArray(data.routines?.[clientId])?data.routines[clientId]:[];
  const total=routine.length;
  const index=Number(dayIndex);

  if(!total || !Number.isInteger(index) || index<0 || index>=total){
    return {allowed:false,code:"no-routine",reason:"Entrenamiento no disponible"};
  }

  const next=getTrainingNextDayIndex(clientId,total);
  if(index!==next){
    return {allowed:false,code:"sequence-locked",reason:"Completa los entrenamientos en orden para desbloquear este día"};
  }

  const lastRaw=data.trainingLastCompletedAt?.[clientId];
  if(lastRaw){
    const last=new Date(lastRaw);
    if(Number.isFinite(last.getTime())){
      const now=new Date();
      const sameLocalDay=last.getFullYear()===now.getFullYear()&&last.getMonth()===now.getMonth()&&last.getDate()===now.getDate();
      if(sameLocalDay){
        return {allowed:false,code:"next-day",reason:"El siguiente entrenamiento estará disponible mañana a las 00:00"};
      }
    }
  }

  return {allowed:true,code:"ready",reason:""};
}

function getClientManagementStatus(id){

  const diet = data.diets?.[id];

  const trainingMeals =
    diet?.training?.meals || [];

  const restMeals =
    diet?.rest?.meals || [];

  const trainingFoods = trainingMeals.reduce(
  (total,meal) =>
    total +
    ensureMealOptions(meal).reduce(
      (sum,option) =>
        sum + (option.foods?.length || 0),
      0
    ),
  0
);

const restFoods = restMeals.reduce(
  (total,meal) =>
    total +
    ensureMealOptions(meal).reduce(
      (sum,option) =>
        sum + (option.foods?.length || 0),
      0
    ),
  0
);

  let dietStatus = "Falta gestionar dieta";

  if(trainingFoods > 0 || restFoods > 0){

    const hasTrainingMeals =
      trainingMeals.length > 0 &&
      trainingMeals.every(
        meal =>
  ensureMealOptions(meal).some(
    option => (option.foods?.length || 0) > 0
  )
      );

    const hasRestMeals =
      restMeals.length > 0 &&
      restMeals.every(
        meal =>
  ensureMealOptions(meal).some(
    option => (option.foods?.length || 0) > 0
  )
      );

    if(hasTrainingMeals && hasRestMeals){

      dietStatus = "Dieta gestionada";

    }else{

      dietStatus = "Acabar de gestionar alimentación";

    }

  }


  const routine =
    data.routines?.[id] || [];

  let routineStatus =
    "Falta gestionar entrenamiento";

  if(routine.length > 0){

    const completeRoutine =
      routine.every(day =>
        Array.isArray(day.exercises) &&
        day.exercises.length > 0
      );

    routineStatus =
      completeRoutine
        ? "Entrenamiento gestionado"
        : "Acabar de gestionar entrenamiento";
  }


  return {
    diet:dietStatus,
    training:routineStatus
  };
}

function setupMessageRealtime(){

  if(window.clientMessagesRealtimeChannel){
    return;
  }

  const channel = supabaseClient
    .channel("client-messages-sync")
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"client_messages"
      },
      payload=>{

        const row=payload?.new;

        if(!row?.client_id) return;

        if(!data.messages){
          data.messages={};
        }

        if(!data.messages[row.client_id]){
          data.messages[row.client_id]=[];
        }

        const exists=data.messages[row.client_id].some(m=>
          m?.[0]===row.sender &&
          m?.[1]===row.message &&
          m?.[2]===row.created_at
        );

        if(!exists){
          data.messages[row.client_id].push([
            row.sender || "",
            row.message || "",
            row.created_at || null,
            row.sender_role || null
          ]);

          saveData();
        }

        // Realtime updates the shared cache and only the already-open premium thread.
        // It must never navigate, open a conversation or repaint another screen.
        if(currentApp==="client"&&typeof window.dccRefreshClientChatRealtime==="function"){
          window.dccRefreshClientChatRealtime(row.client_id);
        }
        if(currentApp==="coach"&&typeof window.dccRefreshCoachChatRealtime==="function"){
          window.dccRefreshCoachChatRealtime(row.client_id);
        }


      }
    )
    .subscribe(status=>{
      if(status==="CHANNEL_ERROR"){
        console.error("No se pudo activar la mensajería en tiempo real");
      }
    });

  window.clientMessagesRealtimeChannel=channel;
}

function rebuildTrainingProgressFromHistory(){
  if(!data.completedTrainingDays)data.completedTrainingDays={};
  if(!data.trainingProgressWeekStart)data.trainingProgressWeekStart={};
  const weekKey=getCurrentWeekKey();
  const weekStart=new Date(weekKey+"T00:00:00");
  const weekEnd=new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate()+7);

  Object.entries(data.workoutHistory||{}).forEach(([clientId,history])=>{
    const completed=[...new Set((Array.isArray(history)?history:[])
      .filter(item=>{
        const when=new Date(item?.date||0);
        return Number.isFinite(when.getTime())&&when>=weekStart&&when<weekEnd&&Number.isInteger(Number(item?.dayIndex));
      })
      .map(item=>Number(item.dayIndex))
      .filter(index=>index>=0))].sort((a,b)=>a-b);
    data.completedTrainingDays[clientId]=completed;
    data.trainingProgressWeekStart[clientId]=weekKey;
  });
  saveData();
}

async function loadTrainingProgressFromSupabase(){
  try{
    const {data:rows,error}=await supabaseClient
      .from("client_training_progress")
      .select("client_id,completed_days,next_day_index,week_start,last_completed_at,updated_at");

    if(error){
      console.error("Error cargando progreso de entrenamiento:",error);
      return false;
    }

    data.completedTrainingDays={};
    data.trainingNextDayIndex={};
    data.trainingProgressWeekStart={};
    data.trainingLastCompletedAt={};

    const currentWeek=getCurrentWeekKey();
    const stale=[];

    (rows||[]).forEach(row=>{
      const id=String(row.client_id);
      const rowWeek=String(row.week_start||"");
      const completed=Array.isArray(row.completed_days)
        ? [...new Set(row.completed_days.map(Number).filter(Number.isInteger).filter(n=>n>=0))]
        : [];

      data.trainingNextDayIndex[id]=Math.max(0,parseInt(row.next_day_index)||0);
      if(row.last_completed_at)data.trainingLastCompletedAt[id]=row.last_completed_at;

      if(rowWeek===currentWeek){
        data.completedTrainingDays[id]=completed;
        data.trainingProgressWeekStart[id]=currentWeek;
      }else{
        data.completedTrainingDays[id]=[];
        data.trainingProgressWeekStart[id]=currentWeek;
        stale.push({
          client_id:id,
          completed_days:[],
          next_day_index:data.trainingNextDayIndex[id],
          week_start:currentWeek,
          updated_at:new Date().toISOString()
        });
      }
    });

    if(stale.length){
      const {error:resetError}=await supabaseClient
        .from("client_training_progress")
        .upsert(stale,{onConflict:"client_id"});
      if(resetError)console.error("Error reiniciando progreso semanal:",resetError);
    }

    saveData();
    return true;

  }catch(e){
    console.error("Error conectando con Supabase para progreso de entrenamiento:",e);
    return false;
  }
}

async function saveTrainingProgressToSupabase(clientId){
  try{
    if(!clientId)return false;

    if(!data.completedTrainingDays)data.completedTrainingDays={};
    if(!data.trainingNextDayIndex)data.trainingNextDayIndex={};
    if(!data.trainingProgressWeekStart)data.trainingProgressWeekStart={};

    const weekKey=getCurrentWeekKey();

    if(data.trainingProgressWeekStart[clientId]!==weekKey){
      data.completedTrainingDays[clientId]=[];
      data.trainingProgressWeekStart[clientId]=weekKey;
    }

    const completed=Array.isArray(data.completedTrainingDays[clientId])
      ? [...new Set(data.completedTrainingDays[clientId].map(Number).filter(Number.isInteger).filter(n=>n>=0))].sort((a,b)=>a-b)
      : [];

    const nextDayIndex=Math.max(0,parseInt(data.trainingNextDayIndex[clientId])||0);

    const {error}=await supabaseClient
      .from("client_training_progress")
      .upsert({
        client_id:String(clientId),
        completed_days:completed,
        next_day_index:nextDayIndex,
        week_start:weekKey,
        last_completed_at:data.trainingLastCompletedAt?.[clientId]||null,
        updated_at:new Date().toISOString()
      },{onConflict:"client_id"});

    if(error)throw error;
    return true;
  }catch(e){
    console.error("Error guardando progreso de entrenamiento:",e);
    return false;
  }
}

async function loadCheckinHistoryFromSupabase(){
  try{
    const {data:rows,error}=await supabaseClient
      .from("client_checkin_history")
      .select("client_id,weight,body_fat,sent_at,checkin_type,photos")
      .order("sent_at",{ascending:true});

    if(error){
      console.error("Error cargando historial de check-ins:",error);
      return;
    }

    data.checkinHistory={};

    (rows||[]).forEach(row=>{
      if(!data.checkinHistory[row.client_id])data.checkinHistory[row.client_id]=[];
      const rawWeight=String(row.weight||"").replace(",",".");
      const weightMatch=rawWeight.match(/-?\d+(?:\.\d+)?/);
      data.checkinHistory[row.client_id].push({
        weight:weightMatch?Number(weightMatch[0]):null,
        bodyFat:row.body_fat!=null?Number(row.body_fat):null,
        sentAt:row.sent_at||null,
        checkinType:row.checkin_type||"normal",
        photos:row.photos&&typeof row.photos==="object"?row.photos:{}
      });
    });

    saveData();
  }catch(e){
    console.error("Error conectando con Supabase para historial de check-ins:",e);
  }
}

async function loadClientBodyFatHistoryFromSupabase(clientId=currentClientId){
  const id=String(clientId||"").trim();
  if(!id)return false;
  try{
    const {data:rows,error}=await supabaseClient
      .from("client_body_fat_history")
      .select("body_fat,recorded_at")
      .eq("client_id",id)
      .order("recorded_at",{ascending:true});

    if(error)throw error;
    data.bodyFatHistory=data.bodyFatHistory||{};
    data.bodyFatHistory[id]=(rows||[])
      .map(row=>({
        bodyFat:Number(row.body_fat),
        body_fat:Number(row.body_fat),
        recordedAt:row.recorded_at||null,
        recorded_at:row.recorded_at||null
      }))
      .filter(row=>Number.isFinite(row.bodyFat));
    saveData();
    return true;
  }catch(e){
    console.error("Error cargando historial de grasa corporal:",e);
    return false;
  }
}

function ensureTrainingProgressWeek(clientId){
  if(!data.completedTrainingDays)data.completedTrainingDays={};
  if(!data.trainingNextDayIndex)data.trainingNextDayIndex={};
  if(!data.trainingProgressWeekStart)data.trainingProgressWeekStart={};
  if(!data.trainingLastCompletedAt)data.trainingLastCompletedAt={};

  const weekKey=getCurrentWeekKey();

  if(data.trainingProgressWeekStart[clientId]!==weekKey){
    data.completedTrainingDays[clientId]=[];
    data.trainingProgressWeekStart[clientId]=weekKey;
    saveData();
  }

  if(!Array.isArray(data.completedTrainingDays[clientId])){
    data.completedTrainingDays[clientId]=[];
  }

  return weekKey;
}

function getTrainingNextDayIndex(clientId,totalDays){
  const total=Math.max(0,parseInt(totalDays)||0);
  if(!total)return 0;

  ensureTrainingProgressWeek(clientId);

  /* La rutina es una rueda continua. next_day_index es la autoridad:
     al cambiar de semana se limpian solo los bloqueos semanales, nunca
     la posición de la rueda. Así un día pendiente pasa a ser el primero
     de la semana siguiente. */
  const stored=parseInt(data.trainingNextDayIndex[clientId]);
  if(Number.isInteger(stored)&&stored>=0){
    return stored%total;
  }

  /* Compatibilidad para clientes anteriores que todavía no tengan
     next_day_index persistido: inferir una única vez desde el historial. */
  const history=(data.workoutHistory?.[clientId]||[])
    .filter(w=>Number.isInteger(Number(w?.dayIndex)))
    .slice()
    .sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));

  if(history.length){
    const inferred=(Number(history[0].dayIndex)+1)%total;
    data.trainingNextDayIndex[clientId]=inferred;
    saveData();
    return inferred;
  }

  const legacy=getCompletedTrainingDays(clientId);
  const inferred=Math.max(0,legacy.length)%total;
  data.trainingNextDayIndex[clientId]=inferred;
  saveData();
  return inferred;
}
window.dccLoadTrainingProgressFromSupabase=loadTrainingProgressFromSupabase;
window.dccSaveTrainingProgressToSupabase=saveTrainingProgressToSupabase;
window.dccGetTrainingNextDayIndex=getTrainingNextDayIndex;

async function openApp(app){

  console.log("openApp funciona", app);

  if(app !== "client" && app !== "coach"){
    console.error("Aplicación no válida:", app);
    return;
  }

  if(window.__dccOpenAppPromise){
    // Only client onboarding owns the client entry. Never let a stale client
    // promise block the coach panel or a fresh authenticated coach session.
    if(app==="client" && window.__dccOnboardingGate){
      return window.__dccOpenAppPromise;
    }
    window.__dccOpenAppPromise=null;
  }

  const loginAlreadyHidden = document.getElementById("login")?.style.display==="none";
  const alreadyOpen = currentApp===app && document.getElementById(app)?.style.display==="block" && loginAlreadyHidden;

  if(alreadyOpen && app==="client" && window.__dccOnboardingGate){
    return true;
  }

  if(alreadyOpen){
    if(app==="client"){
      const clientMain=document.getElementById("client-main");
      const targetScreen=String(currentScreen||"home");
      const homeMissing=
        targetScreen==="home" &&
        clientMain &&
        !clientMain.querySelector(".dcc-home2");

      if(currentClientId && homeMissing){
        try{
          if(typeof window.dccClientGoHome==="function"){
            window.dccClientGoHome();
          }else{
            showClient("home");
          }
        }catch(error){
          console.warn("DCC openApp restored home repaint",error);
        }
      }
    }
    return true;
  }

  window.__dccOpenAppPromise=Promise.resolve(true);
  currentApp = app;
  window.currentApp = app;

  // La entrada debe pintar una sola vez. Realtime y la sincronización
  // pesada arrancan después, sin competir con el retorno OAuth en Safari.

  const login =
    document.getElementById("login");

  const clientApp =
    document.getElementById("client");

  const coachApp =
    document.getElementById("coach");

  login.style.display = "none";

  clientApp.style.display =
    app === "client" ? "block" : "none";

  coachApp.style.display =
    app === "coach" ? "block" : "none";

  // Al cambiar del login a la aplicación, no conservar la posición
  // de scroll de la pantalla de acceso.
  window.scrollTo(0,0);


  if(app === "client"){

    buildClientNav();

    const clientMain=document.getElementById("client-main");
    if(clientMain){
      clientMain.innerHTML='<div style="padding:28px 20px;color:#6f747c;font-weight:700">Cargando tu perfil…</div>';
    }

    try{
      let claimedClientId=currentClientId||window.currentClientId||null;
      if(!claimedClientId){
        const {data:resolvedClientId,error:claimError}=await supabaseClient.rpc("dcc_claim_client_access");
        if(claimError)throw claimError;
        claimedClientId=resolvedClientId||null;
      }
      if(!claimedClientId)throw new Error("No hay ningún cliente asociado a esta cuenta");

      currentClientId=String(claimedClientId);
      window.currentClientId=currentClientId;

      const preloadedClient=client(currentClientId);
      await loadClientsFromSupabase();

      let claimedClient=client(currentClientId)||preloadedClient;
      if(claimedClient&&!client(currentClientId)){
        data.clients=[...(data.clients||[]).filter(x=>String(x.id)!==String(currentClientId)),claimedClient];
      }
      if(!claimedClient){
        const {data:directClient,error:directClientError}=await supabaseClient.from("clients").select("*").eq("id",currentClientId).maybeSingle();
        if(directClientError)throw directClientError;
        if(directClient){
          data.clients=[...(data.clients||[]).filter(x=>String(x.id)!==String(currentClientId)),directClient];
          claimedClient=directClient;
        }
      }
      if(!claimedClient){
        const {data:retryClientId,error:retryClaimError}=await supabaseClient.rpc("dcc_claim_client_access");
        if(retryClaimError)throw retryClaimError;
        if(retryClientId){
          currentClientId=String(retryClientId);
          window.currentClientId=currentClientId;
          await loadClientsFromSupabase();
          claimedClient=client(currentClientId);
        }
      }
      if(!claimedClient){
        throw new Error("No se pudo cargar el perfil del cliente");
      }
      if(claimedClient.access_suspended===true){
        throw new Error("plan_suspended");
      }
      if(claimedClient.password_setup_completed!==true){
        for(let i=0;i<30&&typeof window.dccOpenFirstPasswordSetup!=='function';i++)await new Promise(resolve=>setTimeout(resolve,100));
        if(typeof window.dccOpenFirstPasswordSetup==='function'){
          window.dccOpenFirstPasswordSetup(claimedClient);
          window.__dccOpenAppPromise=null;
          return true;
        }
        throw new Error('Configuración de contraseña no disponible');
      }
      if(claimedClient?.status==='Pendiente de cuestionario'){
        window.__dccOnboardingGate=true;
        window.__dccOpenAppPromise=null;
        document.querySelector('#client .side')?.style.setProperty('display','none','important');
        return true;
      }
      window.__dccOnboardingGate=false;
      document.querySelector('#client .side')?.style.removeProperty('display');


      // Inicio depende de rutina, check-in, historial, métricas, mensajes y
      // notificaciones. Antes se pintaba Inicio antes de que esos datos
      // estuvieran listos y Safari/iOS podía dejar el contenedor sin pintar
      // hasta que el usuario cambiaba de pestaña.
      currentScreen="home";
      window.currentScreen="home";

      const hydrationResults=await Promise.allSettled([
        loadDietsFromSupabase(),
        loadRoutinesFromSupabase(),
        loadWorkoutHistoryFromSupabase(),
        loadTrainingProgressFromSupabase(),
        loadWeightsFromSupabase(),
        loadNotificationStateFromSupabase(),
        loadMessagesFromSupabase(),
        loadCheckinHistoryFromSupabase(),
        loadCheckinsFromSupabase(),
        loadClientBodyFatHistoryFromSupabase(currentClientId)
      ]);
      const historyLoaded=hydrationResults[2]?.status==="fulfilled"&&hydrationResults[2].value===true;
      const progressLoaded=hydrationResults[3]?.status==="fulfilled"&&hydrationResults[3].value===true;
      if(!progressLoaded&&historyLoaded)rebuildTrainingProgressFromHistory();

      const loadedRoutine=Array.isArray(data.routines?.[currentClientId])?data.routines[currentClientId]:[];
      if(loadedRoutine.length){
        window.trainingDayTab=getTrainingNextDayIndex(currentClientId,loadedRoutine.length);
      }

      // Inicio cliente: pintar directamente la autoridad aprobada.
      const paintApprovedHome=()=>{
        if(
          currentApp!=="client" ||
          !currentClientId ||
          String(window.currentScreen||currentScreen||"home")!=="home"
        )return;
        try{
          if(typeof window.dccClientGoHome==="function"){
            window.dccClientGoHome();
          }else if(typeof window.dccRenderClientHomeApproved==="function"){
            window.dccRenderClientHomeApproved();
          }else{
            showClient("home");
          }
        }catch(error){
          console.warn("DCC approved home paint",error);
        }
      };

      // All required server data is settled before the first approved Home paint.
      // A single deterministic paint avoids the old Safari retry chain repainting
      // stale screens after the user has already navigated elsewhere.
      paintApprovedHome();
      setupMessageRealtime();

    }catch(error){
      console.error("Error accediendo al perfil cliente:",error);
      window.__dccOpenAppPromise=null;
      currentClientId=null;
      window.currentClientId=null;
      if(clientMain){
        // Never expose the obsolete Google-account fallback. A valid client
        // session that cannot hydrate must return to secure access instead.
        clientMain.innerHTML='<div style="margin:24px;padding:20px;border:1px solid rgba(183,123,19,.25);border-radius:18px;background:#fffdf9;color:#17191d"><h2 style="margin:0 0 8px">No se pudo cargar tu acceso</h2><p style="margin:0 0 14px;color:#6f747c;line-height:1.45">Vuelve al acceso seguro e inténtalo de nuevo.</p><button type="button" onclick="logout()" style="width:100%;min-height:46px;border:1px solid #d9aa4a;border-radius:12px;background:#f4d16f;font-weight:850">Volver al acceso</button></div>';
      }
    }

  }else{

    buildCoachNav();

    // Entramos al panel inmediatamente. La sincronización con Supabase
    // no debe bloquear la primera pintura del entrenador.
    window.__dccCoachClientsHydrated=false;
    window.__dccCoachPlanDataHydrated=false;
    showCoach("dashboard");

    setupMessageRealtime();
    // Client rows are the base identity set. Load them first, then hydrate
    // dependent server domains. The dashboard must not infer missing plan
    // tasks until diet + routine data have finished loading from Supabase.
    loadClientsFromSupabase().then(()=>{
      window.__dccCoachClientsHydrated=true;
      if(window.currentApp==="coach"&&window.currentScreen==="dashboard")showCoach("dashboard");
      return Promise.allSettled([
      loadDietsFromSupabase(),
      loadRoutinesFromSupabase(),
      loadWorkoutHistoryFromSupabase(),
      loadWeightsFromSupabase(),
      loadMessagesFromSupabase(),
      loadNotificationStateFromSupabase(),
      loadCheckinsFromSupabase()
    ]);
    }).then(results=>{
      const dietOk=results?.[0]?.status==="fulfilled"&&results[0].value===true;
      const routineOk=results?.[1]?.status==="fulfilled"&&results[1].value===true;
      window.__dccCoachPlanDataHydrated=dietOk&&routineOk;
      if(window.currentApp==="coach"&&window.currentScreen==="dashboard")showCoach("dashboard");
    });

  }

  // La promesa solo bloquea aperturas concurrentes. No debe quedar
  // permanente, porque Safari/iOS puede restaurar la app desde caché
  // y necesitar una nueva pintura de Inicio.
  window.__dccOpenAppPromise=null;
  return true;

}
function logout(){
/* Limpiar estado efímero antes de una nueva sesión. La capa de autenticación
   se encarga de cerrar Supabase; aquí evitamos que una reentrada herede
   navegación, entrenamiento o polling del usuario anterior. */
clearInterval(window.restTimerInterval);
window.restTimerInterval=null;
if(typeof window.dccStopClientMessagePolling==="function"){
  window.dccStopClientMessagePolling();
}

  try{supabaseClient.removeChannel(window.clientMessagesRealtimeChannel)}catch(error){console.warn("DCC realtime cleanup",error)}
  window.clientMessagesRealtimeChannel=null;
}
if(typeof closeModal==="function"){
  closeModal();
}
window.activeWorkout=null;
window.workoutPausedScreen=null;
window.__dccCoachRouteIntent=null;
window.__dccOpenAppPromise=null;
currentClientId=null;
window.currentClientId=null;
currentApp=null;
window.currentApp=null;
currentScreen="home";
window.currentScreen="home";
document.getElementById("login").style.display="flex";
document.getElementById("client").style.display="none";
document.getElementById("coach").style.display="none";
}

function getWeekStart(date=new Date()){

  const d=new Date(date);
  const day=d.getDay();

  const diff=day===0 ? -6 : 1-day;

  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);

  return d;
}

function getWeeklyWorkoutCount(clientId){

  const history=data.workoutHistory?.[clientId]||[];

  const weekStart=getWeekStart();
  const now=new Date();

  return history.filter(w=>{

    const date=new Date(w.date);

    return date>=weekStart && date<=now;

  }).length;
}

  if(window.__dccOnboardingGate){

  currentScreen=screen;

  /* Actualizar pestaña activa aunque se llegue desde una alerta */

function startRestTimer(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!window.workoutAudioCtx){
      window.workoutAudioCtx = new AudioContext();
    }

    if(window.workoutAudioCtx.state === "suspended"){
      window.workoutAudioCtx.resume();
    }

  }catch(e){

    console.log("Audio no disponible:",e);

  }
  clearInterval(window.restTimerInterval);

  const workout = window.activeWorkout;

  if(!workout || !workout.restUntil) return;

  window.restTimerInterval = setInterval(()=>{

    if(!window.activeWorkout){
      clearInterval(window.restTimerInterval);
      return;
    }

    const remaining = Math.max(
      0,
      Math.ceil((workout.restUntil - Date.now()) / 1000)
    );

    const timer = document.getElementById("rest-timer");

    if(timer){

      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;

      timer.textContent =
        `${minutes}:${String(seconds).padStart(2,"0")}`;

    }

    
    if(remaining >= 1 && remaining <= 10){

  if(window.lastBeepSecond !== remaining){

    window.lastBeepSecond = remaining;

    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const audioCtx = window.workoutAudioCtx || new AudioContext();

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.frequency.value = 800;
      oscillator.type = "sine";

      gainNode.gain.value = 0.12;

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();

      oscillator.stop(audioCtx.currentTime + 0.12);

    }catch(e){
      console.log("No se pudo reproducir el sonido:",e);
    }

  }

}
    if(remaining <= 0){

  clearInterval(window.restTimerInterval);

  workout.restUntil = null;

  const finishedRestMode=workout.restMode;
  workout.restMode = null;
  renderWorkoutSession();
  if(finishedRestMode==="exercise" || finishedRestMode==="superset"){
    toast("Descanso terminado · Siguiente ejercicio");
  }else{
    toast("Descanso terminado · Siguiente serie");
  }

}

  },250);
}


function skipRest(){

  const workout = window.activeWorkout;

  if(!workout) return;

  clearInterval(window.restTimerInterval);

  const finishedRestMode=workout.restMode;
  workout.restUntil = null;
  workout.restMode = null;
  renderWorkoutSession();
  if(finishedRestMode==="exercise" || finishedRestMode==="superset"){
    toast("Descanso omitido · Siguiente ejercicio");
  }else{
    toast("Descanso omitido · Siguiente serie");
  }
}


function saveWorkoutSet(){

  const workout=window.activeWorkout;
  if(!workout)return;
  if(workout.restUntil && workout.restUntil > Date.now()){toast("Espera a que termine el descanso");return;}

  const exercise=workout.exercises[workout.currentExercise];
  if(!exercise)return;

  const kgInput=document.getElementById("workout-kg");
  const repsInput=document.getElementById("workout-reps");
  if(!kgInput||!repsInput)return;
  const kgValue=parseFloat(String(kgInput.value||"").trim().replace(",","."));
  const repsValue=parseInt(String(repsInput.value||"").trim());
  if(!Number.isFinite(kgValue)||!Number.isFinite(repsValue)||kgValue<0||repsValue<=0){toast("Introduce peso y repeticiones");return;}

  if(exercise.restPause){
    const repsPattern=String(exercise.restPauseReps||exercise.reps||'').trim();
    const targets=repsPattern.split(/[\/\-–,\s]+/).map(v=>parseInt(v)).filter(v=>Number.isFinite(v)&&v>0);
    if(!targets.length){toast("Configura las repeticiones REST-pause");return;}
    workout.restPauseState=workout.restPauseState||{};
    const stateKey=String(workout.currentExercise);
    const state=workout.restPauseState[stateKey]||{seriesCompleted:0,block:0,entries:[]};
    const plannedSeries=Math.max(1,parseInt(exercise.sets)||1);
    if(state.seriesCompleted>=plannedSeries){toast("Ya has completado todas las series");return;}
    state.entries.push({kg:kgValue,reps:repsValue,targetReps:targets[state.block]||null});
    state.block+=1;
    workout.restPauseState[stateKey]=state;
    if(state.block<targets.length){
      const miniRest=Math.max(0,parseInt(exercise.restPauseSeconds)||0);
      if(miniRest>0){workout.restUntil=Date.now()+miniRest*1000;workout.restMode="restpause-block";renderWorkoutSession();startRestTimer();toast(`REST-pause · Bloque ${state.block} guardado · Mini-descanso ${miniRest} s`);}
      else{workout.restUntil=null;workout.restMode=null;renderWorkoutSession();toast(`REST-pause · Bloque ${state.block} guardado`);}
      return;
    }
    const blocks=JSON.parse(JSON.stringify(state.entries));
    const representativeKg=blocks.length?blocks[0].kg:kgValue;
    workout.sets.push({kg:representativeKg,reps:repsPattern,restPause:true,blocks});
    state.seriesCompleted+=1;
    state.block=0;
    state.entries=[];
    const seriesDone=state.seriesCompleted;
    const seriesRest=Math.max(0,parseInt(exercise.restPauseFinalRest)||parseInt(exercise.restBetweenExercises)||0);
    if(seriesDone<plannedSeries&&seriesRest>0){workout.restUntil=Date.now()+seriesRest*1000;workout.restMode="restpause-series";renderWorkoutSession();startRestTimer();toast(`REST-pause · Serie ${seriesDone} guardada · Descanso ${seriesRest} s`);}
    else{workout.restUntil=null;workout.restMode=null;renderWorkoutSession();toast(`REST-pause · Serie ${seriesDone} guardada`);}
    return;
  }

  const groupId=exercise.supersetId||null;
  if(groupId){
    const members=workout.exercises.map((ex,index)=>({ex,index})).filter(x=>x.ex?.supersetId===groupId).sort((a,b)=>(Number(a.ex.supersetOrder)||0)-(Number(b.ex.supersetOrder)||0));
    const pos=Math.max(0,members.findIndex(x=>x.index===workout.currentExercise));
    const rounds=Math.max(1,parseInt(exercise.supersetRounds||exercise.sets)||1);
    workout.supersetState=workout.supersetState||{};
    const state=workout.supersetState[groupId]||{round:1,entries:{}};
    const round=Math.max(1,Number(state.round)||1);
    state.entries[workout.currentExercise]=state.entries[workout.currentExercise]||[];
    state.entries[workout.currentExercise][round-1]={kg:kgValue,reps:repsValue};
    workout.supersetState[groupId]=state;
    workout.sets=state.entries[workout.currentExercise].filter(Boolean);

    if(pos<members.length-1){
      workout.currentExercise=members[pos+1].index;
      workout.sets=(state.entries[workout.currentExercise]||[]).filter(Boolean);
      workout.restUntil=null;workout.restMode=null;
      renderWorkoutSession();
      toast(`Superserie · Ejercicio ${pos+2} de ${members.length}`);
      return;
    }

    members.forEach(m=>{
      const sets=(state.entries[m.index]||[]).filter(Boolean);
      const existing=workout.completedExercises.find(x=>x.__supersetId===groupId&&x.__exerciseIndex===m.index);
      const record={name:m.ex.name||"Ejercicio",plannedSets:String(rounds),plannedReps:m.ex.reps||"",sets:JSON.parse(JSON.stringify(sets)),__supersetId:groupId,__exerciseIndex:m.index};
      if(existing)Object.assign(existing,record);else workout.completedExercises.push(record);
    });

    if(round<rounds){
      state.round=round+1;
      workout.currentExercise=members[0].index;
      workout.sets=(state.entries[workout.currentExercise]||[]).filter(Boolean);
      const restSeconds=Math.max(0,parseInt(exercise.supersetRest||exercise.restBetweenExercises)||0);
      if(restSeconds>0){workout.restUntil=Date.now()+restSeconds*1000;workout.restMode="superset";renderWorkoutSession();startRestTimer();toast(`Superserie · Serie ${round} guardada · Descanso ${restSeconds} s`);}
      else{workout.restUntil=null;workout.restMode=null;renderWorkoutSession();toast(`Superserie · Serie ${round} guardada`);}
      return;
    }

    /* Última ronda de la superserie: el grupo ya está registrado en
       completedExercises. Avanzar al ejercicio siguiente en lugar de dejar
       al usuario atrapado en el 2/2 con la serie final ya guardada. */
    const lastIndex=members[members.length-1].index;
    const nextIndex=lastIndex+1;
    delete workout.supersetState[groupId];
    workout.sets=[];
    workout.restUntil=null;
    workout.restMode=null;

    if(nextIndex>=workout.exercises.length){
      workout.currentExercise=workout.exercises.length;
      finishWorkout();
      return;
    }

    workout.currentExercise=nextIndex;
    const restSeconds=Math.max(0,parseInt(exercise.supersetRest||exercise.restBetweenExercises)||0);
    if(restSeconds>0){
      workout.restUntil=Date.now()+restSeconds*1000;
      workout.restMode="exercise";
      renderWorkoutSession();
      startRestTimer();
      toast(`Superserie completada · Descanso ${restSeconds} s`);
    }else{
      renderWorkoutSession();
      toast("Superserie completada · Siguiente ejercicio");
    }
    return;
  }

  const plannedSets=parseInt(exercise?.sets)||0;
  if(plannedSets&&workout.sets.length>=plannedSets){toast("Ya has completado todas las series");return;}
  workout.sets.push({kg:kgValue,reps:repsValue});
  const restSeconds=Math.max(0,parseInt(exercise?.restBetweenSets)||0);
  if(restSeconds>0){workout.restUntil=Date.now()+restSeconds*1000;workout.restMode="set";renderWorkoutSession();startRestTimer();toast(`Serie guardada · Descanso ${restSeconds} s`);}
  else{workout.restUntil=null;renderWorkoutSession();toast("Serie guardada");}
}
function editWorkoutSet(index){

function dccDeferWorkoutExercise(){
  const workout=window.activeWorkout;
  if(!workout||!Array.isArray(workout.exercises)||workout.exercises.length<2)return;
  if(workout.restUntil&&workout.restUntil>Date.now()){toast("Omite el descanso antes de aplazar el ejercicio");return;}
  const idx=Number(workout.currentExercise)||0,exercise=workout.exercises[idx];
  if(!exercise)return;
  if(Array.isArray(workout.sets)&&workout.sets.length){toast("Ya has empezado este ejercicio; termínalo antes de aplazarlo");return;}
  if(exercise.restPause){
    const rp=workout.restPauseState?.[String(idx)];
    if((Number(rp?.seriesCompleted)||0)>0||(Number(rp?.block)||0)>0){toast("Ya has empezado este REST-pause; termínalo antes de aplazarlo");return;}
  }
  if(exercise.supersetId){
    const members=workout.exercises.map((ex,index)=>({ex,index})).filter(x=>x.ex?.supersetId===exercise.supersetId);
    const first=Math.min(...members.map(x=>x.index));
    const ss=workout.supersetState?.[exercise.supersetId];if(idx!==first||Number(ss?.round||1)>1||Object.keys(ss?.entries||{}).length){toast("La superserie ya está en curso y no se puede aplazar a mitad");return;}
    const group=workout.exercises.splice(first,members.length);
    workout.exercises.push(...group);
    workout.currentExercise=first>=workout.exercises.length?0:first;
  }else{
    const [moved]=workout.exercises.splice(idx,1);
    workout.exercises.push(moved);
    workout.currentExercise=idx>=workout.exercises.length?0:idx;
  }
  workout.deferredExercises=workout.deferredExercises||[];
  workout.deferredExercises.push({name:exercise.name||"Ejercicio",at:Date.now()});
  workout.restUntil=null;workout.restMode=null;
  renderWorkoutSession();
  toast("Ejercicio aplazado · volverá al final");
}

function nextWorkoutExercise(){

  const workout=window.activeWorkout;

  if(!workout)return;

  const exercise=
    workout.exercises[workout.currentExercise];

  if(!exercise){
    finishWorkout();
    return;
  }

  if(!workout.sets || !workout.sets.length){
    toast("Registra al menos una serie");
    return;
  }

  if(exercise.restPause){
    const plannedSeries=Math.max(1,parseInt(exercise.sets)||1);
    const state=workout.restPauseState?.[String(workout.currentExercise)];
    const completedSeries=Math.max(workout.sets.length,Number(state?.seriesCompleted)||0);
    if(completedSeries<plannedSeries){
      toast(`Completa las ${plannedSeries} series REST-pause antes de continuar`);
      return;
    }
  }

  workout.completedExercises.push({

    name:exercise.name || "Ejercicio",

    plannedSets:exercise.sets || "",

    plannedReps:exercise.reps || "",

    sets:JSON.parse(JSON.stringify(workout.sets))

  });

  if(exercise.restPause&&workout.restPauseState)delete workout.restPauseState[String(workout.currentExercise)];

  workout.currentExercise++;

  workout.sets=[];

  /* Último ejercicio: terminar directamente */

  if(workout.currentExercise >= workout.exercises.length){

    finishWorkout();

    return;

  }

  /* Descanso entre ejercicios configurado por el entrenador */

  const restSeconds=
    Math.max(
      0,
      parseInt(exercise.restBetweenExercises) || 0
    );

  if(restSeconds > 0){

    workout.restUntil=
      Date.now() + (restSeconds * 1000);

    workout.restMode="exercise";

    renderWorkoutSession();

    startRestTimer();

    toast(
      `Ejercicio completado · Descanso ${restSeconds} s`
    );

    return;

  }

  /* Sin descanso: pasar directamente */

  workout.restUntil=null;
  workout.restMode=null;

  renderWorkoutSession();
}


async function finishWorkout(){

  clearInterval(window.restTimerInterval);
  window.restTimerInterval=null;

  const workout=window.activeWorkout;
  if(!workout)return;
const totalDays =
  (data.routines[workout.clientId] || []).length;

  const lastExercise=
    workout.exercises[workout.currentExercise];

  if(lastExercise?.restPause){
    const plannedSeries=Math.max(1,parseInt(lastExercise.sets)||1);
    const state=workout.restPauseState?.[String(workout.currentExercise)];
    const completedSeries=Math.max(workout.sets.length,Number(state?.seriesCompleted)||0);
    if((Number(state?.block)||0)>0 || completedSeries<plannedSeries){
      toast(`Completa las ${plannedSeries} series REST-pause antes de finalizar`);
      renderWorkoutSession();
      return;
    }
  }

  if(lastExercise && workout.sets.length){
    workout.completedExercises.push({

      name:lastExercise.name || "Ejercicio",

      plannedSets:lastExercise.sets || "",

      plannedReps:lastExercise.reps || "",

      sets:JSON.parse(JSON.stringify(workout.sets))

    });

  }

  /* No guardar entrenamientos vacíos */
  if(!workout.completedExercises.length){

    toast("No hay ejercicios registrados");

    window.activeWorkout=null;

    showClient("training");

    return;

  }

  const duration=
    Math.max(
      1,
      Math.floor((Date.now()-workout.startedAt)/1000)
    );

  const workoutData={

    client_id:workout.clientId,

    workout_date:new Date().toISOString(),

    duration:duration,

    /* Persistimos el día dentro del JSON de ejercicios porque la tabla
       histórica no tiene una columna day_index. Así el bloqueo semanal
       puede reconstruirse también después de cerrar sesión o cambiar de dispositivo. */
    exercises:[
      {
        __dccMeta:true,
        dayIndex:Number(workout.dayIndex),
        dayName:workout.dayName || ""
      },
      ...workout.completedExercises
    ]

  };

  /* Guardar definitivamente en Supabase antes de confirmar la sesión local. */

  try{
    if(!supabaseClient) throw new Error("Sin conexión con Supabase");
    const {error}=await supabaseClient
      .from("workout_history")
      .insert(workoutData);
    if(error) throw error;
  }catch(error){
    console.error(
      "Error guardando entrenamiento en Supabase:",
      error
    );
    toast("No se pudo guardar el entrenamiento. Inténtalo de nuevo.");
    return;
  }

  /* Mantener también copia local */

  if(!data.workoutHistory[workout.clientId]){
    data.workoutHistory[workout.clientId]=[];
  }

  data.workoutHistory[workout.clientId].push({

    date:workoutData.workout_date,

    duration:duration,

    dayName:workout.dayName,

    dayIndex:Number(workout.dayIndex),

    dayName:workout.dayName,

    exercises:workout.completedExercises

  });

  saveData();

const progressResult =
  await markTrainingDayCompleted(
    workout.clientId,
    workout.dayIndex,
    totalDays
  );

if(progressResult.completedAll){
  toast("¡Rutina completada! Nuevo ciclo disponible.");
}
  window.activeWorkout=null;

  window.__dccWorkoutCompleted={
    dayIndex:Number(workout.dayIndex),
    dayName:workout.dayName||`Día ${Number(workout.dayIndex)+1}`,
    duration:duration
  };
  toast("Entrenamiento completado ✓");
  showClient("home");

}

  const workout=window.activeWorkout;

clearInterval(window.restTimerInterval);
window.restTimerInterval=null;

window.activeWorkout=null;

}
