.<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniel Campins</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#080a0e;
  --bg2:#0d1117;
  --panel:#11151c;
  --panel2:#151a22;
  --text:#f5f5f2;
  --muted:#9299a5;
  --line:rgba(255,255,255,.09);
  --gold:#d9aa4a;
  --gold-light:#f0c96b;
  --blue:#4d8dff;
  --red:#e05a5a;
  --green:#39b982;
  --white:#ffffff;
  --radius:22px;
  --shadow:0 25px 80px rgba(0,0,0,.35);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* =========================
   PANTALLA DE ENTRADA
========================= */

.login{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 78% 8%,rgba(57,72,95,.48),transparent 35%),
    radial-gradient(circle at 12% 92%,rgba(217,170,74,.09),transparent 30%),
    linear-gradient(145deg,#18202b 0%,#090c11 52%,#040507 100%);
}

.login:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,transparent 0,rgba(0,0,0,.35) 75%),
    linear-gradient(120deg,rgba(255,255,255,.025),transparent 35%);
  pointer-events:none;
}

.login-box{
  width:min(720px,100%);
  position:relative;
  z-index:2;
  padding:46px 30px 30px;
  background:
    linear-gradient(145deg,
      rgba(25,29,37,.96),
      rgba(9,11,15,.94));
  border:1px solid rgba(255,255,255,.11);
  border-radius:32px;
  box-shadow:
    0 35px 100px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.logo{
  margin:0;
  text-align:center;
  font-size:0;
  line-height:1;
}

.logo:before{
  content:"DC";
  display:block;
  color:var(--gold);
  font-size:78px;
  font-weight:300;
  letter-spacing:-10px;
  text-shadow:
    0 0 30px rgba(217,170,74,.20);
}

.login-box>.muted{
  margin:20px 0 42px;
  text-align:center;
  color:#aeb4bd;
  font-size:15px;
  letter-spacing:.3px;
}

.login-box:after{
  content:"";
  position:absolute;
  top:143px;
  left:50%;
  width:48px;
  height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border-radius:999px;
  box-shadow:0 0 14px rgba(217,170,74,.25);
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.choice{
  position:relative;
  min-height:190px;
  padding:29px 25px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:23px;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.018));
  color:#fff;
  text-align:left;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.choice:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-75px;
  top:-75px;
  border-radius:50%;
  background:rgba(217,170,74,.075);
}

.choice:after{
  content:"";
  position:absolute;
  left:-30px;
  bottom:-60px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.018);
}

.choice:hover{
  transform:translateY(-4px);
  border-color:rgba(217,170,74,.42);
  box-shadow:0 20px 50px rgba(0,0,0,.32);
}

.choice b{
  position:relative;
  z-index:2;
  display:block;
  margin-bottom:15px;
  font-size:20px;
  font-weight:700;
  letter-spacing:-.3px;
}

.choice span{
  position:relative;
  z-index:2;
  display:block;
  color:#9da5af;
  font-size:14px;
  line-height:1.65;
}

.choice.dark{
  background:
    linear-gradient(145deg,
      rgba(217,170,74,.15),
      rgba(255,255,255,.025));
  border-color:rgba(217,170,74,.45);
}

.choice.dark span{
  color:#b8bec7;
}

/* =========================
   APP
========================= */

.app{
  display:none;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.035),transparent 28%),
    var(--bg);
}

/* =========================
   MENÚ LATERAL
========================= */

.side{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  padding:28px 14px;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.09),transparent 30%),
    linear-gradient(180deg,#11151b 0%,#080a0d 100%);
  color:#fff;
  border-right:1px solid rgba(255,255,255,.07);
  z-index:20;
}

.side h2{
  margin:0 10px 28px;
  padding:0 0 23px;
  border-bottom:1px solid rgba(255,255,255,.09);
  font-size:13px;
  font-weight:700;
  letter-spacing:4px;
  color:#f2f2ef;
}

.nav button{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  width:100%;
  height:100%;

  background:none;
  border:0;

  color:#858d98;
  text-align:center;

  padding:6px 2px;
  margin:0;

  border-radius:16px;

  font-size:11px;
  line-height:1.1;

  white-space:nowrap;

  transition:
    background .25s ease,
    color .25s ease,
    transform .18s ease,
    box-shadow .25s ease;

  box-sizing:border-box;
}

.nav button::before{
  content:"";
  position:absolute;
  left:8px;
  top:50%;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(217,170,74,.12);
  transform:translateY(-50%) scale(.65);
  opacity:0;
  transition:
    transform .25s ease,
    opacity .25s ease;
  pointer-events:none;
}



.out{
  position:absolute;
  left:14px;
  right:14px;
  bottom:20px;
  padding:11px;
  background:transparent;
  color:#858d98;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  transition:.2s;
}

.out:hover{
  color:#fff;
  border-color:rgba(255,255,255,.18);
}

/* =========================
   CONTENIDO
========================= */

main{
  margin-left:250px;
  padding:38px;
  max-width:1500px;
}

.screen{
  display:none;
}

.screen.on{
  display:block;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:26px;
}

.top h1,
h1{
  margin:0;
  font-size:32px;
  font-weight:750;
  letter-spacing:-1.1px;
}

h2{
  letter-spacing:-.5px;
}

h3{
  margin-top:0;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  gap:18px;
}

.g2{
  grid-template-columns:1.4fr .8fr;
}

.g3{
  grid-template-columns:repeat(3,1fr);
}

/* =========================
   TARJETAS
========================= */

.card{
  position:relative;
  background:
    radial-gradient(circle at 100% 0%,rgba(217,170,74,.08),transparent 35%),
    linear-gradient(145deg,#181b23,#101218);
  color:#f5f5f2;
  border:1px solid rgba(255,255,255,.10);
  border-radius:26px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:
    0 14px 45px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.card h2:first-child{
  margin-top:0;
}

/* =========================
   MÉTRICAS
========================= */

.metric b{
  display:block;
  color:#f5f5f2;
  margin:7px 0;
  font-size:29px;
  letter-spacing:-.9px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid rgba(255,255,255,.09);
  border-radius:16px;
  overflow:hidden;
  background:rgba(255,255,255,.025);
}

.metric{
  padding:17px;
  border-right:1px solid rgba(255,255,255,.08);
}

.metric:last-child{
  border:0;
}

/* =========================
   ITEMS
========================= */

.item{
  padding:16px 0;
  border-bottom:1px solid #eceef1;
}

.item:last-child{
  border:0;
}

/* =========================
   BOTONES
========================= */

.btn{
    background:linear-gradient(135deg,var(--gold),#f4d98a);
    color:#17130a;
    border:0;
    padding:12px 18px;
    border-radius:14px;
    font-weight:750;
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
    box-shadow:0 5px 18px rgba(217,170,74,.10);
}

.btn:hover{
    transform:translateY(-1px);
    filter:brightness(1.04);
    box-shadow:0 8px 24px rgba(217,170,74,.18);
}

.btn:active{
    transform:scale(.97);
    box-shadow:0 3px 12px rgba(217,170,74,.12);
}
.ghost{
  background:#fff;
  color:#111318;
  border:1px solid #dfe3e8;
  padding:10px 14px;
  border-radius:12px;
  transition:.2s;
}

.ghost:hover{
  background:#f7f8fa;
  border-color:#cbd1d8;
}

.danger{
  background:#fff2f2;
  color:var(--red);
  border:1px solid #f0cccc;
  padding:10px 14px;
  border-radius:12px;
}

/* =========================
   BADGES
========================= */

.pill{
  display:inline-flex;
  align-items:center;
  padding:7px 11px;
  border-radius:999px;
  background:#f5ead2;
  color:#956b18;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
}

/* =========================
   CLIENTES
========================= */

.client-row{
  padding:18px;
  margin:5px 0;
  border:1px solid transparent;
  border-radius:15px;
  cursor:pointer;
  transition:.2s;
}

.client-row:hover{
  background:#fafbfc;
  border-color:#e6e9ed;
}

/* =========================
   EJERCICIOS / ALIMENTOS
========================= */

.exercise,
.food{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px;
  margin:9px 0;
  background:rgba(255,255,255,.035);
  color:#f5f5f2;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  transition:
    transform .2s ease,
    background .2s ease,
    border-color .2s ease;
}

.exercise:active,
.food:active{
  transform:scale(.985);
  background:rgba(217,170,74,.06);
  border-color:rgba(217,170,74,.18);
}

.food-actions,
.exercise-actions{
  display:flex;
  gap:7px;
  align-items:center;
}

/* =========================
   FORMULARIOS
========================= */

textarea,
input,
select{
  width:100%;
  padding:12px 13px;
  border:1px solid #d9dee4;
  border-radius:12px;
  background:#fff;
  color:#111318;
  outline:none;
  transition:.2s;
}

textarea:focus,
input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(52,120,246,.10);
}

label{
  display:block;
  margin:13px 0 7px;
  font-weight:700;
}

/* =========================
   VACÍO
========================= */

.empty{
  padding:30px 20px;
  text-align:center;
  color:#7c858f;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  padding:20px;
  background:rgba(5,7,10,.62);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:50;
}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  padding:26px;
  background:#fff;
  color:#111318;
  border-radius:23px;
  box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  display:none;
  padding:13px 17px;
  background:#10141a;
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
  border-radius:13px;
  z-index:100;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

/* =========================
   MÓVIL
========================= */

@media(max-width:700px){

  body{
    background:var(--bg);
  }

  .login{
    padding:14px;
    align-items:center;
  }

  .login-box{
    width:100%;
    padding:40px 20px 21px;
    border-radius:28px;
  }

  .logo:before{
    font-size:66px;
  }

  .login-box>.muted{
    margin-top:18px;
    margin-bottom:34px;
    font-size:14px;
  }

  .login-box:after{
    top:130px;
  }

  .choices{
    grid-template-columns:1fr;
    gap:12px;
  }

  .choice{
    min-height:145px;
    padding:23px 20px;
    border-radius:20px;
  }

  .choice b{
    font-size:19px;
  }

  .choice span{
    font-size:14px;
    line-height:1.55;
  }

  .side{
  width:calc(100% - 20px);
  height:68px;
  top:auto;
  bottom:10px;
  left:10px;
  padding:6px;
  background:rgba(17,21,28,.94);
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

  .side h2,
  .out{
    display:none;
  }

  .nav{
  display:flex;
  justify-content:space-around;
  align-items:center;
  height:100%;
  gap:4px;
}

.nav button{
    position:relative;
    flex:1 1 0;
    width:100%;
    min-width:0;
    height:56px;
    margin:0;
    padding:4px 2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    border:1px solid transparent;
    border-radius:14px;
    background:transparent;
    color:#858d98;
    text-align:center;
    font-size:10px;
    box-sizing:border-box;
    transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease,
        border-color .2s ease;
}

.nav button.active{
    background:transparent !important;
    border-color:transparent !important;
    box-shadow:none !important;
    transform:none !important;
}

.nav button.active svg{
    color:#d9a62f;
}

.nav button.active span{
    color:#d9a62f;
}

.nav button svg{
  width:23px;
  height:23px;
  flex:none;
  stroke:currentColor;
}

.nav button:active{
  transform:scale(.94);
}

#coach-nav button{
  min-width:0 !important;
  width:100% !important;
  height:68px !important;

  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
justify-content:center !important;
gap:4px !important;

padding:5px 2px !important;
margin:0 !important;
  box-sizing:border-box !important;
}

#coach-nav button svg{
  width:24px !important;
  height:24px !important;
  flex-shrink:0 !important;
}

#coach-nav button span{
  display:block !important;
  width:100% !important;

  font-size:10px !important;
  line-height:1 !important;

  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:clip !important;

  box-sizing:border-box !important;
}

#coach-nav button.active{
  color:#f0c96b !important;
  background:rgba(217,170,74,.09) !important;
  border-color:rgba(217,170,74,.08) !important;
}

#coach-nav button.active svg{
  filter:drop-shadow(0 0 7px rgba(217,170,74,.35)) !important;
}
 

  .top h1,
  h1{
    font-size:27px;
  }

  .g2,
  .g3{
    grid-template-columns:1fr;
  }

  .card{
    padding:19px;
    border-radius:18px;
    margin-bottom:14px;
  }

  .metrics{
    grid-template-columns:1fr;
  }

  .metric{
    border-right:0;
    border-bottom:1px solid #e7e9ec;
  }

  .metric:last-child{
    border-bottom:0;
  }

  .exercise,
  .food{
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .food-actions,
  .exercise-actions{
    width:100%;
  }

  .food-actions button,
  .exercise-actions button{
    flex:1;
  }

  .top .btn{
    white-space:nowrap;
  }
}
/* ===== ELEVATE — PANTALLA DE INICIO ===== */

.login{
  min-height:100vh;
  min-height:100dvh;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  box-sizing:border-box;
  background:
    radial-gradient(circle at 50% 12%,rgba(217,170,74,.10),transparent 32%),
    radial-gradient(circle at 15% 85%,rgba(217,170,74,.045),transparent 30%),
    #07090d;
  position:relative;
  overflow:auto;
}

.login-box{
  width:100%;
  max-width:620px;
  box-sizing:border-box;
  padding:38px 30px 32px;
  background:
    linear-gradient(
      145deg,
      rgba(31,35,43,.96),
      rgba(17,20,26,.97)
    );
  border:1px solid rgba(255,255,255,.13);
  border-radius:30px;
  box-shadow:
    0 30px 90px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.035);
  text-align:center;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

/* brillo decorativo superior */
.login-box::before{
  content:"";
  position:absolute;
  width:230px;
  height:230px;
  right:-110px;
  top:-105px;
  border-radius:50%;
  background:rgba(217,170,74,.07);
  pointer-events:none;
}

.login-box::after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  left:-105px;
  bottom:-105px;
  border-radius:50%;
  background:rgba(255,255,255,.025);
  pointer-events:none;
}

/* ===== LOGO ===== */

.brand-logo{
  width:150px;
  height:105px;
  margin:0 auto 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
}

.brand-logo svg{
  width:150px;
  height:105px;
  display:block;
}

/* ===== NOMBRE ===== */

.brand-name{
  color:#f7f7f5;
  font-size:34px;
  font-weight:500;
  letter-spacing:7px;
  line-height:1.15;
  margin:0;
  position:relative;
  z-index:1;
}

/* ===== SUBTÍTULO ===== */

.brand-subtitle{
  color:#d9aa4a;
  font-size:13px;
  font-weight:500;
  letter-spacing:4px;
  margin-top:10px;
  position:relative;
  z-index:1;
}

/* ===== LÍNEA DORADA ===== */

.brand-line{
  width:70px;
  height:2px;
  margin:18px auto 25px;
  background:linear-gradient(
    90deg,
    #b98227,
    #f5d27a,
    #b98227
  );
  border-radius:999px;
  box-shadow:0 0 14px rgba(217,170,74,.25);
  position:relative;
  z-index:1;
}

/* ===== TARJETAS ===== */

.choices{
  display:flex;
  flex-direction:column;
  gap:16px;
  width:100%;
  text-align:left;
  position:relative;
  z-index:1;
}

.login .choices .choice{
  width:100%;
  min-height:0;
  height:auto;
  box-sizing:border-box;
  padding:27px 22px 25px;
  border-radius:23px;
  background:
    linear-gradient(
      145deg,
      rgba(31,35,43,.96),
      rgba(17,20,26,.97)
    );
  border:1px solid rgba(255,255,255,.16);
  color:#f5f5f2;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
  cursor:pointer;
  transition:
    transform .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
  font-family:inherit;
}

/* decoración de las tarjetas */
.login .choices .choice::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  right:-80px;
  top:-75px;
  border-radius:50%;
  background:rgba(217,170,74,.065);

}

/* ===== LÍNEA TARJETA ===== */

.login .choices .choice-line{

/* ===== PANEL ENTRENADOR ===== */

}

.choice-admin .choice-icon span{

/* ===== INTERACCIÓN ===== */

.login .choices .choice:hover{

.diet-list{

  display:flex;

  gap:12px;
}

.meal-number{
  flex:none;

  width:46px;

  box-sizing:border-box;

      rgba(217,170,74,.10),
      rgba(217,170,74,.015)

  font-size:14px;
  font-weight:700;

  box-shadow:
    0 0 14px rgba(217,170,74,.05);
}

.meal-card summary b{
  display:flex;
  align-items:center;
  gap:10px;

  min-width:0;

  font-family:Georgia,"Times New Roman",serif;
  font-size:18px;
  font-weight:500;
  line-height:1.2;
}

.meal-card summary b::before{
  flex:none;

  color:#e9b94f;

  font-family:Arial,sans-serif;
  font-size:22px;
  line-height:1;
  text-align:center;
}

  content:"♧";

.dc-home{

.dc-avatar{

}

.dc-avatar svg{

.dc-welcome{

.dc-eyebrow{

/* =========================================================
   NUEVO DISEÑO MÓVIL — PROTOTIPO DANIEL CAMPINS
   BLOQUE ÚNICO Y DEFINITIVO
   ========================================================= */

@media (max-width: 768px) {

  /* ---------- BASE ---------- */

  body {
    overflow-x: hidden;
  }

  .dc-home {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 16px 16px 110px;
    box-sizing: border-box;
  }

  /* ---------- CABECERA ---------- */

  .dc-home > header,
  .dc-home .dc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    margin-bottom: 18px;
  }

  /* ---------- ESTADÍSTICAS ---------- */

  .dc-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    margin-bottom: 16px;
  }

  .dc-stats > * {
    min-width: 0;
  }

  /* ---------- ENTRENAMIENTO ---------- */

  .dc-training {
    width: 100%;
    margin-bottom: 16px;
    box-sizing: border-box;
  }

  .dc-training > * {
    max-width: 100%;
    box-sizing: border-box;
  }

  /* ---------- PRÓXIMO ENTRENAMIENTO ---------- */

  .dc-next {
    width: 100%;
    margin-bottom: 16px;
    box-sizing: border-box;
  }

  /* ---------- ACCESOS RÁPIDOS ---------- */

  .dc-home .dc-quick,
  .dc-home .dc-quick-actions,
  .dc-home .quick-actions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    width: 100%;
    margin: 0 0 16px;
  }

  .dc-home .dc-quick > *,
  .dc-home .dc-quick-actions > *,
  .dc-home .quick-actions > * {
    width: 100%;
    min-width: 0;
    min-height: 86px;
    box-sizing: border-box;
  }

  /* ---------- FRASE ---------- */

  .dc-quote {
    width: 100%;
    margin: 0 0 16px;
    box-sizing: border-box;
  }

  /* ---------- NAVEGACIÓN INFERIOR ---------- */

  #client-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1000;

    width: 100%;
    box-sizing: border-box;

    padding:
      8px
      max(8px, env(safe-area-inset-right))
      calc(8px + env(safe-area-inset-bottom))
      max(8px, env(safe-area-inset-left));

    margin: 0;
  }

  #client-nav > * {
    min-width: 0;
  }

  /* Evita que el contenido quede escondido
     detrás de la navegación inferior */
  .dc-home {
    padding-bottom: 115px;
  }

  /* ---------- AJUSTES DE TARJETAS ---------- */

  .dc-home .card,
  .dc-home .dc-card {
    max-width: 100%;
    box-sizing: border-box;
  }

  /* ---------- TIPOGRAFÍA ---------- */

  .dc-home h1,
  .dc-home h2,
  .dc-home h3,
  .dc-home p {
    max-width: 100%;
  }

}

function getCurrentWeekKey(){

  const now = new Date();
  const day = now.getDay();

  const monday = new Date(now);

  const diff = day === 0 ? -6 : 1 - day;

  monday.setDate(now.getDate() + diff);
  monday.setHours(0,0,0,0);

  return monday.toISOString().slice(0,10);
}


function isMonday(){

  return new Date().getDay() === 1;

}


function resetWeeklyCheckinIfNeeded(){

  if(!data.checkins) return;

  const weekKey = getCurrentWeekKey();

  if(!data.checkinWeek){
    data.checkinWeek = {};
  }

  if(data.checkinWeek[currentClientId] !== weekKey){

    const checkin = data.checkins[currentClientId];

    if(checkin){

      checkin.diet = "";
      checkin.training = "";
      checkin.comment = "";
      checkin.reviewed = false;

    }

    data.checkinWeek[currentClientId] = weekKey;

    saveData();

  }

}

  const completed=getCompletedTrainingDays(clientId);

    completed.push(index);

async function deleteClient(id){

  const c = client(id);

  if(!c){
    toast("No se encontró el cliente");
    return;
  }

  const confirmed = confirm(
    "¿Seguro que quieres eliminar a " +
    c.name +
    "?\n\nSe eliminarán también sus datos asociados."
  );

  if(!confirmed) return;

  try{

    const { error:clientError } = await supabaseClient
      .from("clients")
      .delete()
      .eq("id",id);

    if(clientError){

      console.error(
        "Error eliminando cliente:",
        clientError
      );

      toast("No se pudo eliminar el cliente");
      return;
    }

    data.clients =
      data.clients.filter(c => c.id !== id);

    if(data.weights) delete data.weights[id];
    if(data.checkins) delete data.checkins[id];
    if(data.messages) delete data.messages[id];
    if(data.routines) delete data.routines[id];
    if(data.diets) delete data.diets[id];
    if(data.workoutHistory) delete data.workoutHistory[id];
    if(data.completedTrainingDays){
      delete data.completedTrainingDays[id];
    }

    saveData();

    currentClientId = null;

    closeModal();

    showCoach("clients");

    toast("Cliente eliminado correctamente");

  }catch(e){

    console.error(
      "Error eliminando cliente:",
      e
    );

    toast("No se pudo eliminar el cliente");

  }

}
function getClientManagementStatus(id){

  const diet = data.diets?.[id];

  const trainingMeals =
    diet?.training?.meals || [];

  const restMeals =
    diet?.rest?.meals || [];

  const trainingFoods = trainingMeals.reduce(
    (total,meal) =>
      total + (meal.foods?.length || 0),
    0
  );

  const restFoods = restMeals.reduce(
    (total,meal) =>
      total + (meal.foods?.length || 0),
    0
  );

  let dietStatus = "Falta gestionar dieta";

  if(trainingFoods > 0 || restFoods > 0){

    const hasTrainingMeals =
      trainingMeals.length > 0 &&
      trainingMeals.every(
        meal => (meal.foods?.length || 0) > 0
      );

    const hasRestMeals =
      restMeals.length > 0 &&
      restMeals.every(
        meal => (meal.foods?.length || 0) > 0
      );

    if(hasTrainingMeals && hasRestMeals){

      dietStatus = "Dieta gestionada";

    }else{

      dietStatus = "Acabar de gestionar alimentación";

    }

  }


  const routine =
    data.routines?.[id] || [];

  let routineStatus =
    "Falta gestionar entrenamiento";

  if(routine.length > 0){

    const completeRoutine =
      routine.every(day =>
        Array.isArray(day.exercises) &&
        day.exercises.length > 0
      );

    routineStatus =
      completeRoutine
        ? "Entrenamiento gestionado"
        : "Acabar de gestionar entrenamiento";
  }


  return {
    diet:dietStatus,
    training:routineStatus
  };
}

                values.length===1
                ? 50
                : (index/(values.length-1))*100;

                92 -
                ((value-min)/range)*72;

          const min =

          const max =
            Math.max(...chartValues);

          const range =

          return chartValues
            .map((value,index)=>{

              const x =
                chartValues.length===1

function startWorkout(dayIndex){

  const routine = data.routines[currentClientId] || [];
  const day = routine[Number(dayIndex)];

  if(!day){
    toast("No se encontró el entrenamiento");
    return;
  }

  const exercises = day.exercises || [];

  if(!exercises.length){
    toast("Este entrenamiento no tiene ejercicios");
    return;
  }

  window.activeWorkout = {
    clientId:currentClientId,
    dayIndex:Number(dayIndex),
    dayName:day.muscle || "Entrenamiento",
    exercises:JSON.parse(JSON.stringify(exercises)),
    startedAt:Date.now(),
    currentExercise:0,
    sets:[],
    completedExercises:[]
  };

  renderWorkoutSession();
}

  const workout=window.activeWorkout;

  if(!workout)return;

if(!workout.completedExercises){
  workout.completedExercises=[];
}
  const main=document.getElementById("client-main");

  const exercise=workout.exercises[workout.currentExercise];

  if(!exercise){
    finishWorkout();

function startRestTimer(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!window.workoutAudioCtx){
      window.workoutAudioCtx = new AudioContext();
    }

    if(window.workoutAudioCtx.state === "suspended"){
      window.workoutAudioCtx.resume();
    }

  }catch(e){

    console.log("Audio no disponible:",e);

  }
  clearInterval(window.restTimerInterval);

  const workout = window.activeWorkout;

  if(!workout || !workout.restUntil) return;

  window.restTimerInterval = setInterval(()=>{

    if(!window.activeWorkout){
      clearInterval(window.restTimerInterval);
      return;
    }

    const remaining = Math.max(
      0,
      Math.ceil((workout.restUntil - Date.now()) / 1000)
    );

    const timer = document.getElementById("rest-timer");

    if(timer){

      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;

      timer.textContent =
        `${minutes}:${String(seconds).padStart(2,"0")}`;

    }

    
    if(remaining >= 1 && remaining <= 10){

  if(window.lastBeepSecond !== remaining){

    window.lastBeepSecond = remaining;

    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const audioCtx = window.workoutAudioCtx || new AudioContext();

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.frequency.value = 800;
      oscillator.type = "sine";

      gainNode.gain.value = 0.12;

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();

      oscillator.stop(audioCtx.currentTime + 0.12);

    }catch(e){
      console.log("No se pudo reproducir el sonido:",e);
    }

  }

}
    if(remaining <= 0){

      clearInterval(window.restTimerInterval);

      workout.restUntil = null;

      renderWorkoutSession();

      toast("Descanso terminado · Siguiente serie");
    }

  },250);
}


function skipRest(){

  const workout = window.activeWorkout;

  if(!workout) return;

  clearInterval(window.restTimerInterval);

  workout.restUntil = null;

  renderWorkoutSession();

  toast("Descanso terminado");
}


function saveWorkoutSet(){

  const workout = window.activeWorkout;

  if(!workout) return;

  /* No permitir guardar otra serie durante el descanso */

  if(workout.restUntil && workout.restUntil > Date.now()){

    toast("Espera a que termine el descanso");

    return;
  }

  const exercise =
    workout.exercises[workout.currentExercise];

  const plannedSets =
    parseInt(exercise?.sets) || 0;

  if(plannedSets && workout.sets.length >= plannedSets){

    toast("Ya has completado todas las series");

    return;
  }

  const kgInput =
    document.getElementById("workout-kg");

  const repsInput =
    document.getElementById("workout-reps");

  if(!kgInput || !repsInput) return;

  const kg =
    kgInput.value.trim();

  const reps =
    repsInput.value.trim();

  if(!kg || !reps){

    toast("Introduce peso y repeticiones");

    return;
  }

  const kgValue =
    parseFloat(kg.replace(",","."));

  const repsValue =
    parseInt(reps);

  if(
    !Number.isFinite(kgValue) ||
    !Number.isFinite(repsValue) ||
    kgValue < 0 ||
    repsValue <= 0
  ){

    toast("Introduce valores válidos");

    return;
  }

  workout.sets.push({
    kg:kgValue,
    reps:repsValue
  });

  /* Descanso obligatorio de 90 segundos */

  workout.restUntil =
    Date.now() + 90000;

  renderWorkoutSession();

  startRestTimer();

  toast("Serie guardada · Descanso 90 s");
}

function editWorkoutSet(index){

  const workout=window.activeWorkout;

  if(!workout || !workout.sets[index])return;

  const set=workout.sets[index];

  const kgText=prompt(
    `Peso de la serie ${index+1} (kg):`,
    String(set.kg)
  );

  if(kgText===null)return;

  const repsText=prompt(
    `Repeticiones de la serie ${index+1}:`,
    String(set.reps)
  );

  if(repsText===null)return;

  const kg=parseFloat(kgText.replace(",","."));
  const reps=parseInt(repsText);

  if(
    !Number.isFinite(kg) ||
    !Number.isFinite(reps) ||
    kg<0 ||
    reps<=0
  ){
    toast("Introduce valores válidos");
    return;
  }

  workout.sets[index]={
    kg:kg,
    reps:reps
  };

  renderWorkoutSession();

  toast(`Serie ${index+1} actualizada`);
}


function deleteWorkoutSet(index){

  const workout=window.activeWorkout;

  if(!workout || !workout.sets[index])return;

  const ok=confirm(
    `¿Eliminar la serie ${index+1}?`
  );

  if(!ok)return;

  workout.sets.splice(index,1);

  renderWorkoutSession();

  toast("Serie eliminada");
}
function nextWorkoutExercise(){

  const workout=window.activeWorkout;

  if(!workout)return;

  const exercise=
    workout.exercises[workout.currentExercise];

  if(!exercise){
    finishWorkout();
    return;
  }

  if(!workout.sets || !workout.sets.length){
    toast("Registra al menos una serie");
    return;
  }

  workout.completedExercises.push({

    name:exercise.name || "Ejercicio",

    plannedSets:exercise.sets || "",

    plannedReps:exercise.reps || "",

    sets:JSON.parse(JSON.stringify(workout.sets))

  });

  workout.currentExercise++;

  workout.sets=[];

  if(workout.currentExercise >= workout.exercises.length){

    finishWorkout();

    return;

  }

  renderWorkoutSession();
}


async function finishWorkout(){

  clearInterval(window.restTimerInterval);
  window.restTimerInterval=null;

  const workout=window.activeWorkout;
  if(!workout)return;
const totalDays =
  (data.routines[workout.clientId] || []).length;

  const lastExercise=
    workout.exercises[workout.currentExercise];

  if(lastExercise && workout.sets.length){

    workout.completedExercises.push({

      name:lastExercise.name || "Ejercicio",

      plannedSets:lastExercise.sets || "",

      plannedReps:lastExercise.reps || "",

      sets:JSON.parse(JSON.stringify(workout.sets))

    });

  }

  /* No guardar entrenamientos vacíos */
  if(!workout.completedExercises.length){

    toast("No hay ejercicios registrados");

    window.activeWorkout=null;

    showClient("training");

    return;

  }

  const duration=
    Math.max(
      1,
      Math.floor((Date.now()-workout.startedAt)/1000)
    );

  const workoutData={

    client_id:workout.clientId,

    workout_date:new Date().toISOString(),

    duration:duration,

    exercises:workout.completedExercises

  };

  /* Guardar definitivamente en Supabase */

  const {error}=await supabaseClient
    .from("workout_history")
    .insert(workoutData);

  if(error){

    console.error(
      "Error guardando entrenamiento en Supabase:",
      error
    );

    toast("No se pudo guardar el entrenamiento");

    return;

  }

  /* Mantener también copia local */

  if(!data.workoutHistory[workout.clientId]){
    data.workoutHistory[workout.clientId]=[];
  }

  data.workoutHistory[workout.clientId].push({

    date:workoutData.workout_date,

    duration:duration,

    dayName:workout.dayName,

    exercises:workout.completedExercises

  });

  saveData();

const completedAll =
  markTrainingDayCompleted(
    workout.clientId,
    workout.dayIndex,
    totalDays
  );

if(completedAll){
  toast("¡Rutina completada! Nuevo ciclo disponible.");
}
  window.activeWorkout=null;

  toast("Entrenamiento guardado ✓");

  showClient("profile");

}

);

){

}

const id="client_"+Date.now();

};

data.diets[id]={

    protein:"",
    meals:[]
  },
  rest:{
    calories:"",
    protein:"",
    meals:[]
  }
};

data.routines[id]=[];
data.messages[id]=[];

saveData();

closeModal();

/* Recargamos clientes desde Supabase.

await loadClientsFromSupabase();

showCoach("clients");

function addWeight(id){

    const c = client(id);

    if(!c){
        toast("No se encontró el cliente");
        return;
    }

    const text = prompt("Nuevo peso (kg):");

    if(text === null) return;

    const value = parseFloat(
        text.trim().replace(",", ".")
    );

    if(
        !Number.isFinite(value) ||
        value <= 0 ||
        value >= 500
    ){
        toast("Introduce un peso válido");
        return;
    }

    c.weight = value;

    if(!data.weights[id]){
        data.weights[id] = [];
    }

    data.weights[id].push(value);

    saveData();

    supabaseClient
        .from("client_weights")
        .insert({
            client_id:id,
            weight:value
        })
        .then(({error}) => {

            if(error){
                console.error(
                    "Error guardando peso en Supabase:",
                    error
                );

                toast(
                    "Peso guardado localmente, pero no se pudo sincronizar"
                );
            }

        });

    if(currentApp === "coach"){
        showClientAdmin(id);
    }

    toast("Peso actualizado");
}

async function addFood(id,type,mi){

  const diet=data.diets[id]?.[type];

  if(!diet || !diet.meals || !diet.meals[mi]){
    toast("No se encontró la comida");
    return;
  }

  const food=prompt("Alimento:");
  if(!food) return;

  const qty=prompt("Cantidad:");
  if(!qty) return;

  if(!diet.meals[mi].foods){
    diet.meals[mi].foods=[];
  }

  diet.meals[mi].foods.push([food,qty]);

  const { error } = await supabaseClient
    .from("client_diets")
    .upsert({
      client_id:id,
      diet_type:type,
      calories:diet.calories||"",
      protein:diet.protein||"",
      meals:diet.meals
    },{
      onConflict:"client_id,diet_type"
    });

  if(error){

    console.error("Error guardando dieta:",error);

    diet.meals[mi].foods.pop();

    toast("No se pudo guardar la dieta");

    return;
  }

  saveData();

  window.coachDietType=type;

  /*
    Guardamos la comida que acabamos de editar
    para poder continuar desde la siguiente.
  */
  window.nextDietMealIndex = mi + 1;

  showCoach("diets");

  /*
    Después de reconstruir la pantalla,
    bajamos automáticamente hasta la siguiente comida.
  */
  requestAnimationFrame(()=>{

    const nextMeal =
      document.querySelector(
        `[data-diet-meal="${window.nextDietMealIndex}"]`
      );

    if(nextMeal){

      nextMeal.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }

  });

  toast("Alimento guardado");
}

async function updateClientWeight(){

  const c = client(currentClientId);

  if(!c){
    toast("No se encontró el cliente");
    return;
  }

  const text = prompt("Introduce tu peso actual (kg):");

  if(text === null) return;

  const value = parseFloat(
    text.trim().replace(",", ".")
  );

  if(
    !Number.isFinite(value) ||
    value <= 0 ||
    value > 500
  ){
    toast("Introduce un peso válido");
    return;
  }

  /*
   * 1. Actualizar el peso del cliente
   *    en la aplicación
   */
  c.weight = value;

  /*
   * 2. Guardar el peso actual en Supabase
   */
  const { error: clientError } = await supabaseClient
    .from("clients")
    .update({
      weight: value
    })
    .eq("id", currentClientId);

  if(clientError){

    console.error(
      "Error actualizando peso del cliente:",
      clientError
    );

    toast("No se pudo guardar el peso");
    return;
  }

  /*
   * 3. Guardar histórico del peso
   */
  if(!data.weights){
    data.weights = {};
  }

  if(!data.weights[currentClientId]){
    data.weights[currentClientId] = [];
  }

  data.weights[currentClientId].push(value);

  const { error: weightError } = await supabaseClient
    .from("client_weights")
    .insert({
      client_id: currentClientId,
      weight: value
    });

  if(weightError){

    console.error(
      "Error guardando histórico del peso:",
      weightError
    );

    /*
     * El peso principal ya se ha guardado.
     * Solo avisamos del histórico.
     */
    toast("Peso actualizado, pero no se pudo guardar el histórico");

  }else{

    toast("Peso actualizado correctamente");
  }

  /*
   * 4. Actualizar también el check-in local
   */
  if(!data.checkins){
    data.checkins = {};
  }

  if(!data.checkins[currentClientId]){
    data.checkins[currentClientId] = {
      weight:"",
      bodyFat:"",
      diet:"",
      training:"",
      comment:"",
      reviewed:false
    };
  }

  data.checkins[currentClientId].weight =
    money(value) + " kg";

  data.checkins[currentClientId].reviewed = false;

  c.status = "Pendiente";

  /*
   * 5. Guardar los datos locales
   */
  saveData();

  /*
   * 6. Volver al check-in sin hacer scroll arriba
   */
  showClient("checkin");
}

            });

                (error.message || error.code || "Error desconocido")
            );

        showClient("checkin");

    }catch(error){

        console.error("ERROR GENERAL CHECK-IN:", error);

        toast(
            "No se pudo enviar el check-in: " +
            (error.message || "Error desconocido")
        );
    }
}
</script>
