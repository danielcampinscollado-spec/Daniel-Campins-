<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniel Campins</title>
<style>
*{
  box-sizing:border-box;
}

:root{
  --bg:#080a0e;
  --bg2:#0d1117;
  --panel:#11151c;
  --panel2:#151a22;
  --text:#f5f5f2;
  --muted:#9299a5;
  --line:rgba(255,255,255,.09);
  --gold:#d9aa4a;
  --gold-light:#f0c96b;
  --blue:#4d8dff;
  --red:#e05a5a;
  --green:#39b982;
  --white:#ffffff;
  --radius:22px;
  --shadow:0 25px 80px rgba(0,0,0,.35);
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

/* =========================
   PANTALLA DE ENTRADA
========================= */

.login{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 78% 8%,rgba(57,72,95,.48),transparent 35%),
    radial-gradient(circle at 12% 92%,rgba(217,170,74,.09),transparent 30%),
    linear-gradient(145deg,#18202b 0%,#090c11 52%,#040507 100%);
}

.login:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,transparent 0,rgba(0,0,0,.35) 75%),
    linear-gradient(120deg,rgba(255,255,255,.025),transparent 35%);
  pointer-events:none;
}

.login-box{
  width:min(720px,100%);
  position:relative;
  z-index:2;
  padding:46px 30px 30px;
  background:
    linear-gradient(145deg,
      rgba(25,29,37,.96),
      rgba(9,11,15,.94));
  border:1px solid rgba(255,255,255,.11);
  border-radius:32px;
  box-shadow:
    0 35px 100px rgba(0,0,0,.58),
    inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

.logo{
  margin:0;
  text-align:center;
  font-size:0;
  line-height:1;
}

.logo:before{
  content:"DC";
  display:block;
  color:var(--gold);
  font-size:78px;
  font-weight:300;
  letter-spacing:-10px;
  text-shadow:
    0 0 30px rgba(217,170,74,.20);
}

.login-box>.muted{
  margin:20px 0 42px;
  text-align:center;
  color:#aeb4bd;
  font-size:15px;
  letter-spacing:.3px;
}

.login-box:after{
  content:"";
  position:absolute;
  top:143px;
  left:50%;
  width:48px;
  height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border-radius:999px;
  box-shadow:0 0 14px rgba(217,170,74,.25);
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.choice{
  position:relative;
  min-height:190px;
  padding:29px 25px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.10);
  border-radius:23px;
  background:
    linear-gradient(145deg,
      rgba(255,255,255,.065),
      rgba(255,255,255,.018));
  color:#fff;
  text-align:left;
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.choice:before{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  right:-75px;
  top:-75px;
  border-radius:50%;
  background:rgba(217,170,74,.075);
}

.choice:after{
  content:"";
  position:absolute;
  left:-30px;
  bottom:-60px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.018);
}

.choice:hover{
  transform:translateY(-4px);
  border-color:rgba(217,170,74,.42);
  box-shadow:0 20px 50px rgba(0,0,0,.32);
}

.choice b{
  position:relative;
  z-index:2;
  display:block;
  margin-bottom:15px;
  font-size:20px;
  font-weight:700;
  letter-spacing:-.3px;
}

.choice span{
  position:relative;
  z-index:2;
  display:block;
  color:#9da5af;
  font-size:14px;
  line-height:1.65;
}

.choice.dark{
  background:
    linear-gradient(145deg,
      rgba(217,170,74,.15),
      rgba(255,255,255,.025));
  border-color:rgba(217,170,74,.45);
}

.choice.dark span{
  color:#b8bec7;
}

/* =========================
   APP
========================= */

.app{
  display:none;
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.035),transparent 28%),
    var(--bg);
}

/* =========================
   MENÚ LATERAL
========================= */

.side{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  padding:28px 14px;
  background:
    radial-gradient(circle at 85% 0%,rgba(217,170,74,.09),transparent 30%),
    linear-gradient(180deg,#11151b 0%,#080a0d 100%);
  color:#fff;
  border-right:1px solid rgba(255,255,255,.07);
  z-index:20;
}

.side h2{
  margin:0 10px 28px;
  padding:0 0 23px;
  border-bottom:1px solid rgba(255,255,255,.09);
  font-size:13px;
  font-weight:700;
  letter-spacing:4px;
  color:#f2f2ef;
}

.nav button{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  margin:4px 0;
  padding:13px 14px;
  border:1px solid transparent;
  border-radius:14px;
  background:transparent;
  color:#aeb5bf;
  text-align:left;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:rgba(217,170,74,.09);
  border-color:rgba(217,170,74,.08);
  color:var(--gold-light);
}

.out{
  position:absolute;
  left:14px;
  right:14px;
  bottom:20px;
  padding:11px;
  background:transparent;
  color:#858d98;
  border:1px solid rgba(255,255,255,.10);
  border-radius:12px;
  transition:.2s;
}

.out:hover{
  color:#fff;
  border-color:rgba(255,255,255,.18);
}

/* =========================
   CONTENIDO
========================= */

main{
  margin-left:250px;
  padding:38px;
  max-width:1500px;
}

.screen{
  display:none;
}

.screen.on{
  display:block;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:26px;
}

.top h1,
h1{
  margin:0;
  font-size:32px;
  font-weight:750;
  letter-spacing:-1.1px;
}

h2{
  letter-spacing:-.5px;
}

h3{
  margin-top:0;
}

/* =========================
   GRID
========================= */

.grid{
  display:grid;
  gap:18px;
}

.g2{
  grid-template-columns:1.4fr .8fr;
}

.g3{
  grid-template-columns:repeat(3,1fr);
}

/* =========================
   TARJETAS
========================= */

.card{
  position:relative;
  background:rgba(255,255,255,.97);
  color:#111318;
  border:1px solid rgba(0,0,0,.06);
  border-radius:22px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:
    0 10px 35px rgba(15,23,42,.06);
}

.card h2:first-child{
  margin-top:0;
}

/* =========================
   MÉTRICAS
========================= */

.metric b{
  display:block;
  margin:7px 0;
  font-size:29px;
  letter-spacing:-.9px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid #e5e7eb;
  border-radius:16px;
  overflow:hidden;
}

.metric{
  padding:17px;
  border-right:1px solid #e5e7eb;
}

.metric:last-child{
  border:0;
}

/* =========================
   ITEMS
========================= */

.item{
  padding:16px 0;
  border-bottom:1px solid #eceef1;
}

.item:last-child{
  border:0;
}

/* =========================
   BOTONES
========================= */

.btn{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#17130a;
  border:0;
  padding:11px 17px;
  border-radius:12px;
  font-weight:750;
  transition:.2s;
  box-shadow:0 5px 18px rgba(217,170,74,.12);
}

.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(217,170,74,.20);
}

.ghost{
  background:#fff;
  color:#111318;
  border:1px solid #dfe3e8;
  padding:10px 14px;
  border-radius:12px;
  transition:.2s;
}

.ghost:hover{
  background:#f7f8fa;
  border-color:#cbd1d8;
}

.danger{
  background:#fff2f2;
  color:var(--red);
  border:1px solid #f0cccc;
  padding:10px 14px;
  border-radius:12px;
}

/* =========================
   BADGES
========================= */

.pill{
  display:inline-flex;
  align-items:center;
  padding:7px 11px;
  border-radius:999px;
  background:#f5ead2;
  color:#956b18;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
}

/* =========================
   CLIENTES
========================= */

.client-row{
  padding:18px;
  margin:5px 0;
  border:1px solid transparent;
  border-radius:15px;
  cursor:pointer;
  transition:.2s;
}

.client-row:hover{
  background:#fafbfc;
  border-color:#e6e9ed;
}

/* =========================
   EJERCICIOS / ALIMENTOS
========================= */

.exercise,
.food{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:15px;
  margin:9px 0;
  background:#fafbfc;
  border:1px solid #e5e8ec;
  border-radius:14px;
}

.food-actions,
.exercise-actions{
  display:flex;
  gap:7px;
  align-items:center;
}

/* =========================
   FORMULARIOS
========================= */

textarea,
input,
select{
  width:100%;
  padding:12px 13px;
  border:1px solid #d9dee4;
  border-radius:12px;
  background:#fff;
  color:#111318;
  outline:none;
  transition:.2s;
}

textarea:focus,
input:focus,
select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(52,120,246,.10);
}

label{
  display:block;
  margin:13px 0 7px;
  font-weight:700;
}

/* =========================
   VACÍO
========================= */

.empty{
  padding:30px 20px;
  text-align:center;
  color:#7c858f;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  display:none;
  place-items:center;
  padding:20px;
  background:rgba(5,7,10,.62);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:50;
}

.modal-box{
  width:min(520px,100%);
  max-height:90vh;
  overflow:auto;
  padding:26px;
  background:#fff;
  color:#111318;
  border-radius:23px;
  box-shadow:0 30px 90px rgba(0,0,0,.35);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  display:none;
  padding:13px 17px;
  background:#10141a;
  color:#fff;
  border:1px solid rgba(255,255,255,.08);
  border-radius:13px;
  z-index:100;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

/* =========================
   MÓVIL
========================= */

@media(max-width:700px){

  body{
    background:var(--bg);
  }

  .login{
    padding:14px;
    align-items:center;
  }

  .login-box{
    width:100%;
    padding:40px 20px 21px;
    border-radius:28px;
  }

  .logo:before{
    font-size:66px;
  }

  .login-box>.muted{
    margin-top:18px;
    margin-bottom:34px;
    font-size:14px;
  }

  .login-box:after{
    top:130px;
  }

  .choices{
    grid-template-columns:1fr;
    gap:12px;
  }

  .choice{
    min-height:145px;
    padding:23px 20px;
    border-radius:20px;
  }

  .choice b{
    font-size:19px;
  }

  .choice span{
    font-size:14px;
    line-height:1.55;
  }

  .side{
  width:calc(100% - 20px);
  height:68px;
  top:auto;
  bottom:10px;
  left:10px;
  padding:6px;
  background:rgba(17,21,28,.94);
  border:1px solid rgba(255,255,255,.10);
  border-radius:22px;
  box-shadow:0 12px 35px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

  .side h2,
  .out{
    display:none;
  }

  .nav{
  display:flex;
  justify-content:space-around;
  align-items:center;
  height:100%;
  gap:4px;
}

.nav button{
  position:relative;
  width:auto;
  min-width:54px;
  height:54px;
  margin:0;
  padding:8px 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid transparent;
  border-radius:17px;
  background:transparent;
  color:#7f8792;
  text-align:center;
  font-size:21px;
  transition:
    color .2s ease,
    background .2s ease,
    transform .2s ease,
    border-color .2s ease;
}

.nav button:hover,
.nav button.active{
  color:#f0c96b;
  background:rgba(217,170,74,.09);
  border-color:rgba(217,170,74,.08);
}

.nav button.active{
  transform:translateY(-1px);
}

.nav button svg{
  width:23px;
  height:23px;
  flex:none;
  stroke:currentColor;
}

.nav button.active svg{
  filter:drop-shadow(0 0 7px rgba(217,170,74,.35));
}

.nav button:hover,
.nav button.active{
  color:#f0c96b;
  background:rgba(217,170,74,.09);
}

.nav button:active{
  transform:scale(.94);
}

  .nav button span{
    display:none;
  }

  main{
    margin:0 0 72px;
    padding:20px 15px;
  }

  .top{
    align-items:flex-start;
    margin-bottom:20px;
  }

  .top h1,
  h1{
    font-size:27px;
  }

  .g2,
  .g3{
    grid-template-columns:1fr;
  }

  .card{
    padding:19px;
    border-radius:18px;
    margin-bottom:14px;
  }

  .metrics{
    grid-template-columns:1fr;
  }

  .metric{
    border-right:0;
    border-bottom:1px solid #e7e9ec;
  }

  .metric:last-child{
    border-bottom:0;
  }

  .exercise,
  .food{
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .food-actions,
  .exercise-actions{
    width:100%;
  }

  .food-actions button,
  .exercise-actions button{
    flex:1;
  }

  .top .btn{
    white-space:nowrap;
  }
}
/* ===== DISEÑO FINAL PANTALLA DE INICIO ===== */

.login{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 50% 15%,rgba(218,170,70,.08),transparent 35%),
    #080a0e;
}

.login-box{
  width:100%;
  max-width:620px;
  padding:28px 24px 26px;
  background:rgba(14,17,23,.92);
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  text-align:center;
}

.brand-logo{
  width:150px;
  height:105px;
  margin:0 auto 4px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.brand-logo svg{
  width:150px;
  height:105px;
  display:block;
}

.brand-name{
  color:#f5f5f2;
  font-size:27px;
  font-weight:500;
  letter-spacing:4px;
  line-height:1.2;
  margin-top:2px;
}

.brand-subtitle{
  color:#d9aa4a;
  font-size:13px;
  font-weight:500;
  letter-spacing:3px;
  margin-top:9px;
}

.brand-line{
  width:70px;
  height:2px;
  background:#d9aa4a;
  margin:14px auto 20px;
}

.choices{
  display:flex;
  flex-direction:column;
  gap:12px;
  text-align:left;
}

.login .choices .choice{
  width:100%;
  min-height:0;
  height:auto;
  padding:24px 20px 22px;
  border-radius:22px;
  background:linear-gradient(
    145deg,
    rgba(31,35,43,.95),
    rgba(17,20,26,.95)
  );
  border:1px solid rgba(255,255,255,.16);
  color:#f5f5f2;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  text-align:center;
}

.login .choices .choice:hover{
  transform:translateY(-2px);
  border-color:rgba(217,170,74,.55);
}

.choice-admin{
  border-color:rgba(217,170,74,.7) !important;
}

.login .choices .choice-icon{
  width:64px;
  height:64px;
  min-height:64px;
  margin:0 auto 13px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(20,24,32,.95);
  box-shadow:0 0 28px rgba(218,170,74,.20);
}

.login .choices .choice-icon span{
  font-size:29px;
  color:#f5d27a;
}

.login .choices .choice b{
  display:block;
  font-size:24px;
  line-height:1.15;
  letter-spacing:.3px;
  margin:0;
  color:#f7f7f4;
}

.login .choices .choice-line{
  width:50px;
  height:2px;
  background:#d9aa4a;
  margin:13px auto 15px;
}

.login .choices .choice-icons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:17px;
  width:100%;
  margin-bottom:13px;
}

.login .choices .choice-icons span{
  font-size:21px;
  line-height:1;
}

.login .choices .choice-description{
  display:block;
  max-width:330px;
  color:rgba(255,255,255,.62);
  font-size:15px;
  line-height:1.4;
  text-align:center;
}

/* ===== MÓVIL ===== */

@media(max-width:600px){

  .login{
    min-height:100dvh;
    padding:0
  }

  .login-box{
    max-width:100%;
    padding:20px 10px 20px;
    border-radius:26px;
  }

  .brand-logo{
    width:120px;
    height:82px;
    margin:0 auto 0;
  }

  .brand-logo svg{
    width:120px;
    height:82px;
  }

  .brand-name{
    font-size:23px;
    letter-spacing:3px;
    margin-top:0;
  }

  .brand-subtitle{
    font-size:11px;
    letter-spacing:2.5px;
    margin-top:7px;
  }

  .brand-line{
    width:52px;
    margin:14px auto 20px;
  }

  .choices{
    gap:10px;
  }

  .login .choices .choice{
    min-height:205px;
    height:205px;
    padding:22px 14px 20px;
    border-radius:20px;
  }

  .login .choices .choice-icon{
    width:54px;
    height:54px;
    min-height:54px;
    margin-bottom:10px;
  }

  .login .choices .choice-icon span{
    font-size:25px;
  }

  .login .choices .choice b{
    font-size:22px;
  }

  .login .choices .choice-line{
    width:44px;
    margin:10px auto 12px;
  }

  .login .choices .choice-icons{
    gap:12px;
    margin-bottom:10px;
  }

  .login .choices .choice-icons span{
    font-size:18px;
  }

  .login .choices .choice-description{
    max-width:300px;
    font-size:13px;
    line-height:1.35;
  }
}
</style>
</head>

<body>

<div id="login" class="login">

  <div class="login-box">

    <div class="brand-logo">
  <svg viewBox="0 0 220 180"
     xmlns="http://www.w3.org/2000/svg"
     aria-label="Daniel Campins">

  <defs>
    <linearGradient id="goldLogo"
      x1="0%" y1="0%"
      x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d27a"/>
      <stop offset="50%" stop-color="#d9aa4a"/>
      <stop offset="100%" stop-color="#b98227"/>
    </linearGradient>
  </defs>

  <path
    d="M48 140
       V38
       H104
       C136 38 153 56 153 82
       C153 91 151 98 147 104"
    fill="none"
    stroke="url(#goldLogo)"
    stroke-width="17"
    stroke-linecap="square"
    stroke-linejoin="round"/>

  <path
    d="M187 91

function loadData(){
  try{
    const saved=localStorage.getItem(KEY);

    if(saved){
      const parsed=JSON.parse(saved);

      const result=JSON.parse(JSON.stringify(defaultData));

      if(parsed.clients) result.clients=parsed.clients;
      if(parsed.weights) result.weights=parsed.weights;
      if(parsed.workoutHistory) result.workoutHistory=parsed.workoutHistory;
      if(parsed.checkins) result.checkins=parsed.checkins;
      if(parsed.messages) result.messages=parsed.messages;
      if(parsed.routines) result.routines=parsed.routines;

      if(parsed.diets){
        result.diets=parsed.diets;
      }

      return result;
    }

  }catch(e){
    console.error("Error cargando datos:",e);
  }

  return JSON.parse(JSON.stringify(defaultData));
}
async function loadDietsFromSupabase(){

  try{

    const { data:diets,error } = await supabaseClient
      .from("client_diets")
      .select("client_id,diet_type,calories,protein,meals");

    if(error){
      console.error("Error cargando dietas:",error);
      return;
    }

    if(!diets) return;

    diets.forEach(row=>{

      if(!data.diets[row.client_id]){
        data.diets[row.client_id]={
          training:{
            calories:"",
            protein:"",
            meals:[]
          },
          rest:{
            calories:"",
            protein:"",
            meals:[]
          }
        };
      }

      data.diets[row.client_id][row.diet_type]={
        calories:row.calories||"",
        protein:row.protein||"",
        meals:Array.isArray(row.meals)?row.meals:[]
      };

    });

    saveData();

  }catch(e){

    console.error("Error conectando con Supabase para dietas:",e);
}
  }
async function loadWorkoutHistoryFromSupabase(){

  try{

    const { data:history, error } = await supabaseClient
      .from("workout_history")
      .select("client_id,workout_date,duration,exercises")
      .order("workout_date",{ascending:false});

    if(error){
      console.error("Error cargando historial de entrenamientos:",error);
      toast("No se pudo cargar el historial");
      return;
    }

    if(!history) return;

    data.workoutHistory={};

    history.forEach(row=>{

      if(!data.workoutHistory[row.client_id]){
        data.workoutHistory[row.client_id]=[];
      }

      data.workoutHistory[row.client_id].push({

        date:row.workout_date,

        duration:Number(row.duration)||0,

        exercises:Array.isArray(row.exercises)
          ? row.exercises
          : []

      });

    });

    saveData();

  }catch(e){

    console.error(
      "Error conectando con Supabase para historial:",
      e
    );

  }

}

function getCompletedTrainingDays(clientId){
  if(!data.completedTrainingDays){
    data.completedTrainingDays={};
  }

  if(!data.completedTrainingDays[clientId]){
    data.completedTrainingDays[clientId]=[];
  }

  return data.completedTrainingDays[clientId];
}

function isTrainingDayCompleted(clientId,dayIndex){
  return getCompletedTrainingDays(clientId)
    .includes(Number(dayIndex));
}

function markTrainingDayCompleted(clientId,dayIndex,totalDays){

  const completed=getCompletedTrainingDays(clientId);
  const index=Number(dayIndex);

  if(!completed.includes(index)){
    completed.push(index);
  }

  if(completed.length>=totalDays){
    data.completedTrainingDays[clientId]=[];
    saveData();
    return true;
  }

  saveData();
  return false;
}
async function saveRoutineToSupabase(id){
  try{
    const routine=data.routines[id]||[];

    const {error}=await supabaseClient
      .from("client_routines")
      .upsert({
        client_id:id,
        routine:routine,
        updated_at:new Date().toISOString()
      },{
        onConflict:"client_id"
      });

    if(error){
      console.error("Error guardando rutina en Supabase:",error);
      toast("No se pudo sincronizar la rutina");
      return false;
    }

    return true;

  }catch(e){
    console.error("Error sincronizando rutina:",e);
    toast("Error al sincronizar la rutina");
    return false;
  }
}
function esc(value){
return String(value??"").replace(/[&<>"']/g,function(c){
return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c];
});

}

function startRestTimer(){

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!window.workoutAudioCtx){
      window.workoutAudioCtx = new AudioContext();
    }

    if(window.workoutAudioCtx.state === "suspended"){
      window.workoutAudioCtx.resume();
    }

  }catch(e){

    console.log("Audio no disponible:",e);

  }
  clearInterval(window.restTimerInterval);

  const workout = window.activeWorkout;

  if(!workout || !workout.restUntil) return;

  window.restTimerInterval = setInterval(()=>{

    if(!window.activeWorkout){
      clearInterval(window.restTimerInterval);
      return;
    }

    const remaining = Math.max(
      0,
      Math.ceil((workout.restUntil - Date.now()) / 1000)
    );

    const timer = document.getElementById("rest-timer");

    if(timer){

      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;

      timer.textContent =
        `${minutes}:${String(seconds).padStart(2,"0")}`;

    }

    
    if(remaining >= 1 && remaining <= 10){

  if(window.lastBeepSecond !== remaining){

    window.lastBeepSecond = remaining;

    try{

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      const audioCtx = window.workoutAudioCtx || new AudioContext();

      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.frequency.value = 800;
      oscillator.type = "sine";

      gainNode.gain.value = 0.12;

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();

      oscillator.stop(audioCtx.currentTime + 0.12);

    }catch(e){
      console.log("No se pudo reproducir el sonido:",e);
    }

  }

}
    if(remaining <= 0){

      clearInterval(window.restTimerInterval);

      workout.restUntil = null;

      renderWorkoutSession();

      toast("Descanso terminado · Siguiente serie");
    }

  },250);
}


function skipRest(){

  const workout = window.activeWorkout;

  if(!workout) return;

  clearInterval(window.restTimerInterval);

  workout.restUntil = null;

  renderWorkoutSession();

  toast("Descanso terminado");
}


function saveWorkoutSet(){

  const workout = window.activeWorkout;

  if(!workout) return;

  /* No permitir guardar otra serie durante el descanso */

  if(workout.restUntil && workout.restUntil > Date.now()){

    toast("Espera a que termine el descanso");

    return;
  }

  const exercise =
    workout.exercises[workout.currentExercise];

  const plannedSets =
    parseInt(exercise?.sets) || 0;

  if(plannedSets && workout.sets.length >= plannedSets){

    toast("Ya has completado todas las series");

    return;
  }

  const kgInput =
    document.getElementById("workout-kg");

  const repsInput =
    document.getElementById("workout-reps");

  if(!kgInput || !repsInput) return;

  const kg =
    kgInput.value.trim();

  const reps =
    repsInput.value.trim();

  if(!kg || !reps){

    toast("Introduce peso y repeticiones");

    return;
  }

  const kgValue =
    parseFloat(kg.replace(",","."));

  const repsValue =
    parseInt(reps);

  if(
    !Number.isFinite(kgValue) ||
    !Number.isFinite(repsValue) ||
    kgValue < 0 ||
    repsValue <= 0
  ){

    toast("Introduce valores válidos");

    return;
  }

  workout.sets.push({
    kg:kgValue,
    reps:repsValue
  });

  /* Descanso obligatorio de 90 segundos */

  workout.restUntil =
    Date.now() + 90000;

  renderWorkoutSession();

  startRestTimer();

  toast("Serie guardada · Descanso 90 s");
}

function editWorkoutSet(index){

  const workout=window.activeWorkout;

  if(!workout || !workout.sets[index])return;

  const set=workout.sets[index];

  const kgText=prompt(
    `Peso de la serie ${index+1} (kg):`,
    String(set.kg)
  );

  if(kgText===null)return;

  const repsText=prompt(
    `Repeticiones de la serie ${index+1}:`,
    String(set.reps)
  );

  if(repsText===null)return;

  const kg=parseFloat(kgText.replace(",","."));
  const reps=parseInt(repsText);

  if(
    !Number.isFinite(kg) ||
    !Number.isFinite(reps) ||
    kg<0 ||
    reps<=0
  ){
    toast("Introduce valores válidos");
    return;
  }

  workout.sets[index]={
    kg:kg,
    reps:reps
  };

  renderWorkoutSession();

  toast(`Serie ${index+1} actualizada`);
}


function deleteWorkoutSet(index){

  const workout=window.activeWorkout;

  if(!workout || !workout.sets[index])return;

  const ok=confirm(
    `¿Eliminar la serie ${index+1}?`
  );

  if(!ok)return;

  workout.sets.splice(index,1);

  renderWorkoutSession();

  toast("Serie eliminada");
}
function nextWorkoutExercise(){

  const workout=window.activeWorkout;

  if(!workout)return;

  const exercise=
    workout.exercises[workout.currentExercise];

  if(!exercise){
    finishWorkout();
    return;
  }

  if(!workout.sets || !workout.sets.length){
    toast("Registra al menos una serie");
    return;
  }

  workout.completedExercises.push({

    name:exercise.name || "Ejercicio",

    plannedSets:exercise.sets || "",

    plannedReps:exercise.reps || "",

    sets:JSON.parse(JSON.stringify(workout.sets))

  });

  workout.currentExercise++;

  workout.sets=[];

  if(workout.currentExercise >= workout.exercises.length){

    finishWorkout();

    return;

  }

  renderWorkoutSession();
}

  /* Guardar definitivamente en Supabase */

  const {error}=await supabaseClient
    .from("workout_history")
    .insert(workoutData);

  if(error){

    console.error(
      "Error guardando entrenamiento en Supabase:",
      error
    );

    toast("No se pudo guardar el entrenamiento");

    return;

  }

  /* Mantener también copia local */

  if(!data.workoutHistory[workout.clientId]){
    data.workoutHistory[workout.clientId]=[];
  }

  data.workoutHistory[workout.clientId].push({

    date:workoutData.workout_date,

    duration:duration,

    dayName:workout.dayName,

    exercises:workout.completedExercises

  });

  saveData();

const completedAll =
  markTrainingDayCompleted(
    workout.clientId,
    workout.dayIndex,
    totalDays
  );

if(completedAll){
  toast("¡Rutina completada! Nuevo ciclo disponible.");
}
  window.activeWorkout=null;

  toast("Entrenamiento guardado ✓");

  showClient("profile");

}

window.restTimerInterval=null;

window.activeWorkout=null;

}

async function createClient(){
const name=document.getElementById("new-name").value.trim();
const weightText=document.getElementById("new-weight").value.trim();
const goal=document.getElementById("new-goal").value.trim();

if(!name||!weightText||!goal){
toast("Completa todos los campos");
return;
}

const weight=parseFloat(weightText.replace(",","."));
if(!Number.isFinite(weight)||weight<=0){
toast("Introduce un peso válido");
return;
}

const id="client_"+Date.now();

const { error } = await supabaseClient
  .from("clients")
  .insert({
    id,
    name,
    goal,
    weight,
    initial_weight:weight,
    plan:"",
    status:"Pendiente"
  });

if(error){
  console.error(error);
  toast("No se pudo guardar el cliente");
  return;
}

data.clients.push({
  id,
  name,
  goal,
  weight,
  initial:weight,
  plan:"",
  status:"Pendiente"
});
data.weights[id]=[weight];
data.checkins[id]={
  weight:money(weight)+" kg",
  diet:"Pendiente",
  training:"Pendiente",
  comment:"Pendiente de revisión.",
  reviewed:false
};
data.diets[id]={
  training:{
    calories:"",
    protein:"",
    meals:[]
  },
  rest:{
    calories:"",
    protein:"",
    meals:[]
  }
};
data.routines[id]=[];
data.messages[id]=[];

saveData();
closeModal();
showCoach("clients");
toast("Cliente creado correctamente");
}

function addWeight(id){
const c=client(id);
if(!c)return;

const text=prompt("Nuevo peso (kg):","0");
if(text===null)return;

const value=parseFloat(text.replace(",","."));
if(!Number.isFinite(value)||value<=0){
toast("Introduce un peso válido");
return;
}

c.weight=value;
if(!data.weights[id])data.weights[id]=[c.initial];
data.weights[id].push(value);
supabaseClient
  .from("client_weights")
  .insert({
    client_id:id,
    weight:value
  })
  .then(({error})=>{
    if(error){
      console.error("Error guardando peso en Supabase:",error);
      toast("Peso guardado localmente, pero no en Supabase");
    }
  });
saveData();

if(currentApp==="coach")showClientAdmin(id);
toast("Peso actualizado");
}

function editDietMarcos(id,type){
if(!data.diets[id])data.diets[id]={};
if(!data.diets[id][type]){
data.diets[id][type]={
calories:"",
protein:"",
meals:[]
};
}

const diet=data.diets[id][type];

const calories=prompt("Calorías:",diet.calories||"");
if(calories===null)return;

const protein=prompt("Proteína:",diet.protein||"");
if(protein===null)return;

diet.calories=calories;

function addMeal(id,type){
const name=prompt("Nombre de la comida:");
if(!name)return;

if(!data.diets[id])data.diets[id]={};
if(!data.diets[id][type])data.diets[id][type]={calories:"",protein:"",meals:[]};
if(!data.diets[id][type].meals)data.diets[id][type].meals=[];

name:name,
foods:[]
});

saveData();
window.coachDietType=type;
showCoach("diets");
}


async function addFood(id,type,mi){

  const diet=data.diets[id]?.[type];

  if(!diet||!diet.meals||!diet.meals[mi]){
    toast("No se encontró la comida");
    return;
  }

  const food=prompt("Alimento:");
  if(!food)return;

  const qty=prompt("Cantidad:");
  if(!qty)return;

  if(!diet.meals[mi].foods){
    diet.meals[mi].foods=[];
  }

  diet.meals[mi].foods.push([food,qty]);

  const { error } = await supabaseClient
    .from("client_diets")
    .upsert({
      client_id:id,
      diet_type:type,
      calories:diet.calories||"",
      protein:diet.protein||"",
      meals:diet.meals
    },{
      onConflict:"client_id,diet_type"
    });

  if(error){
    console.error("Error guardando dieta:",error);
    diet.meals[mi].foods.pop();
    toast("No se pudo guardar la dieta");
    return;
  }

  const previousScroll=window.scrollY;

saveData();

window.coachDietType=type;

showCoach("diets");

requestAnimationFrame(()=>{
  window.scrollTo(0,previousScroll);
});

toast("Alimento guardado");
}

async function removeFood(id,type,mi,fi){

  const diet=data.diets[id]?.[type];

  if(!diet||!diet.meals||!diet.meals[mi]){
    return;
  }

  diet.meals[mi].foods.splice(fi,1);

  const { error } = await supabaseClient
    .from("client_diets")
    .upsert({
      client_id:id,
      diet_type:type,
      calories:diet.calories||"",
      protein:diet.protein||"",
      meals:diet.meals
    },{
      onConflict:"client_id,diet_type"
    });

  if(error){

    console.error("Error eliminando alimento:",error);

    toast("No se pudo guardar el cambio");

    return;
  }

  saveData();

  window.coachDietType=type;

  showCoach("diets");

  toast("Alimento eliminado");
}


async function addTrainingDay(id){
  if(!data.routines[id]){
    data.routines[id]=[];
  }

  const muscle=prompt("Grupo muscular de este día:");
  if(!muscle)return;

  data.routines[id].push({
    day:data.routines[id].length+1,
    muscle:muscle,
    exercises:[]
  });

  saveData();

  const ok=await saveRoutineToSupabase(id);

  if(ok){
    toast("Día de entrenamiento guardado");
  }

  showCoach("routines");
}

async function addExercise(id,dayIndex){

  const day=data.routines[id]?.[dayIndex];

  if(!day){
    toast("No se encontró el día");
    return;
  }

  const name=prompt("Nombre del ejercicio:");
  if(!name) return;

  const sets=prompt("Series:");
  if(!sets) return;

  const reps=prompt("Repeticiones:");
  if(!reps) return;
const video=prompt(
  "Enlace al vídeo del ejercicio (opcional):"
);

  day.exercises.push({
  name:name,
  sets:sets,
  reps:reps,
  videoUrl:video.trim()
});
  /* Guardado local */
  saveData();

  /* Guardado en Supabase */
  const { error } = await supabaseClient
    .from("client_routines")
    .upsert({
      client_id:id,
      routine:data.routines[id]
    });

  if(error){
    console.error("Error guardando rutina en Supabase:",error);
    toast("Guardado local, pero no en Supabase");
    return;
  }

  showCoach("routines");
  toast("Ejercicio guardado");
}
async function removeExercise(id,dayIndex,exerciseIndex){

  const day=data.routines[id]?.[dayIndex];

  if(!day) return;

  day.exercises.splice(exerciseIndex,1);

  saveData();

  const ok=await saveRoutineToSupabase(id);

  if(ok){
    toast("Ejercicio eliminado");
  }

  showCoach("routines");
}

async function removeTrainingDay(id,dayIndex){

  if(!data.routines[id]) return;

  data.routines[id].splice(dayIndex,1);

  data.routines[id].forEach((day,i)=>{
    day.day=i+1;
  });

  saveData();

  const ok=await saveRoutineToSupabase(id);

  if(ok){
    toast("Día de entrenamiento eliminado");
  }

  showCoach("routines");
}

function reviewCheckin(id){
const c=client(id);
const x=data.checkins[id]||{
weight:money(c.weight)+" kg",
diet:"Pendiente",
training:"Pendiente",
comment:"Pendiente",
reviewed:false
};

openModal(`
<div class="modal-head"><h2>Check-in · ${esc(c.name)}</h2><button class="ghost" onclick="closeModal()">✕</button></div>
<div class="item"><b>Peso</b><br>${esc(x.weight)}</div>
<div class="item"><b>Alimentación</b><br>${esc(x.diet)}</div>
<div class="item"><b>Entrenamiento</b><br>${esc(x.training)}</div>
<div class="item"><b>Comentario</b><br>${esc(x.comment)}</div>
<button class="btn" onclick="markReviewed('${id}')">✓ Marcar como revisado</button>
`);
}

function markReviewed(id){
data.checkins[id].reviewed=true;
client(id).status="Revisado";
saveData();
openMessages(id);
showCoach("checkins");
toast("Check-in marcado como revisado");
}

function openMessages(id){
const c=client(id);
const msgs=data.messages[id]||[];

openModal(`
<div class="modal-head"><h2>${esc(c.name)}</h2><button class="ghost" onclick="closeModal()">✕</button></div>
<div id="conversation">
${msgs.length?msgs.map(m=>`<div class="item"><b>${esc(m[0])}</b><p>${esc(m[1])}</p></div>`).join(""):"<div class='empty'>Sin mensajes.</div>"}
</div>
<textarea id="coach-message" placeholder="Escribe un mensaje..."></textarea>
<button class="btn" style="margin-top:10px" onclick="sendCoachMessage('${id}')">Enviar</button>
`);
}

function sendCoachMessage(id){
const box=document.getElementById("coach-message");
const text=box.value.trim();
if(!text)return;

if(!data.messages[id])data.messages[id]=[];
data.messages[id].push(["Daniel",text]);
saveData();
closeModal();
toast("Mensaje enviado");
}

function openModal(html){
document.getElementById("modal-content").innerHTML=html;
document.getElementById("modal").style.display="grid";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

document.getElementById("modal").addEventListener("click",function(e){
if(e.target===this)closeModal();
});
</script>
