name: Client tabs and plan fix v43
on:
  push:
    branches: [google-auth-rc]
    paths:
      - '.github/workflows/client-tabs-plan-fix-v43.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: google-auth-rc
      - name: Apply patch
        run: python3 .github/scripts/client_tabs_plan_fix_v43.py
      - name: Validate JavaScript
        run: node --check client-admin-premium.js
      - name: Commit app change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-admin-premium.js
          git diff --cached --quiet && exit 0
          git commit -m "[ui] Restore intuitive client plans and tabs"
          git push
