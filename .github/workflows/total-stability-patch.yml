name: DCC total stability patch
on:
  push:
    branches: [google-auth-rc]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[stability-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: google-auth-rc
      - name: Remove render loops and unify route state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if required: raise SystemExit(f'pattern not found: {path}: {old[:80]}')
                  return
              p.write_text(s.replace(old,new))

          patch('index.html','let currentApp="";\nlet currentScreen="";\nlet currentClientId="carlos";','var currentApp="";\nvar currentScreen="";\nvar currentClientId="carlos";')

          patch('dcc-theme-system-v1.js',"const observer=new MutationObserver(()=>{ensureUi();updateVisibility()});observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});","window.addEventListener('pageshow',()=>{ensureUi();updateVisibility()});window.addEventListener('load',()=>{ensureUi();updateVisibility()},{once:true});document.addEventListener('click',()=>setTimeout(updateVisibility,0),true);")

          patch('coach-theme-premium-global.js',"document.getElementById(POLISH_ID)?.remove();\n    const style=document.createElement('style');","if(document.getElementById(POLISH_ID))return;\n    const style=document.createElement('style');")
          patch('coach-theme-premium-global.js',"loadStableTheme();\n  watchNewClientModal();\n  watchCoachMain();\n  document.addEventListener('DOMContentLoaded',()=>{loadStableTheme();installPolish();watchNewClientModal();watchCoachMain()},{once:true});\n  window.addEventListener('pageshow',()=>{loadStableTheme();installPolish();watchNewClientModal();watchCoachMain()});","loadStableTheme();\n  installPolish();\n  document.addEventListener('DOMContentLoaded',()=>{loadStableTheme();installPolish()},{once:true});\n  window.addEventListener('pageshow',()=>{loadStableTheme();installPolish()});")

          patch('coach-light-stable-v1.js',"document.documentElement.classList.add('dcc-theme-light-premium');\n    document.body?.classList.toggle('dcc-coach-mode',coachVisible());","document.body?.classList.toggle('dcc-coach-mode',coachVisible());")
          patch('coach-light-stable-v1.js',"document.getElementById(ID)?.remove();\n    const s=document.createElement('style');","if(document.getElementById(ID))return;\n    const s=document.createElement('style');")
          patch('coach-light-stable-v1.js',"\n  const observer=new MutationObserver(syncMode);\n  document.addEventListener('DOMContentLoaded',()=>{\n    const coach=document.getElementById('coach');\n    if(coach)observer.observe(coach,{attributes:true,attributeFilter:['style','class']});\n  },{once:true});","")

          patch('checkin-premium.js',"document.getElementById('dcc-checkin-premium-css')?.remove();\n    const s=document.createElement('style');","if(document.getElementById('dcc-checkin-premium-css'))return;\n    const s=document.createElement('style');")
          patch('client-admin-premium.js',"document.getElementById('dcc-client-admin-css')?.remove();", "if(document.getElementById('dcc-client-admin-css'))return;", required=False)

          patch('coach-premium-core-v9.js',"const t=(main.textContent||'').toUpperCase();\n    const isDashboard=window.currentScreen==='dashboard'||t.includes('PANEL DE ENTRENADOR')||t.includes('CADA CLIENTE ES UN PROCESO')||t.includes('BUENOS DÍAS')||t.includes('BUENAS TARDES')||t.includes('BUENAS NOCHES');\n    if(isDashboard)window.showCoach('dashboard');","const isDashboard=window.__dccCoachRouteIntent==='dashboard'&&window.currentScreen==='dashboard';\n    if(isDashboard)window.showCoach('dashboard');")

          patch('coach-premium-v8.js',"if(wasInstant&&typeof window.showCoach==='function'){\n      try{delete m.dataset.dccInstant;window.showCoach('dashboard')}catch(e){}\n    }","if(wasInstant&&window.__dccCoachRouteIntent==='dashboard'&&typeof window.showCoach==='function'){\n      try{delete m.dataset.dccInstant;window.showCoach('dashboard')}catch(e){}\n    }else if(wasInstant){try{delete m.dataset.dccInstant}catch(e){}}")
          PY
      - name: Commit stability patch
        run: |
          git config user.name "dcc-stability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html dcc-theme-system-v1.js coach-theme-premium-global.js coach-light-stable-v1.js checkin-premium.js client-admin-premium.js coach-premium-core-v9.js coach-premium-v8.js
          git diff --cached --quiet && exit 0
          git commit -m "[stability-bot] Remove global repaint loops and unify route state"
          git push origin HEAD:google-auth-rc
