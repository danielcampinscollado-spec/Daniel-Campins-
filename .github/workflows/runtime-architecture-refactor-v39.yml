name: runtime-architecture-refactor-v39
on:
  push:
    branches: [google-auth-rc]
    paths: ['.github/workflows/runtime-architecture-refactor-v39.yml']
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Refactor competing runtime authorities
        run: python .github/scripts/runtime_architecture_refactor_v39.py
      - name: Commit refactor
        run: |
          git config user.name dcc-runtime-refactor
          git config user.email actions@users.noreply.github.com
          git add entrenamientos/runtime-compat.js ejercicio-biblioteca.js checkin-coach-sync-v2.js checkin-premium.js messages-premium.js coach-premium-core-v9.js coach-client-plan-status-v1.js coach-premium-v8.js
          git commit -m '[runtime] Remove competing navigation authorities'
          git push
