name: Polish premium coach dashboard
on:
  push:
    paths:
      - '.github/workflows/one-shot-polish-premium-dashboard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch premium dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('coach-premium.js')
          s=p.read_text()

          s=s.replace(
            '.dcc-pd-copy span{display:block;margin-top:4px;color:#858c96;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}',
            '.dcc-pd-copy span{display:block;margin-top:4px;color:#858c96;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\\n      .dcc-pd-attention .dcc-pd-copy span{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35;padding-right:4px;}\\n      .dcc-pd-section.dcc-empty{padding-top:17px;padding-bottom:17px;}\\n      .dcc-pd-section.dcc-empty .dcc-pd-section-head{margin-bottom:2px;}\\n      .dcc-pd-section.dcc-empty .dcc-pd-empty{padding:10px 0 0;}'
          )

          s=s.replace(
            '<section class="dcc-pd-section">\\n        <div class="dcc-pd-section-head"><div><div class="dcc-pd-section-kicker">TAREAS PENDIENTES</div>',
            '<section class="dcc-pd-section ${tasks.length?"":"dcc-empty"}">\\n        <div class="dcc-pd-section-head"><div><div class="dcc-pd-section-kicker">TAREAS PENDIENTES</div>'
          )

          old='''  function installNav(){\n    const nav=document.getElementById("coach-nav"); if(!nav) return;\n    nav.innerHTML=`\n      <button onclick="showCoach('dashboard')">${svg("panel")}<span>Panel</span></button>\n      <button onclick="showCoach('clients')">${svg("clients")}<span>Clientes</span></button>\n      <button onclick="showCoach('checkins')">${svg("check")}<span>Check-in</span></button>\n      <button onclick="showCoach('messages')">${svg("msg")}<span>Mensajes</span></button>`;\n    nav.style.gridTemplateColumns="repeat(4,minmax(0,1fr))";\n  }'''
          new='''  function installNav(){\n    const nav=document.getElementById("coach-nav"); if(!nav) return;\n    const expected=["Panel","Clientes","Check-in","Mensajes"];\n    const current=[...nav.querySelectorAll("button span")].map(x=>x.textContent.trim());\n    if(current.length!==4 || expected.some((x,i)=>current[i]!==x)){\n      nav.innerHTML=`\n        <button onclick="showCoach('dashboard')">${svg("panel")}<span>Panel</span></button>\n        <button onclick="showCoach('clients')">${svg("clients")}<span>Clientes</span></button>\n        <button onclick="showCoach('checkins')">${svg("check")}<span>Check-in</span></button>\n        <button onclick="showCoach('messages')">${svg("msg")}<span>Mensajes</span></button>`;\n    }\n    nav.style.setProperty("grid-template-columns","repeat(4,minmax(0,1fr))","important");\n  }\n\n  function guardCoachNav(){\n    const nav=document.getElementById("coach-nav"); if(!nav||nav.__dccGuard) return;\n    nav.__dccGuard=true;\n    new MutationObserver(()=>installNav()).observe(nav,{childList:true,subtree:true});\n    if(typeof window.buildCoachNav==="function"&&!window.buildCoachNav.__dccPremium){\n      const originalBuild=window.buildCoachNav;\n      const wrappedBuild=function(){ const r=originalBuild.apply(this,arguments); installNav(); return r; };\n      wrappedBuild.__dccPremium=true;\n      window.buildCoachNav=wrappedBuild;\n    }\n  }'''
          if old not in s:
            raise SystemExit('installNav block not found')
          s=s.replace(old,new)

          s=s.replace(
            '    injectStyles();\n    installNav();\n    const original=window.showCoach;',
            '    injectStyles();\n    installNav();\n    guardCoachNav();\n    const original=window.showCoach;'
          )

          s=s.replace(
            '        .dcc-pd-section{padding:17px 16px;border-radius:20px}.dcc-pd-row{gap:10px}.dcc-pd-icon{width:38px;height:38px;flex-basis:38px}.dcc-pd-copy b{font-size:12.5px}.dcc-pd-copy span{font-size:10.5px}',
            '        .dcc-pd-section{padding:17px 16px;border-radius:20px}.dcc-pd-row{gap:10px}.dcc-pd-icon{width:38px;height:38px;flex-basis:38px}.dcc-pd-copy b{font-size:12.5px}.dcc-pd-copy span{font-size:10.5px}.dcc-pd-attention .dcc-pd-row{align-items:flex-start}.dcc-pd-attention .dcc-pd-badge{margin-top:2px;padding:6px 7px;font-size:8px}.dcc-pd-attention .dcc-pd-arrow{margin-top:5px}'
          )

          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-premium.js
          git commit -m "Polish premium coach dashboard" || true
          git rm .github/workflows/one-shot-polish-premium-dashboard.yml
          git commit -m "Remove one-shot dashboard polish workflow"
          git push