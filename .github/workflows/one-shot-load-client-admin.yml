name: Rebuild client home to premium reference
on:
  push:
    paths:
      - '.github/workflows/one-shot-load-client-admin.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch client home
        run: python3 patch-client-home.py
      - name: Commit client home
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Rebuild client home to premium reference layout"
          git push
