name: Client list reference finish
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/client-list-reference-finish.yml'
jobs:
  finish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: google-auth-rc
      - run: python3 .github/scripts/client_list_reference_finish.py
      - run: node --check coach-premium-core-v9.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-premium-core-v9.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[ui] Finish compact active-client cards"
          git push origin google-auth-rc
