name: deep-runtime-cleanup-20260916
on:
  push:
    branches: [audit-saneamiento-2026-09-16-1133]
    paths: ['.github/workflows/deep-runtime-cleanup-20260916.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-saneamiento-2026-09-16-1133
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deep runtime cleanup
        run: python .github/scripts/deep_runtime_cleanup_20260916.py
      - name: Commit cleaned architecture
        run: |
          git config user.name dcc-deep-audit
          git config user.email actions@users.noreply.github.com
          git add index.html ejercicio-biblioteca.js coach-premium-core-v9.js coach-light-stable-v1.js coach-theme-premium-global.js
          git commit -m '[audit] Consolidate runtime authorities and remove competing renderers'
          git push origin HEAD:audit-saneamiento-2026-09-16-1133
