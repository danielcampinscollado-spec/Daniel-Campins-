name: One-shot index coach nav cleanup
on:
  push:
    paths:
      - '.github/workflows/one-shot-clean-index-nav-cache.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy inline coach nav CSS and bump runtime URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          before=s
          s=s.replace('./coach-premium-v8.js?v=20260916-audit1','./coach-premium-v8.js?v=20260916-audit2')
          s=s.replace('./coach-client-plan-status-v1.js?v=20260916-audit3','./coach-client-plan-status-v1.js?v=20260916-audit4')
          # El core es ahora la única autoridad visual del nav del entrenador.
          s,n=re.subn(r'(?s)([^{}]*#coach-nav[^{}]*)\{[^{}]*\}', '', s)
          if s==before:
              raise SystemExit('index.html no cambió')
          print('Reglas legacy de #coach-nav eliminadas:',n)
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'dcc-source-cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove legacy inline coach nav rules and refresh runtime URLs'
          git push origin HEAD:main