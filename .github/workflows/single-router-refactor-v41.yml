name: DCC final single-router refactor v41
on:
  push:
    branches: [google-auth-rc]
    paths:
      - '.github/workflows/single-router-refactor-v41.yml'
      - '.github/scripts/single_router_refactor_v41.py'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor navigation ownership
        run: python3 .github/scripts/single_router_refactor_v41.py
      - name: Validate complete JavaScript tree and router invariants
        shell: bash
        run: |
          set -e
          while IFS= read -r f; do node --check "$f"; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print | sort)
          node --check .github/scripts/rc_browser_smoke.mjs
          test "$(grep -RIl --include='*.js' 'window.showCoach=' . --exclude-dir=node_modules --exclude='coach-premium-core-v9.js' | wc -l)" -eq 0
          ! grep -q 'installShowCoachWrapper' client-server-source-v1.js
          ! grep -q 'wrapShowCoach' coach-calendar-sync-v14.js
          grep -q '__dccSingleRouterV40' coach-premium-core-v9.js
          grep -q "event.detail?.screen==='calendar'" coach-calendar-sync-v14.js
          grep -q 'dcc:coach-before-screen' messages-realtime-chat-guard-v1.js
          echo 'Single-router validation OK'
      - name: Commit refactor
        run: |
          git config user.name dcc-runtime-refactor
          git config user.email actions@users.noreply.github.com
          git add coach-premium-core-v9.js coach-ui-v11.js coach-calendar-v12.js coach-calendar-sync-v14.js messages-realtime-chat-guard-v1.js client-server-source-v1.js auth-premium-v1.js
          git commit -m '[runtime] Enforce one coach navigation authority'
          git push
