name: Fix previous routine compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-previous-routine-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply previous routine compatibility fix
        run: python .github/scripts/fix-previous-routine-compat.py

      - name: Validate previous routine compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'const previousStored=data.previousRoutines?.[id];' in s
          assert 'Array.isArray(previousStored?.routine)' in s
          print('Previous routine compatibility validated')
          PY

      - name: Commit fix and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/fix-previous-routine-compat.py
          rm -f .github/workflows/fix-previous-routine-compat.yml
          git add index.html .github/scripts/fix-previous-routine-compat.py .github/workflows/fix-previous-routine-compat.yml
          git diff --cached --quiet && exit 0
          git commit -m "Support legacy previous routine format"
          git push origin main
