name: DCC client hub restructure v1
on:
  push:
    paths:
      - '.github/workflows/client-hub-restructure-v1.yml'
permissions:
  contents: write
jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: google-auth-rc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply client hub restructure
        run: python .github/scripts/client_hub_restructure_v1.py
      - name: JavaScript syntax check
        run: |
          node --check coach-premium-core-v9.js
          node --check client-admin-premium.js
          node --check client-edit-visibility-v1.js
          node --check messages-premium.js
          node --check checkin-premium.js
      - name: Commit changes
        run: |
          git config user.name 'dcc-client-hub'
          git config user.email 'actions@users.noreply.github.com'
          git add coach-premium-core-v9.js client-admin-premium.js client-edit-visibility-v1.js messages-premium.js checkin-premium.js
          git commit -m '[client] Consolidate check-in and messages into client hub'
          git push origin HEAD:google-auth-rc
