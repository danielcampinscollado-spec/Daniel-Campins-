name: Add message realtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-message-realtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply realtime messaging patch
        run: python .github/scripts/add-message-realtime.py

      - name: Validate realtime messaging
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function setupMessageRealtime(){',
            '.channel("client-messages-sync")',
            'table:"client_messages"',
            'setupMessageRealtime();',
            'window.openCoachMessageClientId=id;',
            'window.openCoachMessageClientId=null;'
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          print('Realtime messaging validated')
          PY

      - name: Commit fix and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/add-message-realtime.py
          rm -f .github/workflows/add-message-realtime.yml
          git add index.html .github/scripts/add-message-realtime.py .github/workflows/add-message-realtime.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add realtime client coach messaging"
          git push origin main
