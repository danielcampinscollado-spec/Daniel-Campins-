name: Fix coach nav five tabs
on:
  push:
    branches: [google-auth-rc]
    paths:
      - '.github/workflows/fix-coach-nav-5.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: google-auth-rc
      - name: Restore five coach tabs
        run: python3 .github/scripts/fix_coach_nav_5.py
      - name: Validate JavaScript
        run: node --check coach-premium-core-v9.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-premium-core-v9.js
          git diff --cached --quiet || git commit -m "[ui] Restore five coach navigation tabs"
          git push origin HEAD:google-auth-rc
