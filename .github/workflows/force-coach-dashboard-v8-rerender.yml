name: Force coach dashboard v8 rerender
on:
  push:
    paths:
      - '.github/workflows/force-coach-dashboard-v8-rerender.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force already visible coach dashboard to rerender
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          source = Path('coach-premium-v7.js')
          target = Path('coach-premium-v8.js')
          html = index.read_text()
          js = source.read_text()

          boot = [
              '(function(){',
              '  function repaintCurrentDashboard(){',
              '    const main=document.getElementById("coach-main");',
              '    if(!main || typeof window.showCoach!=="function") return;',
              '    const t=(main.textContent||"").toUpperCase();',
              '    const isDashboard=window.currentScreen==="dashboard" || t.includes("RESUMEN GENERAL") || t.includes("CADA CLIENTE ES UN PROCESO") || t.includes("BUENOS DÍAS") || t.includes("BUENAS TARDES") || t.includes("BUENAS NOCHES");',
              '    if(isDashboard) window.showCoach("dashboard");',
              '  }',
              '  setTimeout(repaintCurrentDashboard,80);',
              '  window.addEventListener("pageshow",()=>setTimeout(repaintCurrentDashboard,30));',
              '})();'
          ]
          target.write_text(js.replace('DCC definitive dashboard loader v7','DCC definitive dashboard loader v8',1) + '\n' + '\n'.join(boot) + '\n')

          html = re.sub(r'\s*<script\s+src=["\']\./coach-premium-v7\.js[^"\']*["\']\s*></script>\s*', '\n', html, flags=re.I)
          html = re.sub(r'\s*<script\s+src=["\']\./coach-premium-v8\.js[^"\']*["\']\s*></script>\s*', '\n', html, flags=re.I)
          tag = '<script src="./coach-premium-v8.js?v=20260910-1654"></script>'
          if '</body>' not in html:
              raise SystemExit('No body closing tag')
          html = html.replace('</body>', tag + '\n</body>', 1)
          index.write_text(html)
          PY
      - name: Commit immediate dashboard rerender
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html coach-premium-v8.js
          git diff --cached --quiet || git commit -m 'Rerender coach dashboard after premium override loads'
          git pull --rebase origin main
          git push
