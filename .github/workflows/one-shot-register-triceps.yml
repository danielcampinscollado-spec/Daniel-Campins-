name: Register triceps illustrations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-register-triceps.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Register triceps image ids
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          ids = [
            'extension-triceps-cuerda',
            'extension-triceps-barra',
            'extension-triceps-unilateral',
            'extension-triceps-sobre-cabeza',
            'fondos-maquina-asistida',
            'press-triceps-maquina',
            'press-cerrado-barra',
            'extension-triceps-tumbado-ez',
            'fondos-maquina',
            'extension-triceps-maquina',
            'extension-triceps-polea-agarre-inverso',
            'extension-triceps-sobre-cabeza-unilateral'
          ]

          runtime = Path('entrenamientos/runtime-compat.js')
          text = runtime.read_text(encoding='utf-8')
          marker = 'const DCC_PREMIUM_IMAGES=new Set(['
          start = text.index(marker) + len(marker)
          end = text.index(']);', start)
          block = text[start:end]
          existing = set(re.findall(r'"([^"]+)"', block))
          additions = [x for x in ids if x not in existing]
          if additions:
              trimmed = block.rstrip()
              if trimmed and not trimmed.endswith(','):
                  trimmed += ','
              if trimmed:
                  trimmed += '\n'
              trimmed += '\n'.join(f'  "{x}",' for x in additions)
              trimmed = trimmed.rstrip(',')
              runtime.write_text(text[:start] + trimmed + '\n' + text[end:], encoding='utf-8')

          catalog = Path('entrenamientos/ilustraciones/catalogo.json')
          try:
              payload = json.loads(catalog.read_text(encoding='utf-8'))
          except Exception:
              payload = {'version': 2}
          payload['estilo_actual'] = 'premium oscuro negro/dorado con músculo principal resaltado'
          payload['estado'] = 'migracion_en_progreso'
          approved = payload.get('aprobadas', [])
          by_id = {item.get('id'): item for item in approved if isinstance(item, dict) and item.get('id')}
          for ex_id in ids:
              by_id[ex_id] = {'id': ex_id, 'archivo': f'{ex_id}.webp', 'estado': 'provisional'}
          payload['aprobadas'] = list(by_id.values())
          catalog.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrenamientos/runtime-compat.js entrenamientos/ilustraciones/catalogo.json
          git commit -m "Register triceps exercise illustrations" || true
          rm .github/workflows/one-shot-register-triceps.yml
          git add -A
          git commit -m "Remove one-shot triceps workflow" || true
          git push
