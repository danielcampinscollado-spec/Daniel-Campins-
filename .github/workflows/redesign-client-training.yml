name: Load premium training renderer

on:
  push:
    paths:
      - '.github/workflows/redesign-client-training.yml'

permissions:
  contents: write

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add premium training script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="./training-premium-v2.js?v=1"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '\n\n</body>', 1)
              p.write_text(s)
          PY

      - name: Commit loader
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Load premium client training screen"
          git push origin main
