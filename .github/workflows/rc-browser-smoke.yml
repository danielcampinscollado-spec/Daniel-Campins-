name: rc-browser-runtime-trace

on:
  push:
    branches:
      - google-auth-rc
    paths:
      - .github/workflows/rc-browser-smoke.yml
      - .github/scripts/rc_browser_smoke.mjs
  workflow_dispatch:

jobs:
  browser-runtime-trace:
    runs-on: ubuntu-latest
    env:
      RC_URL: https://daniel-campins-ckyk0gv00-danielcampinscollado-4962s-projects.vercel.app/?_vercel_share=yEFOZyZVDLSfXrCuYUnvrwPwVJBKDgbs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real navigation trace
        run: node .github/scripts/rc_browser_smoke.mjs
