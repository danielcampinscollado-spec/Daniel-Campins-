name: Root navigation stability v38
on:
  push:
    branches: [google-auth-rc]
    paths:
      - '.github/workflows/root-navigation-stability-v38.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: google-auth-rc
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply structural repair
        run: python .github/scripts/root_navigation_stability_v38.py
      - name: Validate JavaScript syntax
        run: |
          node --check checkin-coach-sync-v2.js
          node --check checkin-premium.js
          node --check messages-premium.js
          node --check auth-premium-v1.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,b in enumerate(blocks):
              if not b.strip(): continue
              p=Path(tempfile.gettempdir())/f'dcc-inline-{i}.js'
              p.write_text(b,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(1)
          print('inline scripts OK')
          PY
      - name: Commit repair
        run: |
          git config user.name 'dcc-stability-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html checkin-coach-sync-v2.js checkin-premium.js messages-premium.js auth-premium-v1.js
          git diff --cached --quiet && exit 0
          git commit -m '[stability] Fix root coach navigation reset'
          git push origin google-auth-rc
