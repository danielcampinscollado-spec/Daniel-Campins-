name: Tune client home metric cards
on:
  push:
    paths: ['.github/workflows/tune-client-home-metrics.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make weight and body-fat cards compact
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = {
            '#client-main .dch-stat{position:relative;min-height:112px;display:grid;grid-template-columns:46px minmax(0,1fr) 16px;align-items:center;gap:10px;padding:13px 11px;box-sizing:border-box;border:1px solid rgba(217,170,74,.55)!important;border-radius:20px!important;background:radial-gradient(circle at 100% 0,rgba(217,170,74,.10),transparent 38%),linear-gradient(145deg,#171b21 0%,#0e1217 58%,#090c10 100%)!important;box-shadow:0 13px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.035)!important;overflow:hidden;cursor:pointer}': '#client-main .dch-stat{position:relative;min-height:88px;display:grid;grid-template-columns:38px minmax(0,1fr) 10px;align-items:center;gap:8px;padding:10px 10px;box-sizing:border-box;border:1px solid rgba(217,170,74,.36)!important;border-radius:17px!important;background:radial-gradient(circle at 100% 0,rgba(217,170,74,.065),transparent 42%),linear-gradient(145deg,#15191f 0%,#0d1116 62%,#090c10 100%)!important;box-shadow:0 10px 24px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.028)!important;overflow:hidden;cursor:pointer}',
            '#client-main .dch-iconbox{width:46px;height:46px;display:grid;place-items:center;border:1px solid rgba(217,170,74,.48);border-radius:13px;background:linear-gradient(145deg,rgba(217,170,74,.11),rgba(217,170,74,.025));color:#f0c96b;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 0 18px rgba(217,170,74,.06)}': '#client-main .dch-iconbox{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(217,170,74,.34);border-radius:11px;background:linear-gradient(145deg,rgba(217,170,74,.075),rgba(217,170,74,.018));color:#f0c96b;box-shadow:inset 0 1px 0 rgba(255,255,255,.025),0 0 12px rgba(217,170,74,.035)}',
            '#client-main .dch-iconbox svg{width:25px;height:25px}': '#client-main .dch-iconbox svg{width:20px;height:20px}',
            '#client-main .dch-percent{font-size:25px;font-weight:800;line-height:1;color:#f0c96b}': '#client-main .dch-percent{font-size:20px;font-weight:760;line-height:1;color:#f0c96b}',
            '#client-main .dch-stat-label{margin-bottom:6px;color:#aab1bb;font-size:9px;line-height:1.2;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}': '#client-main .dch-stat-label{margin-bottom:5px;color:#959da8;font-size:7.8px;line-height:1.15;letter-spacing:1.35px;text-transform:uppercase;white-space:nowrap}',
            '#client-main .dch-stat-value{color:#f8f7f3;font-size:28px;line-height:1;font-weight:780;letter-spacing:-1px;white-space:nowrap}': '#client-main .dch-stat-value{color:#f8f7f3;font-size:22px;line-height:1;font-weight:720;letter-spacing:-.55px;white-space:nowrap}',
            '#client-main .dch-stat-value span{color:#aab1bb;font-size:15px;font-weight:520;letter-spacing:0}': '#client-main .dch-stat-value span{color:#929aa5;font-size:11.5px;font-weight:500;letter-spacing:0}',
            '#client-main .dch-chevron{color:#838c98;font-size:30px;line-height:1;font-weight:250}': '#client-main .dch-chevron{color:#707984;font-size:22px;line-height:1;font-weight:250}',
            '@media(max-width:390px){#client-main .dch-logo-row{min-height:82px;margin-top:-12px}#client-main .dch-logo-row img{width:108px;max-height:78px}#client-main .dch-profile{width:40px;height:40px;top:15px}#client-main .dch-name{font-size:31px!important}#client-main .dch-motto{font-size:7px;letter-spacing:2px;max-width:94px}#client-main .dch-stats{gap:8px!important}#client-main .dch-stat{min-height:104px;grid-template-columns:42px minmax(0,1fr) 12px;gap:8px;padding:11px 8px}#client-main .dch-iconbox{width:42px;height:42px}#client-main .dch-stat-value{font-size:25px}#client-main .dch-stat-value span{font-size:13px}#client-main .dch-stat-label{font-size:8px;letter-spacing:1.5px}#client-main .dch-next-content{padding-right:112px}#client-main .dch-routine-btn{min-width:104px;font-size:12px;padding:8px 10px}#client-main .dch-next-name{font-size:18px}}': '@media(max-width:390px){#client-main .dch-logo-row{min-height:82px;margin-top:-12px}#client-main .dch-logo-row img{width:108px;max-height:78px}#client-main .dch-profile{width:40px;height:40px;top:15px}#client-main .dch-name{font-size:31px!important}#client-main .dch-motto{font-size:7px;letter-spacing:2px;max-width:94px}#client-main .dch-stats{gap:7px!important}#client-main .dch-stat{min-height:82px;grid-template-columns:34px minmax(0,1fr) 9px;gap:7px;padding:9px 8px}#client-main .dch-iconbox{width:34px;height:34px;border-radius:10px}#client-main .dch-iconbox svg{width:18px;height:18px}#client-main .dch-percent{font-size:18px}#client-main .dch-stat-value{font-size:20px}#client-main .dch-stat-value span{font-size:10.5px}#client-main .dch-stat-label{font-size:7px;letter-spacing:1.05px}#client-main .dch-chevron{font-size:20px}#client-main .dch-next-content{padding-right:112px}#client-main .dch-routine-btn{min-width:104px;font-size:12px;padding:8px 10px}#client-main .dch-next-name{font-size:18px}}'
          }

          changed = 0
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new, 1)
              changed += 1

          if changed < 8:
            raise SystemExit(f'Expected 9 metric style replacements, made {changed}')

          p.write_text(s)
          PY
      - name: Commit compact metric cards
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Make client weight and body-fat cards compact'
          git pull --rebase origin main
          git push
