name: Body fat relative percentage v21

on:
  push:
    paths:
      - '.github/workflows/body-fat-relative-percent-v21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Convert body-fat deltas from points to relative percent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Pattern not found: {label}')
              return text.replace(old, new, 1)

          # Coach check-in + coach client progress/history.
          path = Path('checkin-coach-sync-v2.js')
          text = path.read_text()
          anchor = "  function fmt(v){const n=Number(v);return Number.isFinite(n)?n.toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1}):'—'}\n"
          helper = anchor + "  function changePct(current,previous){const c=num(current),p=num(previous);if(c==null||p==null||Math.abs(p)<.0001)return null;return((c-p)/Math.abs(p))*100}\n"
          text = replace_once(text, anchor, helper, 'coach helper')

          text = replace_once(
              text,
              "          const previous=series[series.length-2].v,latest=series[series.length-1].v,delta=latest-previous;",
              "          const previous=series[series.length-2].v,latest=series[series.length-1].v,delta=latest-previous,deltaPct=changePct(latest,previous);",
              'coach check-in delta'
          )
          text = replace_once(
              text,
              "          else if(delta<0){side.classList.add('good');side.innerHTML=`↓ ${fmt(Math.abs(delta))} pts<span>desde el anterior</span>`}",
              "          else if(delta<0){side.classList.add('good');side.innerHTML=`↓ ${fmt(Math.abs(deltaPct))} %<span>desde el anterior</span>`}",
              'coach check-in decrease'
          )
          text = replace_once(
              text,
              "          else{side.classList.add('bad');side.innerHTML=`↑ ${fmt(Math.abs(delta))} pts<span>desde el anterior</span>`}",
              "          else{side.classList.add('bad');side.innerHTML=`↑ ${fmt(Math.abs(deltaPct))} %<span>desde el anterior</span>`}",
              'coach check-in increase'
          )

          text = replace_once(
              text,
              "    const initial=series[0].v,current=series[series.length-1].v,delta=current-initial;",
              "    const initial=series[0].v,current=series[series.length-1].v,delta=current-initial,deltaPct=changePct(current,initial);",
              'coach client admin delta'
          )
          text = replace_once(
              text,
              "        else if(delta<0){trend.textContent=`↓ ${fmt(Math.abs(delta))} pts desde el inicio`;trend.classList.add('good')}",
              "        else if(delta<0){trend.textContent=`↓ ${fmt(Math.abs(deltaPct))} % desde el inicio`;trend.classList.add('good')}",
              'coach client admin decrease'
          )
          text = replace_once(
              text,
              "        else{trend.textContent=`↑ ${fmt(Math.abs(delta))} pts desde el inicio`;trend.classList.add('bad')}",
              "        else{trend.textContent=`↑ ${fmt(Math.abs(deltaPct))} % desde el inicio`;trend.classList.add('bad')}",
              'coach client admin increase'
          )

          old_history = "      if(i>0){const change=item.v-series[i-1].v;if(Math.abs(change)<.05)deltaHtml='<span class=\"dcc-bfh-delta\">Sin cambios</span>';else if(change<0)deltaHtml=`<span class=\"dcc-bfh-delta good\">↓ ${fmt(Math.abs(change))} pts</span>`;else deltaHtml=`<span class=\"dcc-bfh-delta bad\">↑ ${fmt(Math.abs(change))} pts</span>`}"
          new_history = "      if(i>0){const previous=series[i-1].v,change=item.v-previous,changePctValue=changePct(item.v,previous);if(Math.abs(change)<.05)deltaHtml='<span class=\"dcc-bfh-delta\">Sin cambios</span>';else if(change<0)deltaHtml=`<span class=\"dcc-bfh-delta good\">↓ ${fmt(Math.abs(changePctValue))} %</span>`;else deltaHtml=`<span class=\"dcc-bfh-delta bad\">↑ ${fmt(Math.abs(changePctValue))} %</span>`}"
          text = replace_once(text, old_history, new_history, 'coach fat history')
          path.write_text(text)

          # Client progress.
          path = Path('client-metrics-sync-v10.js')
          text = path.read_text()
          anchor = "  const fmt=v=>{const n=Number(v);return Number.isFinite(n)?n.toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1}):'—'};\n"
          helper = anchor + "  const changePct=(current,previous)=>{const c=num(current),p=num(previous);return c==null||p==null||Math.abs(p)<.0001?null:((c-p)/Math.abs(p))*100};\n"
          text = replace_once(text, anchor, helper, 'client helper')
          text = replace_once(
              text,
              "        const delta=current-initial;",
              "        const delta=current-initial,deltaPct=changePct(current,initial);",
              'client fat delta'
          )
          text = replace_once(
              text,
              "        else if(delta<0){chip.textContent=`↓ ${fmt(Math.abs(delta))} pts desde el inicio`;chip.classList.add('dcc-fat-good')}",
              "        else if(delta<0){chip.textContent=`↓ ${fmt(Math.abs(deltaPct))} % desde el inicio`;chip.classList.add('dcc-fat-good')}",
              'client fat decrease'
          )
          text = replace_once(
              text,
              "        else{chip.textContent=`↑ ${fmt(Math.abs(delta))} pts desde el inicio`;chip.classList.add('dcc-fat-bad')}",
              "        else{chip.textContent=`↑ ${fmt(Math.abs(deltaPct))} % desde el inicio`;chip.classList.add('dcc-fat-bad')}",
              'client fat increase'
          )
          path.write_text(text)

          # Base coach-client metric: keep same relative-percent semantics even before async sync finishes.
          path = Path('client-admin-premium.js')
          text = path.read_text()
          old = "function trend(a,b,u){if(a==null||b==null)return'Sin histórico todavía';const d=a-b;if(Math.abs(d)<.05)return'Sin cambios desde el inicio';return`${d>0?'↑':'↓'} ${Math.abs(d).toFixed(1).replace('.',',')} ${u} desde el inicio`}"
          new = "function trend(a,b,u){if(a==null||b==null)return'Sin histórico todavía';const d=a-b;if(Math.abs(d)<.05)return'Sin cambios desde el inicio';const shown=u==='%'&&Math.abs(b)>.0001?Math.abs(d/b*100):Math.abs(d);return`${d>0?'↑':'↓'} ${shown.toFixed(1).replace('.',',')} ${u} desde el inicio`}"
          text = replace_once(text, old, new, 'base coach client trend')
          path.write_text(text)

          # Cache bust every route that loads these files.
          path = Path('index.html')
          text = path.read_text()
          text = text.replace('./client-admin-premium.js?v=20260910-2250','./client-admin-premium.js?v=20260910-fatpct-v1')
          text = text.replace('./checkin-coach-sync-v2.js?v=20260910-2250','./checkin-coach-sync-v2.js?v=20260910-fatpct-v1')
          path.write_text(text)

          path = Path('ejercicio-biblioteca.js')
          text = path.read_text()
          text = text.replace("./client-metrics-sync-v10.js?v=20260910-1","./client-metrics-sync-v10.js?v=20260910-fatpct-v1")
          path.write_text(text)

          path = Path('client-progress-stable-v8.js')
          text = path.read_text()
          text = text.replace("./client-metrics-sync-v10.js?v=20260910-bfh11","./client-metrics-sync-v10.js?v=20260910-fatpct-v1")
          path.write_text(text)
          PY

      - name: Commit percentage display fix
        run: |
          git config user.name "danielcampinscollado-spec"
          git config user.email "danielcampinscollado@gmail.com"
          git add checkin-coach-sync-v2.js client-metrics-sync-v10.js client-admin-premium.js index.html ejercicio-biblioteca.js client-progress-stable-v8.js
          git commit -m "Show body fat changes as relative percentages"
          git push origin main
