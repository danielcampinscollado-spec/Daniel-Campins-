name: Register pectoral illustrations
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  register:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register pectoral image IDs
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('entrenamientos/runtime-compat.js')
          s=p.read_text()
          ids=[
            'press-banca-barra','press-banca-mancuernas','press-inclinado-barra','press-inclinado-mancuernas',
            'press-pecho-maquina','press-inclinado-maquina','press-convergente-maquina','aperturas-pec-deck',
            'cruces-polea-media','cruces-polea-alta','cruces-polea-baja','flexiones',
            'press-declinado-maquina','press-pecho-iso-lateral','press-inclinado-iso-lateral',
            'press-banca-multipower','press-inclinado-multipower','aperturas-polea-banco'
          ]
          m=re.search(r'const DCC_PREMIUM_IMAGES=new Set\(\[(.*?)\]\);',s,re.S)
          if not m: raise SystemExit('DCC_PREMIUM_IMAGES not found')
          current=re.findall(r'"([^"]+)"',m.group(1))
          merged=[]
          for x in current+ids:
            if x not in merged: merged.append(x)
          body='\n'+''.join(f'  "{x}",\n' for x in merged)
          body=body.rstrip(',\n')+'\n'
          s=s[:m.start()]+f'const DCC_PREMIUM_IMAGES=new Set([{body}]);'+s[m.end():]
          p.write_text(s)
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/one-shot-register-pectoral.yml
      - name: Commit registration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add entrenamientos/runtime-compat.js .github/workflows/one-shot-register-pectoral.yml
          git commit -m "Register pectoral exercise illustrations" || exit 0
          git push
