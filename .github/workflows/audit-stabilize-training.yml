name: Audit and stabilize client training flow

# retrigger 2026-09-11
on:
  push:
    paths:
      - '.github/workflows/audit-stabilize-training.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove overlapping training layers and fix workout handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('training-premium-v2.js')
          s = p.read_text()
          old = '''    const startButton = main.querySelector('.dct-start');
    if(startButton){
      startButton.addEventListener('click', function(event){
        event.preventDefault();
        event.stopPropagation();
        const next = Number(this.dataset.dayIndex);
        const dayIndex = Number.isFinite(next) ? next : selectedDayIndex;
        let fn = null;
        if(typeof window.startWorkout === 'function') fn = window.startWorkout;
        if(!fn){
          try{ fn = (typeof startWorkout === 'function') ? startWorkout : null; }
          catch(_){ fn = null; }
        }
        if(typeof fn === 'function'){
          fn(dayIndex);
        }else{
          console.error('DCC: startWorkout no disponible desde training-premium-v2');
          if(typeof window.toast === 'function') window.toast('No se pudo iniciar el entrenamiento.');
        }
      });
    }
'''
          new = '''    const startButton = main.querySelector('.dct-start');
    if(startButton){
      startButton.addEventListener('click', function(event){
        event.preventDefault();
        event.stopPropagation();
        const next = Number(this.dataset.dayIndex);
        const dayIndex = Number.isFinite(next) ? next : selectedDayIndex;
        const activeDay = routine[dayIndex];
        const activeExercises = Array.isArray(activeDay?.exercises) ? activeDay.exercises : [];
        if(!activeDay || !activeExercises.length){
          try{ if(typeof toast === 'function') toast('Este entrenamiento no tiene ejercicios'); }catch(_){}
          return;
        }
        const preparedExercises = activeExercises.map(ex => ({
          ...ex,
          restBetweenSets: activeDay.restBetweenSetsGlobal !== undefined ? Math.max(0, parseInt(activeDay.restBetweenSetsGlobal,10) || 0) : Math.max(0, parseInt(ex.restBetweenSets,10) || 0),
          restBetweenExercises: activeDay.restBetweenExercisesGlobal !== undefined ? Math.max(0, parseInt(activeDay.restBetweenExercisesGlobal,10) || 0) : Math.max(0, parseInt(ex.restBetweenExercises,10) || 0)
        }));
        window.activeWorkout = {clientId:id,dayIndex,dayName:activeDay.muscle || 'Entrenamiento',exercises:JSON.parse(JSON.stringify(preparedExercises)),startedAt:Date.now(),currentExercise:0,sets:[],completedExercises:[]};
        try{
          if(typeof renderWorkoutSession === 'function'){ renderWorkoutSession(); return; }
          if(typeof window.renderWorkoutSession === 'function'){ window.renderWorkoutSession(); return; }
        }catch(error){ console.error('DCC: error abriendo sesión de entrenamiento', error); }
        window.activeWorkout = null;
        try{ if(typeof toast === 'function') toast('No se pudo abrir el entrenamiento'); }catch(_){}
      });
    }
'''
          if old not in s:
              raise SystemExit('No se encontró el bloque startButton esperado en training-premium-v2.js')
          s = s.replace(old, new)
          s = s.replace("if(screen === 'training'){\n      try{\n        renderPremiumTraining();", "if(screen === 'training' && !window.activeWorkout){\n      try{\n        renderPremiumTraining();")
          p.write_text(s)

          p = Path('exercise-guidance-v1.js')
          s = p.read_text()
          replacement = '''  function decorateClientAdvice(){
    ensureCss();
    document.querySelectorAll('#client-main .dcc-exercise-client-advice').forEach(node=>node.remove());
  }

'''
          s, count = re.subn(r"  function decorateClientAdvice\(\)\{.*?\n  \}\n\n  let observer=null;", replacement + "  let observer=null;", s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('No se pudo aislar decorateClientAdvice en exercise-guidance-v1.js')
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          start = s.find('function renderWorkoutSession(){')
          end = s.find('function startRestTimer(){', start)
          if start < 0 or end < 0:
              raise SystemExit('No se encontró renderWorkoutSession en index.html')
          chunk = s[start:end]
          chunk = chunk.replace('Consejo de hoy', 'Consejo del ejercicio', 1)
          old_tip = '${esc(getTodayCoachTip(workout.clientId))}'
          new_tip = "${esc(typeof window.dccExerciseAdvice==='function' ? window.dccExerciseAdvice(exercise) : getTodayCoachTip(workout.clientId))}"
          if old_tip not in chunk:
              raise SystemExit('No se encontró el consejo del workout en index.html')
          chunk = chunk.replace(old_tip, new_tip, 1)
          s = s[:start] + chunk + s[end:]
          s = re.sub(r'\n?<script src="\./training-actions-hotfix-v1\.js[^\"]*"></script>', '', s)
          s = re.sub(r'\n?<script src="\./training-actions-hotfix-v2\.js[^\"]*"></script>', '', s)
          s = re.sub(r'<script src="\./training-premium-v2\.js\?v=[^\"]+"></script>', '<script src="./training-premium-v2.js?v=20260911-audit-stable-1"></script>', s)
          p.write_text(s)
          PY

      - name: Sanity checks
        run: |
          grep -q "screen === 'training' && !window.activeWorkout" training-premium-v2.js
          grep -q "window.activeWorkout =" training-premium-v2.js
          grep -q "Consejo del ejercicio" index.html
          grep -q "dccExerciseAdvice(exercise)" index.html
          ! grep -q "training-actions-hotfix-v1.js" index.html
          ! grep -q "training-actions-hotfix-v2.js" index.html

      - name: Commit stabilized runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-premium-v2.js exercise-guidance-v1.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize training flow and show advice only in active workout"
          git push
