name: Bust coach bootstrap cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump coach bootstrap URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./coach-client-plan-status-v1.js?v=20260911-0610'
          new='./coach-client-plan-status-v1.js?v=20260916-0948'
          if old not in s and new not in s:
              raise SystemExit('coach bootstrap URL not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit cache bust
        run: |
          git config user.name "dcc-cache-bust"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force browsers to load restored morning coach navigation"
          git push
