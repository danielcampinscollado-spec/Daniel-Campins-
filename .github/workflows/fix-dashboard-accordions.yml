name: Fix dashboard accordion close state
on:
  push:
    branches: [google-auth-rc]
    paths:
      - '.github/workflows/fix-dashboard-accordions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close dashboard accordions between tabs
        run: python3 -c "from pathlib import Path; p=Path('coach-premium-core-v9.js'); s=p.read_text(); a='    const tasksOpen=window.__dccCoachTasksOpen!==false;\\n    const attentionOpen=window.__dccCoachAttentionOpen!==false;'; b='    const tasksOpen=window.__dccCoachTasksOpen===true;\\n    const attentionOpen=window.__dccCoachAttentionOpen===true;'; assert a in s; s=s.replace(a,b,1); a2='      if(!beforeRoute(screen))return;\\n      syncRoute(screen);'; b2=\"      if(!beforeRoute(screen))return;\\n      if(screen!=='dashboard'){\\n        window.__dccCoachTasksOpen=false;\\n        window.__dccCoachAttentionOpen=false;\\n      }\\n      syncRoute(screen);\"; assert a2 in s; p.write_text(s.replace(a2,b2,1))"
      - name: Validate JavaScript
        run: node --check coach-premium-core-v9.js
      - name: Commit fix
        run: |
          git config user.name dcc-ui-fix
          git config user.email actions@users.noreply.github.com
          git add coach-premium-core-v9.js
          git commit -m '[ui] Close dashboard accordions between tabs'
          git push
