name: Fix start workout session handoff at root
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-start-workout-session-root-v1.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix workout session handoff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('training-premium-v2.js')
          s=p.read_text()
          old='''        let fn = null;
        if(typeof window.startWorkout === 'function') fn = window.startWorkout;
        if(!fn){
          try{ fn = (typeof startWorkout === 'function') ? startWorkout : null; }
          catch(_){ fn = null; }
        }
        if(typeof fn === 'function'){
          fn(dayIndex);
        }else{
          console.error('DCC: startWorkout no disponible desde training-premium-v2');
          if(typeof window.toast === 'function') window.toast('No se pudo iniciar el entrenamiento.');
        }'''
          new='''        const day = routine[dayIndex];
        if(!day){
          if(typeof window.toast === 'function') window.toast('No se encontró el entrenamiento.');
          return;
        }
        const sessionExercises = (Array.isArray(day.exercises) ? day.exercises : []).map(exercise => ({
          ...exercise,
          restBetweenSets:
            day.restBetweenSetsGlobal !== undefined
              ? Math.max(0, parseInt(day.restBetweenSetsGlobal) || 0)
              : Math.max(0, parseInt(exercise.restBetweenSets) || 0),
          restBetweenExercises:
            day.restBetweenExercisesGlobal !== undefined
              ? Math.max(0, parseInt(day.restBetweenExercisesGlobal) || 0)
              : Math.max(0, parseInt(exercise.restBetweenExercises) || 0)
        }));
        if(!sessionExercises.length){
          if(typeof window.toast === 'function') window.toast('Este entrenamiento no tiene ejercicios.');
          return;
        }
        window.activeWorkout = {
          clientId:id,
          dayIndex,
          dayName:day.muscle || 'Entrenamiento',
          exercises:JSON.parse(JSON.stringify(sessionExercises)),
          startedAt:Date.now(),
          currentExercise:0,
          sets:[],
          completedExercises:[]
        };
        originalShowClient.call(window, 'training');'''
          if old not in s:
            raise SystemExit('No se encontró el bloque de inicio actual')
          s=s.replace(old,new,1)
          old2='''    if(screen === 'training'){
      try{
        renderPremiumTraining();
      }catch(error){
        console.error('Error renderizando entrenamiento premium:', error);
      }
    }'''
          new2='''    if(screen === 'training' && !window.activeWorkout){
      try{
        renderPremiumTraining();
      }catch(error){
        console.error('Error renderizando entrenamiento premium:', error);
      }
    }'''
          if old2 not in s:
            raise SystemExit('No se encontró el wrapper de showClient')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training-premium-v2.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix workout session start handoff'
          git push