name: Restore coach Light Premium layout
on:
  push:
    branches: [google-auth-rc]
    paths:
      - '.github/workflows/restore-coach-light-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual recovery
        run: python3 .github/scripts/restore_coach_light.py
      - name: Validate JavaScript
        run: node --check auth-premium-v1.js && node --check coach-light-stable-v1.js
      - name: Commit recovery
        run: |
          git config user.name dcc-ui-recovery
          git config user.email actions@users.noreply.github.com
          git add auth-premium-v1.js coach-light-stable-v1.js
          git commit -m '[ui] Restore Light Premium coach layout and bottom nav'
          git push
