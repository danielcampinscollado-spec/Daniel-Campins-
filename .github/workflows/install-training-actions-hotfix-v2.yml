name: Install training actions hotfix v2
on:
  push:
    branches: [main]
    paths:
      - 'training-actions-hotfix-v2.js'
      - '.github/workflows/install-training-actions-hotfix-v2.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load hotfix v2 in index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./training-actions-hotfix-v2.js?v=20260911-2"></script>'
          if tag in s:
              raise SystemExit(0)
          marker='<script src="./training-actions-hotfix-v1.js?v=20260911-1"></script>'
          if marker not in s:
              marker='<script src="./training-premium-v2.js?v=1"></script>'
          if marker not in s:
              raise SystemExit('training hotfix marker not found')
          s=s.replace(marker, marker+'\n'+tag, 1)
          p.write_text(s)
          PY
      - name: Commit index change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load robust client training actions hotfix v2'
          git push
