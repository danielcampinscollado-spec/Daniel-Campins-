name: Finish triceps illustrations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-finish-triceps.yml'
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified triceps assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          repo='danielcampinscollado-spec/Daniel-Campins-'
          assets={
            'fondos-maquina-asistida.webp':'a87a8a0efd5e10adbb2692fff929c6ef0d6a8685',
            'press-triceps-maquina.webp':'6c88b1c7fe79156387db9008e0db64d07c02bafe',
            'fondos-maquina.webp':'f6813894b86b91a1de9e0fcf056cf08844007ee9',
            'extension-triceps-sobre-cabeza-unilateral.webp':'2c339d72a36193a06e9788ceb29b17e82edaa234',
          }
          out=Path('entrenamientos/ilustraciones')
          token=os.environ['GH_TOKEN']
          for name,sha in assets.items():
            req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req) as r:
              payload=json.load(r)
            (out/name).write_bytes(base64.b64decode(payload['content']))
          catalog={
            'version':3,
            'estado':'migracion_en_progreso',
            'criterio':'Ilustraciones premium oscuras, una por ejercicio, sin mini-anatomias ni textos dentro del asset, con el musculo principal resaltado en dorado.',
            'grupos':{
              'Pectoral':{'estado':'provisional','total':18},
              'Triceps':{
                'estado':'completo_verificado','total':12,
                'integradas':['extension-triceps-cuerda','extension-triceps-barra','extension-triceps-unilateral','extension-triceps-sobre-cabeza','fondos-maquina-asistida','press-triceps-maquina','press-cerrado-barra','extension-triceps-tumbado-ez','fondos-maquina','extension-triceps-maquina','extension-triceps-polea-agarre-inverso','extension-triceps-sobre-cabeza-unilateral'],
                'pendientes':[]
              }
            },
            'nota':'Triceps completado: cada ID tiene WebP registrado y cargable en la app.'
          }
          (out/'catalogo.json').write_text(json.dumps(catalog,ensure_ascii=False,separators=(',',':'))+'\n',encoding='utf-8')
          PY
      - name: Commit final triceps set
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrenamientos/ilustraciones/fondos-maquina-asistida.webp entrenamientos/ilustraciones/press-triceps-maquina.webp entrenamientos/ilustraciones/fondos-maquina.webp entrenamientos/ilustraciones/extension-triceps-sobre-cabeza-unilateral.webp entrenamientos/ilustraciones/catalogo.json
          git commit -m "Finish verified triceps illustration set"
          rm .github/workflows/one-shot-finish-triceps.yml
          git add -A
          git commit -m "Remove one-shot triceps workflow"
          git push
