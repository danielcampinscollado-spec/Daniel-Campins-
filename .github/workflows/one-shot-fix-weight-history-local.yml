name: One-shot weight history consistency fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fix-weight-history-local.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch local weight history consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ejercicio-biblioteca.js')
          text = path.read_text(encoding='utf-8')
          old = '''  window.addWeight=async function(id){const c=client(id);if(!c){toast("No se encontró el cliente");return;}const text=prompt("Nuevo peso (kg):");if(text===null)return;const value=parseFloat(text.trim().replace(",","."));if(!Number.isFinite(value)||value<=0||value>=500){toast("Introduce un peso válido");return;}try{const {error:clientError}=await supabaseClient.from("clients").update({weight:value}).eq("id",id);if(clientError)throw clientError;c.weight=value;if(!data.weights[id])data.weights[id]=[];data.weights[id].push(value);saveData();const {error:historyError}=await supabaseClient.from("client_weights").insert({client_id:id,weight:value});if(currentApp==="coach")showClientAdmin(id);else if(currentApp==="client")showClient("progress");if(historyError){console.error("Error guardando histórico del peso:",historyError);toast("Peso actualizado, pero no se pudo guardar el histórico");return;}toast("Peso actualizado");}catch(error){console.error("Error actualizando peso:",error);toast("No se pudo actualizar el peso");}};'''
          new = '''  window.addWeight=async function(id){const c=client(id);if(!c){toast("No se encontró el cliente");return;}const text=prompt("Nuevo peso (kg):");if(text===null)return;const value=parseFloat(text.trim().replace(",","."));if(!Number.isFinite(value)||value<=0||value>=500){toast("Introduce un peso válido");return;}try{const {error:clientError}=await supabaseClient.from("clients").update({weight:value}).eq("id",id);if(clientError)throw clientError;c.weight=value;const {error:historyError}=await supabaseClient.from("client_weights").insert({client_id:id,weight:value});if(!historyError){if(!data.weights[id])data.weights[id]=[];data.weights[id].push(value);}saveData();if(currentApp==="coach")showClientAdmin(id);else if(currentApp==="client")showClient("progress");if(historyError){console.error("Error guardando histórico del peso:",historyError);toast("Peso actualizado, pero no se pudo guardar el histórico");return;}toast("Peso actualizado");}catch(error){console.error("Error actualizando peso:",error);toast("No se pudo actualizar el peso");}};'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one addWeight block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/one-shot-fix-weight-history-local.yml

      - name: Commit patch
        run: |
          git config user.name "DCC Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Keep local weight history consistent with Supabase"
          git push origin HEAD:main
