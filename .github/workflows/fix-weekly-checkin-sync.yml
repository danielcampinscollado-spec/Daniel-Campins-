name: Fix weekly check-in sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-weekly-checkin-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply weekly check-in synchronization patch
        run: python .github/scripts/fix-weekly-checkin-sync.py

      - name: Validate weekly check-in synchronization
        shell: bash
        run: |
          python -c 'from pathlib import Path; s=Path("index.html").read_text(encoding="utf-8"); required=["serverCheckinSentThisWeek","checkin.updatedAt","new Date(`${currentWeekKey}T00:00:00`)"]; missing=[x for x in required if x not in s]; assert not missing, missing; print("Weekly check-in synchronization validated")'

      - name: Commit fix and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/fix-weekly-checkin-sync.py
          rm -f .github/workflows/fix-weekly-checkin-sync.yml
          git add index.html .github/scripts/fix-weekly-checkin-sync.py .github/workflows/fix-weekly-checkin-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "Sync weekly check-in status across devices"
          git push origin main
