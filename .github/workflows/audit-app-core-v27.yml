name: audit-app-core-v27

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/audit-app-core-v27.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited patches
        run: python3 .github/scripts/audit_v27.py
      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-client-premium-v1.js coach-premium-v8.js coach-ui-v11.js coach-premium-core-v9.js client-admin-premium.js coach-client-plan-status-v1.js client-metrics-sync-v10.js coach-calendar-v12.js coach-calendar-form-fix-v15.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix core client workflow and remove hidden app dead ends"
          git push origin HEAD:main
