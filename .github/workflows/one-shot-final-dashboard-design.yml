name: Apply approved premium dashboard design
on:
  push:
    paths:
      - '.github/workflows/one-shot-final-dashboard-design.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch premium dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('coach-premium.js')
          s=p.read_text()
          # approved compact header: no eyebrow, no header quote
          s=s.replace('        <div class="dcc-pd-eyebrow">PANEL ENTRENADOR</div>\n','')
          s=s.replace('        <div class="dcc-pd-hero-note">CADA CLIENTE ES UN PROCESO.<br><b>TÚ MARCAS LA DIFERENCIA.</b><div class="dcc-pd-hero-line"></div></div>\n','')
          # 4 useful counters
          old='''      <div class="dcc-pd-strip">\n        <div class="dcc-pd-stat"><strong>${clients.length}</strong><span>CLIENTES</span></div>\n        <div class="dcc-pd-stat"><strong>${pending}</strong><span>CHECK-INS PENDIENTES</span></div>\n        <div class="dcc-pd-stat"><strong>${unread}</strong><span>MENSAJES NUEVOS</span></div>\n      </div>'''
          new='''      <div class="dcc-pd-strip">\n        <div class="dcc-pd-stat"><strong>${clients.length}</strong><span>CLIENTES</span></div>\n        <div class="dcc-pd-stat"><strong>${pending}</strong><span>CHECK-IN PENDIENTE</span></div>\n        <div class="dcc-pd-stat"><strong>0</strong><span>RUTINAS POR RENOVAR</span></div>\n        <div class="dcc-pd-stat"><strong>0</strong><span>DIETAS POR RENOVAR</span></div>\n      </div>'''
          s=s.replace(old,new)
          # smoky premium banner copy
          s=s.replace('<section class="dcc-pd-banner"><small>ENTRENADORES QUE TRANSFORMAN VIDAS</small><strong>ENFOQUE. CONSTANCIA. RESULTADOS.</strong></section>','<section class="dcc-pd-banner"><span class="dcc-pd-trophy">♛</span><div><small>CADA CLIENTE ES UN PROCESO.</small><strong>TÚ MARCAS LA DIFERENCIA.</strong></div></section>')
          # nav: Panel, Clientes, Calendario, Check-in, Mensajes
          oldnav='''    nav.innerHTML=`\n      <button onclick="showCoach('dashboard')">${svg("panel")}<span>Panel</span></button>\n      <button onclick="showCoach('clients')">${svg("clients")}<span>Clientes</span></button>\n      <button onclick="showCoach('checkins')">${svg("check")}<span>Check-in</span></button>\n      <button onclick="showCoach('messages')">${svg("msg")}<span>Mensajes</span></button>`;\n    nav.style.gridTemplateColumns="repeat(4,minmax(0,1fr))";'''
          newnav='''    nav.innerHTML=`\n      <button onclick="showCoach('dashboard')">${svg("panel")}<span>Panel</span></button>\n      <button onclick="showCoach('clients')">${svg("clients")}<span>Clientes</span></button>\n      <button onclick="return false">${svg("calendar")}<span>Calendario</span></button>\n      <button onclick="showCoach('checkins')">${svg("check")}<span>Check-in</span></button>\n      <button onclick="showCoach('messages')">${svg("msg")}<span>Mensajes</span></button>`;\n    nav.style.gridTemplateColumns="repeat(5,minmax(0,1fr))";'''
          s=s.replace(oldnav,newnav)
          s=s.replace('const map={dashboard:0,clients:1,checkins:2,messages:3};','const map={dashboard:0,clients:1,checkins:3,messages:4};')
          # calendar svg
          needle="      clients:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"9\" cy=\"8\" r=\"3\"/><circle cx=\"17\" cy=\"9\" r=\"2.5\"/><path d=\"M3.5 20c.5-4 2.3-6 5.5-6s5 2 5.5 6\"/><path d=\"M14 15c3-.2 5 1.3 5.5 4.5\"/></svg>',"
          s=s.replace(needle,needle+'\n      calendar:\'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>\',')
          # append final CSS overrides
          marker='    document.head.appendChild(style);'
          css='''\n    const finalStyle=document.createElement("style");\n    finalStyle.id="dcc-approved-dashboard-final";\n    finalStyle.textContent=`\n      .dcc-pd-hero{min-height:225px;border:0;border-radius:0;padding:18px 22px 20px;background:radial-gradient(ellipse at 73% 35%,rgba(221,170,70,.16),transparent 30%),linear-gradient(110deg,#050607 0%,#090b0d 58%,#030405 100%);box-shadow:none}\n      .dcc-pd-hero:after{right:0;top:-12px;width:48%;height:245px;opacity:.85;background:radial-gradient(ellipse at 55% 45%,rgba(213,164,74,.23),transparent 28%),radial-gradient(ellipse at 58% 60%,rgba(255,255,255,.07),transparent 33%);filter:none}\n      .dcc-pd-brand{z-index:3}.dcc-pd-title{margin-top:46px;font-size:48px;max-width:55%;z-index:3}.dcc-pd-title:after{content:"";display:block;width:52px;height:2px;margin-top:16px;background:linear-gradient(90deg,${GOLD2},${GOLD})}\n      .dcc-pd-strip{grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin:8px 0 12px;border:1px solid rgba(217,170,74,.38);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#10151a,#080b0e)}\n      .dcc-pd-stat{border:0;border-right:1px solid rgba(255,255,255,.12);border-radius:0;min-height:82px;padding:15px 12px;background:transparent}.dcc-pd-stat:last-child{border-right:0}.dcc-pd-stat strong{font-family:Arial,sans-serif;font-size:25px;font-weight:700}.dcc-pd-stat span{font-size:8px;line-height:1.35;letter-spacing:.8px;color:#d4d6d9}\n      .dcc-pd-section{margin-top:12px;padding:15px 18px;border-color:rgba(217,170,74,.42);border-radius:18px;background:linear-gradient(145deg,#101418,#080b0d)}\n      .dcc-pd-section-kicker{font-size:11px}.dcc-pd-section-sub{color:#b6bac0}.dcc-pd-row{padding:10px 0}.dcc-pd-empty{padding:9px 0 2px}\n      .dcc-pd-banner{display:flex;align-items:center;gap:18px;margin-top:12px;padding:18px 22px;border-color:rgba(240,201,107,.72);border-radius:18px;background:radial-gradient(ellipse at 86% 45%,rgba(232,178,66,.35),transparent 18%),radial-gradient(ellipse at 72% 70%,rgba(178,121,28,.25),transparent 24%),radial-gradient(ellipse at 18% 50%,rgba(216,158,45,.25),transparent 22%),linear-gradient(100deg,#171006,#090a0b 38%,#171006 100%);box-shadow:inset 0 0 35px rgba(211,153,41,.12),0 14px 40px rgba(0,0,0,.3)}\n      .dcc-pd-banner:before{content:"";position:absolute;inset:-40%;background:repeating-radial-gradient(ellipse at 70% 50%,rgba(235,187,82,.08) 0 3%,transparent 4% 9%);filter:blur(7px);transform:rotate(-8deg);pointer-events:none}.dcc-pd-trophy{position:relative;z-index:2;font-size:30px;color:${GOLD2};text-shadow:0 0 18px rgba(240,201,107,.35)}.dcc-pd-banner>div{position:relative;z-index:2}.dcc-pd-banner strong{font-size:20px}\n      #coach .side{height:78px!important}#coach-nav{grid-template-columns:repeat(5,minmax(0,1fr))!important}#coach-nav button{font-size:9px!important}\n      @media(max-width:700px){#coach-main.dcc-premium-dashboard{padding:10px 14px 102px!important}.dcc-pd-hero{min-height:220px;padding:15px 12px 18px}.dcc-pd-brand img{width:52px}.dcc-pd-title{margin-top:45px;font-size:38px;max-width:62%}.dcc-pd-strip{margin-top:6px}.dcc-pd-stat{min-height:76px;padding:12px 7px}.dcc-pd-stat strong{font-size:21px}.dcc-pd-stat span{font-size:6.8px;letter-spacing:.35px}.dcc-pd-section{padding:14px}.dcc-pd-banner{padding:16px}.dcc-pd-banner strong{font-size:17px}#coach-nav button span{font-size:8px!important}}\n    `;\n    document.head.appendChild(finalStyle);\n'''
          s=s.replace(marker,marker+css)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add coach-premium.js
          git commit -m "Match approved premium coach dashboard" || true
          git rm .github/workflows/one-shot-final-dashboard-design.yml
          git commit -m "Remove one-shot dashboard workflow"
          git push
