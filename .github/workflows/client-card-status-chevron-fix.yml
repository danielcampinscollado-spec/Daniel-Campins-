name: Client card status and chevron fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/client-card-status-chevron-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch client cards only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path('coach-premium-core-v9.js')
          s = core.read_text()
          old = ".dcc-cl-card-ref{grid-template-columns:minmax(0,1fr) auto 18px!important;cursor:pointer!important;min-height:92px!important;padding:15px 17px!important}.dcc-cl-card-ref .dcc-cl-training,.dcc-cl-card-ref .dcc-cl-manage{display:none!important}.dcc-cl-ref-meta{display:flex;gap:14px;align-items:center;margin-top:8px;color:#8d96a1;font-size:10px;font-weight:650}.dcc-cl-active{align-self:center;padding:7px 10px;border-radius:999px;background:rgba(57,185,130,.13);color:#47b987;font-size:9px;font-weight:850}.dcc-cl-chevron{align-self:center;color:${GOLD2};font-size:26px;line-height:1}"
          new = ".dcc-cl-card-ref{grid-template-columns:minmax(0,1fr) 24px!important;cursor:pointer!important;min-height:92px!important;padding:15px 17px!important}.dcc-cl-card-ref .dcc-cl-training,.dcc-cl-card-ref .dcc-cl-manage{display:none!important}.dcc-cl-ref-meta{display:flex;gap:14px;align-items:center;margin-top:8px;color:#8d96a1;font-size:10px;font-weight:650}.dcc-cl-active{display:none!important}.dcc-cl-chevron{display:flex!important;align-items:center!important;justify-content:flex-end!important;align-self:stretch!important;color:${GOLD2};font-size:26px;line-height:1}"
          if old not in s:
              raise SystemExit('Expected client-card CSS block not found')
          core.write_text(s.replace(old, new, 1))

          theme = Path('coach-theme-premium-global.js')
          t = theme.read_text()
          anchor = "html.dcc-theme-light-premium body #coach #coach-main.dcc-premium-clients .dcc-cl-training{display:none!important}"
          addition = anchor + "\n      html.dcc-theme-light-premium body #coach #coach-main.dcc-premium-clients .dcc-cl-card.dcc-cl-card-ref{grid-template-columns:minmax(0,1fr) 24px!important;gap:12px!important}\n      html.dcc-theme-light-premium body #coach #coach-main.dcc-premium-clients .dcc-cl-card-ref .dcc-cl-active{display:none!important}\n      html.dcc-theme-light-premium body #coach #coach-main.dcc-premium-clients .dcc-cl-card-ref .dcc-cl-chevron{display:flex!important;align-items:center!important;justify-content:flex-end!important;align-self:stretch!important;color:#b77b13!important;font-size:26px!important;line-height:1!important}"
          if anchor not in t:
              raise SystemExit('Expected light-theme client anchor not found')
          theme.write_text(t.replace(anchor, addition, 1))
          PY
      - name: Validate JavaScript
        run: |
          node --check coach-premium-core-v9.js
          node --check coach-theme-premium-global.js
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/client-card-status-chevron-fix.yml
          git add coach-premium-core-v9.js coach-theme-premium-global.js .github/workflows/client-card-status-chevron-fix.yml
          git commit -m "Fix client status badge and lateral chevron"
          git push
# trigger
