name: Full runtime architecture audit v40
on:
  push:
    paths: ['.github/workflows/audit-all-js-syntax-v32.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every JavaScript file
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do if ! node --check "$file"; then failed=1; fi; done < <(find . -type f -name '*.js' -not -path './node_modules/*' -printf '%p\n' | sort)
          exit "$failed"
      - name: Verify single-router invariants
        shell: bash
        run: |
          ! grep -q 'window.openApp=async function' entrenamientos/runtime-compat.js
          ! grep -q 'showCoach("dashboard")' entrenamientos/runtime-compat.js
          ! grep -q 'showCoach' coach-dashboard-bootstrap-v1.js
          ! grep -q 'showCoach' coach-client-final-consistency-v1.js
          ! grep -q 'window.showCoach=' rc-coach-stability-v1.js
          ! grep -q 'dcc-coach-nav-final' coach-client-plan-status-v1.js
          ! grep -q 'installNavigationSync();' checkin-coach-sync-v2.js
          ! grep -q 'install();setTimeout(install' checkin-premium.js
          ! grep -q 'install();setTimeout(install' messages-premium.js
          grep -q 'dccRenderCoachCheckins' coach-premium-core-v9.js
          grep -q 'dccRenderCoachMessages' coach-premium-core-v9.js
          echo 'Single-router invariants OK'
