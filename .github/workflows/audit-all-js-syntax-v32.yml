name: Release read-only integrity audit
on:
  push:
    branches:
      - main
      - 'audit/**'
    paths:
      - '*.js'
      - 'index.html'
      - '.github/workflows/audit-all-js-syntax-v32.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every root JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort)
      - name: Check inline JavaScript in index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          for i,block in enumerate(blocks,1):
              p=Path(tempfile.gettempdir())/f'dcc-inline-{i}.js'
              p.write_text(block,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          print(f'Inline scripts checked: {len(blocks)}')
          PY
      - name: Guard consolidated coach client architecture
        shell: bash
        run: |
          set -euo pipefail
          loader='nutrition-plan-premium-v1.js'
          forbidden=(
            'client-server-source-v1.js'
            'client-delete-atomic-v4.js'
            'client-profile-edit-authority-v2.js'
            'rc-coach-stability-v1.js'
            'coach-client-critical-authority-v1.js'
            'coach-dashboard-bootstrap-v1.js'
            'client-current-fat-dedupe-v1.js'
            'coach-client-final-consistency-v1.js'
          )
          for item in "${forbidden[@]}"; do
            if grep -Fq "$item" "$loader"; then
              echo "Forbidden overlapping client authority still loaded: $item" >&2
              exit 1
            fi
          done
          grep -Fq 'coach-client-authority-v2.js' "$loader"
          echo 'Coach client authority is consolidated.'
      - name: Audit active runtime graph
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict, deque
          import re, sys

          root=Path('.')
          html=(root/'index.html').read_text(encoding='utf-8')
          direct=re.findall(r'<script[^>]+src=["\'](?:\./)?([^"\'?]+\.js)(?:\?[^"\']*)?["\']',html,re.I)
          queue=deque(direct)
          active=[]
          seen=set()
          parents=defaultdict(set)
          for f in direct: parents[f].add('index.html')
          ref_re=re.compile(r'["\']\./([^"\'?]+\.js)(?:\?[^"\']*)?["\']')

          missing=[]
          while queue:
              file=queue.popleft()
              if file in seen: continue
              seen.add(file); active.append(file)
              p=root/file
              if not p.is_file():
                  missing.append(file); continue
              text=p.read_text(encoding='utf-8')
              for child in ref_re.findall(text):
                  parents[child].add(file)
                  if child not in seen: queue.append(child)

          if missing:
              print('Missing active JavaScript:',', '.join(sorted(missing)),file=sys.stderr)
              sys.exit(1)

          observers=intervals=timeouts=0
          global_defs=defaultdict(set)
          per_file=[]
          for file in active:
              text=(root/file).read_text(encoding='utf-8')
              mo=text.count('MutationObserver')
              si=len(re.findall(r'\bsetInterval\s*\(',text))
              st=len(re.findall(r'\bsetTimeout\s*\(',text))
              observers+=mo; intervals+=si; timeouts+=st
              for name in re.findall(r'window\.([A-Za-z_$][\w$]*)\s*=',text):
                  global_defs[name].add(file)
              per_file.append((file,mo,si,st))

          print(f'Active JS files: {len(active)}')
          print('ACTIVE_RUNTIME_FILES='+' '.join(active))
          print(f'Active MutationObserver references: {observers}')
          print(f'Active setInterval calls: {intervals}')
          print(f'Active setTimeout calls: {timeouts}')
          print('Per-file async/runtime counts:')
          for file,mo,si,st in per_file:
              if mo or si or st:
                  print(f'  {file}: MutationObserver={mo} setInterval={si} setTimeout={st}')
          collisions={k:sorted(v) for k,v in global_defs.items() if len(v)>1}
          print(f'Global window assignment names defined by >1 active file: {len(collisions)}')
          for name,files in sorted(collisions.items()):
              print(f'  window.{name}: '+', '.join(files))
          PY
      - name: Ensure only read-only release workflow remains active
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)
          test "$count" -eq 1
          test -f .github/workflows/audit-all-js-syntax-v32.yml
          echo 'Only the read-only release integrity workflow remains active.'
