name: Fix approved compact panel v2
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch coach premium panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('coach-premium.js')
          s=p.read_text()
          s=s.replace('const expected=["Panel","Clientes","Check-in","Mensajes"];','const expected=["Panel","Clientes","Calendario","Check-in","Mensajes"];')
          s=s.replace('if(current.length!==4 || expected.some((x,i)=>current[i]!==x)){','if(current.length!==5 || expected.some((x,i)=>current[i]!==x)){')
          old='''      nav.innerHTML=`
        <button onclick="showCoach('dashboard')">${svg("panel")}<span>Panel</span></button>
        <button onclick="showCoach('clients')">${svg("clients")}<span>Clientes</span></button>
        <button onclick="showCoach('checkins')">${svg("check")}<span>Check-in</span></button>
        <button onclick="showCoach('messages')">${svg("msg")}<span>Mensajes</span></button>`;
    }
    nav.style.setProperty("grid-template-columns","repeat(4,minmax(0,1fr))","important");'''
          new='''      nav.innerHTML=`
        <button onclick="showCoach('dashboard')">${svg("panel")}<span>Panel</span></button>
        <button onclick="showCoach('clients')">${svg("clients")}<span>Clientes</span></button>
        <button onclick="return false">${svg("calendar")}<span>Calendario</span></button>
        <button onclick="showCoach('checkins')">${svg("check")}<span>Check-in</span></button>
        <button onclick="showCoach('messages')">${svg("msg")}<span>Mensajes</span></button>`;
    }
    nav.style.setProperty("grid-template-columns","repeat(5,minmax(0,1fr))","important");'''
          if old not in s:
              raise SystemExit('nav block not found')
          s=s.replace(old,new)
          s=s.replace('`<div class="dcc-pd-empty">NO TIENES TAREAS PENDIENTES. TODO ESTÁ AL DÍA.</div>`','`<div class="dcc-pd-empty dcc-pd-empty-ok"><b>TODO AL DÍA</b><span>NO TIENES TAREAS PENDIENTES EN ESTE MOMENTO.</span></div>`')
          marker='})();'
          css='''

/* DCC final approved compact panel v2 */
(function(){
  const st=document.createElement('style');
  st.id='dcc-approved-compact-v2';
  st.textContent=`
    #coach-main.dcc-premium-dashboard{padding-top:5px!important;padding-bottom:86px!important}
    .dcc-pd-hero{min-height:198px!important;padding:11px 14px!important;border-radius:0!important}
    .dcc-pd-brand img{width:50px!important}.dcc-pd-brand-name{font-size:10px!important;letter-spacing:3.4px!important}.dcc-pd-brand-sub{font-size:7px!important;letter-spacing:2.7px!important}
    .dcc-pd-title{margin-top:35px!important;font-size:34px!important;line-height:1!important;max-width:60%!important}.dcc-pd-title:after{width:44px!important;margin-top:13px!important}
    .dcc-pd-strip{margin:5px 0 10px!important;border-radius:16px!important}.dcc-pd-stat{min-height:68px!important;padding:9px 7px!important}.dcc-pd-stat strong{font-size:20px!important}.dcc-pd-stat span{font-size:6.7px!important;line-height:1.3!important}
    .dcc-pd-section{margin-top:10px!important;padding:12px 14px!important;border-radius:17px!important}.dcc-pd-section-head{margin-bottom:4px!important}.dcc-pd-section-sub{margin-top:3px!important;font-size:10.5px!important}
    .dcc-pd-section.dcc-empty{padding:11px 14px!important}.dcc-pd-section.dcc-empty .dcc-pd-empty{padding:5px 0 1px!important}
    .dcc-pd-empty-ok{text-align:center!important;padding:9px 0 4px!important}.dcc-pd-empty-ok b{display:block;color:#f5f2ec;font-size:12px;letter-spacing:.4px}.dcc-pd-empty-ok span{display:block;margin-top:4px;color:#858c96;font-size:9.5px;letter-spacing:.2px}
    .dcc-pd-banner{margin-top:10px!important;min-height:70px!important;padding:10px 14px!important;gap:12px!important;border-radius:17px!important}.dcc-pd-trophy{font-size:22px!important}.dcc-pd-banner small{font-size:7.2px!important;letter-spacing:2.3px!important}.dcc-pd-banner strong{font-size:15px!important;margin-top:4px!important}
    #coach .side{height:64px!important;left:14px!important;right:14px!important;bottom:10px!important;border-radius:21px!important}#coach-nav{grid-template-columns:repeat(5,minmax(0,1fr))!important}#coach-nav button{padding:5px 2px!important}#coach-nav button svg{width:21px!important;height:21px!important}#coach-nav button span{font-size:7.3px!important;margin-top:2px!important}
    @media(max-width:700px){#coach-main.dcc-premium-dashboard{padding:5px 12px 86px!important}.dcc-pd-hero{min-height:194px!important}.dcc-pd-title{font-size:33px!important}.dcc-pd-section{padding:11px 13px!important}.dcc-pd-banner{padding:10px 13px!important}#coach .side{height:62px!important}}
  `;
  document.head.appendChild(st);
})();
'''
          s=s+css
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-premium.js
          git commit -m "Apply approved compact coach panel v2"
          git rm .github/workflows/one-shot-fix-approved-panel-v2.yml
          git commit -m "Remove one-shot approved panel workflow"
          git push
