name: final-runtime-sanitize-20260916
on:
  push:
    branches: [main]
    paths: ['.github/workflows/final-runtime-sanitize-20260916.yml']
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sanitize and record architecture diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="./nutrition-plan-premium-v1.js?v=20260911-1"></script>\n','')
          p.write_text(s,encoding='utf-8')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I)
          local=[x for x in srcs if x.startswith('./')]
          paths=[x.split('?',1)[0] for x in local]
          dup=sorted({x for x in paths if paths.count(x)>1})
          forbidden=['bottom-nav-light-premium-v1.js','clients-name-only-v1.js','clients-search-final-fix.js','coach-dashboard-authority-v1.js','coach-dashboard-bootstrap-v1.js','coach-navigation-authority-v1.js','dcc-coach-nav-final-v1.js','coach-bottom-nav-fix-v1.js','coach-calendar-nav-guard-v1.js','coach-calendar-sync-v14.js','coach-calendar-alignment-v13.js','coach-premium-final-v2.js','coach-ui-v11.js','coach-premium-v7.js']
          runtime=s+Path('coach-client-plan-status-v1.js').read_text(encoding='utf-8')+Path('coach-premium-v8.js').read_text(encoding='utf-8')
          loaded=[x for x in forbidden if x in runtime]
          theme_conflicts=[f for f in ['dcc-theme-system-v1.js','coach-theme-premium-global.js','coach-light-stable-v1.js'] if '#coach-nav' in Path(f).read_text(encoding='utf-8')]
          core=Path('coach-premium-core-v9.js').read_text(encoding='utf-8');support=Path('coach-client-plan-status-v1.js').read_text(encoding='utf-8');lib=Path('ejercicio-biblioteca.js').read_text(encoding='utf-8')
          alltext='\n'.join(x.read_text(encoding='utf-8',errors='ignore') for x in [Path('index.html'),*Path('.').glob('*.js')])
          syntax=[]
          for f in Path('.').glob('*.js'):
            r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode: syntax.append(f.name)
          checks={
            'direct_local_scripts':len(local),'duplicate_direct_scripts':dup,'checkin_direct_count':s.count('./checkin-coach-sync-v2.js'),'nutrition_v1_direct_count':s.count('./nutrition-plan-premium-v1.js'),'obsolete_runtime_loaded':loaded,'coach_nav_theme_conflicts':theme_conflicts,'core_nav_authority':('#coach-nav' in core and "showCoach('calendar')" in core),'calendar_v12_router':('dccRenderCoachCalendarV12' in core),'calendar_load_order':(support.index('coach-calendar-v12.js') < support.index('coach-calendar-form-fix-v15.js')),'exercise_hidden_loader':("createElement('script')" in lib or 'createElement("script")' in lib),'service_worker_registration':('serviceWorker.register' in alltext or 'navigator.serviceWorker' in alltext),'syntax_failures':syntax}
          Path('.github/runtime-audit-result.txt').write_text('\n'.join(f'{k}={v}' for k,v in checks.items())+'\n',encoding='utf-8')
          PY
      - name: Commit sanitation and remove one-shot workflow
        run: |
          rm .github/workflows/final-runtime-sanitize-20260916.yml
          git config user.name dcc-runtime-audit
          git config user.email actions@users.noreply.github.com
          git add index.html .github/runtime-audit-result.txt .github/workflows/final-runtime-sanitize-20260916.yml
          git commit -m 'Audit: finalize runtime sanitation and record checks'
          git push origin HEAD:main
