name: Fix client message routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-client-message-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix obsolete client message routes
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); a=s.count("showClient(\u0027coach\u0027)"); b=s.count("showClient(\"coach\")"); assert a+b>0, "No obsolete client coach routes found"; s=s.replace("showClient(\u0027coach\u0027)","showClient(\u0027messages\u0027)").replace("showClient(\"coach\")","showClient(\"messages\")"); p.write_text(s,encoding="utf-8"); print(f"Replaced {a+b} obsolete route(s)")'

      - name: Validate message routes
        shell: bash
        run: |
          python -c 'from pathlib import Path; s=Path("index.html").read_text(encoding="utf-8"); assert "showClient(\u0027coach\u0027)" not in s; assert "showClient(\"coach\")" not in s; assert "showClient(\u0027messages\u0027)" in s or "showClient(\"messages\")" in s; print("Client message routes validated")'

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-client-message-routing.yml
          git add index.html .github/workflows/fix-client-message-routing.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix client message navigation"
          git push origin main
