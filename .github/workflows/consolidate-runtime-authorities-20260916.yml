name: consolidate-runtime-authorities-20260916
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-runtime-authorities-20260916.yml']
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consolidate exercise and theme loaders
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          # Exercise library owns its data load; remove document.write compatibility loader and late UI injection.
          p=Path('ejercicio-biblioteca.js'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"  const realFetch=window\.fetch\.bind\(window\);\n  window\.fetch=function\(input,init\)\{.*?\n  window\.fetch=realFetch;\n", "  const realFetch=window.fetch.bind(window);\n", s, count=1, flags=re.S)
          if n!=1: raise SystemExit('exercise fetch/document.write compatibility block not found')
          s,n=re.subn(r"\n  /\* La pantalla premium del entrenamiento activo se carga al final,.*?\n  \},\{once:true\}\);\n", "\n  /* La UI del entrenamiento activo se carga desde el bootstrap determinista. */\n", s, count=1, flags=re.S)
          if n!=1: raise SystemExit('late workout UI loader not found')
          p.write_text(s,encoding='utf-8')

          # Deterministic support bootstrap now owns workout-session-premium-v3.
          p=Path('coach-client-plan-status-v1.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const BUILD='20260916-support-bootstrap-audit-v2';","const BUILD='20260916-support-bootstrap-audit-v3';")
          needle="  './training-interaction-fix-v1.js?v=20260916-audit1'\n];"
          repl="  './training-interaction-fix-v1.js?v=20260916-audit1',\n  './workout-session-premium-v3.js?v=20260916-audit2'\n];"
          if needle not in s: raise SystemExit('support module tail not found')
          s=s.replace(needle,repl,1);p.write_text(s,encoding='utf-8')

          # Merge coach light polish CSS into the single coach light stylesheet.
          g=Path('coach-theme-premium-global.js').read_text(encoding='utf-8')
          m=re.search(r"style\.textContent=`(.*?)`;\n    \(document\.head\|\|document\.documentElement\)\.appendChild\(style\);",g,re.S)
          if not m: raise SystemExit('coach polish CSS block not found')
          polish=m.group(1).strip()
          p=Path('coach-light-stable-v1.js'); stable=p.read_text(encoding='utf-8')
          marker='/* === CSS consolidado desde coach-theme-premium-global.js === */'
          if marker not in stable:
            close='\n@media(max-width:700px){\n  html.dcc-theme-light-premium body #coach #coach-main{padding:18px 14px 112px!important}\n}\n`;'
            if close not in stable: raise SystemExit('coach light closing block not found')
            merged='\n'+marker+'\n'+polish+'\n\n@media(max-width:700px){\n  html.dcc-theme-light-premium body #coach #coach-main{padding:18px 14px 112px!important}\n}\n`;'
            stable=stable.replace(close,merged,1)
          p.write_text(stable,encoding='utf-8')

          # Production load graph: direct, explicit order. Remove coach polish bootstrap entirely.
          p=Path('index.html'); idx=p.read_text(encoding='utf-8')
          idx=idx.replace('./ejercicio-biblioteca.js?v=20260916-audit1','./ejercicio-biblioteca.js?v=20260916-audit2')
          idx=idx.replace('./coach-client-plan-status-v1.js?v=20260916-audit1','./coach-client-plan-status-v1.js?v=20260916-audit3')
          old='<script src="./dcc-theme-system-v1.js?v=20260916-audit1"></script>\n<script src="./coach-theme-premium-global.js?v=20260916-audit1"></script>'
          new='<script src="./dcc-theme-system-v1.js?v=20260916-audit1"></script>\n<script src="./coach-light-stable-v1.js?v=20260916-audit2"></script>'
          if old not in idx: raise SystemExit('theme load pair not found')
          idx=idx.replace(old,new,1);p.write_text(idx,encoding='utf-8')

          # Final structural checks.
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',idx,re.I)
          local=[x for x in srcs if x.startswith('./')]; paths=[x.split('?',1)[0] for x in local]
          dup=sorted({x for x in paths if paths.count(x)>1})
          assert not dup, dup
          assert 'coach-theme-premium-global.js' not in idx
          assert idx.count('./coach-light-stable-v1.js')==1
          assert idx.count('./checkin-coach-sync-v2.js')==1
          assert 'document.write(' not in Path('ejercicio-biblioteca.js').read_text(encoding='utf-8')
          assert "createElement('script')" not in Path('ejercicio-biblioteca.js').read_text(encoding='utf-8')
          support=Path('coach-client-plan-status-v1.js').read_text(encoding='utf-8')
          assert support.count('workout-session-premium-v3.js')==1
          assert support.index('coach-calendar-v12.js') < support.index('coach-calendar-form-fix-v15.js')
          for f in ['dcc-theme-system-v1.js','coach-light-stable-v1.js']:
            assert '#coach-nav' not in Path(f).read_text(encoding='utf-8')
          core=Path('coach-premium-core-v9.js').read_text(encoding='utf-8')
          assert '#coach-nav' in core and 'dccRenderCoachCalendarV12' in core
          alltext='\n'.join(x.read_text(encoding='utf-8',errors='ignore') for x in [Path('index.html'),*Path('.').glob('*.js')])
          assert 'navigator.serviceWorker' not in alltext and 'serviceWorker.register' not in alltext
          bad=[]
          for f in Path('.').glob('*.js'):
            r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode: bad.append(f.name)
          assert not bad, bad
          Path('.github/runtime-audit-result.txt').unlink(missing_ok=True)
          print('FINAL_RUNTIME_AUDIT_OK')
          print('direct_local_scripts',len(local))
          print('duplicate_direct_scripts',dup)
          print('coach_nav_authority','coach-premium-core-v9.js')
          print('calendar_authority','coach-calendar-v12.js')
          print('coach_light_authority','coach-light-stable-v1.js')
          print('service_worker',False)
          print('syntax_failures',bad)
          PY
      - name: Commit and remove one-shot workflow
        run: |
          rm .github/workflows/consolidate-runtime-authorities-20260916.yml
          git config user.name dcc-runtime-audit
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Audit: consolidate final runtime authorities at source'
          git push origin HEAD:main
