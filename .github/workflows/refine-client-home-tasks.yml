name: Refine client home pending tasks

on:
  push:
    paths:
      - '.github/workflows/refine-client-home-tasks.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update client home
        run: python scripts/refine_client_home_tasks.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "Improve client pending tasks panel"
          git push origin main
