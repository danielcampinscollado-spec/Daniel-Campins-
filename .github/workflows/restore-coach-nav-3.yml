name: Restore coach navigation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-coach-nav-3.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: google-auth-rc
      - name: Restore three main coach tabs
        run: python3 .github/scripts/restore_coach_nav_3.py
      - name: Validate JavaScript
        run: node --check coach-premium-core-v9.js
      - name: Commit restore
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coach-premium-core-v9.js
          git commit -m "[ui] Restore three-tab coach main navigation"
          git push origin google-auth-rc
