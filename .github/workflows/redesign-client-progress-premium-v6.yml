name: Redesign client progress premium v6
on:
  push:
    paths: ['.github/workflows/redesign-client-progress-premium-v6.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace client progress screen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          start=s.index('if(screen==="progress"){')
          end=s.index('if(screen==="checkin"){',start)

          new=r'''if(screen==="progress"){

  const G="#f0bd4f";
  const GREEN="#45d79a";

  const safeNum=value=>{
    const n=parseFloat(String(value??"").replace(",","."));
    return Number.isFinite(n)?n:null;
  };

  const currentWeight=safeNum(c.weight)??0;
  const initialWeight=safeNum(c.initial??c.initial_weight)??currentWeight;

  let weightSeries=(data.weights?.[c.id]||[])
    .map(value=>safeNum(typeof value==="object"?(value.weight??value.value??value.peso):value))
    .filter(Number.isFinite);

  if(!weightSeries.length && initialWeight>0) weightSeries=[initialWeight];
  if(currentWeight>0 && (!weightSeries.length || Math.abs(weightSeries[weightSeries.length-1]-currentWeight)>.01)){
    weightSeries.push(currentWeight);
  }

  const weightChange=currentWeight-initialWeight;
  const weightPercent=initialWeight?weightChange/initialWeight*100:null;

  const initialBodyFat=
    c.bodyFatInitial!=null?safeNum(c.bodyFatInitial):
    c.initialBodyFat!=null?safeNum(c.initialBodyFat):
    c.initial_body_fat!=null?safeNum(c.initial_body_fat):null;

  const progressCheckin=data.checkins?.[c.id]||{};
  const currentBodyFat=
    progressCheckin.bodyFat!==undefined &&
    progressCheckin.bodyFat!==null &&
    progressCheckin.bodyFat!==""
      ? safeNum(progressCheckin.bodyFat)
      : null;

  const bodyFatChange=
    initialBodyFat!=null && currentBodyFat!=null
      ? currentBodyFat-initialBodyFat
      : null;

  const fatSeries=[];
  if(initialBodyFat!=null) fatSeries.push(initialBodyFat);
  if(currentBodyFat!=null && (fatSeries.length===0 || Math.abs(fatSeries[fatSeries.length-1]-currentBodyFat)>.01)){
    fatSeries.push(currentBodyFat);
  }

  const workoutHistory=(data.workoutHistory?.[c.id]||[])
    .slice()
    .filter(w=>w && w.date)
    .sort((a,b)=>new Date(a.date)-new Date(b.date));

  const exerciseKey=ex=>String(ex?.libraryId??ex?.id??ex?.name??ex?.nombre??"Ejercicio")
    .toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

  const exerciseName=ex=>ex?.name??ex?.nombre??ex?.exerciseName??"Ejercicio";

  const bestEstimatedStrength=ex=>{
    const sets=Array.isArray(ex?.sets)?ex.sets:[];
    let best=null;
    sets.forEach(set=>{
      const kg=safeNum(set?.kg??set?.weight??set?.peso);
      const reps=safeNum(set?.reps??set?.repetitions??set?.repeticiones);
      if(kg==null || reps==null || kg<0 || reps<=0) return;
      const estimated=kg*(1+reps/30);
      if(!best || estimated>best.estimated){
        best={kg,reps,estimated};
      }
    });
    return best;
  };

  const strengthMap=new Map();
  const strengthTimeline=[];
  const baselines=new Map();

  workoutHistory.forEach((session,sessionIndex)=>{
    const sessionChanges=[];
    (session.exercises||[]).forEach(ex=>{
      const best=bestEstimatedStrength(ex);
      if(!best) return;
      const key=exerciseKey(ex);
      const name=exerciseName(ex);

      if(!strengthMap.has(key)){
        strengthMap.set(key,{name,first:best,last:best,count:1});
      }else{
        const row=strengthMap.get(key);
        row.last=best;
        row.count+=1;
        if(!row.name) row.name=name;
      }

      if(!baselines.has(key)) baselines.set(key,best.estimated);
      const baseline=baselines.get(key);
      if(baseline>0){
        sessionChanges.push((best.estimated/baseline-1)*100);
      }
    });

    if(sessionChanges.length){
      strengthTimeline.push({
        v:sessionChanges.reduce((a,b)=>a+b,0)/sessionChanges.length,
        label:`S${sessionIndex+1}`
      });
    }
  });

  const strengthRows=[...strengthMap.values()]
    .map(row=>({
      ...row,
      change:row.count>=2 && row.first.estimated>0
        ? (row.last.estimated/row.first.estimated-1)*100
        : null
    }))
    .filter(row=>Number.isFinite(row.change))
    .sort((a,b)=>b.change-a.change);

  const improvedRows=strengthRows.filter(row=>row.change>0);
  const validStrengthChanges=strengthRows.map(row=>row.change).filter(Number.isFinite);
  const averageStrength=validStrengthChanges.length
    ? validStrengthChanges.reduce((a,b)=>a+b,0)/validStrengthChanges.length
    : null;

  const selectedMetric=window.clientProgressMetric||"force";

  window.setClientProgressMetric=function(metric){
    const y=window.scrollY;
    window.clientProgressMetric=metric;
    showClient("progress");
    requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"auto"})));
  };

  const spark=(values)=>{
    const vals=(values||[]).map(Number).filter(Number.isFinite);
    if(vals.length<2) return `<div class="dcpr-spark dcpr-spark-empty"></div>`;
    const w=150,h=38,p=3;
    const lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1;
    const pts=vals.map((v,i)=>{
      const x=p+i*(w-2*p)/(vals.length-1);
      const y=h-p-(v-lo)*(h-2*p)/span;
      return [x,y];
    });
    const line=pts.map((pt,i)=>`${i?"L":"M"}${pt[0].toFixed(1)},${pt[1].toFixed(1)}`).join(" ");
    const area=`${line} L${pts[pts.length-1][0].toFixed(1)},${h-p} L${pts[0][0].toFixed(1)},${h-p} Z`;
    return `<div class="dcpr-spark"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="dcprSparkFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${G}" stop-opacity=".22"/><stop offset="1" stop-color="${G}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#dcprSparkFill)"/><path d="${line}" fill="none" stroke="${G}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>`;
  };

  const metricChartData={
    weight:{
      label:"Peso",
      subtitle:"Tu peso semana a semana.",
      unit:" kg",
      values:weightSeries.map((v,i)=>({v,label:`R${i+1}`})),
      valueLabel:currentWeight>0?`${money(currentWeight)} kg`:"—"
    },
    fat:{
      label:"% de grasa",
      subtitle:"Tu composición corporal a lo largo del proceso.",
      unit:"%",
      values:fatSeries.map((v,i)=>({v,label:`R${i+1}`})),
      valueLabel:currentBodyFat!=null?`${money(currentBodyFat)}%`:"—"
    },
    force:{
      label:"Fuerza",
      subtitle:"Tu fuerza entrenamiento a entrenamiento.",
      unit:"%",
      values:strengthTimeline,
      valueLabel:averageStrength!=null?`${averageStrength>=0?"+":""}${money(averageStrength)}%`:"—"
    }
  };

  const selectedData=metricChartData[selectedMetric]||metricChartData.force;

  const premiumChart=dataSet=>{
    const points=(dataSet.values||[]).filter(item=>Number.isFinite(Number(item.v)));
    if(points.length<2){
      return `<div class="dcpr-chart-empty">Necesitamos más registros para mostrar esta evolución.</div>`;
    }

    const W=720,H=245,L=54,R=18,T=18,B=38;
    const vals=points.map(x=>Number(x.v));
    let min=Math.min(...vals),max=Math.max(...vals);
    let span=max-min;
    if(!span){span=Math.max(Math.abs(max)*.08,1);min-=span;max+=span;}
    else{const pad=span*.16;min-=pad;max+=pad;span=max-min;}

    const coords=vals.map((v,i)=>({
      x:L+i*(W-L-R)/(vals.length-1),
      y:T+(max-v)/span*(H-T-B),
      v,
      label:points[i].label||`R${i+1}`
    }));

    const line=coords.map((pt,i)=>`${i?"L":"M"}${pt.x.toFixed(1)},${pt.y.toFixed(1)}`).join(" ");
    const area=`${line} L${coords[coords.length-1].x.toFixed(1)},${H-B} L${coords[0].x.toFixed(1)},${H-B} Z`;

    const horizontal=Array.from({length:5},(_,i)=>{
      const y=T+i*(H-T-B)/4;
      const val=max-i*span/4;
      const label=dataSet.unit==="%"
        ? `${val>=0?"+":""}${val.toFixed(0)}%`
        : `${val.toFixed(0)}`;
      return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="rgba(145,159,174,.18)" stroke-dasharray="4 5"/><text x="8" y="${y+4}" fill="#7f8b98" font-size="11">${label}</text>`;
    }).join("");

    const vertical=coords.map(pt=>`<line x1="${pt.x}" y1="${T}" x2="${pt.x}" y2="${H-B}" stroke="rgba(145,159,174,.10)"/><text x="${pt.x}" y="${H-12}" text-anchor="middle" fill="#7f8b98" font-size="10">${esc(pt.label)}</text>`).join("");
    const dots=coords.map(pt=>`<circle cx="${pt.x}" cy="${pt.y}" r="4.2" fill="#f4c75c" stroke="#fff0bb" stroke-width="1.3"/>`).join("");

    return `<div class="dcpr-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="dcprArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${G}" stop-opacity=".30"/><stop offset="1" stop-color="${G}" stop-opacity="0"/></linearGradient><filter id="dcprGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>${horizontal}${vertical}<path d="${area}" fill="url(#dcprArea)"/><path d="${line}" fill="none" stroke="${G}" stroke-width="3.2" vector-effect="non-scaling-stroke" filter="url(#dcprGlow)"/>${dots}</svg></div>`;
  };

  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const nextMonth=new Date(now.getFullYear(),now.getMonth()+1,1);
  const monthWorkouts=workoutHistory.filter(w=>{
    const d=new Date(w.date);
    return d>=monthStart && d<nextMonth;
  }).length;
  const routine=Array.isArray(data.routines?.[c.id])?data.routines[c.id]:[];
  const monthlyTarget=routine.length?routine.length*4:0;
  const constancyPercent=monthlyTarget?Math.min(100,monthWorkouts/monthlyTarget*100):null;

  const weightChip=weightChange!==0
    ? `${weightChange>0?"+":""}${money(weightChange)} kg ${weightChange<0?"↓":"↑"}`
    : "Sin cambios";
  const fatChip=bodyFatChange!=null
    ? `${bodyFatChange>0?"+":""}${money(bodyFatChange)} pts ${bodyFatChange<0?"↓":"↑"}`
    : "Sin datos";
  const forceChip=averageStrength!=null
    ? `${improvedRows.length} ${improvedRows.length===1?"ejercicio mejorado":"ejercicios mejorados"}`
    : "Sin datos suficientes";

  const strengthDisplayRows=(improvedRows.length?improvedRows:strengthRows).slice(0,4);
  const bestProgress=improvedRows[0]||null;

  html=`
  <style id="dcc-client-progress-v6">
    #client-main .dcpr-wrap{width:100%;max-width:860px;margin:0 auto;padding:2px 0 34px;color:#f7f6f1}
    #client-main .dcpr-head{margin:4px 2px 18px}
    #client-main .dcpr-kicker{color:#e9b74d;font-size:11px;font-weight:850;letter-spacing:3px;text-transform:uppercase}
    #client-main .dcpr-head p{margin:8px 0 0;color:#9aa4b1;font-size:15px;line-height:1.35}
    #client-main .dcpr-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:11px}
    #client-main .dcpr-metric{position:relative;min-height:154px;padding:14px 13px 10px;overflow:hidden;border:1px solid rgba(232,178,68,.72);border-radius:21px;background:radial-gradient(circle at 100% 0,rgba(232,178,68,.12),transparent 36%),linear-gradient(145deg,#131a21 0%,#091016 72%,#070b10 100%);box-shadow:0 15px 36px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.035)}
    #client-main .dcpr-metric:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.025),transparent 65%);pointer-events:none}
    #client-main .dcpr-metric-top{position:relative;z-index:1;display:flex;align-items:center;gap:9px}
    #client-main .dcpr-icon{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid rgba(232,178,68,.36);border-radius:12px;background:rgba(232,178,68,.055);color:#f1c35d}
    #client-main .dcpr-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #client-main .dcpr-icon-percent{font-size:22px;font-weight:800}
    #client-main .dcpr-metric-copy{min-width:0}
    #client-main .dcpr-metric-title{color:#f4f4ef;font-size:14px;font-weight:780;line-height:1.1}
    #client-main .dcpr-metric-start{margin-top:3px;color:#919ca9;font-size:10px;line-height:1.25;white-space:nowrap}
    #client-main .dcpr-metric-value{position:relative;z-index:1;margin-top:14px;color:#fff;font-size:30px;font-weight:820;letter-spacing:-1.1px;line-height:1;white-space:nowrap}
    #client-main .dcpr-chip{position:relative;z-index:1;display:inline-flex;align-items:center;min-height:28px;margin-top:10px;padding:5px 10px;border:1px solid rgba(66,214,151,.62);border-radius:999px;background:rgba(20,111,75,.17);color:#58e3a7;font-size:10px;font-weight:800;white-space:nowrap}
    #client-main .dcpr-chip.neutral{border-color:#344351;background:#0b1219;color:#aab5c2}
    #client-main .dcpr-spark{position:absolute;right:8px;bottom:5px;width:48%;height:34px;opacity:.78;pointer-events:none}.dcpr-spark svg{width:100%;height:100%;display:block}.dcpr-spark-empty{display:none}
    #client-main .dcpr-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 0 12px;padding:4px;border:1px solid #26313c;border-radius:18px;background:linear-gradient(145deg,#0b1117,#070c11);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
    #client-main .dcpr-switch button{min-height:44px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:14px;background:transparent!important;color:#9ca8b5;font-size:11px;font-weight:800}
    #client-main .dcpr-switch button.active{border-color:#e5b347!important;background:radial-gradient(circle at 50% 0,rgba(242,194,91,.20),transparent 78%),linear-gradient(145deg,#2a2418,#15130d)!important;color:#f1c45e;box-shadow:0 0 20px rgba(226,171,62,.13),inset 0 1px 0 rgba(255,255,255,.04)}
    #client-main .dcpr-switch svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #client-main .dcpr-panel{position:relative;margin:0 0 12px;padding:16px;border:1px solid rgba(232,178,68,.72);border-radius:21px;background:radial-gradient(circle at 100% 0,rgba(232,178,68,.10),transparent 36%),linear-gradient(145deg,#111922,#071018);box-shadow:0 15px 38px rgba(0,0,0,.29),inset 0 1px 0 rgba(255,255,255,.03);overflow:hidden}
    #client-main .dcpr-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative;z-index:1}
    #client-main .dcpr-panel-title{display:flex;align-items:flex-start;gap:10px}.dcpr-panel-title .dcpr-icon{width:34px;height:34px;border:0;background:transparent}
    #client-main .dcpr-eyebrow{color:#e9b74d;font-size:10px;font-weight:850;letter-spacing:2.3px;text-transform:uppercase}
    #client-main .dcpr-panel h2{margin:2px 0 0!important;color:#f6f5f0!important;font-size:20px!important;line-height:1.1!important}
    #client-main .dcpr-sub{margin:4px 0 0;color:#8f9aa7;font-size:10px;line-height:1.35}
    #client-main .dcpr-chart-badge{flex:none;padding:8px 12px;border:1px solid rgba(232,178,68,.65);border-radius:14px;background:rgba(232,178,68,.055);color:#f1c45e;font-size:11px;font-weight:850;white-space:nowrap}
    #client-main .dcpr-chart{height:235px;margin-top:9px}.dcpr-chart svg{width:100%;height:100%;display:block;overflow:visible}.dcpr-chart-empty{height:210px;display:grid;place-items:center;padding:20px;color:#7f8b97;font-size:11px;text-align:center}
    #client-main .dcpr-force-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
    #client-main .dcpr-count{flex:none;padding:7px 10px;border:1px solid #2c3945;border-radius:999px;color:#9da9b5;font-size:9px;white-space:nowrap}
    #client-main .dcpr-force-list{border:1px solid #1f2a34;border-radius:15px;overflow:hidden;background:#071018}
    #client-main .dcpr-force-row{min-height:54px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #1f2a34}.dcpr-force-row:first-child{border-top:0}
    #client-main .dcpr-force-name{color:#f1f2ee;font-size:12px;font-weight:700;line-height:1.25}
    #client-main .dcpr-force-change{padding:5px 9px;border:1px solid rgba(53,210,143,.50);border-radius:999px;background:rgba(16,96,65,.16);color:#59e2aa;font-size:11px;font-weight:850;white-space:nowrap}
    #client-main .dcpr-force-empty{padding:22px 14px;text-align:center;color:#818c98;font-size:11px}
    #client-main .dcpr-best{display:flex;align-items:center;gap:9px;margin-top:8px;padding:10px 12px;border:1px solid rgba(232,178,68,.68);border-radius:13px;background:linear-gradient(90deg,rgba(232,178,68,.17),rgba(232,178,68,.03));color:#f0c35d;font-size:11px;font-weight:800}
    #client-main .dcpr-constancy{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:11px}
    #client-main .dcpr-constancy-copy{min-width:0}.dcpr-constancy-copy p{margin:4px 0 8px;color:#a0aab5;font-size:10px}.dcpr-constancy-pct{color:#f5f5ef;font-size:14px;font-weight:850}
    #client-main .dcpr-bar{height:8px;border:1px solid #283744;border-radius:999px;background:#0a1118;overflow:hidden}.dcpr-bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#e3a936,#f5ca64);box-shadow:0 0 16px rgba(240,190,76,.26)}
    @media(max-width:430px){
      #client-main .dcpr-head{margin-bottom:15px}.dcpr-head p{font-size:13px}
      #client-main .dcpr-metrics{gap:7px}.dcpr-metric{min-height:137px;padding:11px 9px 9px;border-radius:18px}.dcpr-icon{width:31px;height:31px;border-radius:10px}.dcpr-icon svg{width:17px;height:17px}.dcpr-icon-percent{font-size:18px}.dcpr-metric-title{font-size:11px}.dcpr-metric-start{font-size:8px}.dcpr-metric-value{font-size:23px;margin-top:12px}.dcpr-chip{min-height:25px;margin-top:8px;padding:4px 7px;font-size:8.5px}.dcpr-spark{right:5px;bottom:4px;height:27px;width:44%}
      #client-main .dcpr-switch button{min-height:40px;font-size:9.5px;gap:5px}.dcpr-switch svg{width:16px;height:16px}
      #client-main .dcpr-panel{padding:13px;border-radius:19px}.dcpr-panel h2{font-size:17px!important}.dcpr-chart-badge{padding:7px 9px;font-size:9.5px}.dcpr-chart{height:205px}.dcpr-chart-empty{height:180px}.dcpr-force-name{font-size:11px}.dcpr-force-row{min-height:50px;padding:9px 10px}.dcpr-count{font-size:8px;padding:6px 8px}
      #client-main .dcpr-constancy{grid-template-columns:34px minmax(0,1fr) auto;gap:8px}.dcpr-constancy .dcpr-icon{width:34px;height:34px}.dcpr-constancy-copy p{font-size:9px}
    }
    @media(max-width:370px){#client-main .dcpr-metric-value{font-size:20px}.dcpr-chip{font-size:7.8px;padding-left:6px;padding-right:6px}.dcpr-metric-title{font-size:10px}.dcpr-metric-start{font-size:7.5px}.dcpr-switch button{font-size:8.5px}}
  </style>

  <div class="dcpr-wrap">
    <div class="dcpr-head">
      <div class="dcpr-kicker">PROGRESO</div>
      <p>Así evoluciona tu cambio físico y tu fuerza.</p>
    </div>

    <div class="dcpr-metrics">
      <div class="dcpr-metric">
        <div class="dcpr-metric-top"><div class="dcpr-icon"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="12" rx="3"/><path d="M9 10c2-1.5 4-1.5 6 0"/><path d="M12 10v3"/></svg></div><div class="dcpr-metric-copy"><div class="dcpr-metric-title">Peso</div><div class="dcpr-metric-start">Inicio ${initialWeight?money(initialWeight)+" kg":"—"}</div></div></div>
        <div class="dcpr-metric-value">${currentWeight?money(currentWeight)+" kg":"—"}</div>
        <div class="dcpr-chip ${weightChange===0?"neutral":""}">${weightChip}</div>
        ${spark(weightSeries)}
      </div>

      <div class="dcpr-metric">
        <div class="dcpr-metric-top"><div class="dcpr-icon"><span class="dcpr-icon-percent">%</span></div><div class="dcpr-metric-copy"><div class="dcpr-metric-title">% de grasa</div><div class="dcpr-metric-start">Inicio ${initialBodyFat!=null?money(initialBodyFat)+"%":"Sin dato"}</div></div></div>
        <div class="dcpr-metric-value">${currentBodyFat!=null?money(currentBodyFat)+"%":"—"}</div>
        <div class="dcpr-chip ${bodyFatChange==null?"neutral":""}">${fatChip}</div>
        ${spark(fatSeries)}
      </div>

      <div class="dcpr-metric">
        <div class="dcpr-metric-top"><div class="dcpr-icon"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg></div><div class="dcpr-metric-copy"><div class="dcpr-metric-title">Fuerza</div><div class="dcpr-metric-start">Desde el inicio</div></div></div>
        <div class="dcpr-metric-value">${averageStrength!=null?`${averageStrength>=0?"+":""}${money(averageStrength)}%`:"—"}</div>
        <div class="dcpr-chip ${averageStrength==null?"neutral":""}">${forceChip}</div>
        ${spark(strengthTimeline.map(x=>x.v))}
      </div>
    </div>

    <div class="dcpr-switch">
      <button type="button" class="${selectedMetric==="weight"?"active":""}" onclick="setClientProgressMetric('weight')"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="12" rx="3"/><path d="M9 10c2-1.5 4-1.5 6 0"/></svg><span>Peso</span></button>
      <button type="button" class="${selectedMetric==="fat"?"active":""}" onclick="setClientProgressMetric('fat')"><span style="font-size:18px;line-height:1">%</span><span>% Grasa</span></button>
      <button type="button" class="${selectedMetric==="force"?"active":""}" onclick="setClientProgressMetric('force')"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg><span>Fuerza</span></button>
    </div>

    <div class="dcpr-panel">
      <div class="dcpr-panel-head">
        <div class="dcpr-panel-title"><div class="dcpr-icon"><svg viewBox="0 0 24 24"><path d="M5 18V13M10 18V9M15 18V5M4 19h16"/></svg></div><div><h2>Evolución</h2><p class="dcpr-sub">${selectedData.subtitle}</p></div></div>
        <div class="dcpr-chart-badge">${selectedData.valueLabel}</div>
      </div>
      ${premiumChart(selectedData)}
    </div>

    <div class="dcpr-panel">
      <div class="dcpr-force-head"><div><div class="dcpr-eyebrow">PROGRESO DE FUERZA</div><p class="dcpr-sub">Variación desde el inicio.</p></div><div class="dcpr-count">${improvedRows.length} ${improvedRows.length===1?"ejercicio mejorado":"ejercicios mejorados"}</div></div>
      <div class="dcpr-force-list">
        ${strengthDisplayRows.length?strengthDisplayRows.map(row=>`<div class="dcpr-force-row"><div class="dcpr-force-name">${esc(row.name)}</div><div class="dcpr-force-change">${row.change>=0?"+":""}${money(row.change)}%</div></div>`).join(""):`<div class="dcpr-force-empty">Registra varios entrenamientos para empezar a comparar tu fuerza.</div>`}
      </div>
      ${bestProgress?`<div class="dcpr-best"><span>★</span><span>Mejor progreso: ${esc(bestProgress.name)} · +${money(bestProgress.change)}%</span></div>`:""}
    </div>

    <div class="dcpr-panel">
      <div class="dcpr-constancy">
        <div class="dcpr-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 9h16"/><path d="m9 14 2 2 4-5"/></svg></div>
        <div class="dcpr-constancy-copy"><div class="dcpr-eyebrow">CONSTANCIA</div><p>${monthlyTarget?`${monthWorkouts} de ${monthlyTarget} entrenamientos completados este mes`:`${monthWorkouts} entrenamientos completados este mes`}</p><div class="dcpr-bar"><span style="width:${constancyPercent!=null?constancyPercent:0}%"></span></div></div>
        <div class="dcpr-constancy-pct">${constancyPercent!=null?Math.round(constancyPercent)+"%":monthWorkouts}</div>
      </div>
    </div>
  </div>
  `;
}

'''

