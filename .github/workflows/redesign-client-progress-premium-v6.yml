    const badge=tasks?.querySelector('.dcc-p9-count');if(badge)badge.textContent=String(total);
    const inner=tasks?.querySelector('.dcc-p9-inner');if(inner){
      inner.querySelectorAll('.dcc-audit-diet-row').forEach(x=>x.remove());
