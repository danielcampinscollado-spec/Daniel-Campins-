name: Source stability audit runner
on:
  push:
    paths: ['.github/workflows/redesign-client-progress-premium-v6.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source-level stability fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace_once('new-client-premium-v1.js', "${icon('fat')}<span>% de grasa inicial</span>", "${icon('fat')}<span>Grasa corporal inicial</span>", 'fat label')
          replace_once('new-client-premium-v1.js', "if(!Number.isFinite(bodyFat)||bodyFat<=0||bodyFat>=70){notify('Introduce un % de grasa válido');return}", "if(!Number.isFinite(bodyFat)||bodyFat<=0||bodyFat>=70){notify('Introduce un porcentaje de grasa válido');return}", 'fat validation copy')

          old="""    const id='client_'+Date.now();
    try{
      const {error}=await db.from('clients').insert({
        id,
        name,
        goal,
        weight,
        initial_weight:weight,
        initial_body_fat:bodyFat,
        age,
        height_cm:height,
        foods_to_avoid:foodsToAvoid,
        plan:'',
        status:'Pendiente'
      });
      if(error)throw error;

      const d=appData();
      d.clients=Array.isArray(d.clients)?d.clients:[];
      d.clients.push({id,name,goal,weight,initial:weight,bodyFatInitial:bodyFat,age,height:height,heightCm:height,height_cm:height,foodsToAvoid,foods_to_avoid:foodsToAvoid,plan:'',status:'Pendiente'});
      d.weights=d.weights||{};d.weights[id]=[weight];
      d.checkins=d.checkins||{};d.checkins[id]={weight:(typeof money==='function'?money(weight):String(weight))+' kg',bodyFat,diet:'Pendiente',training:'Pendiente',comment:'Pendiente de revisión.',reviewed:false};
      d.diets=d.diets||{};d.diets[id]={training:{calories:'',protein:'',meals:[]},rest:{calories:'',protein:'',meals:[]}};
      d.routines=d.routines||{};d.routines[id]=[];
      d.messages=d.messages||{};d.messages[id]=[];

      try{if(typeof saveData==='function')saveData();else if(typeof window.saveData==='function')window.saveData()}catch(e){}
      cleanupModal();
      try{if(typeof closeModal==='function')closeModal();else window.closeModal?.()}catch(e){}
      try{if(typeof showCoach==='function')showCoach('clients');else window.showCoach?.('clients')}catch(e){}
      notify('Cliente creado correctamente');
"""
          new="""    const id='client_'+Date.now();
    const createdAt=new Date().toISOString();
    try{
      const {error}=await db.from('clients').insert({
        id,
        name,
        goal,
        weight,
        initial_weight:weight,
        initial_body_fat:bodyFat,
        age,
        height_cm:height,
        foods_to_avoid:foodsToAvoid,
        plan:'',
        status:'Pendiente',
        created_at:createdAt
      });
      if(error)throw error;

      const writes=await Promise.all([
        db.from('client_weights').insert({client_id:id,weight,recorded_at:createdAt}),
        db.from('client_body_fat_history').insert({client_id:id,body_fat:bodyFat,recorded_at:createdAt}),
        db.from('client_checkins').upsert({client_id:id,weight:String(weight).replace('.',',')+' kg',body_fat:bodyFat,updated_at:createdAt},{onConflict:'client_id'})
      ]);
      const failed=writes.find(x=>x?.error);
      if(failed){await db.from('clients').delete().eq('id',id);throw failed.error}

      const d=appData();
      d.clients=Array.isArray(d.clients)?d.clients:[];
      d.clients.push({id,name,goal,weight,initial:weight,initial_weight:weight,bodyFatInitial:bodyFat,initial_body_fat:bodyFat,age,height,heightCm:height,height_cm:height,foodsToAvoid,foods_to_avoid:foodsToAvoid,plan:'',status:'Pendiente',created_at:createdAt});
      d.weights=d.weights||{};d.weights[id]=[weight];
      d.bodyFatHistory=d.bodyFatHistory||{};d.bodyFatHistory[id]=[{bodyFat,body_fat:bodyFat,recorded_at:createdAt}];
      d.checkins=d.checkins||{};d.checkins[id]={weight:(typeof money==='function'?money(weight):String(weight))+' kg',bodyFat,body_fat:bodyFat,diet:'Pendiente',training:'Pendiente',energy:'Pendiente',comment:'Pendiente de revisión.',reviewed:false,updatedAt:createdAt,updated_at:createdAt};
      d.diets=d.diets||{};d.diets[id]={training:{calories:'',protein:'',meals:[]},rest:{calories:'',protein:'',meals:[]}};
      d.routines=d.routines||{};d.routines[id]=[];
      d.messages=d.messages||{};d.messages[id]=[];

      try{if(typeof saveData==='function')saveData();else if(typeof window.saveData==='function')window.saveData()}catch(e){}
      cleanupModal();
      try{if(typeof closeModal==='function')closeModal();else window.closeModal?.()}catch(e){}
      window.selectedClient=id;window.__dccClientAdminId=id;
      try{
        if(typeof window.dccClientAdmin==='function')window.dccClientAdmin(id,'summary');
        else if(typeof window.openClient==='function')window.openClient(id);
        else if(typeof showCoach==='function')showCoach('clients');
      }catch(e){console.error('DCC abriendo cliente recién creado:',e);window.showCoach?.('clients')}
      notify('Cliente creado correctamente');
"""
          replace_once('new-client-premium-v1.js', old, new, 'native create client flow')
          replace_once('new-client-premium-v1.js', "  };\n\n  /* Mantener edad y altura sincronizadas desde Supabase sin añadir espera. */", "  };\n  window.createClient.__dccAuditCreateFlowV11=true;\n\n  /* Mantener edad y altura sincronizadas desde Supabase sin añadir espera. */", 'native create marker')

          replace_once('coach-panel-state-v10.js', "'\\\"':'&quot'", "'\\\"':'&quot;'", 'html quote escaping')

          old_tasks="""  function patchTasks(main){
