name: Source stability v29
on:
  push:
    paths:
      - '.github/workflows/run-source-stability-v29.yml'
      - '.github/scripts/source_stability_v29.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/source_stability_v29.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new-client-premium-v1.js coach-panel-state-v10.js
          git commit -m "Stabilize native client creation and coach task refresh"
          git push
