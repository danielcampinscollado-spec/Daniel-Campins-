name: Refine client diet UI
on:
  push:
    paths: ['.github/workflows/refine-client-diet-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine diet UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          heading = '''      <h1>\n        Tu alimentación\n      </h1>\n\n'''
          if heading not in s:
              raise SystemExit('Diet heading not found')
          s = s.replace(heading, '')

          s = s.replace('''      <strong>\n        Tu dieta completa\n      </strong>''', '''      <strong>\n        Plan de alimentación\n      </strong>''')
          s = s.replace('''      <span>\n        Descarga tu plan de alimentación\n        en formato PDF.\n      </span>''', '''      <span>\n        PDF personalizado\n      </span>''')
          s = s.replace('''      <span>\n        DESCARGAR PDF\n      </span>''', '''      <span>\n        DESCARGAR\n      </span>''')

          style = '''\n<style id="dcc-diet-pdf-compact">\n.diet-pdf-card{\n  min-height:76px!important;\n  padding:10px 12px!important;\n  gap:10px!important;\n  border-radius:17px!important;\n  border-color:rgba(217,170,74,.24)!important;\n  background:linear-gradient(145deg,rgba(20,24,30,.96),rgba(10,13,17,.96))!important;\n  box-shadow:0 10px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.025)!important;\n}\n.diet-pdf-icon{\n  flex:0 0 34px!important;\n  width:34px!important;\n  height:42px!important;\n  max-width:34px!important;\n  max-height:42px!important;\n}\n.diet-pdf-icon svg{\n  width:29px!important;\n  height:35px!important;\n  max-width:29px!important;\n  max-height:35px!important;\n}\n.diet-pdf-text strong{\n  font-size:14px!important;\n  line-height:1.15!important;\n  font-weight:750!important;\n  letter-spacing:-.15px!important;\n}\n.diet-pdf-text span{\n  margin-top:3px!important;\n  font-size:10px!important;\n  line-height:1.25!important;\n  color:#8f97a3!important;\n}\n.diet-pdf-button{\n  min-height:36px!important;\n  padding:8px 11px!important;\n  border-radius:12px!important;\n  max-width:none!important;\n  gap:6px!important;\n  background:rgba(217,170,74,.045)!important;\n  border-color:rgba(217,170,74,.48)!important;\n  box-shadow:inset 0 1px 0 rgba(255,255,255,.02)!important;\n}\n.diet-pdf-button svg{\n  width:15px!important;\n  height:15px!important;\n  max-width:15px!important;\n  max-height:15px!important;\n}\n.diet-pdf-button span{\n  font-size:9px!important;\n  font-weight:750!important;\n  letter-spacing:.65px!important;\n}\n@media(max-width:390px){\n  .diet-pdf-card{min-height:72px!important;padding:9px 10px!important;gap:8px!important}\n  .diet-pdf-icon{flex-basis:30px!important;width:30px!important;height:38px!important}\n  .diet-pdf-icon svg{width:26px!important;height:32px!important}\n  .diet-pdf-text strong{font-size:13px!important}\n  .diet-pdf-text span{font-size:9px!important}\n  .diet-pdf-button{min-height:34px!important;padding:7px 9px!important}\n  .diet-pdf-button span{font-size:8.5px!important}\n}\n</style>\n'''
          if 'id="dcc-diet-pdf-compact"' not in s:
              s = s.replace('</body>', style + '\n</body>')

          p.write_text(s)
          PY
      - name: Commit changes and remove one-shot workflow
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/refine-client-diet-ui.yml
          git add index.html
          git commit -m "Compact client diet PDF card and simplify header"
          git pull --rebase origin main
          git push origin main
