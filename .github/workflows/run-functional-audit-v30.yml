name: Functional audit v30
on:
  push:
    paths:
      - '.github/workflows/run-functional-audit-v30.yml'
      - '.github/scripts/functional_audit_v30.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/functional_audit_v30.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-admin-premium.js client-profile-preferences-v1.js coach-client-plan-status-v1.js coach-panel-state-v10.js
          git commit -m "Fix client metrics saves warnings and render loops"
          git push
