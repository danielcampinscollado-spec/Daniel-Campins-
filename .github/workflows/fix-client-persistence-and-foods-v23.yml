name: Fix client persistence and foods v23

on:
  push:
    paths:
      - '.github/workflows/fix-client-persistence-and-foods-v23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply client persistence patch
        run: |
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCByZQppbmRleD1QYXRoKCdpbmRleC5odG1sJykKdGV4dD1pbmRleC5yZWFkX3RleHQoKQpwYXR0ZXJuPXJlLmNvbXBpbGUociJhc3luYyBmdW5jdGlvbiBsb2FkQ2xpZW50c0Zyb21TdXBhYmFzZVxcKFxcKVxcey4qP1xcblxcfVxcblxc  d2Via2l0LXRleHQtZmlsbC1jb2xvcjojNmY3NzgyIWltcG9ydGFudDtv ' | tr -d ' ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit definitive client persistence fix
        run: |
          git config user.name "danielcampinscollado-spec"
          git config user.email "danielcampinscollado@gmail.com"
          git add index.html new-client-premium-v2.js
          git commit -m "Make client deletion permanent and add native food preferences"
          git push origin main
