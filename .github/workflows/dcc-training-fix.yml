name: DCC training fix

on:
  push:
    paths:
      - '.github/workflows/dcc-training-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch training flow
        run: python3 .github/dcc_patch.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix RepDB images and global workout rests"
          git push origin HEAD:main
