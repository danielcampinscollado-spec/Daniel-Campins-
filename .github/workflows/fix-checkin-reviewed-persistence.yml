name: Fix check-in reviewed persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-checkin-reviewed-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply check-in reviewed persistence fix
        run: python .github/scripts/fix-checkin-reviewed-persistence.py

      - name: Validate check-in reviewed persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '.from("client_checkins")' in s
          assert 'reviewed:true' in s
          assert '.eq("client_id",id)' in s
          assert 'status:"Revisado"' in s
          print('Check-in review persistence validated')
          PY

      - name: Commit fix and remove one-shot files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/scripts/fix-checkin-reviewed-persistence.py
          rm -f .github/workflows/fix-checkin-reviewed-persistence.yml
          git add index.html .github/scripts/fix-checkin-reviewed-persistence.py .github/workflows/fix-checkin-reviewed-persistence.yml
          git diff --cached --quiet && exit 0
          git commit -m "Persist reviewed check-ins in Supabase"
          git push origin main
