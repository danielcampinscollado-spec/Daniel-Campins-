name: Remaining JavaScript syntax fixes v33

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_remaining_syntax_v33.py'
      - '.github/workflows/run-fix-remaining-syntax-v33.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply remaining syntax fixes
        run: python3 .github/scripts/fix_remaining_syntax_v33.py
      - name: Validate every root JavaScript file
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            echo "Checking $file"
            if ! node --check "$file"; then failed=1; fi
          done < <(find . -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort)
          exit "$failed"
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client-delete-persist-v1.js client-metrics-sync-v10.js client-progress-final-v9.js progress-premium.js
          git commit -m "Fix remaining JavaScript syntax errors"
          git push
