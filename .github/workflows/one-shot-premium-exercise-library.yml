name: Wire premium DCC exercise library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-premium-exercise-library.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch runtime to local DCC catalog
        run: echo '' | base64 -d | python3
      - name: Commit runtime patch and remove workflow
        run: |
          rm .github/workflows/one-shot-premium-exercise-library.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrenamientos/runtime-compat.js .github/workflows/one-shot-premium-exercise-library.yml
          git commit -m "Use local premium DCC exercise library"
          git push
