name: Enable premium coach dashboard
on:
  push:
    paths:
      - '.github/workflows/one-shot-enable-premium-dashboard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./coach-premium.js"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
              else:
                  s=s+'\n'+tag+'\n'
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load premium coach dashboard" || true
          git rm .github/workflows/one-shot-enable-premium-dashboard.yml
          git commit -m "Remove one-shot premium dashboard workflow"
          git push
