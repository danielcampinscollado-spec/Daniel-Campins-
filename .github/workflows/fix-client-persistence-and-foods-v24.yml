name: Fix client persistence and foods v24

on:
  push:
    paths:
      - '.github/workflows/fix-client-persistence-and-foods-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply definitive client persistence patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path("index.html")
          text = index.read_text()

          pattern = re.compile(
              r'async function loadClientsFromSupabase\(\)\{.*?\n\}\s*async function loadWorkoutHistoryFromSupabase\(\)\{',
              re.S
          )
          replacement = r"""async function loadClientsFromSupabase(){
            try{
              const {data:clients,error}=await supabaseClient
                .from("clients")
                .select("id,name,goal,weight,initial_weight,initial_body_fat,age,height_cm,foods_to_avoid,plan,status,created_at")
                .order("created_at",{ascending:true});
              if(error){console.error("Error cargando clientes:",error);return}

              const previous=new Map((data.clients||[]).map(c=>[String(c.id),c]));
              data.clients=(clients||[]).map(row=>{
                const old=previous.get(String(row.id))||{};
                return {
                  ...old,
                  id:row.id,
                  name:row.name,
                  goal:row.goal||"",
                  weight:Number(row.weight)||0,
                  initial:Number(row.initial_weight)||Number(row.weight)||0,
                  bodyFatInitial:row.initial_body_fat!=null?Number(row.initial_body_fat):null,
                  age:row.age!=null?Number(row.age):null,
                  height:row.height_cm!=null?Number(row.height_cm):null,
                  heightCm:row.height_cm!=null?Number(row.height_cm):null,
                  height_cm:row.height_cm!=null?Number(row.height_cm):null,
                  foodsToAvoid:String(row.foods_to_avoid||""),
                  foods_to_avoid:String(row.foods_to_avoid||""),
                  plan:row.plan||"",
                  status:row.status||"Pendiente",
                  created_at:row.created_at||old.created_at||null
                };
              });

              const valid=new Set(data.clients.map(c=>String(c.id)));
              ["checkins","diets","routines","weights","workoutHistory","bodyFatHistory","messages","notificationState"].forEach(key=>{
                const obj=data[key];
                if(!obj||typeof obj!=="object"||Array.isArray(obj))return;
                Object.keys(obj).forEach(id=>{if(!valid.has(String(id)))delete obj[id]});
              });

              saveData();
            }catch(e){
              console.error("Error conectando con Supabase para clientes:",e);
            }
          }
          async function loadWorkoutHistoryFromSupabase(){"""
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit("loadClientsFromSupabase block not found")

          text = re.sub(
              r'<script src="\./client-admin-premium\.js\?v=[^"]+"></script>',
              '<script src="./client-admin-premium.js?v=20260910-2405"></script>',
              text,
              count=1
          )
          index.write_text(text)

          newc = Path("new-client-premium-v1.js")
          src = newc.read_text()

          button = """        <button type="button" id="dcc-create-client-btn" class="dcc-nc-create" onclick="createClient()">Crear cliente <span>→</span></button>"""
          field = """        <label class="dcc-nc-field">
            <span class="dcc-nc-label"><span>Alimentos a evitar</span></span>
            <input class="dcc-nc-input" id="new-foods-avoid" placeholder="Ej. cebolla, aceitunas, marisco">
          </label>

                  <button type="button" id="dcc-create-client-btn" class="dcc-nc-create" onclick="createClient()">Crear cliente <span>→</span></button>"""
          if 'id="new-foods-avoid"' not in src:
              if button not in src:
                  raise SystemExit("new client button not found")
              src = src.replace(button, field, 1)

          goal = "    const goal=document.getElementById('new-goal')?.value.trim()||'';\n"
          foods = "    const foodsToAvoid=document.getElementById('new-foods-avoid')?.value.trim()||'';\n"
          if foods not in src:
              if goal not in src:
                  raise SystemExit("new client goal line not found")
              src = src.replace(goal, goal + foods, 1)

          payload = """        age,
                  height_cm:height,
                  plan:'',
          """
          payload2 = """        age,
                  height_cm:height,
                  foods_to_avoid:foodsToAvoid,
                  plan:'',
          """
          if "foods_to_avoid:foodsToAvoid" not in src:
              if payload not in src:
                  raise SystemExit("new client payload not found")
              src = src.replace(payload, payload2, 1)

          oldpush = "      d.clients.push({id,name,goal,weight,initial:weight,bodyFatInitial:bodyFat,age,heightCm:height,plan:'',status:'Pendiente'});"
          newpush = "      d.clients.push({id,name,goal,weight,initial:weight,bodyFatInitial:bodyFat,age,height:height,heightCm:height,height_cm:height,foodsToAvoid,foods_to_avoid:foodsToAvoid,plan:'',status:'Pendiente'});"
          if oldpush in src:
              src = src.replace(oldpush, newpush, 1)

          src = src.replace("select('id,age,height_cm')","select('id,age,height_cm,foods_to_avoid')",1)
          src = src.replace(
              "if(c){c.age=row.age!=null?Number(row.age):null;c.heightCm=row.height_cm!=null?Number(row.height_cm):null}",
              "if(c){c.age=row.age!=null?Number(row.age):null;c.height=row.height_cm!=null?Number(row.height_cm):null;c.heightCm=row.height_cm!=null?Number(row.height_cm):null;c.height_cm=row.height_cm!=null?Number(row.height_cm):null;c.foodsToAvoid=String(row.foods_to_avoid||'');c.foods_to_avoid=String(row.foods_to_avoid||'')}",
              1
          )
          newc.write_text(src)

          admin = Path("client-admin-premium.js")
          atext = admin.read_text()
          old = "window.dccLegacyDelete=id=>{if(!confirm('¿Eliminar este cliente?'))return;data.clients=data.clients.filter(x=>String(x.id)!==String(id));if(typeof saveData==='function')saveData();showCoach('clients')};"
          new = "window.dccLegacyDelete=async id=>{const cl=c(id);if(!cl)return;if(!confirm('¿Eliminar definitivamente a '+cl.name+'?'))return;try{if(!window.supabaseClient)throw new Error('Sin conexión con Supabase');try{await supabaseClient.from('dietas').delete().eq('client_id',id)}catch(e){}const {data:deleted,error}=await supabaseClient.from('clients').delete().eq('id',id).select('id');if(error)throw error;if(!Array.isArray(deleted)||!deleted.length)throw new Error('El servidor no confirmó la eliminación');data.clients=(data.clients||[]).filter(x=>String(x.id)!==String(id));['checkins','diets','routines','weights','workoutHistory','bodyFatHistory','messages','notificationState'].forEach(k=>{if(data[k]&&typeof data[k]==='object')delete data[k][id]});if(typeof saveData==='function')saveData();if(typeof showCoach==='function')showCoach('clients');if(typeof toast==='function')toast('Cliente eliminado definitivamente')}catch(e){console.error('Error eliminando cliente:',e);if(typeof toast==='function')toast('No se pudo eliminar el cliente');else alert('No se pudo eliminar el cliente')}};"
          if old not in atext:
              if "Cliente eliminado definitivamente" not in atext:
                  raise SystemExit("legacy delete marker not found")
          else:
              atext = atext.replace(old,new,1)
          admin.write_text(atext)

          sync = Path("checkin-coach-sync-v2.js")
          stext = sync.read_text()
          stext = re.sub(
              r"new-client-premium-v1\.js\?v=[0-9-]+",
              "new-client-premium-v1.js?v=20260910-2405",
              stext,
              count=1
          )
          stext = re.sub(
              r"client-profile-preferences-v1\.js\?v=[0-9-]+",
              "client-profile-preferences-v1.js?v=20260910-2405",
              stext,
              count=1
          )
          sync.write_text(stext)

          print("ok")
          PY

      - name: Commit definitive client persistence fix
        run: |
          git config user.name "danielcampinscollado-spec"
          git config user.email "danielcampinscollado@gmail.com"
          git add index.html new-client-premium-v1.js client-admin-premium.js checkin-coach-sync-v2.js
          git commit -m "Make client deletion permanent and add food preferences"
          git push origin main
