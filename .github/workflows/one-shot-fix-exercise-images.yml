name: Fix exercise image mapping
on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-exercise-images.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch illustrated set
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ejercicio-biblioteca.js')
          s=p.read_text()
          old='''  const illustrated=new Set([\n    "press-banca-barra",\n    "jalon-pecho-ancho",\n    "remo-sentado-polea-neutro",\n    "extension-triceps-cuerda"\n  ]);'''
          new='''  const illustrated=new Set([\n    "press-banca-barra",\n    "jalon-pecho-ancho",\n    "remo-sentado-polea-neutro",\n    "extension-triceps-cuerda",\n    "press-hombro-maquina",\n    "prensa-45",\n    "extension-cuadriceps",\n    "hip-thrust-maquina",\n    "press-banca-mancuernas",\n    "press-inclinado-barra",\n    "press-inclinado-mancuernas",\n    "press-pecho-maquina",\n    "press-inclinado-maquina",\n    "press-convergente-maquina",\n    "aperturas-pec-deck",\n    "cruces-polea-media",\n    "cruces-polea-alta",\n    "cruces-polea-baja",\n    "flexiones",\n    "press-declinado-maquina",\n    "press-pecho-iso-lateral",\n    "press-inclinado-iso-lateral",\n    "press-banca-multipower",\n    "press-inclinado-multipower",\n    "aperturas-polea-banco",\n    "extension-triceps-barra",\n    "extension-triceps-unilateral",\n    "extension-triceps-sobre-cabeza",\n    "fondos-maquina-asistida",\n    "press-triceps-maquina",\n    "press-cerrado-barra",\n    "extension-triceps-tumbado-ez",\n    "fondos-maquina",\n    "extension-triceps-maquina",\n    "extension-triceps-polea-agarre-inverso",\n    "extension-triceps-sobre-cabeza-unilateral"\n  ]);'''
          if old not in s:
              raise SystemExit('Target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ejercicio-biblioteca.js
          git commit -m "Fix premium exercise image mapping"
          git push origin main
      - name: Remove one-shot workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/one-shot-fix-exercise-images.yml
          git commit -m "Remove one-shot image mapping workflow"
          git push origin main
