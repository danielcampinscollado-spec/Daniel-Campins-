name: One-shot Light Premium training modal

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/light-training-modal-20260912.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch training inline modal at source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('training-inline-fix.js')
          s=p.read_text()
          old=""".dcc-tr-modal{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px}.dcc-tr-modal-card{width:min(680px,100%);max-height:82vh;overflow:auto;border:1px solid #8c692b;border-radius:22px 22px 14px 14px;background:linear-gradient(160deg,#11171c,#070b0e);box-shadow:0 -24px 60px #000;padding:14px}.dcc-tr-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.dcc-tr-modal-head h3{margin:0;font-size:18px}.dcc-tr-modal-close{width:34px;height:34px;border:1px solid #39434b;border-radius:50%;background:#0a0e12;color:#ddd;font-size:18px}.dcc-tr-modal-sub{color:#8f98a3;font-size:10px;margin:-4px 0 10px}.dcc-tr-chiprow{display:flex;gap:6px;flex-wrap:wrap}.dcc-tr-chip{border:1px solid #39434b;border-radius:999px;background:#0b1014;color:#abb3bc;padding:8px 10px;font-size:10px;font-weight:750}.dcc-tr-chip.on{border-color:#e0ad4c;background:#1a1409;color:#f2c85f}.dcc-tr-modal-save{width:100%;margin-top:12px;padding:11px;border:1px solid #f2c85f;border-radius:12px;background:linear-gradient(135deg,#f3cf69,#d9a63d);color:#090806;font-weight:900}.dcc-tr-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.dcc-tr-tabx{flex:none;border:1px solid #39434b;border-radius:999px;background:#0b1014;color:#aab2bb;padding:7px 10px;font-size:9px}.dcc-tr-tabx.on{border-color:#e0ad4c;color:#f2c85f;background:#1a1409}.dcc-tr-ex-list{display:grid;gap:7px}.dcc-tr-choice{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;padding:6px;border:1px solid #26313a;border-radius:12px;background:#0c1216;color:#f3f1ed;text-align:left}.dcc-tr-choice img{width:50px;height:46px;border-radius:8px;object-fit:contain;background:#ededeb}.dcc-tr-choice .noimg{width:50px;height:46px;border:1px solid #303941;border-radius:8px;display:grid;place-items:center;color:#69737d;font-size:9px}.dcc-tr-choice b{display:block;font-size:10px}.dcc-tr-choice small{display:block;margin-top:3px;color:#8f98a3;font-size:8px}.dcc-tr-choice strong{color:#e4b84f;font-size:20px}.dcc-tr-manual{width:100%;margin-top:9px;padding:9px;border:1px dashed #765b2c;border-radius:11px;background:transparent;color:#c9a34e;font-size:9px;font-weight:850}"""
          new=""".dcc-tr-modal{position:fixed;inset:0;z-index:99999;background:rgba(55,45,30,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:12px}.dcc-tr-modal-card{width:min(680px,100%);max-height:82vh;overflow:auto;border:1px solid rgba(183,123,19,.34);border-radius:22px 22px 14px 14px;background:linear-gradient(160deg,#fffdf8 0%,#f7eedf 100%);color:#17191d;box-shadow:0 -18px 48px rgba(78,58,28,.16),inset 0 1px 0 rgba(255,255,255,.96);padding:14px}.dcc-tr-modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.dcc-tr-modal-head h3{margin:0;font-size:18px;color:#17191d}.dcc-tr-modal-close{width:34px;height:34px;border:1px solid rgba(183,123,19,.34);border-radius:50%;background:#fff8e8;color:#8d5b08;font-size:18px}.dcc-tr-modal-sub{color:#737b86;font-size:10px;margin:-4px 0 10px}.dcc-tr-chiprow{display:flex;gap:6px;flex-wrap:wrap}.dcc-tr-chip{border:1px solid rgba(183,123,19,.28);border-radius:999px;background:#fffdf8;color:#4e5560;padding:8px 10px;font-size:10px;font-weight:750;box-shadow:none}.dcc-tr-chip.on{border-color:#d9aa4a;background:linear-gradient(135deg,#f7d97f,#e7b13f);color:#1a150b}.dcc-tr-modal-save{width:100%;margin-top:12px;padding:11px;border:1px solid #e2b044;border-radius:12px;background:linear-gradient(135deg,#f3cf69,#d9a63d);color:#090806;font-weight:900}.dcc-tr-tabs{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.dcc-tr-tabx{flex:none;border:1px solid rgba(183,123,19,.28);border-radius:999px;background:#fffdf8;color:#626a75;padding:7px 10px;font-size:9px}.dcc-tr-tabx.on{border-color:#d9aa4a;color:#1a150b;background:linear-gradient(135deg,#f7d97f,#e7b13f)}.dcc-tr-ex-list{display:grid;gap:7px}.dcc-tr-choice{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:9px;width:100%;padding:6px;border:1px solid rgba(183,123,19,.22);border-radius:12px;background:#fffdf8;color:#17191d;text-align:left}.dcc-tr-choice img{width:50px;height:46px;border-radius:8px;object-fit:contain;background:#f4f0e8}.dcc-tr-choice .noimg{width:50px;height:46px;border:1px solid rgba(183,123,19,.22);border-radius:8px;display:grid;place-items:center;color:#7a828c;font-size:9px;background:#fffaf1}.dcc-tr-choice b{display:block;font-size:10px;color:#17191d}.dcc-tr-choice small{display:block;margin-top:3px;color:#7a828c;font-size:8px}.dcc-tr-choice strong{color:#b77b13;font-size:20px}.dcc-tr-manual{width:100%;margin-top:9px;padding:9px;border:1px dashed rgba(183,123,19,.42);border-radius:11px;background:#fffaf1;color:#9a6408;font-size:9px;font-weight:850}"""
          if old not in s:
              raise SystemExit('Expected modal CSS block not found; no file changed')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "dcc-stability-bot"
          git config user.email "actions@users.noreply.github.com"
          git add training-inline-fix.js
          git diff --cached --quiet && exit 0
          git commit -m "Convert training editor modals to Light Premium"
          git push
