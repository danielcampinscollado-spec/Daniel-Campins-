name: Collapse coach training days
on:
  push:
    branches: [google-auth-rc]
    paths:
      - '.github/workflows/collapse-training-days-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply collapsed days behavior
        run: python3 .github/scripts/collapse_training_days_v1.py
      - name: Validate JavaScript
        run: node --check client-admin-premium.js && node --check training-day-wizard-v1.js
      - name: Commit change
        run: |
          git config user.name dcc-training-ui
          git config user.email actions@users.noreply.github.com
          git add client-admin-premium.js training-day-wizard-v1.js
          git commit -m '[training] Start routine days collapsed'
          git push
