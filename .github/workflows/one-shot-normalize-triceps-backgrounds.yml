name: Normalize triceps illustration backgrounds
on:
  push:
    paths:
      - '.github/workflows/one-shot-normalize-triceps-backgrounds.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Normalize white backgrounds to DCC dark
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque
          import os

          files = [
            'entrenamientos/ilustraciones/fondos-maquina-asistida.webp',
            'entrenamientos/ilustraciones/press-triceps-maquina.webp',
            'entrenamientos/ilustraciones/fondos-maquina.webp',
            'entrenamientos/ilustraciones/extension-triceps-sobre-cabeza-unilateral.webp',
          ]

          def process(path):
              im = Image.open(path).convert('RGB')
              px = im.load(); w,h = im.size
              cand = [[False]*w for _ in range(h)]
              for y in range(h):
                  for x in range(w):
                      r,g,b = px[x,y]
                      mx=max(r,g,b); mn=min(r,g,b); mean=(r+g+b)/3
                      cand[y][x] = mean > 185 and (mx-mn) < 34

              seen = [[False]*w for _ in range(h)]
              comps=[]
              for y in range(h):
                  for x in range(w):
                      if not cand[y][x] or seen[y][x]:
                          continue
                      q=deque([(x,y)]); seen[y][x]=True; comp=[]; total=0
                      while q:
                          cx,cy=q.popleft(); comp.append((cx,cy))
                          r,g,b=px[cx,cy]; total += (r+g+b)/3
                          for nx,ny in ((cx+1,cy),(cx-1,cy),(cx,cy+1),(cx,cy-1)):
                              if 0<=nx<w and 0<=ny<h and cand[ny][nx] and not seen[ny][nx]:
                                  seen[ny][nx]=True; q.append((nx,ny))
                      if len(comp) > w*h*0.01 and total/len(comp) > 205:
                          comps.append(comp)

              bg=(8,10,12)
              for comp in comps:
                  for x,y in comp:
                      r,g,b=px[x,y]
                      mean=(r+g+b)/3
                      a=max(0,min(1,(mean-175)/65))
                      px[x,y]=tuple(round(v*(1-a)+d*a) for v,d in zip((r,g,b),bg))
              im.save(path,'WEBP',quality=82,method=6)

          for f in files:
              if os.path.exists(f):
                  process(f)
          PY
      - name: Commit normalized assets and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entrenamientos/ilustraciones/fondos-maquina-asistida.webp \
                  entrenamientos/ilustraciones/press-triceps-maquina.webp \
                  entrenamientos/ilustraciones/fondos-maquina.webp \
                  entrenamientos/ilustraciones/extension-triceps-sobre-cabeza-unilateral.webp
          git rm .github/workflows/one-shot-normalize-triceps-backgrounds.yml
          git commit -m 'Normalize triceps image backgrounds to dark'
          git push
