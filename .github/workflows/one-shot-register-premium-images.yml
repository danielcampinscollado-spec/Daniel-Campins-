name: Register premium exercise images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-register-premium-images.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register premium image ids
        run: echo '' | base64 -d | python3
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/one-shot-register-premium-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrenamientos/runtime-compat.js .github/workflows/one-shot-register-premium-images.yml
          git commit -m "Register premium exercise illustration batch"
          git push
